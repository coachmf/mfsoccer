<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1430">
<title>مركز التحليل الافتراضي — MF Soccer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js" defer></script>
<style>
:root{--bg:#0A1430;--panel:#0D1724;--card:#0F1A28;--line:#1F3047;--line2:#2B3D55;--ink:#F2EDE3;--mute:#9AA7B8;
  --gold:#D4A84B;--mon:#3FB8AF;--play:#6CC24A;--dev:#5B9BF0;--on:#3DDC5A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
body{background-image:radial-gradient(#18283B 1.2px,transparent 1.2px);background-size:26px 26px;min-height:100vh}
button,input{font-family:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:40px clamp(16px,4vw,64px) 64px;display:flex;flex-direction:column;gap:32px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap}
.brand img{height:clamp(84px,10vw,128px);width:auto;display:block}
.brand .sep{width:1px;align-self:stretch;background:var(--line2)}
.brand h1{margin:0;font-size:clamp(30px,4.4vw,54px);font-weight:700;line-height:1.15}
.brand p{margin:6px 0 0;font-size:clamp(14px,1.5vw,18px);color:var(--mute)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;padding:10px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-width:96px}
.stat b{font-size:28px;color:var(--gold)}
.stat span{font-size:13px;color:var(--mute)}
.stat.live{border-color:#2E7A42;background:#0E2418}
.stat.live b{color:var(--on)} .stat.live span{color:#A8D9B4}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--gold)} .btn.gold{background:var(--gold);color:#16120B;border-color:var(--gold)}
.btn:focus-visible,.pill:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.zone{border:1px solid var(--line);border-top:3px solid var(--zc,var(--gold));border-radius:20px;background:var(--panel);padding:20px clamp(12px,1.6vw,24px) 24px;display:flex;flex-direction:column;gap:18px}
.zone.sup{align-self:center;width:min(760px,100%);border:1.5px solid var(--gold);background:var(--card);align-items:center}
.zhead{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.zt{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
.zc{font-size:14px;color:var(--mute);padding:4px 12px;border:1px solid var(--line);border-radius:999px}
.row2{display:flex;gap:32px;flex-wrap:wrap}
.row2 > .zone{flex:1 1 300px}
.desks{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}

.desk{width:240px;padding:14px 10px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;transition:box-shadow .4s,border-color .4s}
.desk.lead{border-color:var(--zc)}
.desk.on,.zone.sup.on{box-shadow:0 0 0 1px rgba(61,220,90,.55),0 14px 34px -12px rgba(61,220,90,.55)}
.pill{align-self:stretch;display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:4px 14px;border-radius:999px;border:1.5px solid #3A4A60;background:rgba(255,255,255,.03);color:var(--mute)}
.zone.sup .pill{align-self:auto}
.pill .dot{width:12px;height:12px;border-radius:50%;background:#6B7A90;flex:none}
.pill .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.pill .tx b{font-size:14px} .pill .tx small{font-size:11px;font-weight:600;letter-spacing:.05em}
.on .pill{border-color:var(--on);background:rgba(61,220,90,.12);color:#7FEA94}
.on .pill .dot{background:var(--on);box-shadow:0 0 10px 2px rgba(61,220,90,.8);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 4px 1px rgba(61,220,90,.5)}}
.station{position:relative;width:220px;height:165px}
.zone.sup .station{width:min(440px,100%);height:auto;aspect-ratio:360/200}
.station svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.station .scr{display:none} .on .station .scr{display:block}
.lamp{fill:#5A6678} .lampglow{fill:#3DDC5A;fill-opacity:0}
.on .lamp{fill:#3DDC5A} .on .lampglow{fill-opacity:.28}
.ring{width:200px;max-width:90%;height:4px;border-radius:999px;background:#22324A;transition:background .4s,box-shadow .4s}
.zone.sup .ring{width:400px;height:5px}
.on .ring{background:var(--on);box-shadow:0 0 16px 3px rgba(61,220,90,.65)}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.who b{font-size:20px} .who span{font-size:15px;font-weight:500;color:var(--zc)}
.who .badge{margin-top:4px;font-size:12px;font-weight:600;color:#0B1420;background:var(--zc);padding:2px 12px;border-radius:999px}
.zone.sup .who{padding:12px 36px;border-radius:12px;background:#16120B;border:1px solid #3A2C1E}
.zone.sup .who b{font-size:30px} .zone.sup .who span{font-size:18px;font-weight:600;color:var(--gold)}
.mail{width:100%;display:flex;flex-direction:column;gap:4px}
.mail label{font-size:12px;color:var(--mute)}
.mail input{width:100%;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line2);background:#0A1426;color:var(--ink);direction:ltr;text-align:left;font-size:14px}
.legend{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.orph{border:1px dashed var(--line2);border-radius:14px;padding:14px 18px;color:var(--mute);font-size:14px}
.orph b{color:var(--ink)}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate img{height:96px;width:auto;align-self:center}
.gate h2{margin:0;font-size:24px}
.gate p{margin:0;color:var(--mute);font-size:15px}
.gate label{text-align:right;font-size:14px;color:var(--mute)}
.gate input{min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:#0A1426;color:var(--ink);font-size:16px;direction:ltr;text-align:left}
.gate .err{color:#F08A78;font-size:14px;min-height:18px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.on .pill .dot{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <form class="box" id="loginForm">
    <img src="/assets/brand/mf-logo-gold.webp" alt="MF Soccer">
    <h2>مركز التحليل الافتراضي</h2>
    <p id="gateMsg">لفريق العمل فقط — سجّل دخولك بحساب فريق العمل.</p>
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">كلمة المرور</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn gold" type="submit">دخول</button>
    <button class="btn" type="button" id="outBtn" hidden>تسجيل الخروج</button>
  </form>
</div>
<main id="app" class="wrap" hidden></main>
<script src="center.js?v=1" defer></script>
</body>
</html>
