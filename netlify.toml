[build]
  publish = "."

# ——— معالج تسجيل الدخول على نطاقنا ———
# Firebase يوجّه الدخول بـGoogle/Apple عبر نطاقه الوسيط، والمتصفحات
# الحديثة تعزل تخزين النطاقات (Safari وiOS خاصة) فتضيع الحالة بين
# التحويل والعودة، ويظهر للمستخدم:
#   "Unable to process request due to missing initial state"
# تمرير المعالج من نطاقنا يجعل التخزين على نفس الأصل فيزول العطل.
# status = 200 تمرير لا تحويل — لا بد أن يبقى الرابط على mfsoccer.com
[[redirects]]
  from = "/__/auth/*"
  to = "https://mfsoccer-c7ee4.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://mfsoccer-c7ee4.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# ——— ترويسات أمان عامة ———
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ——— الصفحة الرئيسية: لا تُخزَّن، عشان التحديثات توصل فوراً ———
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ——— خادم الخدمة: لا يُخزَّن أبداً، وإلا علقت نسخة قديمة عند المستخدم ———
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ——— الأيقونات وصورة المشاركة: تخزين طويل ———
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ——— السرعة في التطبيق والمتصفح: الصور والملفات المرقّمة تُحفظ عند المستخدم ———
# كانت كل الملفات max-age=0 فيُعاد التحقق من ~25 ملفاً (شعارات، صور الترويسة، ملفات js) في كل فتح
# للتطبيق — وWKWebView في تطبيق iOS لا يملك خادم خدمة فيعتمد على هذه الترويسات وحدها.
# الشعارات وصور الترويسة: 30 يوماً (عند تغيير صورة بنفس الاسم يظهر التغيير خلال 30 يوماً — أو غيّر الاسم).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fantasy/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ملفات js/css المرقّمة بـ?v= : يوم واحد (التحديث الفوري يأتي من رفع الرقم في index.html)
[[headers]]
  for = "/fantasy/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fantasy/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site-theme.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site-i18n.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# صفحة الفانتسي كالرئيسية: لا تُخزَّن حتى تصل التحديثات فوراً
[[headers]]
  for = "/fantasy/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
