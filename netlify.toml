[build]
  publish = "."

# ——— معالج تسجيل الدخول على نطاقنا ———
# Firebase يوجّه الدخول بـGoogle/Apple عبر نطاقه الوسيط، والمتصفحات
# الحديثة تعزل تخزين النطاقات (Safari وiOS خاصة) فتضيع الحالة بين
# التحويل والعودة، ويظهر للمستخدم:
#   "Unable to process request due to missing initial state"
# تمرير المعالج من نطاقنا يجعل التخزين على نفس الأصل فيزول العطل.
# status = 200 تمرير لا تحويل — لا بد أن يبقى الرابط على mfsoccer.com
[[redirects]]
  from = "/__/auth/*"
  to = "https://mfsoccer-c7ee4.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://mfsoccer-c7ee4.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# ——— ترويسات أمان عامة ———
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ——— الصفحة الرئيسية: لا تُخزَّن، عشان التحديثات توصل فوراً ———
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ——— خادم الخدمة: لا يُخزَّن أبداً، وإلا علقت نسخة قديمة عند المستخدم ———
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ——— الأيقونات وصورة المشاركة: تخزين طويل ———
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
