# موقع إدارة التعليم وتطوير الدارسين — مشروع Netlify مستقل.
# عند ربطه بـNetlify من هذا المستودع: Base directory = kfa_edu
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."kfa-edu"]
  included_files = ["site/config.js", "site/rules.js"]

[functions."kfa-pay"]
  included_files = ["site/config.js", "site/rules.js"]

[[redirects]]
  from = "/api/kfa-edu"
  to = "/.netlify/functions/kfa-edu"
  status = 200
  force = true

[[redirects]]
  from = "/api/kfa-pay"
  to = "/.netlify/functions/kfa-pay"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
