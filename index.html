/* ================= مدير بيانات الموسم ================= */
const SH = {matches:"سجل المباريات", goals:"سجل الأهداف", pens:"سجل ركلات الجزاء",
            set:"الإعدادات", cards:["سجل الإنذارات","سجل البطاقات"]};
/* يبحث عن عمود اختياري باسم رأسه في أول عشرة صفوف، فلا يهمّ ترتيب الأعمدة
   ولا موضع صف الرؤوس — بعض الأوراق تبدأ من الصف الأول وبعضها من الرابع */
function findHead(rows, names){
  const N=Math.min((rows||[]).length,10);
  for(let i=0;i<N;i++){
    const row=rows[i]||[];
    for(let j=0;j<row.length;j++){
      const h=String(row[j]??"").trim();
      if(h && names.some(n=>h===n || h.includes(n))) return {row:i, col:j};
    }
  }
  return null;
}
function colOf(rows, names){ const f=findHead(rows,names); return f?f.col:-1; }
const pickComp = v => { const t=String(v??"").trim(); return COMPS.includes(t) ? t : (t||"الدوري"); };
const cellStr = v => (v===null||v===undefined) ? "" : String(v).trim();
const cellNum = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function rowsOf(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}

function buildFromWorkbook(wb){
  const warn=[], miss=[];
  const need=[SH.matches,SH.goals,SH.set].filter(n=>!wb.Sheets[n]);
  if(need.length) return {error:"الملف ينقص أوراقاً أساسية: "+need.join("، ")};

  /* الأندية والموسم */
  const setR = rowsOf(wb, SH.set) || [];
  const clubs=[];
  for(let i=4;i<16;i++){ const v=cellStr(setR[i]?.[1]); if(v) clubs.push(v); }
  /* مزامنة القوائم المرجعية مع ورقة الإعدادات */
  const grab=(col,r1,r2)=>{const out=[];for(let i=r1;i<=r2;i++){const v=cellStr(setR[i]?.[col]);if(v)out.push(v);}return out;};
  const L1=grab(3,4,16), L2=grab(6,4,8), L3=grab(7,4,14), L4=grab(10,4,8);
  if(L1.length>3) LIST.det=L1;
  if(L2.length>2) LIST.bp=L2;
  if(L3.length>5) LIST.zone=L3;
  if(L4.length>2) LIST.penres=L4;
  let season = SEASON;
  for(const r of setR){ if(cellStr(r?.[0]).includes("اسم الموسم") && cellStr(r?.[1])) season=cellStr(r[1]); }
  if(clubs.length<2) return {error:"لم أتمكن من قراءة أسماء الأندية من ورقة الإعدادات."};

  /* الأهداف */
  const goals=[];
  (rowsOf(wb, SH.goals)||[]).slice(4).forEach((r,i)=>{
    if(!r) return;
    const sc=cellStr(r[3]), cd=cellStr(r[4]);
    if(!sc || !cd) return;
    const line = i+5;
    let cat=cellStr(r[12]); const det=cellStr(r[13]);
    if(!cat && det) cat = /ركلة جزاء|ركلة حرة|ركنية|رمية تماس|كرة ثابتة/.test(det) ? "كرات ثابتة" : "لعب مفتوح";
    const g={ r:cellNum(r[1]), sc, cd, p:cellStr(r[5]), a:cellStr(r[6]),
              m:cellNum(r[8]), x:cellNum(r[9]),
              cat, det, bp:cellStr(r[14]), zone:cellStr(r[15]),
              og:cellStr(r[16]) };   /* عمود اختياري: اللاعب الذي ارتدت عنه الكرة */
    if(!clubs.includes(sc)) warn.push(`سجل الأهداف صف ${line}: نادٍ غير معروف «${sc}»`);
    if(!clubs.includes(cd)) warn.push(`سجل الأهداف صف ${line}: نادٍ غير معروف «${cd}»`);
    if(!g.r) warn.push(`سجل الأهداف صف ${line}: رقم الجولة فارغ`);
    if(!g.m) warn.push(`سجل الأهداف صف ${line}: الدقيقة فارغة`);
    if(!g.zone) miss.push(`سجل الأهداف صف ${line}: منطقة التسجيل فارغة`);
    if(!g.cat)  miss.push(`سجل الأهداف صف ${line}: التصنيف والتفصيل فارغان`);
    if(!g.p)    miss.push(`سجل الأهداف صف ${line}: اسم اللاعب فارغ`);
    goals.push(g);
  });

  /* المباريات — النتيجة تُشتق من الأهداف لا من خلايا الصيغ */
  const matches=[]; const seen=new Set();
  const mRows = rowsOf(wb, SH.matches)||[];
  const cCompM = colOf(mRows, ["المسابقة","البطولة"]);
  const cVenue = colOf(mRows, ["الملعب","الاستاد"]);
  const cTime  = colOf(mRows, ["الوقت","التوقيت","ساعة"]);
  mRows.slice(4).forEach((r,i)=>{
    if(!r) return;
    const home=cellStr(r[3]), away=cellStr(r[4]);
    if(!home || !away) return;
    const line=i+5, round=cellNum(r[1]);
    let date=""; const dv=r[2];
    if(dv instanceof Date) date=dv.toISOString().slice(0,10);
    else if(typeof dv==="number" && dv>20000){ const d=XLSX.SSF.parse_date_code(dv);
      if(d) date=`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
    else date=cellStr(dv).slice(0,10);
    const key=round+"|"+home+"|"+away;
    if(seen.has(key)) warn.push(`سجل المباريات صف ${line}: مباراة مكررة`);
    seen.add(key);
    if(!clubs.includes(home)) warn.push(`سجل المباريات صف ${line}: نادٍ غير معروف «${home}»`);
    if(!clubs.includes(away)) warn.push(`سجل المباريات صف ${line}: نادٍ غير معروف «${away}»`);
    if(!round) warn.push(`سجل المباريات صف ${line}: رقم الجولة فارغ`);
    const hg=goals.filter(g=>g.r===round&&g.sc===home&&g.cd===away).length;
    const ag=goals.filter(g=>g.r===round&&g.sc===away&&g.cd===home).length;
    const comp = cCompM>=0 ? pickComp(r[cCompM]) : "الدوري";
    const venue = cVenue>=0 ? cellStr(r[cVenue]) : "";
    let time = "";
    if(cTime>=0){ const tv=r[cTime];
      if(tv instanceof Date) time=tv.toISOString().slice(11,16);
      else if(typeof tv==="number" && tv<1) { const t=Math.round(tv*1440); time=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
      else time=cellStr(tv).slice(0,5); }
    matches.push({n:matches.length+1, round, comp, date, time, venue, home, away, hg, ag});
  });

  /* أهداف بلا مباراة مسجّلة */
  goals.forEach((g,i)=>{
    const ok=matches.some(m=>m.round===g.r && ((m.home===g.sc&&m.away===g.cd)||(m.home===g.cd&&m.away===g.sc)));
    if(!ok) warn.push(`سجل الأهداف صف ${i+5}: لا توجد مباراة مطابقة في سجل المباريات`);
  });

  /* ركلات الجزاء */
  const pens=[];
  const pRows = rowsOf(wb, SH.pens)||[];
  const cPlace = colOf(pRows, ["مكان التسديد","موضع التسديد","مكان الركلة"]);
  pRows.slice(4).forEach((r,i)=>{
    if(!r) return;
    const by=cellStr(r[2]), vs=cellStr(r[3]);
    if(!by || !vs) return;
    const place = cPlace>=0 ? cellStr(r[cPlace]) : "";
    if(place && !PZONES.includes(place))
      warn.push(`سجل ركلات الجزاء صف ${i+5}: مكان تسديد غير معروف «${place}»`);
    pens.push({r:cellNum(r[1]), by, vs, p:cellStr(r[4]), m:cellNum(r[5]), res:cellStr(r[6]), place});
  });

  /* الإنذارات — ورقة اختيارية */
  const cards=[];
  const cSheet = SH.cards.find(n=>wb.Sheets[n]);
  if(cSheet){
    const cRows = rowsOf(wb, cSheet)||[];
    const hd = findHead(cRows,["النادي","الفريق"]);
    const hRow = hd ? hd.row : 3;
    const col = names => { const head=cRows[hRow]||[];
      for(let i=0;i<head.length;i++){ const h=String(head[i]??"").trim();
        if(h && names.some(n=>h===n||h.includes(n))) return i; } return -1; };
    const iRound=col(["الجولة"]), iComp=col(["المسابقة","البطولة"]), iClub=col(["النادي","الفريق"]);
    const iP=col(["اللاعب"]), iMin=col(["الدقيقة"]), iType=col(["النوع","البطاقة"]);
    const off = hRow+1;
    cRows.slice(off).forEach((r,i)=>{
      if(!r) return;
      const club = iClub>=0 ? cellStr(r[iClub]) : "";
      if(!club) return;
      const type = iType>=0 ? cellStr(r[iType]) : "إنذار";
      if(!clubs.includes(club)) warn.push(`${cSheet} صف ${i+off+1}: نادٍ غير معروف «${club}»`);
      if(!/إنذار|طرد/.test(type)) warn.push(`${cSheet} صف ${i+off+1}: نوع بطاقة غير معروف «${type}»`);
      cards.push({ r: iRound>=0?cellNum(r[iRound]):0,
                   comp: iComp>=0?pickComp(r[iComp]):"الدوري",
                   club, p: iP>=0?cellStr(r[iP]):"", m: iMin>=0?cellNum(r[iMin]):0, type });
    });
  }

  /* الإنذار الثاني في نفس المباراة يُرقّى تلقائياً — لكل مباراة على حدة */
  const byMatch = {};
  cards.forEach(c=>{ const k=c.r+"|"+c.comp; (byMatch[k]=byMatch[k]||[]).push(c); });
  const cards2 = Object.values(byMatch).flatMap(g=>upgradeSecondYellows(g));

  const blank = goals.filter(g=>!g.det).length;
  const stale = goals.length>3 && blank >= goals.length*0.5;
  return {season, clubs, matches, goals, pens, cards:cards2, warn, miss, stale};
}

/* حقل غائب عن المصدر لا يمسح ما هو محفوظ؛ وحقل موجود ولو فارغاً يُطبَّق.
   ملف الاستوديو (xlsx) لا يحمل تشكيلات ولا تبديلات، فلولا هذا الحفظ
   لمَسَح كل رفعة ما أُدخل يدوياً منها — تماماً كحماية الكشوفات أدناه. */
function keepField(incoming, current){
  return incoming === undefined ? (current || []) : (incoming || []);
}
function applyData(d, source){
  SEASON = d.season || SEASON;
  ALL = stampComp({matches:d.matches||[], goals:d.goals||[], pens:d.pens||[], cards:d.cards||[],
                   events:  keepField(d.events,  ALL && ALL.events),
                   lineups: keepField(d.lineups, ALL && ALL.lineups),
                   subs:    keepField(d.subs,    ALL && ALL.subs),
                   shapes:  keepField(d.shapes,  ALL && ALL.shapes),
                   kits:    keepField(d.kits,    ALL && ALL.kits),
                   tots:    keepField(d.tots,    ALL && ALL.tots)});
  SQUADS = d.squads || SQUADS || {};   /* ملف بلا كشوفات لا يمسح الكشوفات الحالية */
  if("fantasyOpen" in (d||{})) FANTASY_OPEN = !!d.fantasyOpen;
  if(typeof paintFantasyTab==="function") paintFantasyTab();  /* التبويب يظهر فور وصول حالة الإشهار */
  SQNUMS_FOUND = squadsExtractNums();   /* فصل الأرقام المكتوبة داخل الأسماء */
  CLUBS = d.clubs;
  const have = compsPresent();
  if(!have.includes(COMP)) COMP = have[0] || "الدوري";
  SELR=null; SELDAY=null; CALM=null;
  applyComp();
  DATA_UPDATED = d.updated || new Date().toISOString();
  DATA_BY = d.updatedBy || "";
  CUR_STAMP = stampOf(d);   /* v27 */
  DATA_SOURCE  = source || "ملف بيانات";
  const mx = ALL.matches.length ? Math.max(...ALL.matches.map(m=>m.round)) : 0;
  if(!/الجولة/.test(LASTUPDATE)) LASTUPDATE = `الجولة ${mx}`;
  $("#seasonLbl").textContent = SEASON;
  paintRail(); paintFoot(); renderAll();
}

function dataObject(){
  return {season:SEASON, clubs:CLUBS,
          matches:ALL?ALL.matches:MATCHES, goals:ALL?ALL.goals:GOALS,
          pens:ALL?ALL.pens:PENS, cards:ALL?ALL.cards:CARDS, squads:SQUADS,
          lineups:(ALL&&ALL.lineups)||[], subs:(ALL&&ALL.subs)||[],
          shapes:(ALL&&ALL.shapes)||[],
          kits:(ALL&&ALL.kits)||[],
          tots:(ALL&&ALL.tots)||[],
          events:(ALL&&ALL.events)||[],
          lastUpdate:LASTUPDATE, updated:new Date().toISOString(),
          fantasyOpen:FANTASY_OPEN,
          updatedBy:(FBUSER&&FBUSER.email)||""};
}
function downloadJSON(){
  const blob=new Blob([JSON.stringify(dataObject(),null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download="data.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function persistData(){
  const obj=dataObject();
  CUR_STAMP = LASTSTAMP = stampOf(obj);   /* v27:rebase — النسخة المكتوبة هي المرجع الآن */
  await localSet("zain_data", JSON.stringify(obj));
  const r = await fbSaveSeason(obj);
  if(r===true) pushBackup();     /* بلا انتظار حتى لا يبطئ الحفظ */
  return r;
}

async function saveTotRow(round, comp, patch){
  const reb=await rebaseOnCloud();
  if(reb.changed) toast(`وصل تحديث من ${reb.by||"محرّر آخر"} — دُمج قبل الحفظ`,"busy");
  ALL.tots = ALL.tots || [];
  let row=ALL.tots.find(t=>t.r===round && (t.comp||"الدوري")===comp);
  if(!row){ row={r:round, comp, open:false, done:false}; ALL.tots.push(row); }
  Object.assign(row, patch);
  const ok = await persistData();
  /* نافذة التصويت تُنسخ لمستند يقرأه الخادم، فيرفض أي صوت خارجها
     ولو تحايل أحد على الواجهة */
  if(fbDb && ("open" in patch)){
    try{ await fbDb.collection("totlock").doc(totKey(round,comp))
      .set({open:!!row.open, r:round, comp, at:new Date().toISOString()}); }
    catch(e){ toast("حُفظت الحالة، لكن تعذّر تحديث قفل الخادم","err"); }
  }
  return ok;
}

/* المعاينة تتبع الإدخال، وزر «تلقائي» يرجع للافتراضي.
   يُستدعى من لوحتَي المالك والمحرّر معاً. */
function wireKits(){
  if(!document.querySelector(".kits")) return;
  const paintKit=c=>{
    const row=document.querySelector(`[data-kitclub="${cssq(c)}"]`); if(!row) return;
    const bg=row.querySelector("[data-kitbg]").value, fg=row.querySelector("[data-kitfg]").value;
    row.querySelector(".pp-dot").setAttribute("style", dotVars({bg,fg}));
    const d=defaultKit(c), rb=row.querySelector("[data-kitreset]");
    if(rb) rb.disabled = bg.toLowerCase()===d.bg.toLowerCase() && fg.toLowerCase()===d.fg.toLowerCase();
  };
  document.querySelectorAll("[data-kitbg],[data-kitfg]").forEach(inp=>{
    inp.oninput = () => paintKit(inp.dataset.kitbg || inp.dataset.kitfg);
  });
  document.querySelectorAll("[data-kitreset]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.kitreset, d=defaultKit(c);
    const row=document.querySelector(`[data-kitclub="${cssq(c)}"]`);
    row.querySelector("[data-kitbg]").value=d.bg.toLowerCase();
    row.querySelector("[data-kitfg]").value=d.fg.toLowerCase();
    paintKit(c);
  });
  const ks=$("#kitsSave");
  if(ks) ks.onclick=async()=>{
    busy(ks,true,"جارٍ الحفظ…");
    const ok=await saveKits();
    busy(ks,false);
    if(ok===true){ LASTSYNC=new Date(); toast("حُفظت الألوان ✅","ok"); renderAll(); renderAdmin(); }
    else toast(SYNCMSG||"حُفظت محلياً، لكن تعذّر الحفظ في السحابة","err");
  };
}

/* ===== النسخ الاحتياطية =====
   بعد كل حفظ ناجح تُخزَّن صورة كاملة من بيانات الموسم في مجموعة
   backups. تبقى آخر عشر نسخ فيُمكن الرجوع لأي منها بضغطة، فلا
   تضيع التشكيلات والتبديلات مرة أخرى مهما حصل.
   الحجم صغير (≈50 ك.ب للنسخة) فلا يقترب من أي حد. */
const BACKUP_KEEP = 10;
let BACKUPS = null;                       /* مخزَّن للعرض */

function backupCounts(d){
  return {matches:(d.matches||[]).length, goals:(d.goals||[]).length,
          cards:(d.cards||[]).length,     pens:(d.pens||[]).length,
          lineups:(d.lineups||[]).length, subs:(d.subs||[]).length,
          squads:Object.keys(d.squads||{}).length};
}

async function pushBackup(){
  if(!fbDb || !isAdmin) return false;
  const d = dataObject();
  if(!(d.matches||[]).length) return false;        /* لا نحفظ حالة فارغة */
  const id = seasonId()+"__"+new Date().toISOString().replace(/[:.]/g,"-");
  const body = {at:new Date().toISOString(), by:(FBUSER&&FBUSER.email)||"",
                season:seasonId(), n:backupCounts(d), data:d};
  const r = await withTimeout(fbDb.collection("backups").doc(id).set(body), 9000);
  if(r!=="ok") return false;
  BACKUPS = null;                                  /* القائمة تغيّرت */
  pruneBackups();
  return true;
}

/* لا نُبقي إلا آخر BACKUP_KEEP نسخة */
async function pruneBackups(){
  try{
    const q = await fbDb.collection("backups").orderBy("at","desc").get();
    const extra = q.docs.slice(BACKUP_KEEP);
    for(const dc of extra){ try{ await dc.ref.delete(); }catch(e){} }
  }catch(e){}
}

async function listBackups(force){
  if(BACKUPS && !force) return BACKUPS;
  if(!fbDb) return [];
  try{
    const q = await fbDb.collection("backups").orderBy("at","desc").limit(BACKUP_KEEP).get();
    BACKUPS = q.docs.map(dc=>{ const v=dc.data(); return {id:dc.id, at:v.at, by:v.by, n:v.n||{}}; });
    return BACKUPS;
  }catch(e){ return []; }
}

async function restoreBackup(id){
  if(!fbDb) return {ok:false, msg:"السحابة غير متاحة"};
  try{
    const s = await fbDb.collection("backups").doc(id).get();
    if(!s.exists) return {ok:false, msg:"النسخة غير موجودة"};
    const d = s.data().data;
    if(!d || !(d.matches||[]).length) return {ok:false, msg:"النسخة فارغة — لم تُطبَّق"};
    await pushBackup();                              /* نحفظ الحالي قبل الاستبدال */
    applyData(d, "استرجاع نسخة احتياطية");
    paintRail(); renderAll();
    const ok = await persistData();
    const c = backupCounts(d);
    return ok===true
      ? {ok:true, msg:`استُرجعت النسخة: ${c.matches} مباراة و${c.lineups} تشكيلة و${c.subs} تبديلاً`}
      : {ok:false, msg:SYNCMSG||"طُبّقت محلياً لكن تعذّر الحفظ في السحابة"};
  }catch(e){ return {ok:false, msg:(e&&e.message)||"تعذّر الاسترجاع"}; }
}

/* مكتبة الإكسل (≈900 ك.ب) كانت تُحمَّل في رأس الصفحة لكل زائر وتحجب أول رسم، ولا يحتاجها إلا استيراد المدير.
   تُجلب هنا عند الحاجة فقط (وتُسخَّن عند فتح لوحة التحكم). */
let XLSX_P=null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(XLSX_P) return XLSX_P;
  XLSX_P=new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload=()=>res(); sc.onerror=()=>{ XLSX_P=null; rej(new Error("xlsx")); };
    document.head.appendChild(sc);
  });
  return XLSX_P;
}
function readDataFile(file){
  const box=$("#dataReport");
  const fr=new FileReader();
  if(/\.json$/i.test(file.name)){
    fr.onload=()=>{ try{
        const d=JSON.parse(fr.result);
        if(!d.clubs||!d.goals||!d.matches) throw new Error("بنية غير متوقعة");
        PENDING={...d, warn:[], miss:[]};
        showReport(PENDING, file.name);
      }catch(e){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(e.message)}</div>`; } };
    fr.readAsText(file);
    return;
  }
  fr.onload=async()=>{
    try{ await ensureXLSX(); }
    catch(e){
      box.innerHTML=`<div class="note"><b>مكتبة قراءة الإكسل غير متاحة الآن.</b> تحتاج اتصالاً بالإنترنت لقراءة ملفات xlsx، أو استخدم ملف data.json بدلاً منها.</div>`;
      return;
    }
    try{
      const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true});
      const d=buildFromWorkbook(wb);
      if(d.error){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(d.error)}</div>`; return; }
      PENDING=d; showReport(d, file.name);
    }catch(e){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(e.message)}</div>`; }
  };
  fr.readAsArrayBuffer(file);
}

/* ================= إشعار مرئي ================= */
let toastTimer=null;
function toast(msg, kind, sticky){
  const t=$("#toast"); if(!t) return;
  t.className=""; t.textContent=msg;
  t.classList.add(kind||"ok","on");
  clearTimeout(toastTimer);
  /* حتى الإشعار "الملتصق" له عمر أقصى — لا شيء يبقى معلّقاً على الشاشة */
  toastTimer=setTimeout(()=>t.classList.remove("on"), sticky?12000:(kind==="err"?7000:3500));
}
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.orig=btn.dataset.orig||btn.textContent; btn.textContent=label||"جارٍ التنفيذ…"; btn.disabled=true; }
  else { if(btn.dataset.orig) btn.textContent=btn.dataset.orig; btn.disabled=false; }
}

/* ================= ضغط الصور قبل الحفظ ================= */
/* الصور الأصلية تزن مئات الكيلوبايتات، ووثيقة Firestore محدودة بميغابايت واحد.
   نصغّرها إلى الحجم المعروض فعلاً فتصير بضعة كيلوبايتات مع حفظ الشفافية. */
function compressImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("الملف ليس صورة صالحة"));
      img.onload=()=>{
        try{
          const sc=Math.min(1, maxDim/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          let out=""; 
          try{ out=c.toDataURL("image/webp", quality); }catch(e){}
          if(!out || out.indexOf("data:image/webp")!==0) out=c.toDataURL("image/png");
          res(out);
        }catch(e){ rej(e); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const dataUrlKB = u => Math.round((String(u||"").length*0.75)/1024);
function assetsKB(){ return Math.round(JSON.stringify(assetsObject()).length/1024); }

/* يلتقط صورة من حقل ملف، يضغطها، ويعيد رسالة النتيجة */
async function takeImage(file, maxDim, quality, label){
  if(!file) return null;
  const before=Math.round(file.size/1024);
  try{
    const url=await compressImage(file, maxDim, quality);
    const after=dataUrlKB(url);
    return {url, msg:`${label}: ${before} ك.ب ← ${after} ك.ب`};
  }catch(e){ return {url:null, msg:`تعذّرت معالجة ${label}: ${e.message}`}; }
}

/* v27:rebase — طابع النسخة الموجودة في الذاكرة الآن (آخر ما طُبّق أو كُتب) */
let CUR_STAMP="";
function stampOf(d){ return ((d&&d.updated)||"")+"|"+((d&&d.updatedBy)||""); }
/* قبل أي حفظ: نجلب أحدث وثيقة من السحابة ونبني التعديل فوقها.
   كانت كل كتابة تستبدل وثيقة الموسم كاملة بنسخة الجهاز، فإذا حفظ عضوان في وقت متقارب
   محا الثاني تشكيلة وتبديلات الأول، ثم أُعيد تطبيق النسخة القديمة المعلّقة على الشاشة
   بعد الحفظ فبدا وكأن التعديل لم يُحفظ. keep(): يحفظ ما لا يجوز أن يمسحه التحديث
   (مثل كشوفات يُحرَّرها المستخدم الآن) ويعيد دالة لاسترجاعه. */
async function rebaseOnCloud(keep){
  let d = PENDING_REMOTE; PENDING_REMOTE=null;
  if(fbDb){
    const fresh = await Promise.race([ fbLoad(seasonId()), new Promise(r=>setTimeout(()=>r(null), 6000)) ]);
    if(fresh) d = fresh;
  }
  if(!d || !d.clubs || !d.matches) return {ok:true, changed:false};
  const st = stampOf(d);
  if(st===CUR_STAMP) return {ok:true, changed:false};
  const restore = keep ? keep() : null;
  applyData(d, "السحابة (قبل الحفظ)");
  if(restore) restore();
  LASTSTAMP = st;
  return {ok:true, changed:true, by:d.updatedBy||""};
}
/* استماع حيّ لوثيقة الموسم: أي حفظ من أي عضو يظهر عند الجميع فوراً بلا تحديث للصفحة */
function watchSeason(){
  if(!fbDb) return;
  if(SEASON_UNSUB){ try{ SEASON_UNSUB(); }catch(e){} SEASON_UNSUB=null; }
  try{
    SEASON_UNSUB = fbDb.collection("seasons").doc(seasonId()).onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return;   /* تجاهل صدى كتابتنا */
      const d=snap.data();
      if(!d || !d.clubs || !d.matches) return;
      const stamp=(d.updated||"")+"|"+(d.updatedBy||"");
      if(stamp===LASTSTAMP) return;
      LASTSTAMP=stamp;
      if(EDIT){ PENDING_REMOTE=d; return; }   /* لا نقاطع نموذج مباراة مفتوحاً */
      applyRemote(d);
    }, ()=>{});
  }catch(e){}
}

async function diagnose(){
  const out=[];
  const add=(ok,t,d)=>out.push({ok,t,d:d||""});
  add(typeof firebase!=="undefined","تحميل مكتبة Firebase",
      typeof firebase==="undefined"?"لم تُحمّل — تحقق من الاتصال أو من مانع الإعلانات":"");
  if(typeof firebase==="undefined") return out;
  add(!!fbDb,"تهيئة Firestore", fbDb?"":FBSTATE);
  add(location.protocol!=="file:","طريقة الفتح",
      location.protocol==="file:"?"الملف مفتوح محلياً — Firestore يرفض file://":location.origin);
  add(!!FBUSER,"تسجيل الدخول", FBUSER?FBUSER.email:"لم تسجّل الدخول");
  add(!!(FBUSER&&FBUSER.uid===ADMIN_UID),"مطابقة حساب المدير",
      FBUSER? (FBUSER.uid===ADMIN_UID?"":"الـ UID لا يطابق: "+FBUSER.uid) : "—");
  if(!fbDb) return out;

  /* قراءة */
  let r=await Promise.race([
    fbDb.collection("seasons").doc(seasonId()).get().then(d=>({ok:true,ex:d.exists})).catch(e=>({ok:false,e})),
    new Promise(z=>setTimeout(()=>z({to:true}),9000))]);
  if(r.to) add(false,"قراءة من السحابة","لا استجابة خلال 9 ثوانٍ — الاتصال محجوب غالباً");
  else if(r.ok) add(true,"قراءة من السحابة", r.ex?"الوثيقة موجودة":"القاعدة تعمل لكن الوثيقة غير موجودة بعد");
  else add(false,"قراءة من السحابة", r.e.code||r.e.message);

  /* كتابة اختبارية */
  let w=await Promise.race([
    fbDb.collection("seasons").doc("_ping").set({t:Date.now()}).then(()=>({ok:true})).catch(e=>({ok:false,e})),
    new Promise(z=>setTimeout(()=>z({to:true}),9000))]);
  if(w.to) add(false,"كتابة اختبارية","لا استجابة خلال 9 ثوانٍ");
  else if(w.ok) add(true,"كتابة اختبارية","نجحت");
  else add(false,"كتابة اختبارية", w.e.code||w.e.message);
  return out;
}

    return "هذا الحساب ليس المدير — الكتابة مرفوضة بالقواعد.";
  const rd=f("قراءة من السحابة"), wr=f("كتابة اختبارية");
  if(rd && !rd.ok && /9 ثوانٍ/.test(rd.d))
    return "الاتصال بـ Firestore محجوب تماماً. الأسباب الشائعة: برنامج حماية مثل McAfee، أو إضافة حجب إعلانات، أو شبكة مقيّدة. جرّب نافذة تصفح خفي بلا إضافات، أو شبكة أخرى مثل بيانات الجوال.";
  if(rd && !rd.ok && /not-found|NOT_FOUND/i.test(rd.d))
    return "قاعدة Firestore لم تُنشأ بعد. ارجع لـ Firebase ← Firestore Database ← Create database.";
  if(wr && !wr.ok && /permission-denied/i.test(wr.d))
    return "القواعد ترفض الكتابة. تأكد من نشر قواعد Firestore بالضغط على Publish، ومن صحة الـ UID فيها.";

  if(rd && rd.ok && wr && wr.ok) return "كل شيء سليم. أعد المحاولة الآن.";
  return "";
}

   نفصل الرقم لخانته ونصحّح الاسم في سجلات الأهداف والبطاقات والجزاءات معه. */
function splitNumName(raw){
  const s=String(raw||"")
    .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,"")        /* علامات اتجاه مخفية */
    .replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))                  /* أرقام عربية */
    .replace(/[۰-۹]/g, d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .trim().replace(/\s+/g," ");
  let m=s.match(/^(\d{1,3})[^\p{L}\d]*(.+)$/u);                     /* الرقم بالبداية بأي فاصل */
  if(m && m[2].trim().length>=2) return {s:+m[1], n:m[2].trim()};
  m=s.match(/^(.+?)[^\p{L}\d]*(\d{1,3})$/u);                        /* أو بالنهاية */
  if(m && m[1].trim().length>=2) return {s:+m[2], n:m[1].trim()};
  return {s:0, n:s};
}
function renameInRecords(pairs, known){
  if(!pairs.length) return;
  const map=new Map(pairs.map(p=>[p.from,p.to]));
  const fix=v=>{
    if(!v) return v;
    if(map.has(v)) return map.get(v);
    const g=splitNumName(v);                       /* اسم بالسجلات وحده فيه رقم */
    return (g.s && known && known.has(g.n)) ? g.n : v;
  };
  (ALL?.goals||[]).forEach(g=>{ g.p=fix(g.p); if(g.a) g.a=fix(g.a); });
  (ALL?.cards||[]).forEach(x=>{ x.p=fix(x.p); });
  (ALL?.pens ||[]).forEach(x=>{ x.p=fix(x.p); });
}
function squadsExtractNums(){
  const pairs=[]; let n=0;
  Object.keys(SQUADS).forEach(c=>{
    (SQUADS[c]||[]).forEach((x,i)=>{
      const cur=sqName(x); if(!cur) return;
      const got=splitNumName(cur);
      if(!got.s || got.n===cur) return;
      SQUADS[c][i]=sqItem(got.n, sqPos(x), sqNum(x)||got.s);
      pairs.push({from:cur, to:got.n}); n++;
    });
  });
  const known=new Set();
  Object.values(SQUADS).forEach(a=>(a||[]).forEach(x=>{ const nm=sqName(x); if(nm) known.add(nm); }));
  renameInRecords(pairs, known);
  return n;
}

/* أسماء لاعبي نادٍ: الكشف المُدخل + كل اسم ظهر له في السجلات */
function playersOf(club){
  if(!club) return [];
  const s=new Set((SQUADS[club]||[]).map(x=>sqName(x).trim()).filter(Boolean));
  (ALL?.goals||[]).forEach(g=>{ if(g.sc===club){ if(g.p) s.add(g.p); if(g.a) s.add(g.a); } });
  (ALL?.cards||[]).forEach(x=>{ if(x.club===club && x.p) s.add(x.p); });
  (ALL?.pens ||[]).forEach(x=>{ if(x.by===club && x.p) s.add(x.p); });
  return [...s].sort((a,b)=>String(a).localeCompare(String(b),"ar"));
}
function playersOfSides(sides){
  const s=new Set(); (sides||[]).forEach(c=>playersOf(c).forEach(n=>s.add(n)));
  return [...s].sort((a,b)=>String(a).localeCompare(String(b),"ar"));
}
function squadTotal(){ return Object.values(SQUADS).reduce((a,b)=>a+(b?b.length:0),0); }

function fld(label, key, kind, list, val){
  const v = val==null?"":val;
  if(kind==="select") return `<div class="fld"><label>${label}</label>
    <select data-k="${key}">${opt(list, v, "اختر")}</select></div>`;
  if(kind==="combo"){
    const id="dl_"+key.replace(/[^A-Za-z0-9_]/g,"_");
    const names=(list||[]);
    return `<div class="fld"><label>${label}${names.length?` <span class="cnt">${names.length}</span>`:""}</label>
      <input type="text" data-k="${key}" value="${esc(v)}" list="${id}" autocomplete="off"
             placeholder="${names.length?"اختر من القائمة أو اكتب":"اكتب الاسم"}">
      <datalist id="${id}">${names.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>`;
  }
  return `<div class="fld"><label>${label}</label>
    <input type="${kind}" data-k="${key}" value="${esc(v)}"></div>`;
}

/* حقل لاعب برقمه: اكتب الرقم يطلع الاسم، أو اكتب الاسم يطلع رقمه */
function squadEntriesOf(club, sides){
  const cs = club ? [club] : (sides||[]);
  const out=[];
  cs.forEach(c=>(SQUADS[c]||[]).forEach(x=>{
    const n=sqName(x); if(n) out.push({n, s:sqNum(x), p:sqPos(x), club:c});
  }));
  return out.sort((a,b)=>(a.s||999)-(b.s||999) || String(a.n).localeCompare(String(b.n),"ar"));
}
function editSides(){ return [EDIT?.match?.home, EDIT?.match?.away].filter(Boolean); }
function pfld(label, key, club, sides, val){
  const ent=squadEntriesOf(club, sides), cur=String(val==null?"":val);

    <label>${label}${ent.length?` <span class="cnt">${ent.length}</span>`:""}</label>
    <div class="prow">

             data-pfor="${key}" data-pclub="${esc(club||"")}" value="${mine&&mine.s?mine.s:""}">
      <input type="text" data-k="${key}" value="${esc(cur)}" list="${id}" autocomplete="off"
             placeholder="${ent.length?"الاسم":"اكتب الاسم"}">
    </div>
    <div class="phint" data-phint="${key}"></div>
    <datalist id="${id}">${ent.map(e=>`<option value="${esc(e.n)}" label="${e.s?e.s:""}${e.p?" · "+e.p:""}"></option>`).join("")}</datalist>
  </div>`;
}
function syncPNum(box, el){
  const w=el.closest(".pfld"); if(!w) return;
  const num=w.querySelector(".pnum"); if(!num) return;
  const hit=squadEntriesOf(num.dataset.pclub, editSides()).find(e=>e.n===String(el.value).trim());

}
/* ===== شكل التشكيلة على الملعب =====
   الخطة تُقترح من مراكز اللاعبين في الكشف، وتُغيَّر من القائمة، والمواضع
   تُسحب باليد فتُحفظ مع بيانات المباراة ويراها الجمهور كما ضُبطت. */
const FORMATIONS=["4-4-2","4-3-3","4-2-3-1","4-5-1","4-1-4-1","3-5-2","3-4-3","5-3-2","5-4-1","4-4-1-1","4-2-2-2"];
const SH_LINE={GK:"G",RB:"D",CB:"D",LB:"D",RWB:"D",LWB:"D",CDM:"M",CM:"M",CAM:"M",RM:"M",LM:"M",RW:"F",ST:"F",LW:"F"};
const shSide=p=>String(p||"").startsWith("R")?2:String(p||"").startsWith("L")?0:1;
const SH_ORDER={G:0,D:1,M:2,F:3};

/* أسماء لاعبين ← مركز كل واحد ورقمه من كشف النادي */
function shapeMenFrom(names, club){
  const ent=squadEntriesOf(club,[club]);
  return names.map(n=>{
    const e=ent.find(z=>z.n===n) || {};
    const role=e.p||"CM";
    return {n, s:e.s||0, role, line:SH_LINE[role]||"M"};
  });
}
function shapeMen(club){
  const seen={}, ns=[];
  (EDIT.lineup||[]).filter(x=>x.club===club && x.p)
    .forEach(x=>{ if(!seen[x.p]){ seen[x.p]=1; ns.push(x.p); } });
  return shapeMenFrom(ns, club);    /* الملعب كما يراه الجمهور: بلا تكرار */
}
function autoForm(men){
  const c={D:0,M:0,F:0};
  men.forEach(p=>{ if(c[p.line]!==undefined) c[p.line]++; });
  const parts=[c.D,c.M,c.F].filter(n=>n);
  return FORMATIONS.includes(parts.join("-")) ? parts.join("-") : (parts.join("-")||"4-4-2");
}
function autoFormation(club){ return autoForm(shapeMen(club)); }
/* توزيع اللاعبين على صفوف الخطة */
function shapeSlots(men, form){
  const rows=String(form).split("-").map(Number).filter(n=>n>0);
  const gk=men.filter(p=>p.line==="G").slice(0,1);
  const rest=men.filter(p=>p.line!=="G").slice()
    .sort((a,b)=>(SH_ORDER[a.line]-SH_ORDER[b.line])||(shSide(a.role)-shSide(b.role)));
  const lines=[gk,...rows.map(()=>[])];
  let i=0;
  rows.forEach((n,ri)=>{ for(let k=0;k<n&&i<rest.length;k++) lines[ri+1].push(rest[i++]); });
  while(i<rest.length) lines[lines.length-1].push(rest[i++]);
  const out=[];
  lines.forEach((row,li)=>{
    const y=90-li*(78/Math.max(1,lines.length-1));
    /* الجهة: اليسار (L) أولاً فيأخذ x كبيراً، واليمين (R) أخيراً فيأخذ x صغيراً.
       التنسيق يقيس right من الحافة اليمنى، فيقع الأيمن يميناً واليسار يساراً. */
    const ord=li===0?row:row.slice().sort((a,b)=>shSide(a.role)-shSide(b.role));
    ord.forEach((p,k)=>out.push({p,x:100*(ord.length-k)/(ord.length+1),y,n:ord.length}));
  });
  return out;
}
function drawShape(club){
  const box=document.querySelector(`[data-pitchfor="${cssq(club)}"]`);
  if(!box) return;
  const st=EDIT.shapes[club]=EDIT.shapes[club]||{f:"",pos:{}};
  const form=st.f||autoFormation(club);
  const kit=kitOf(club);
  box.innerHTML=`<div class="xip-lines"></div>`;
  shapeSlots(shapeMen(club),form).forEach(({p,x,y,n})=>{
    const ov=st.pos[p.n];
    const el=document.createElement("div");
    el.className="pp-spot"; el.dataset.pn=p.n; el.dataset.pc=club;
    el.style.right=(ov?ov.x:x)+"%"; el.style.top=(ov?ov.y:y)+"%";
    el.style.maxWidth=(96/(n+1))+"%";      /* لا يتجاوز المسافة بين لاعبين متجاورين */
    el.innerHTML=`<span class="pp-dot" style="${dotVars(kit)}">${p.s||"–"}</span>
      <span class="pp-nm">${esc(p.n)}</span>`;
    box.appendChild(el);
  });
}
const cssq=s=>String(s).replace(/"/g,'\\"');

/* ===================== تشكيلة الجمهور =====================
   يصوّت المشترك المسجَّل بتشكيلة من أحد عشر لاعباً ورسمٍ فنّي، ويختار
   أفضل لاعب وأفضل حارس وهدف الجولة. تُحسب النتيجة بأكثر اللاعبين
   اختياراً في كل خط، ثم يعتمدها المحرّرون فتصير رسمية.

   التصويت يبدأ من الجولة الثالثة، ولا يُفتح إلا بعد انتهاء مبارياتها.
   الأصوات في مجموعة tots بمعرّف "<الجولة>_<المشترك>" فلا يصوّت أحد
   مرتين ولا يعدّل صوت غيره. والنتيجة المعتمدة داخل بيانات الموسم
   يكتبها فريق العمل مع بقية البيانات. */
const VOTE_FROM_ROUND = 3;

/* تمييز العدد بالعربية: صوت واحد، صوتان، ثلاثة أصوات، أحد عشر صوتاً */
function arCount(n, one, two, few, many){
  n=+n||0;
  if(n===1) return one;
  if(n===2) return two;
  if(n>=3 && n<=10) return n+" "+few;
  return n+" "+many;
}
const nVotes  = n => arCount(n, "صوت واحد", "صوتان", "أصوات", "صوتاً");
const nVoters = n => arCount(n, "مصوّت واحد", "مصوّتان", "مصوّتين", "مصوّتاً");

function totKey(round, comp){ return round + "|" + comp; }
function totRow(round, comp){
  return (ALL&&ALL.tots||[]).find(t=>t.r===round && (t.comp||"الدوري")===comp) || null;
}
/* الجولة صالحة للتصويت متى لُعبت كل مبارياتها */
function roundPlayed(round, comp){
  const ms=MATCHES.filter(m=>m.round===round && compOf(m)===comp);
  return ms.length>0 && ms.every(m=>!isUpcoming(m));
}
function voteRounds(){
  const out=[];
  MATCHES.forEach(m=>{
    const c=compOf(m), k=totKey(m.round,c);
    if(m.round<VOTE_FROM_ROUND || out.some(x=>x.k===k)) return;
    if(roundPlayed(m.round,c)) out.push({k, r:m.round, comp:c});
  });
  return out.sort((a,b)=>b.r-a.r);
}
/* من شارك في الجولة: الأساسيون ومن دخل بديلاً */
function roundPlayers(round, comp){
  const seen={}, out=[];
  const add=(n,club)=>{ const k=n+"|"+club; if(!n||seen[k]) return; seen[k]=1;
    const e=squadEntriesOf(club,[club]).find(z=>z.n===n)||{};
    out.push({n, club, s:e.s||0, role:e.p||"CM", line:SH_LINE[e.p||"CM"]||"M"}); };
  (ALL&&ALL.lineups||[]).filter(x=>x.r===round && compOf(x)===comp).forEach(x=>add(x.p,x.club));
  (ALL&&ALL.subs||[]).filter(x=>x.r===round && compOf(x)===comp).forEach(x=>add(x.in,x.club));
  return out.sort((a,b)=>String(a.n).localeCompare(String(b.n),"ar"));
}
function roundGoals(round, comp){
  return GOALS.filter(g=>g.r===round && compOf(g)===comp && g.bp!=="هدف عكسي")
    .map(g=>({id:goalId(g), p:g.p, club:g.sc, m:+g.m||0, x:+g.x||0, det:g.det||"", zone:g.zone||""}))
    .sort((a,b)=>a.m-b.m);
}
const goalId = g => [g.r, compOf(g), g.sc, g.p, (+g.m||0), (+g.x||0)].join("~");

/* ===== فرز الأصوات =====
   الرسم الفنّي: الأكثر اختياراً. ثم أعلى اللاعبين أصواتاً في كل خط
   بالعدد الذي يفرضه الرسم. التعادل يُحسم بالأكثر ظهوراً ثم بالاسم،
   ويُعرض للمحرّر ليقرّر. */
function tallyVotes(ballots){
  const forms={}, players={}, best={}, gks={}, goals={};
  const bump=(o,k)=>{ if(k) o[k]=(o[k]||0)+1; };
  ballots.forEach(b=>{
    bump(forms, b.f);
    (b.xi||[]).forEach(p=>{ const k=p.n+"|"+p.club; players[k]=(players[k]||0)+1; });
    if(b.best) bump(best, b.best.n+"|"+b.best.club);
    if(b.gk)   bump(gks,  b.gk.n+"|"+b.gk.club);
    bump(goals, b.goal);
  });
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]),"ar"))[0];
  const split=k=>({n:k.split("|")[0], club:k.split("|")[1]});
  return {forms, players, best, gks, goals,
          topForm: top(forms)? top(forms)[0] : "4-4-2",
          topBest: top(best)? {...split(top(best)[0]), v:top(best)[1]} : null,
          topGk:   top(gks)?  {...split(top(gks)[0]),  v:top(gks)[1]}  : null,
          topGoal: top(goals)? {id:top(goals)[0], v:top(goals)[1]} : null};
}
/* يبني الأحد عشر من أعلى الأصوات في كل خط حسب الرسم */
function buildFansXI(tal, round, comp){
  const pool=roundPlayers(round, comp);
  const votes=k=>tal.players[k]||0;
  const rank=arr=>arr.slice().sort((a,b)=>
    votes(b.n+"|"+b.club)-votes(a.n+"|"+a.club) || String(a.n).localeCompare(String(b.n),"ar"));
  const rows=String(tal.topForm).split("-").map(Number).filter(n=>n>0);
  const need={D:rows[0]||4, M:rows.slice(1,-1).reduce((a,b)=>a+b,0)||0, F:rows[rows.length-1]||0};
  if(rows.length===2){ need.D=rows[0]; need.M=0; need.F=rows[1]; }
  if(rows.length>=3){ need.M=rows.slice(1,-1).reduce((a,b)=>a+b,0); }
  const pick=(line,n)=>rank(pool.filter(p=>p.line===line)).filter(p=>votes(p.n+"|"+p.club)>0).slice(0,n);
  const xi=[...pick("G",1), ...pick("D",need.D), ...pick("M",need.M), ...pick("F",need.F)];
  return {f:tal.topForm, xi:xi.map(p=>({n:p.n, club:p.club}))};
}

/* ===== عرض التشكيلة للجمهور =====
   نفس الحساب الذي يراه المحرّر: الخطة المحفوظة إن ضُبطت، وإلا تُقترح من
   مراكز اللاعبين؛ والمواضع المسحوبة تُقرأ كما هي. */
function shapeRowOf(round, comp, club){
  return (ALL&&ALL.shapes||[]).find(x=>x.r===round && compOf(x)===comp && x.club===club) || null;
}
function xiNames(round, comp, club){
  const seen={}, out=[];
  (ALL&&ALL.lineups||[])
    .filter(x=>x.r===round && compOf(x)===comp && x.club===club && x.p)
    .forEach(x=>{ if(!seen[x.p]){ seen[x.p]=1; out.push(x.p); } });
  return out;                       /* لاعب مكرر بالخطأ يُرسم مرة واحدة */
}
function pitchSpots(round, comp, club){
  const names=xiNames(round, comp, club);
  if(names.length<7) return null;               /* تشكيلة ناقصة: لا نرسم نصفها */
  const men=shapeMenFrom(names, club);
  const row=shapeRowOf(round, comp, club);
  const form=(row&&row.f) || autoForm(men);
  const pos =(row&&row.pos) || {};
  const spots=shapeSlots(men, form).map(({p,x,y,n})=>{
    const ov=pos[p.n];
    return {p, x: ov?ov.x:x, y: ov?ov.y:y, n};
  });
  return {form, spots};
}
/* أحداث لاعب في مباراة: أهداف (بلا العكسية)، صناعات، كرت */
function playerMatchEvents(m, club, name){
  const comp = compOf(m);
  const gs = matchGoals(m).filter(g=>g.sc===club);
  const goals   = gs.filter(g=>g.p===name && g.bp!=="هدف عكسي").length;
  const assists = gs.filter(g=>g.a===name).length;
  const cds = CARDS.filter(x=>x.r===m.round && compOf(x)===comp && x.club===club && x.p===name);
  const off = (typeof matchSubs==="function") && matchSubs(m).some(s=>s.club===club && s.out===name);
  return {goals, assists, off, red:cds.some(c=>isRed(c.type)), yellow:cds.some(c=>isYellow(c.type))};
}
/* شارات على شارة اللاعب نفسها (أركان): الكرت أعلى يمين، الهدف أعلى يسار،
   الصناعة أسفل يمين، وسهم الخروج الأحمر أسفل يسار. */
function spotBadges(ev){
  if(!ev) return "";
  let b="";
  if(ev.goals)   b+=`<span class="pp-b goal">${ICO_BALL}${ev.goals>1?`<em>${ev.goals}</em>`:""}</span>`;
  if(ev.assists) b+=`<span class="pp-b assist">${ICO_BOOT}</span>`;
  if(ev.red||ev.yellow) b+=`<span class="pp-b card ${ev.red?"r":"y"}"></span>`;
  if(ev.off)     b+=`<span class="pp-b off" title="خرج"></span>`;
  return b;
}
const shortName = s => { const w=String(s||"").trim().split(/\s+/); return w.length>1 ? w[w.length-1] : (w[0]||""); };
function spotHTML(p, x, y, n, kit, ev, compact){
  const nm = compact ? shortName(p.n) : p.n;
  return `<div class="pp-spot${compact?" cmp":""}" style="right:${x}%;top:${y}%;max-width:${(compact?90/(n+1):96/(n+1)).toFixed(1)}%">
    <span class="pp-dot" style="${dotVars(kit)}">${p.s||"–"}${spotBadges(ev)}</span>
    <span class="pp-nm">${esc(nm)}</span></div>`;
}
/* القميص الفاتح يحتاج حافة غامقة ليُرى على العشب، والغامق حافة فاتحة */
function dotVars(kit){
  const edge = lumOf(kit.bg)>.72 ? "rgba(11,31,58,.45)" : "rgba(255,255,255,.85)";
  return `--pc:${kit.bg};--pt:${kit.fg};--pe:${edge}`;
}
/* ===== ألوان القميص على الملعب =====
   لكل نادٍ لون قميص ولون رقم. الافتراضي مشتقّ من ألوان النادي: اللون
   الأول قميصاً، والرقم أبيض عليه إن كان غامقاً، ولون النادي الثاني إن
   كان القميص فاتحاً (الكويت أبيض ورقمه أحمر). ويُضبط يدوياً من الإعدادات
   ويُحفظ في السحابة فيراه الجمهور كما ضُبط. */
const HEX=/^#[0-9a-fA-F]{6}$/;
function lumOf(h){
  const c=String(h||"").replace("#","");
  if(c.length!==6) return 1;
  return (.2126*parseInt(c.slice(0,2),16) + .7152*parseInt(c.slice(2,4),16)
        + .0722*parseInt(c.slice(4,6),16))/255;
}
function defaultKit(club){
  const cc=(window.CLUB_COLORS||{})[club] || ["#FFFFFF","#0B1F3A"];
  const bg=cc[0];
  if(lumOf(bg)<=.62) return {bg, fg:"#FFFFFF"};       /* قميص غامق: رقم أبيض */
  const alt=cc[1]||"";                                 /* قميص فاتح: اللون الثاني إن كان يُقرأ */
  return {bg, fg: (HEX.test(alt) && lumOf(alt)<=.62) ? alt : "#0B1F3A"};
}
function kitOf(club){
  const row=(ALL&&ALL.kits||[]).find(k=>k.club===club);
  const d=defaultKit(club);
  return {bg: (row&&HEX.test(row.bg))?row.bg:d.bg,
          fg: (row&&HEX.test(row.fg))?row.fg:d.fg};
}
const clubColor=c=>kitOf(c).bg;

/* ملعب لفريق واحد */
function clubPitchHTML(round, comp, club){
  const S=pitchSpots(round, comp, club);
  if(!S) return "";
  const kit=kitOf(club);
  const m=MATCHES.find(x=>x.round===round && compOf(x)===comp && (x.home===club||x.away===club));
  return `<div class="xipitch half"><div class="xip-lines"></div>
    ${S.spots.map(({p,x,y,n})=>spotHTML(p,x,y,n,kit, m?playerMatchEvents(m,club,p.n):null)).join("")}</div>`;
}
/* ملعب للفريقين: المضيف في نصفه السفلي، والضيف في العلوي مقلوباً */
function matchPitchHTML(m){
  const comp=compOf(m);
  const H=pitchSpots(m.round, comp, m.home), A=pitchSpots(m.round, comp, m.away);
  if(!H || !A) return "";
  /* فجوة واضحة في المنتصف: الضيف [3,45] والمضيف [55,97]، فلا تتلامس خطوط الهجوم */
  const half=(S, club, top)=>{
    const kit=kitOf(club);
    return S.spots.map(({p,x,y,n})=>{
      const yy = top ? 3 + ((90-y)/90)*42 : 97 - ((90-y)/90)*42;
      return spotHTML(p, top?100-x:x, +yy.toFixed(1), n, kit, playerMatchEvents(m,club,p.n), true);
    }).join("");
  };
  /* الاسم فوق نصف صاحبه وتحته، فيقرأ الملعب بلا لبس */
  const tag=c=>`<div class="xi-t">${crest(c)}<b>${esc(c)}</b>`;
  return `<div class="xi">
    ${tag(m.away)}<i>${esc(A.form)}</i></div>
    <div class="xipitch full"><div class="xip-lines"></div>
      ${half(A, m.away, true)}${half(H, m.home, false)}</div>
    ${tag(m.home)}<i>${esc(H.form)}</i></div>
  </div>`;
}

function wireShapes(box){
  box.querySelectorAll("[data-formfor]").forEach(sel=>sel.onchange=()=>{
    const cl=sel.dataset.formfor;
    EDIT.shapes[cl]={f:sel.value,pos:{}};     /* تغيير الخطة يُعيد التوزيع */
    drawShape(cl);
  });
  box.querySelectorAll("[data-resetshape]").forEach(b=>b.onclick=()=>{
    const cl=b.dataset.resetshape;
    delete EDIT.shapes[cl];
    const sel=box.querySelector(`[data-formfor="${cssq(cl)}"]`);
    if(sel) sel.value=autoFormation(cl);
    drawShape(cl);
  });
  /* اعكس الجهات: يقلب كل لاعب أفقياً (x ← 100−x) فيصير اليمين يساراً
     والعكس. يثبّت المواضع الحالية أولاً حتى يشمل القلبُ التلقائيَّ منها. */
  box.querySelectorAll("[data-flipshape]").forEach(b=>b.onclick=()=>{
    const cl=b.dataset.flipshape;
    const form=(EDIT.shapes[cl]||{}).f || autoFormation(cl);
    const pos={};
    shapeSlots(shapeMen(cl), form).forEach(({p,x,y})=>{
      const cur=(EDIT.shapes[cl]||{}).pos||{};
      const ox=cur[p.n]?cur[p.n].x:x, oy=cur[p.n]?cur[p.n].y:y;
      pos[p.n]={x:+(100-ox).toFixed(1), y:oy};
    });
    EDIT.shapes[cl]={f:form, pos};
    drawShape(cl);
  });
  box.querySelectorAll("[data-pitchfor]").forEach(p=>{
    let cur=null,rect=null;
    p.addEventListener("pointerdown",e=>{
      const s=e.target.closest(".pp-spot"); if(!s) return;
      cur=s; rect=p.getBoundingClientRect(); s.classList.add("drag");
      s.setPointerCapture(e.pointerId); e.preventDefault();
    });
    p.addEventListener("pointermove",e=>{
      if(!cur) return;
      /* حدود تُبقي الاسم داخل الملعب فلا يُقتطع عند الحافة */
      const x=Math.max(11,Math.min(89,(rect.right-e.clientX)/rect.width*100));
      const y=Math.max(6,Math.min(94,(e.clientY-rect.top)/rect.height*100));
      cur.style.right=x+"%"; cur.style.top=y+"%";
    });
    const drop=()=>{
      if(!cur) return;
      const cl=cur.dataset.pc, st=EDIT.shapes[cl]=EDIT.shapes[cl]||{f:"",pos:{}};
      if(!st.f) st.f=autoFormation(cl);
      st.pos[cur.dataset.pn]={x:parseFloat(cur.style.right),y:parseFloat(cur.style.top)};
      cur.classList.remove("drag"); cur=null;
    };
    p.addEventListener("pointerup",drop);
    p.addEventListener("pointercancel",drop);
  });
  box.querySelectorAll("[data-pitchfor]").forEach(p=>drawShape(p.dataset.pitchfor));
}

/* عدّاد التشكيلة: يمسك النقص والتكرار قبل الحفظ، فلا يصل خطأ للجمهور */
function xiTally(sides, E){
  const rows=sides.map(cl=>{
    const ns=(E.lineup||[]).filter(x=>x.club===cl && x.p).map(x=>x.p);
    const seen={}, dup=[];
    ns.forEach(n=>{ if(seen[n] && dup.indexOf(n)<0) dup.push(n); seen[n]=1; });
    const uniq=Object.keys(seen).length;
    const bad = uniq!==11 || dup.length;
    return `<div class="xitl${bad?" bad":""}">
      <b>${esc(cl)}</b>
      <span>${uniq} من 11</span>
      ${dup.length?`<em>مكرر: ${dup.map(esc).join("، ")}</em>`:""}
      ${!dup.length && uniq<11 ? `<em>ناقص ${11-uniq}</em>` : ""}
      ${!dup.length && uniq>11 ? `<em>زائد ${uniq-11}</em>` : ""}
    </div>`;
  }).join("");
  return rows ? `<div class="xitally">${rows}</div>` : "";
}

function setPath(path, val){
  const parts=path.split(".");
  if(parts[0]==="match"){ EDIT.match[parts[1]] = val; return; }
  const arr=EDIT[parts[0]]; if(!arr) return;
  arr[+parts[1]][parts[2]] = val;
}

function validateEdit(){
  const m=EDIT.match;
  if(!m.round || +m.round<1) return "أدخل رقم الجولة.";
  if(!m.home || !m.away) return "اختر الفريق المضيف والفريق الضيف.";
  if(m.home===m.away) return "لا يمكن أن يواجه النادي نفسه.";
  if(!m.date) return "أدخل تاريخ المباراة.";
  const dup=(ALL.matches||[]).some(x=>mkey(x)===`${+m.round}|${m.comp}|${m.home}|${m.away}` && mkey(x)!==EDIT.orig);
  if(dup) return "هذه المباراة مسجّلة مسبقاً في هذه الجولة والمسابقة.";
  for(const [i,g] of EDIT.goals.entries()){
    if(!g.sc) return `الهدف ${i+1}: اختر الفريق المسجل.`;
    if(!g.p) return `الهدف ${i+1}: اكتب اسم اللاعب.`;
    if(!g.m || +g.m<1) return `الهدف ${i+1}: أدخل الدقيقة.`;
    if(!g.det) return `الهدف ${i+1}: اختر تفصيل طريقة التسجيل.`;
  }
  for(const [i,x] of EDIT.cards.entries()){
    if(!x.club) return `البطاقة ${i+1}: اختر النادي.`;
    if(!x.type) return `البطاقة ${i+1}: اختر النوع.`;
  }
  for(const [i,x] of EDIT.pens.entries()){
    if(!x.by) return `ركلة الجزاء ${i+1}: اختر الفريق المنفّذ.`;
    if(!x.res) return `ركلة الجزاء ${i+1}: اختر النتيجة.`;
  }
  return "";
}

function removeMatchByKey(key){
  const old=(ALL.matches||[]).find(m=>mkey(m)===key);
  if(!old) return;
  const pair=(a,b)=>(a===old.home&&b===old.away)||(a===old.away&&b===old.home);
  ALL.matches = ALL.matches.filter(m=>mkey(m)!==key);
  ALL.goals   = ALL.goals.filter(g=>!(g.r===old.round && compOf(g)===compOf(old) && pair(g.sc,g.cd)));
  ALL.cards   = (ALL.cards||[]).filter(x=>!(x.r===old.round && compOf(x)===compOf(old) && (x.club===old.home||x.club===old.away)));
  ALL.pens    = (ALL.pens||[]).filter(x=>!(x.r===old.round && compOf(x)===compOf(old) && pair(x.by,x.vs)));
  const mine  = x => x.r===old.round && compOf(x)===compOf(old) && (x.club===old.home||x.club===old.away);
  ALL.lineups = (ALL.lineups||[]).filter(x=>!mine(x));
  ALL.shapes  = (ALL.shapes ||[]).filter(x=>!mine(x));
  ALL.subs    = (ALL.subs||[]).filter(x=>!mine(x));
}

async function saveMatch(){
  toast("جارٍ حفظ المباراة…","busy",true);
  FORMERR = validateEdit();
  if(FORMERR){ renderMatchAdmin(); return; }
  /* نبني على أحدث نسخة سحابية حتى لا نمحو ما أدخله محرّر آخر بيننا */
  const reb = await rebaseOnCloud();
  if(reb.changed) toast(`وصل تحديث من ${reb.by||"محرّر آخر"} — دُمج قبل الحفظ`,"busy");
  const m=EDIT.match, round=+m.round;
  if(EDIT.orig) removeMatchByKey(EDIT.orig);
  const other = t => t===m.home ? m.away : m.home;
  ALL.matches.push({n:ALL.matches.length+1, round, comp:m.comp, date:m.date, time:m.time,
                    venue:m.venue, home:m.home, away:m.away, note:(m.note||"").trim(), hg:0, ag:0});
  EDIT.goals.forEach(g=>ALL.goals.push({r:round, comp:m.comp, sc:g.sc, cd:other(g.sc), p:g.p, a:g.a||"",
      m:+g.m, x:+g.x||0, cat:catOf(g.det), det:g.det, bp:g.bp||"", zone:g.zone||"",
      og: g.bp==="هدف عكسي" ? (g.og||"") : ""}));
  upgradeSecondYellows(EDIT.cards).forEach(x=>ALL.cards.push(
      {r:round, comp:m.comp, club:x.club, p:x.p, m:+x.m||0, type:x.type}));
  EDIT.pens.forEach(x=>ALL.pens.push({r:round, comp:m.comp, by:x.by, vs:other(x.by), p:x.p,
      m:+x.m||0, res:x.res, place:x.place||""}));
  ALL.lineups = ALL.lineups || []; ALL.subs = ALL.subs || [];
  (EDIT.lineup||[]).filter(x=>x.club && x.p).forEach(x=>
      ALL.lineups.push({r:round, comp:m.comp, club:x.club, p:x.p}));
  (EDIT.subs||[]).filter(x=>x.club && (x.out||x.in)).forEach(x=>
      ALL.subs.push({r:round, comp:m.comp, club:x.club, out:x.out||"", in:x.in||"",
                     h:+x.h||1, m:+x.m||0}));
  ALL.shapes = ALL.shapes || [];
  for(const cl in (EDIT.shapes||{})){
    const s=EDIT.shapes[cl];
    if(!s || (!s.f && !Object.keys(s.pos||{}).length)) continue;   /* بلا تعديل: لا نحفظ صفاً */
    ALL.shapes.push({r:round, comp:m.comp, club:cl, f:s.f||"", pos:s.pos||{}});
  }
  /* النتيجة تُشتق من الأهداف */
  ALL.matches.forEach(mm=>{
    mm.hg = ALL.goals.filter(g=>g.r===mm.round && compOf(g)===compOf(mm) && g.sc===mm.home && g.cd===mm.away).length;
    mm.ag = ALL.goals.filter(g=>g.r===mm.round && compOf(g)===compOf(mm) && g.sc===mm.away && g.cd===mm.home).length;
  });
  ALL.matches.sort((a,b)=>(a.round-b.round)||String(a.date).localeCompare(String(b.date)));
  ALL.matches.forEach((mm,i)=>mm.n=i+1);
  stampComp(ALL);
  const have=compsPresent(); if(!have.includes(COMP)) COMP=have[0]||"الدوري";
  applyComp(); DATA_SOURCE="إدخال يدوي في الموقع"; DATA_UPDATED=new Date().toISOString();
  DATA_BY=(FBUSER&&FBUSER.email)||"";
  EDIT=null; FORMERR="";
  toast("جارٍ حفظ المباراة…","busy",true);
  const okm = await persistData();
  if(okm===true){ LASTSYNC=new Date(); toast(`حُفظت المباراة: ${m.home} ضد ${m.away} ✅`,"ok"); }
  else if(okm==="pending") toast(SYNCMSG,"busy");
  else toast(SYNCMSG||"حُفظت محلياً، لكن تعذّر الحفظ في السحابة","err");
  /* أي لقطة وصلت أثناء التحرير أقدم من حفظنا — تطبيقها يتراجع عنه */
  dropStaleRemote();
  paintRail(); renderAll(); renderMatchAdmin();
}

    const shrink=(u,dim,q)=>new Promise(r=>{
      if(!u){ r(u); return; }
      const img=new Image();
      img.onload=()=>{ try{
          const sc=Math.min(1,dim/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          let o=""; try{ o=c.toDataURL("image/webp",q); }catch(e){}
          r(o && o.indexOf("data:image/webp")===0 ? o : c.toDataURL("image/png"));
        }catch(e){ r(u); } };
      img.onerror=()=>r(u); img.src=u; });
    for(const k of Object.keys(LOGOS))  LOGOS[k]  = await shrink(LOGOS[k],160,0.9);
    for(const k of Object.keys(PHOTOS)) PHOTOS[k] = await shrink(PHOTOS[k],220,0.85);
    BRAND  = await shrink(BRAND,300,0.9);
    LEAGUE = await shrink(LEAGUE,180,0.9);
    const after=assetsKB();
    const ok=await persist();
    busy(rc2,false);

  const ft=$("#fantasyToggle");

    else toast(SYNCMSG||"تعذّر الحفظ — لم تتغيّر الحالة","err");
    renderAdmin(); };
  const fo=$("#fantasyOpenBtn");
  if(fo) fo.onclick=()=>window.open(FANTASY_URL+"#admin","_blank","noopener");
  const pc=$("#pushCloud");

    else toast(SYNCMSG||"تعذّر الرفع إلى السحابة","err");

    paintRail(); renderAll(); renderMatchAdmin(); });

/* ================= التصدير: صورة 1080 و PDF ================= */
function rr(ctx,x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function cardData(mode, club){
  const T=standings(), tg=GOALS.length, pl=playedMatches().length;
  if(mode==="club"){
    const st=clubStats(club), r=st.row, pos=T.findIndex(x=>x.c===club)+1;
    const L={w:"ف",d:"ت",l:"خ"};
    return {title:club, sub:`الجولة ${Math.max(...MATCHES.map(m=>m.round))} · ${SEASON}`, rows:[
      ["المركز", String(pos)],
      ["النقاط", String(r.Pts)],
      ["سجّل / استقبل", `${r.GF} - ${r.GA}`],
      ["الفورمة", r.form.slice(-5).reverse().map(x=>L[x]).join(" ") || "—"],
      ["الهدّاف", st.top?`${st.top.n} (${st.top.g})`:"—"],
      ["نصيب الكرات الثابتة", r.GF?`${pct(st.sp,r.GF)}%`:"—"]
    ]};
  }
  const sp=GOALS.filter(g=>g.cat==="كرات ثابتة").length;
  const second=GOALS.filter(g=>["46-60","61-75","76-90","90+"].includes(period(g))).length;
  const top=scorers()[0];
  const fg=firstGoals().filter(x=>x.first);
  return {title:"ملخص الدوري", sub:`الجولة ${Math.max(...MATCHES.map(m=>m.round))} · ${SEASON}`, rows:[
    ["إجمالي الأهداف", `${tg} في ${mw(pl)}`],
    ["معدل أهداف المباراة", pl?(tg/pl).toFixed(2):"—"],
    ["المتصدر", `${T[0].c} (${T[0].Pts})`],
    ["الهدّاف", top?`${top.n} (${top.g})`:"—"],
    ["نصيب الكرات الثابتة", `${pct(sp,tg)}%`],
    ["نصيب الشوط الثاني", `${pct(second,tg)}%`],
    ["فوز صاحب الهدف الأول", `${pct(fg.filter(x=>x.res==="فوز").length,fg.length)}%`]
  ]};
}

async function exportImage(mode, club){
  const S=1080, c=document.createElement("canvas"); c.width=S; c.height=S;
  const x=c.getContext("2d");
  try{ await document.fonts.ready; }catch(e){}
  const F=(w,sz)=>`${w} ${sz}px "IBM Plex Sans Arabic", system-ui, sans-serif`;

  const bg=x.createLinearGradient(0,0,S,S);
  bg.addColorStop(0,"#0E2B52"); bg.addColorStop(.55,"#0A2242"); bg.addColorStop(1,"#061529");
  x.fillStyle=bg; x.fillRect(0,0,S,S);
  const glow=x.createRadialGradient(S*.85,S*.08,20,S*.85,S*.08,S*.7);
  glow.addColorStop(0,"rgba(95,178,232,.20)"); glow.addColorStop(1,"rgba(95,178,232,0)");
  x.fillStyle=glow; x.fillRect(0,0,S,S);

  x.direction="rtl"; x.textAlign="right";
  const D=cardData(mode,club);

  /* الشعار أعلى اليسار */
  const img=new Image();
  await new Promise(res=>{ img.onload=res; img.onerror=res; img.src=BRAND; });
  if(img.width){ const lw=190, lh=lw*img.height/img.width; x.globalAlpha=1; x.drawImage(img,72,64,lw,lh); }

  /* العنوان */
  x.fillStyle="#5FB2E8"; x.font=F(600,30); x.fillText(D.sub, S-72, 106);
  x.fillStyle="#FFFFFF"; x.font=F(700,64); x.fillText(D.title, S-72, 178);

  /* شريط الدقائق */
  const rw=(S-144)/16;
  PERIODS.forEach((pp,i)=>{ const n=GOALS.filter(g=>period(g)===pp).length;
    x.fillStyle = n>2?"#E9B949" : n>0?"#5FB2E8" : "rgba(143,166,196,.25)";
    rr(x,72+i*2*rw,214,rw*2-8,7,4); x.fill(); });

  /* لوحة الأرقام */
  const py=268, ph=S-py-190;
  x.fillStyle="rgba(14,43,82,.72)"; rr(x,72,py,S-144,ph,26); x.fill();
  x.strokeStyle="rgba(143,166,196,.28)"; x.lineWidth=2; x.stroke();

  const n=D.rows.length, step=ph/n;
  D.rows.forEach((row,i)=>{
    const y=py+step*(i+.5);
    x.fillStyle="#A9D8F5"; x.font=F(500,30); x.fillText(row[0], S-112, y-4);
    x.textAlign="left";
    x.fillStyle="#FFFFFF"; x.font=F(700,42); x.fillText(row[1], 112, y+4);
    x.textAlign="right";
    if(i<n-1){ x.strokeStyle="rgba(143,166,196,.16)"; x.lineWidth=1;
      x.beginPath(); x.moveTo(112,py+step*(i+1)); x.lineTo(S-112,py+step*(i+1)); x.stroke(); }
  });

  /* التذييل: الحقوق */
  x.fillStyle="#8FA6C4"; x.font=F(400,26);
  x.fillText("المصدر: رصد يدوي ✅ · " + LASTUPDATE, S-72, S-96);
  x.textAlign="left"; x.direction="ltr";
  x.fillStyle="#E9B949"; x.font=F(600,30); x.fillText(HANDLES, 72, S-96);
  x.fillStyle="rgba(143,166,196,.75)"; x.font=F(400,24); x.fillText("© "+OWNER, 72, S-56);

  const name = (mode==="club" ? club : "ملخص-الدوري") + "-الجولة-" + Math.max(...MATCHES.map(m=>m.round)) + ".png";
  c.toBlob(b=>{ const u=URL.createObjectURL(b); const a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); }, "image/png");
}

/* ================= صورة اللاعب ================= */
function pavStyle(name){
  const a=PAV[name]||{z:100,x:50,y:50};
  return `object-position:${a.x}% ${a.y}%;transform:scale(${(a.z/100).toFixed(2)})`;
}
function pav(name, size, placeholder){
  const S=size||PAVSIZE;
  const src = PHOTOSON ? PHOTOS[name] : null;
  if(src) return `<span class="pav" style="width:${S}px;height:${S}px">
    <img src="${src}" alt="${esc(name)}" style="${pavStyle(name)}"></span>`;
  /* بلا صورة: لا يظهر شيء — شعار النادي وحده بجانب الاسم.
     الحروف الأولى تُعرض في لوحة المدير فقط لتمييز من ينقصه صورة. */
  if(!placeholder) return "";
  const ini=(name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("");
  return `<span class="pavph" style="width:${S}px;height:${S}px;font-size:${Math.round(S*0.34)}px">${esc(ini||"؟")}</span>`;
}

const PZ_GEO = {
 "يسار أعلى":  {x:8,  y:8,  w:34, h:20},
 "وسط أعلى":   {x:42, y:8,  w:34, h:20},
 "يمين أعلى":  {x:76, y:8,  w:34, h:20},

 "خارج المرمى":{x:0,  y:52, w:118,h:14}
};
function goalMap(list){
  const has = list.some(x=>x.place);
  const c={}; PZONES.forEach(z=>c[z]=0);
  list.forEach(x=>{ if(c[x.place]!==undefined) c[x.place]++; });
  const mx=Math.max(1,...Object.values(c));
  const cell=z=>{
    const g=PZ_GEO[z], n=c[z];
    const t=n/mx;
    const f = n===0 ? "rgba(143,166,196,.07)"
      : `rgba(${Math.round(95+(233-95)*t)},${Math.round(178+(185-178)*t)},${Math.round(232+(73-232)*t)},${(0.24+0.6*t).toFixed(2)})`;
    return `<rect class="zn" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="${f}" rx="1.5"><title>${z}: ${n}</title></rect>`
      + (n>0?`<text x="${g.x+g.w/2}" y="${g.y+g.h/2}">${n}</text>`:"");
  };
  const svg=`<div class="goalwrap"><svg class="goalsvg" viewBox="-4 0 126 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="خريطة مرمى ركلات الجزاء">
    ${PZONES.map(cell).join("")}
    <path class="frame" d="M 8 50 L 8 8 L 110 8 L 110 50"/>

/* ================= الرزنامة وشريط الجولات ================= */
let SELR=null, SELDAY=null, CALM=null;
const AR_DOW=["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];  /* getDay(): 0=الأحد */
const AR_MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

/* الشهر الافتراضي للتقويم: الشهر الحالي إن كان فيه مباريات، وإلا أقرب شهر قادم فيه مباريات،
   وإلا آخر شهر في الموسم (كان يفتح دائماً على آخر شهر — مايو). */
function calMonth(){
  if(CALM) return CALM;
  const dates=MATCHES.map(m=>m.date).filter(Boolean).sort();
  const now=new Date(), ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  if(!dates.length) return ym;
  if(dates.some(d=>d.slice(0,7)===ym)) return ym;
  const next=dates.find(d=>d.slice(0,7)>ym);
  return (next || dates[dates.length-1]).slice(0,7);
}
/* ===== المناسبات وفترات التوقف =====
   مناسبة واحدة: {d:"من", to:"إلى"(اختياري), t:"العنوان", k:"النوع", n:"تفصيل"}
   تُعرض في الرزنامة وتحتها، فيرى الجمهور سبب توقف الدوري. */
const EV_KINDS = ["منتخب", "بطولة خارجية", "توقف الدوري", "مناسبة"];
function allEvents(){ return (ALL && ALL.events) || []; }
function evDays(e){                                  /* أيام المناسبة من d إلى to */
  const out=[]; if(!e || !e.d) return out;
  const a=new Date(e.d+"T12:00:00"), b=new Date((e.to||e.d)+"T12:00:00");
  if(isNaN(a)||isNaN(b)||b<a) return [e.d];
  for(let t=new Date(a); t<=b; t.setDate(t.getDate()+1)){
    out.push(t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"));
    if(out.length>120) break;                        /* حارس ضد مدى مفتوح */
  }
  return out;
}
function eventsOfMonth(base){
  return allEvents().filter(e=>evDays(e).some(d=>d.startsWith(base)))
    .sort((a,b)=>String(a.d).localeCompare(String(b.d)));
}
function evRange(e){
  const f=s=>{ const d=new Date(s+"T12:00:00"); return isNaN(d)?s:(d.getDate()+" "+AR_MON[d.getMonth()]); };
  return (e.to && e.to!==e.d) ? f(e.d)+" — "+f(e.to) : f(e.d);
}
function eventsBlock(base){
  const evs=eventsOfMonth(base);
  if(!evs.length) return "";
  return `<div class="evlist">${evs.map(e=>`
    <div class="evrow${e.k==="توقف الدوري"?" brk":""}">
      <span class="ev-d">${esc(evRange(e))}</span>
      <span class="ev-t">${esc(e.t||"")}${e.k?`<i class="ev-k">${esc(e.k)}</i>`:""}
        ${e.n?`<em class="ev-n">${esc(e.n)}</em>`:""}</span>
    </div>`).join("")}</div>`;
}
function calendarBar(){
  const base=calMonth();
  const [Y,Mo]=base.split("-").map(Number);
  const days=new Date(Y,Mo,0).getDate();
  const counts={}, soonDays={};
  MATCHES.forEach(m=>{ if(m.date && m.date.startsWith(base)){
    counts[m.date]=(counts[m.date]||0)+1;
    if(isUpcoming(m)) soonDays[m.date]=(soonDays[m.date]||0)+1; } });
  const evDayset=new Set();                        /* أيام فيها مناسبة */
  allEvents().forEach(e=>evDays(e).forEach(d=>{ if(d.startsWith(base)) evDayset.add(d); }));
  const lead=new Date(Y,Mo-1,1).getDay();          /* 0 = الأحد */
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="cday blank"></div>');
  for(let d=1; d<=days; d++){
    const iso=`${Y}-${String(Mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n=counts[iso]||0;
    const sn=soonDays[iso]||0;
    const ev=evDayset.has(iso);
    cells.push(`<button class="cday ${n?(sn===n?"has soon":"has"):"off"}${ev?" evd":""}" data-day="${iso}" ${n?"":"disabled"} aria-pressed="${SELDAY===iso}">
      <div class="dn">${d}</div><div class="dd${sn?" g":""}">${n?"●".repeat(Math.min(n,3)):""}</div></button>`);
  }
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  return `<div class="calbar">
    <div class="calhead"><b>${AR_MON[Mo-1]} ${Y}</b>
      <div class="calnav">
        <button data-cal="1" title="الشهر التالي">›</button>
        <button data-cal="-1" title="الشهر السابق">‹</button>
        ${SELDAY?`<button data-cal="0" style="width:auto;padding:0 10px;font-size:.7rem">إلغاء التحديد</button>`:""}
      </div></div>
    <div class="caldow">${AR_DOW.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="caldays">${cells.join("")}</div>
    <p class="hint" style="margin:8px 0 0">${total?`${mw(total)} في هذا الشهر — اضغط أي يوم مضيء لعرض مبارياته.${Object.keys(soonDays).length?" الأيام الذهبية مبارياتها لم تبدأ بعد.":""}`:"لا مباريات في هذا الشهر."}${evDayset.size?" الأيام ذات الخط الذهبي فيها مناسبة.":""}</p>
    ${eventsBlock(base)}
  </div>`;
}

function formPills(f){

function nextMatch(){
  return MATCHES.filter(m=>isUpcoming(m) && kickoffTS(m)!==null)
                .sort((a,b)=>kickoffTS(a)-kickoffTS(b))[0] || null;
}
function dayLabel(dstr){
  const d=new Date(String(dstr)+"T12:00:00");
  if(isNaN(d.getTime())) return esc(dstr||"");
  return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]}`;
}
function countdown(ts){
  const ms = ts - Date.now();
  if(ms<=0) return "";
  const mins=Math.floor(ms/60000), hrs=Math.floor(mins/60), days=Math.floor(hrs/24);
  if(days>=1) return days===1?"بعد يوم واحد":days===2?"بعد يومين":days<=10?`بعد ${days} أيام`:`بعد ${days} يوماً`;
  if(hrs>=1)  return hrs===1?"بعد ساعة":hrs===2?"بعد ساعتين":`بعد ${hrs} ساعات`;
  return mins<=1?"بعد دقيقة":`بعد ${mins} دقيقة`;
}
/* ===== المباريات الجارية الآن =====
   تُحدَّد بالتوقيت وحده: انطلقت ولم تمضِ ساعتان. الدقيقة تقديرية
   محسوبة من ضربة البداية — لا تعرف التوقّف بدقة — فنكتفي بحد 90. */
function liveMatches(){
  return MATCHES.filter(isLive).sort((a,b)=>(kickoffTS(a)||0)-(kickoffTS(b)||0));

function liveMinute(m){
  const k=kickoffTS(m); if(k===null) return "";
  const mins=Math.floor((Date.now()-k)/60000);
  if(mins<0) return "";
  if(mins<=45) return mins+"'";
  if(mins<60)  return "الاستراحة";
  return Math.min(90, mins-15)+"'";        /* ربع ساعة استراحة تقريباً */
}

function renderMatches(){
  let list = MATCHES.slice();
  if(SELDAY) list = list.filter(m=>m.date===SELDAY);
  else if(SELR!==null) list = list.filter(m=>m.round===SELR);
  list.sort((a,b)=>{
    const ua=isUpcoming(a), ub=isUpcoming(b);
    if(ua!==ub) return ua?-1:1;                                   /* القادم أولاً */
    if(ua) return (kickoffTS(a)||0)-(kickoffTS(b)||0);            /* الأقرب موعداً */
    return (b.round-a.round) || String(b.date).localeCompare(String(a.date));
  });

  /* v15: FotMob-style split timeline — home goals on the right, away on the left, minute badge on the centre line */
  function goalsTimeline(m,gs,mc){
    mc = mc || [];
    const subs=(typeof matchSubs==="function")?matchSubs(m):[];
    if(!gs.length && !subs.length && !mc.length) return "";
    const ORD={g:0,c:1,s:2};
    const ev=[...gs.map(g=>({t:"g",m:+g.m||0,x:+g.x||0,g})),
              ...subs.map(sb=>({t:"s",m:absMinute(sb.h,sb.m),x:0,sb,half:+sb.h||1})),
              ...mc.map(c=>({t:"c",m:+c.m||0,x:0,c}))]
      .sort((a,b)=>(a.m-b.m)||(a.x-b.x)||(ORD[a.t]-ORD[b.t]));
    let h=0,a=0; const rows=[]; let htDone=false;
    ev.forEach(e=>{
      const club = e.t==="g" ? e.g.sc : e.t==="c" ? e.c.club : e.sb.club;
      const isH = club===m.home;
      const afterHT = e.t==="g" ? (e.m>45 && !(e.m===45 && e.x))
                    : e.t==="c" ? (e.m>45)
                    : (e.half>=2);
      if(!htDone && afterHT){ htDone=true; rows.push(`<div class="tl-mark"><span>الشوط الأول <b dir="ltr">${h} - ${a}</b></span></div>`); }
      if(e.t==="s"){
        const sb=e.sb;
        const sbody=`<div class="tl-ev sub${isH?" h":" a"}">
          <div class="tl-card">
            ${sb.out?`<div class="tl-sub-out"><i></i>${esc(sb.out)}</div>`:""}
            ${sb.in?`<div class="tl-sub-in"><i></i>${esc(sb.in)}</div>`:""}
          </div>
        </div>`;
        rows.push(`<div class="tl-row sub${isH?" home":" away"}">
          <div class="tl-side r">${isH?sbody:""}</div>
          <div class="tl-min sub"><span>${e.m}'</span></div>
          <div class="tl-side l">${isH?"":sbody}</div>
        </div>`);
        return;
      }
      if(e.t==="c"){
        const c=e.c, red=isRed(c.type);
        const cbody=`<div class="tl-ev card${isH?" h":" a"}">
          <div class="tl-card">
            <div class="tl-name"><i class="cardpill ${red?"r":"y"}"></i>${esc(c.p)}</div>
            <div class="tl-sub">${red?"طرد":"إنذار"}</div>
          </div></div>`;
        rows.push(`<div class="tl-row card${isH?" home":" away"}">
          <div class="tl-side r">${isH?cbody:""}</div>
          <div class="tl-min card"><span>${e.m}'</span></div>
          <div class="tl-side l">${isH?"":cbody}</div>
        </div>`);
        return;
      }
      const g=e.g;
      if(isH) h++; else a++;
      const og = g.bp==="هدف عكسي";
      const body=`<div class="tl-ev${isH?" h":" a"}">
          <div class="tl-card">

        <div class="tl-min"><span>${minLabel(g)}</span></div>
        <div class="tl-side l">${isH?"":body}</div>
      </div>`);
    });
    if(!htDone) rows.push(`<div class="tl-mark"><span>الشوط الأول <b dir="ltr">${h} - ${a}</b></span></div>`);
    rows.push(`<div class="tl-mark end"><span>النهاية <b dir="ltr">${m.hg??h} - ${m.ag??a}</b></span></div>`);

  /* التفاصيل مطويّة: البطاقة تبقى نظيفة، وتُفتح بالضغط */
  function detailsBlock(m, gs, mc, soon){
    if(soon) return "";
    const xi = matchPitchHTML(m);
    const tl = goalsTimeline(m, gs, mc);   /* الإنذارات مدمجة في الشريط الزمني */
    if(!xi && !tl) return "";
    const n = gs.length + (typeof matchSubs==="function" ? matchSubs(m).length : 0) + mc.length;
    return `<button type="button" class="mtog" aria-expanded="false">
        <span>التفاصيل${n?` <em>${n}</em>`:""}</span><i class="chev"></i></button>
      <div class="mdet" hidden>${xi}${tl}</div>`;
  }

  const matchCards = list.map(m=>{
    const gs=matchGoals(m);
    const mc=CARDS.filter(x=>x.r===m.round && (x.club===m.home||x.club===m.away));
    const y=mc.filter(x=>isYellow(x.type)).length, r=mc.filter(x=>isRed(x.type)).length;
    const soon=isUpcoming(m), live=isLive(m);
    return `<div class="match${soon?" soon":""}">
      <div class="mhead">
        <div class="mside">${crest(m.home)}<b>${esc(m.home)}</b></div>
        <div class="score${soon?" soon":""}">${soon ? (m.time?esc(m.time):"—") : `${m.hg} - ${m.ag}`}</div>
        <div class="mside away">${crest(m.away)}<b>${esc(m.away)}</b></div>
      </div>
      <div class="mmeta">
        ${soon?'<span class="mstat soon">لم تبدأ</span>':live?'<span class="mstat live">جارية الآن</span>':""}
        <span class="mdate">${esc(m.date)}${m.time?`<em>${esc(m.time)}</em>`:""}</span>
        <span class="mround">الجولة ${m.round}</span>
        ${m.venue?`<span class="mvenue">${esc(m.venue)}</span>`:""}
        ${COMP==="الكل"?`<span class="mcomp">${esc(compOf(m))}</span>`:""}
        ${soon?"":`<span class="mgoals">${gw(gs.length)}</span>`}
        ${(y||r)?`<span class="mcards">${y?`<b><i class="cardpill y"></i>${y}</b>`:""}${r?`<b><i class="cardpill r"></i>${r}</b>`:""}</span>`:""}
      </div>
      ${m.note?`<div class="mnote">${esc(m.note)}</div>`:""}
      ${detailsBlock(m, gs, mc, soon)}
    </div>`;
  }).join("");

  $("#v-matches").innerHTML = `
    ${compChips()}
    ${calendarBar()}
    ${roundStrip()}
    ${roundSummary(list)}
    ${list.length?matchCards:'<div class="card pad" style="text-align:center;color:var(--slate)">لا توجد مباريات ضمن هذا التحديد.</div>'}`;

  const V=$("#v-matches");
  /* فتح التفاصيل وطيّها — مباراة واحدة مفتوحة تكفي، فلا تطول الصفحة */
  V.querySelectorAll(".mtog").forEach(b=>b.onclick=()=>{
    const box=b.nextElementSibling, open=!box.hidden;
    box.hidden=open;
    b.setAttribute("aria-expanded", String(!open));
    b.classList.toggle("on", !open);
  });
  wireComp(V);
  V.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{
    SELR = b.dataset.round==="all" ? null : +b.dataset.round; SELDAY=null; renderMatches(); });
  V.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    SELDAY = SELDAY===b.dataset.day ? null : b.dataset.day; renderMatches(); });
  V.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.cal;
    if(d===0){ SELDAY=null; renderMatches(); return; }
    let [Y,Mo]=calMonth().split("-").map(Number); Mo+=d;
    if(Mo<1){Mo=12;Y--;} if(Mo>12){Mo=1;Y++;}
    CALM=`${Y}-${String(Mo).padStart(2,"0")}`; renderMatches(); });
}

async function paintFansBody(round, comp){
  await loadTotVotes(round, comp);
  const box=$("#fansBody"); if(!box) return;
  const row=totRow(round,comp);
  const ballots=TOTVOTES[totKey(round,comp)]||[];
  const parts=[];

  if(row && row.done) parts.push(officialXIHTML(row, round, comp, ballots.length));
  else if(ballots.length) parts.push(liveTallyHTML(ballots, round, comp));

  if(row && row.open) parts.push(ballotHTML(round, comp));
  else if(!row || !row.done) parts.push(`<div class="card pad"><p class="hint" style="margin:0">
    لم يُفتح التصويت لهذه الجولة بعد. يفتحه فريق العمل بعد رصد المباريات.</p></div>`);

  parts.push(votersHTML(ballots));
  box.innerHTML = parts.join("");
  wireBallot(round, comp);
}

/* ملعب تشكيلة الجمهور: لاعبون من أندية مختلفة، فلكل واحد لون ناديه */
function fansPitchHTML(row, tal){
  const men=(row.xi||[]).map(p=>{

/* ===== بطاقة التصويت =====
   الرسم الفنّي يحدّد عدد خانات كل خط، وكل خانة قائمة بلاعبي ذلك الخط
   ممن شاركوا في الجولة. الملعب فوقها يتغيّر مع كل اختيار. */
function newBallot(round, comp){
  if(MYTOT) return {f:MYTOT.f, xi:[...(MYTOT.xi||[])], best:MYTOT.best||null,
                    gk:MYTOT.gk||null, goal:MYTOT.goal||""};
  return {f:"4-3-3", xi:[], best:null, gk:null, goal:""};
}
function lineNeeds(f){
  const rows=String(f).split("-").map(Number).filter(n=>n>0);
  const D=rows[0]||0, F=rows.length>1?rows[rows.length-1]:0;
  const M=rows.length>2?rows.slice(1,-1).reduce((a,b)=>a+b,0):0;
  return [["G",1],["D",D],["M",M],["F",F]].filter(([,n])=>n>0);
}
const LINE_AR={G:"حراسة", D:"دفاع", M:"وسط", F:"هجوم"};

function ballotHTML(round, comp){
  if(!FAN) return `<h2 class="sec">صوّت بتشكيلتك</h2>
    <div class="card pad"><p class="hint">التصويت للمشتركين المسجّلين — سجّل دخولك من قسم
      <b>التوقعات</b> بنفس الحساب، ثم ارجع هنا.</p>
      <button class="btn" onclick="document.querySelector('nav.tabs button[data-v=predict]').click()">الذهاب للتسجيل</button></div>`;
  BALLOT = BALLOT || newBallot(round, comp);
  const pool=roundPlayers(round, comp);
  const gks=pool.filter(p=>p.line==="G");
  const goals=roundGoals(round, comp);
  const chosen=new Set(BALLOT.xi.map(p=>p.n+"|"+p.club));

  let i=0;
  const slots=lineNeeds(BALLOT.f).map(([line,n])=>{
    const opts=pool.filter(p=>p.line===line);
    const cells=[];
    for(let k=0;k<n;k++,i++){
      const cur=BALLOT.xi[i]||null;
      const key=cur?cur.n+"|"+cur.club:"";
      cells.push(`<label class="bl-f"><span>${LINE_AR[line]} ${n>1?k+1:""}</span>
        <select data-slot="${i}">
          <option value="">— اختر —</option>
          ${opts.map(p=>{const v=p.n+"|"+p.club;
            const taken=chosen.has(v)&&v!==key;
            return `<option value="${esc(v)}" ${v===key?"selected":""} ${taken?"disabled":""}>${esc(p.n)} — ${esc(p.club)}${p.s?" ("+p.s+")":""}</option>`;}).join("")}
        </select></label>`);
    }
    return `<div class="bl-line"><div class="bl-lt">${LINE_AR[line]}</div>${cells.join("")}</div>`;
  }).join("");

  const done=BALLOT.xi.filter(Boolean).length;
  const opt=(p,cur)=>`<option value="${esc(p.n+"|"+p.club)}" ${cur&&cur.n===p.n&&cur.club===p.club?"selected":""}>${esc(p.n)} — ${esc(p.club)}</option>`;
  return `<h2 class="sec">${MYTOT?"عدّل تصويتك":"صوّت بتشكيلتك"}</h2>
  <div class="card pad">
    ${MYTOT?`<div class="fx-hd"><span class="fx-badge live">صوتك مسجَّل</span>
      <span class="hint" style="margin:0">تقدر تعدّله ما دام التصويت مفتوحاً.</span></div>`:""}
    <div class="xi-pick">
      <label class="lb" for="blForm">الرسم الفنّي</label>
      <select id="blForm">${FORMATIONS.map(f=>`<option ${f===BALLOT.f?"selected":""}>${f}</option>`).join("")}</select>
    </div>
    <div id="blPitch">${BALLOT.xi.filter(Boolean).length>=7?fansPitchHTML({f:BALLOT.f, xi:BALLOT.xi.filter(Boolean)}):`
      <div class="bl-empty">اختر اللاعبين وتظهر تشكيلتك على الملعب</div>`}</div>
    <div class="bl-slots">${slots}</div>
    <h4 class="bl-h">اختيارات الجولة</h4>
    <div class="bl-extra">
      <label class="bl-f"><span>أفضل لاعب</span>
        <select id="blBest"><option value="">— اختر —</option>${pool.map(p=>opt(p,BALLOT.best)).join("")}</select></label>
      <label class="bl-f"><span>أفضل حارس</span>
        <select id="blGk"><option value="">— اختر —</option>${gks.map(p=>opt(p,BALLOT.gk)).join("")}</select></label>
      <label class="bl-f"><span>هدف الجولة</span>
        <select id="blGoal"><option value="">— اختر —</option>${goals.map(g=>`<option value="${esc(g.id)}" ${g.id===BALLOT.goal?"selected":""}>${esc(g.p)} (${esc(g.club)}) — ${g.m}'${g.det?" · "+esc(g.det):""}</option>`).join("")}</select></label>
    </div>
    <div class="bl-foot">
      <span class="bl-count${done===11?" ok":""}">${done} من 11</span>
      <button class="btn" id="blSave">${MYTOT?"تحديث التصويت":"إرسال التصويت"}</button>
    </div>
  </div>`;
}

function wireBallot(round, comp){
  const fm=$("#blForm");
  if(fm) fm.onchange=()=>{ BALLOT.f=fm.value; BALLOT.xi=[]; repaintBallot(round,comp); };
  document.querySelectorAll("[data-slot]").forEach(sel=>sel.onchange=()=>{
    const i=+sel.dataset.slot, v=sel.value;
    BALLOT.xi[i] = v ? {n:v.split("|")[0], club:v.split("|")[1]} : null;
    refreshBallot();          /* الملعب والعدّاد والمكرَّر فقط — لا نعيد بناء القوائم */
  });
  const pick=(id,key)=>{ const el=$(id); if(!el) return;
    el.onchange=()=>{ const v=el.value; BALLOT[key]= v? {n:v.split("|")[0], club:v.split("|")[1]} : null; }; };
  pick("#blBest","best"); pick("#blGk","gk");
  const gl=$("#blGoal"); if(gl) gl.onchange=()=>{ BALLOT.goal=gl.value; };
  const sv=$("#blSave");
  if(sv) sv.onclick=async()=>{
    const xi=BALLOT.xi.filter(Boolean);
    if(xi.length!==11){ toast("اختر أحد عشر لاعباً","err"); return; }
    if(new Set(xi.map(p=>p.n+"|"+p.club)).size!==11){ toast("لا تكرّر لاعباً","err"); return; }
    if(!BALLOT.best){ toast("اختر أفضل لاعب","err"); return; }
    if(!BALLOT.gk){ toast("اختر أفضل حارس","err"); return; }
    if(!BALLOT.goal && roundGoals(round,comp).length){ toast("اختر هدف الجولة","err"); return; }
    busy(sv,true,"جارٍ الإرسال…");
    const ok=await saveTotVote(round, comp, {...BALLOT, xi});
    busy(sv,false);
    if(ok){ toast("سُجّل تصويتك ✅","ok"); BALLOT=null; paintFansBody(round,comp); }
  };
}
/* تحديث خفيف بعد كل اختيار: القوائم فيها مئات الخيارات، فإعادة بنائها
   في كل ضغطة تُبطئ الهاتف. نكتفي بالملعب والعدّاد وتعطيل المكرَّر. */
function refreshBallot(){
  const taken=new Set(BALLOT.xi.filter(Boolean).map(p=>p.n+"|"+p.club));
  document.querySelectorAll("[data-slot]").forEach(sel=>{
    const mine=sel.value;
    [...sel.options].forEach(o=>{ if(o.value) o.disabled = taken.has(o.value) && o.value!==mine; });
  });
  const done=BALLOT.xi.filter(Boolean).length;
  const c=document.querySelector(".bl-count");
  if(c){ c.textContent=`${done} من 11`; c.classList.toggle("ok", done===11); }
  const p=$("#blPitch");
  if(p) p.innerHTML = done>=7
    ? fansPitchHTML({f:BALLOT.f, xi:BALLOT.xi.filter(Boolean)})
    : `<div class="bl-empty">اختر اللاعبين وتظهر تشكيلتك على الملعب</div>`;
}
/* تغيير الرسم وحده يستدعي إعادة بناء الخانات */
function repaintBallot(round, comp){
  const y=window.scrollY;
  const anchor=$("#blSave"); if(!anchor) return;
  const card=anchor.closest(".card");
  const holder=document.createElement("div");
  holder.innerHTML=ballotHTML(round, comp);
  const fresh=holder.querySelector(".card");
  card.replaceWith(fresh);
  wireBallot(round, comp);
  window.scrollTo(0,y);
}
