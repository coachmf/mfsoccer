/* شعارات الأندية الخارجية (ملفات محلية 160×160 من ويكيميديا) — تُقرأ باسم النادي بعد حذف النسبة (الاماراتي/البحريني…) */
const EXT_CRESTS={
  "الوحدة":"assets/crests/ext/wahda_uae.png","الخالدية":"assets/crests/ext/khaldiya_bhr.png",
  "ناساف":"assets/crests/ext/nasaf_uzb.png","نسف":"assets/crests/ext/nasaf_uzb.png",
  "فورتيس":"assets/crests/ext/fortis_ban.png","ريغار":"assets/crests/ext/regar_tjk.png","ريجار":"assets/crests/ext/regar_tjk.png",
  "استقلول":"assets/crests/ext/istiklol_tjk.png","استقلال":"assets/crests/ext/istiklol_tjk.png",
  "غوا":"assets/crests/ext/goa_ind.png","جوا":"assets/crests/ext/goa_ind.png","النجمة":"assets/crests/ext/nejmeh_lbn.png",
  "حمص الفداء":"assets/crests/ext/homs_syr.png","حمص الفدا":"assets/crests/ext/homs_syr.png","الفداء":"assets/crests/ext/homs_syr.png","الوثبة":"assets/crests/ext/homs_syr.png",
  "ريغار تاداز":"assets/crests/ext/regar_tjk.png","ريجار تاداز":"assets/crests/ext/regar_tjk.png",
  "الاتفاق":"assets/crests/ext/ettifaq_ksa.png","عجمان":"assets/crests/ext/ajman_uae.png","أربيل":"assets/crests/ext/erbil_irq.png","اربيل":"assets/crests/ext/erbil_irq.png"
};
const EXT_N={}; Object.keys(EXT_CRESTS).forEach(k=>{ EXT_N[_norm(k)]=EXT_CRESTS[k]; });
function evTeam(name, kind){
  const shown=String(name||"").trim().replace(/^(النادي|نادي|منتخب)\s+/,"").trim();
  if(!shown) return null;
  const stripped=shown.replace(/\s+(ال)?[ء-ي]{2,}ي$/,"").trim();   /* «الوحدة الاماراتي» → «الوحدة» */
  const cands=[shown]; if(stripped && stripped!==shown) cands.push(stripped);
  for(const raw of cands){
    const n=_norm(raw);
    const club=Object.keys(LOGOS).find(c=>_norm(c)===n) || null;
    const flag=FLAG_N[n] || null;
    const ext=EXT_N[n] || null;
    if(kind==="منتخب" && flag) return {t:"flag",n:raw,c:flag};
    if(club) return {t:"club",n:club};
    if(ext) return {t:"ext",n:raw,src:ext};
    if(flag) return {t:"flag",n:raw,c:flag};
  }
  return {t:"other",n:shown};
}
function evTeamHTML(x){
  const logo = x.t==="club" ? crest(x.n)
    : x.t==="ext" ? `<div class="crest has-logo" style="background:#fff"><img src="${x.src}" alt="" decoding="async"></div>`
    : x.t==="flag" ? `<img class="ev-flag" src="https://flagcdn.com/w40/${x.c}.png" srcset="https://flagcdn.com/w80/${x.c}.png 2x" alt="" decoding="async">`
    : `<div class="crest" style="background:#3B5578">${esc(x.n.slice(0,2))}</div>`;
  return `<span class="ev-team">${logo}<b>${esc(x.n)}</b></span>`;
}
/* صور مصغّرة لخلية التقويم: شعار نادٍ محلي/خارجي أو علم منتخب */
function evAvatarImg(x){
  if(!x) return "";
  if(x.t==="club") return LOGOS[x.n] ? `<img class="cl" src="${LOGOS[x.n]}" alt="" loading="lazy" decoding="async">` : "";
  if(x.t==="ext")  return `<img class="cl" src="${x.src}" alt="" loading="lazy" decoding="async">`;
  if(x.t==="flag") return `<img class="fl" src="https://flagcdn.com/w40/${x.c}.png" srcset="https://flagcdn.com/w80/${x.c}.png 2x" alt="" loading="lazy" decoding="async">`;
  return "";
}
function evAvatars(e){
  const parts=String(e.t||"").split(/\s*[-–—]\s*/).map(p=>p.trim()).filter(Boolean);
  if(parts.length<2) return [];
  const a=evTeam(parts[0],e.k), b=evTeam(parts[1],e.k);
  if(!a||!b||a.t==="other"||b.t==="other") return [];
  return [evAvatarImg(a),evAvatarImg(b)].filter(Boolean);
}
function evTitleHTML(e){
  const parts=String(e.t||"").split(/\s*[-–—]\s*/).map(p=>p.trim()).filter(Boolean);
  if(parts.length>=2){
    const a=evTeam(parts[0],e.k), b=evTeam(parts[1],e.k);
    if(a && b && a.t!=="other" && b.t!=="other" || (a&&b&&e.k==="بطولة خارجية"&&(a.t!=="other"||b.t!=="other"))){
      const rest=parts.slice(2).join(" - ");
      return `<span class="ev-match">${evTeamHTML(a)}<span class="ev-x">–</span>${evTeamHTML(b)}</span>${rest?`<em class="ev-comp">${esc(rest)}</em>`:""}`;
    }
  }
  return esc(e.t||"");
}
function eventsBlock(base){
  const evs=eventsOfMonth(base);
  if(!evs.length) return "";
  return `<div class="evlist">${evs.map(e=>`
    <div class="evrow${e.k==="توقف الدوري"?" brk":""}">
      <span class="ev-d">${esc(evRange(e))}</span>
      <span class="ev-t">${evTitleHTML(e)}${e.k?`<i class="ev-k">${esc(e.k)}</i>`:""}
        ${e.n?`<em class="ev-n">${esc(e.n)}</em>`:""}</span>
    </div>`).join("")}</div>`;
}
/* شريط الأيام (2026-09-15): بدل شبكة الشهر الكبيرة — حبوب أيام أفقية صغيرة، اليوم الذي فيه مباريات مضيء،
   والمناسبات (منتخب/بطولات خارجية) في قائمة قابلة للطي تحته. سمات data-day/data-cal نفسها فتبقى المعالجات كما هي. */
function calendarBar(){
  const base=calMonth();
  const [Y,Mo]=base.split("-").map(Number);
  const days=new Date(Y,Mo,0).getDate();
  const counts={}, soonDays={}, dayComps={};      /* dayComps: البطولة وعدد مبارياتها في اليوم (بدل النقاط) */
  MATCHES.forEach(m=>{ if(m.date && m.date.startsWith(base)){
    counts[m.date]=(counts[m.date]||0)+1;
    const c=compOf(m); (dayComps[m.date]??={})[c]=((dayComps[m.date]||{})[c]||0)+1;
    if(isUpcoming(m)) soonDays[m.date]=(soonDays[m.date]||0)+1; } });
  const COMP_SHORT={"كأس الأمير":"الأمير","كأس سمو ولي العهد":"ولي العهد","كأس السوبر":"السوبر"};
  const dayMarks=iso=>Object.entries(dayComps[iso]||{}).map(([c,k])=> c==="الدوري"
      ? `<i class="dk" title="الدوري"><img src="assets/hero/kpl-mark.webp" alt="" decoding="async">${k>1?`<em>${k}</em>`:""}</i>`
      : `<i class="dk cup" title="${esc(c)}">${esc(COMP_SHORT[c]||c)}${k>1?`<em>${k}</em>`:""}</i>`).join("");
  const evDayset=new Set();
  const evs=allEvents().filter(e=>evDays(e).some(d=>d.startsWith(base)));
  evs.forEach(e=>evDays(e).forEach(d=>{ if(d.startsWith(base)) evDayset.add(d); }));
  const todayIso=(()=>{ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; })();
  const cells=[];
  for(let d=1; d<=days; d++){
    const iso=`${Y}-${String(Mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n=counts[iso]||0, sn=soonDays[iso]||0, ev=evDayset.has(iso);
    const dow=AR_DOW[new Date(Y,Mo-1,d).getDay()];
    const dws=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"][new Date(Y,Mo-1,d).getDay()];
    cells.push(`<button type="button" class="dp${n?" has":""}${sn?" soon":""}${ev?" evd":""}${iso===todayIso?" today":""}" data-day="${iso}" ${n?"":"disabled"} aria-pressed="${SELDAY===iso}" aria-label="${dow} ${d}${n?` · ${mw(n)}`:""}">
      <span class="dw">${dws}</span><span class="dn">${d}</span><span class="dd">${dayMarks(iso)}</span></button>`);
  }
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  return `<div class="dstrip">
    <div class="ds-head">
      <b>${AR_MON[Mo-1]} ${Y}</b>
      <span class="ds-n">${total?mw(total):"لا مباريات"}</span>
      <div class="ds-nav">
        ${SELDAY?`<button type="button" data-cal="0" class="ds-clear">إلغاء اليوم</button>`:""}
        <button type="button" data-cal="-1" aria-label="الشهر السابق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" data-cal="1" aria-label="الشهر التالي"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
    </div>
    <div class="ds-days">${cells.join("")}</div>
    ${evs.length?`<details class="ds-ev"><summary>مناسبات الشهر<span class="ds-evn">${evs.length}</span><i class="chev"></i></summary>${eventsBlock(base)}</details>`:""}
  </div>`;
}

/* الجولة الحالية: جولة أقرب مباراة قادمة، وإلا آخر جولة لُعبت */
function currentRound(){
  const up=MATCHES.filter(isUpcoming).sort((a,b)=>(kickoffTS(a)||9e15)-(kickoffTS(b)||9e15));
  if(up.length) return up[0].round;
  const done=MATCHES.filter(m=>!isUpcoming(m));
  return done.length ? Math.max(...done.map(m=>m.round)) : null;
}
/* فلتر الجولات: حبوب أفقية صغيرة (الكل + أرقام الجولات) بدل الشريط القديم */
function roundStrip(){
  const rounds=[...new Set(MATCHES.map(m=>m.round))].sort((a,b)=>a-b);
  if(!rounds.length) return "";
  const cr=currentRound();
  const cur = SELR===null ? "all" : String(SELR);
  const i = rounds.indexOf(SELR);
  const chevR=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  const chevL=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
  return `<div class="rsel" aria-label="الجولة">
    <span class="rp-lab">الجولة</span>
    <button type="button" class="rs-nav" data-rstep="-1" ${SELR===null||i<=0?"disabled":""} aria-label="الجولة السابقة">${chevR}</button>
    <div class="rs-dd">
      <button type="button" class="rs-btn" id="rsBtn" aria-haspopup="listbox" aria-expanded="false"><span>${cur==="all"?"كل الجولات":`الجولة ${SELR}${SELR===cr?" · الحالية":""}`}</span><i class="chev"></i></button>
      <div class="rs-menu" id="rsMenu" role="listbox" hidden>
        <button type="button" class="rs-opt" role="option" data-round="all" aria-selected="${cur==="all"}">كل الجولات</button>
        ${rounds.map(r=>`<button type="button" class="rs-opt" role="option" data-round="${r}" aria-selected="${cur===String(r)}">الجولة ${r}${r===cr?`<em>الحالية</em>`:""}</button>`).join("")}
      </div>
    </div>
    <button type="button" class="rs-nav" data-rstep="1" ${SELR===null||i<0||i>=rounds.length-1?"disabled":""} aria-label="الجولة التالية">${chevL}</button>
    ${(cr!==null && SELR!==cr)?`<button type="button" class="rs-now" data-round="${cr}">الجولة الحالية</button>`:""}
  </div>`;
}

function roundSummary(list){
  const soon=list.filter(isUpcoming).length;
  const done=list.filter(m=>!isUpcoming(m));
  const goals=done.reduce((a,m)=>a+m.hg+m.ag,0);
  const inScope=x=>list.some(m=>m.round===x.r&&compOf(m)===compOf(x)&&(m.home===x.club||m.away===x.club));
  const yc=CARDS.filter(x=>isYellow(x.type)&&inScope(x)).length;
  const rc=CARDS.filter(x=>isRed(x.type)&&inScope(x)).length;
  if(!list.length) return "";
  return `<div class="msum">
    <span><b>${done.length}</b>أُقيمت</span>
    <span><b>${soon}</b>لم تبدأ</span>
    <span><b>${goals}</b>${goals===1?"هدف":"أهداف"}</span>
    <span><b>${yc+rc}</b>بطاقات</span>
  </div>`;
}

/* ================= الواجهات ================= */
function formPills(f){
  const last=f.slice(-5).reverse();
  if(!last.length) return '<span style="color:var(--slate);font-size:.72rem">—</span>';
  const L={w:"ف",d:"ت",l:"خ"};
  return `<div class="pillrow">${last.map(x=>`<span class="pl ${x}">${L[x]}</span>`).join("")}</div>`;
}

/* ================= بطاقة المباراة القادمة ================= */
function nextMatch(){
  return MATCHES.filter(m=>isUpcoming(m) && kickoffTS(m)!==null)
                .sort((a,b)=>kickoffTS(a)-kickoffTS(b))[0] || null;
}
function dayLabel(dstr){
  const d=new Date(String(dstr)+"T12:00:00");
  if(isNaN(d.getTime())) return esc(dstr||"");
  return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]}`;
}
function countdown(ts){
  const ms = ts - Date.now();
  if(ms<=0) return "";
  const mins=Math.floor(ms/60000), hrs=Math.floor(mins/60), days=Math.floor(hrs/24);
  if(days>=1) return days===1?"بعد يوم واحد":days===2?"بعد يومين":days<=10?`بعد ${days} أيام`:`بعد ${days} يوماً`;
  if(hrs>=1)  return hrs===1?"بعد ساعة":hrs===2?"بعد ساعتين":`بعد ${hrs} ساعات`;
  return mins<=1?"بعد دقيقة":`بعد ${mins} دقيقة`;
}
/* ===== المباريات الجارية الآن =====
   تُحدَّد بالتوقيت وحده: انطلقت ولم تمضِ ساعتان. الدقيقة تقديرية
   محسوبة من ضربة البداية — لا تعرف التوقّف بدقة — فنكتفي بحد 90. */
function liveMatches(){
  return MATCHES.filter(isLive).sort((a,b)=>(kickoffTS(a)||0)-(kickoffTS(b)||0));
}
function liveMinute(m){
  const k=kickoffTS(m); if(k===null) return "";
  const mins=Math.floor((Date.now()-k)/60000);
  if(mins<0) return "";
  if(mins<=45) return mins+"'";
  if(mins<60)  return "الاستراحة";
  return Math.min(90, mins-15)+"'";        /* ربع ساعة استراحة تقريباً */
}
function liveCard(){
  const ms=liveMatches();
  if(!ms.length) return "";
  return `<div class="livewrap">

      <span class="lv-min">${liveMinute(m)}</span>

}

      ${m.venue?`<span>·</span><span>${esc(m.venue)}</span>`:""}
      <span class="go">التفاصيل ›</span>

}

/* v15: FotMob-style split timeline — home goals on the right, away on the left, minute badge on the centre line */
/* أحداث المباراة الإضافية من المحرّر (ALL.mev): فرصة خطيرة / مراجعة VAR / تعليق */
const MEV_KIND={
  chance:{t:"فرصة خطيرة", ico:`<svg class="xev-ico ch" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>`},
  var:{t:"مراجعة VAR", ico:`<span class="xev-ico var">VAR</span>`},
  note:{t:"تعليق", ico:`<svg class="xev-ico nt" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H10l-4 4v-4H5z"/></svg>`}
};
function matchMev(m){
  return (ALL && ALL.mev ? ALL.mev : []).filter(x=>x.r===m.round && compOf(x)===compOf(m) && x.home===m.home && x.away===m.away);
}
function goalsTimeline(m,gs,mc){
  mc = mc || [];
  const subs=(typeof matchSubs==="function")?matchSubs(m):[];
  const xe=(typeof matchMev==="function")?matchMev(m):[];
  if(!gs.length && !subs.length && !mc.length && !xe.length) return "";
  const ORD={g:0,c:1,s:2,e:3};
  const ev=[...gs.map(g=>({t:"g",m:+g.m||0,x:+g.x||0,g})),
            ...subs.map(sb=>({t:"s",m:absMinute(sb.h,sb.m),x:0,sb,half:+sb.h||1})),
            ...mc.map(c=>({t:"c",m:+c.m||0,x:0,c})),
            ...xe.map(v=>({t:"e",m:+v.m||0,x:+v.x||0,v}))]
    .sort((a,b)=>(a.m-b.m)||(a.x-b.x)||(ORD[a.t]-ORD[b.t]));
  let h=0,a=0; const rows=[]; let htDone=false;
  ev.forEach(e=>{
    const club = e.t==="g" ? e.g.sc : e.t==="c" ? e.c.club : e.t==="e" ? e.v.club : e.sb.club;
    const isH = club===m.home;
    const afterHT = e.t==="g" ? (e.m>45 && !(e.m===45 && e.x))
                  : (e.t==="c"||e.t==="e") ? (e.m>45)
                  : (e.half>=2);
    if(!htDone && afterHT){ htDone=true; rows.push(`<div class="tl-mark"><span>الشوط الأول <b dir="ltr">${h} - ${a}</b></span></div>`); }
    if(e.t==="s"){
      const sb=e.sb;
      const sbody=`<div class="tl-ev sub${isH?" h":" a"}">
        <div class="tl-card">
          ${sb.out?`<div class="tl-sub-out" data-player="${esc(sb.out)}" data-club="${esc(sb.club)}"><i></i>${esc(sb.out)}</div>`:""}
          ${sb.in?`<div class="tl-sub-in" data-player="${esc(sb.in)}" data-club="${esc(sb.club)}"><i></i>${esc(sb.in)}</div>`:""}
        </div>
      </div>`;
      rows.push(`<div class="tl-row sub${isH?" home":" away"}">
        <div class="tl-side r">${isH?sbody:""}</div>
        <div class="tl-min sub"><span>${e.m}'</span></div>
        <div class="tl-side l">${isH?"":sbody}</div>
      </div>`);
      return;
    }
    if(e.t==="e"){
      const v=e.v, K=MEV_KIND[v.k]||MEV_KIND.note, mn=`${e.m}${e.x?"+"+e.x:""}'`;
      if(!v.club){ rows.push(`<div class="tl-xnote">${K.ico}<b>${K.t}</b><span dir="ltr">${mn}</span>${v.note?`<em>${esc(v.note)}</em>`:""}</div>`); return; }
      const body=`<div class="tl-ev xev${isH?" h":" a"}"><div class="tl-card">
          <div class="tl-name"${v.p?` data-player="${esc(v.p)}" data-club="${esc(v.club)}"`:""}>${K.ico}${v.p?esc(v.p):K.t}</div>
          <div class="tl-sub">${v.p?K.t:""}${v.note?`${v.p?" · ":""}${esc(v.note)}`:""}</div></div></div>`;
      rows.push(`<div class="tl-row xev${isH?" home":" away"}">
        <div class="tl-side r">${isH?body:""}</div>
        <div class="tl-min xev"><span>${mn}</span></div>
        <div class="tl-side l">${isH?"":body}</div></div>`);
      return;
    }
    if(e.t==="c"){
      const c=e.c, red=isRed(c.type);
      const cbody=`<div class="tl-ev card${isH?" h":" a"}">
        <div class="tl-card">
          <div class="tl-name" data-player="${esc(c.p)}" data-club="${esc(c.club)}"><i class="cardpill ${red?"r":"y"}"></i>${esc(c.p)}</div>
          <div class="tl-sub">${red?"طرد":"إنذار"}</div>
        </div></div>`;
      rows.push(`<div class="tl-row card${isH?" home":" away"}">
        <div class="tl-side r">${isH?cbody:""}</div>
        <div class="tl-min card"><span>${e.m}'</span></div>
        <div class="tl-side l">${isH?"":cbody}</div>
      </div>`);
      return;
    }
    const g=e.g;
    if(isH) h++; else a++;
    const og = isOG(g);
    const body=`<div class="tl-ev${isH?" h":" a"}">
        <div class="tl-card">
          <div class="tl-name" data-player="${esc(g.p)}" data-club="${esc(g.sc)}">${ICO_BALL}${esc(g.p)}${og?`<i class="tl-og">هدف عكسي</i>`:""}</div>
          ${og ? (g.og?`<div class="tl-assist" data-player="${esc(g.og)}" data-club="${esc(g.cd||"")}">${ICO_BOOT}ارتدت عن ${esc(g.og)}</div>`:"")
               : (g.a?`<div class="tl-assist" data-player="${esc(g.a)}" data-club="${esc(g.sc)}">${ICO_BOOT}${esc(g.a)}</div>`:"")}
          ${g.det?`<div class="tl-det">${esc(g.det)}</div>`:""}
        </div>
        <div class="tl-score" dir="ltr">${isH?`<b>${h}</b> - ${a}`:`${h} - <b>${a}</b>`}</div>
      </div>`;
    rows.push(`<div class="tl-row${isH?" home":" away"}">
      <div class="tl-side r">${isH?body:""}</div>
      <div class="tl-min"><span>${minLabel(g)}</span></div>
      <div class="tl-side l">${isH?"":body}</div>
    </div>`);
  });
  if(!htDone) rows.push(`<div class="tl-mark"><span>الشوط الأول <b dir="ltr">${h} - ${a}</b></span></div>`);
  rows.push(`<div class="tl-mark end"><span>النهاية <b dir="ltr">${m.hg??h} - ${m.ag??a}</b></span></div>`);
  return `<div class="tl"><div class="tl-head"><span>${esc(m.home)}</span><span>${esc(m.away)}</span></div>${rows.join("")}</div>`;
}

function renderMatches(){
  if(MXC==="upcoming"){ renderUpcomingMatches(); return; }
  if(MXC){ renderExtMatches(); return; }
  if(SELR_AUTO && SELR===null && !SELDAY){ const cr=currentRound(); if(cr!==null && MATCHES.some(m=>m.round===cr)) SELR=cr; }
  let list = MATCHES.slice();
  if(SELDAY) list = list.filter(m=>m.date===SELDAY);
  else if(SELR!==null) list = list.filter(m=>m.round===SELR);
  list.sort((a,b)=>{
    const ua=isUpcoming(a), ub=isUpcoming(b);
    if(ua!==ub) return ua?-1:1;                                   /* القادم أولاً */
    if(ua) return (kickoffTS(a)||0)-(kickoffTS(b)||0);            /* الأقرب موعداً */
    return (b.round-a.round) || String(b.date).localeCompare(String(a.date));
  });

  /* الإنذارات وحالات الطرد مرتبة بالدقيقة */
  function cardsList(mc){
    if(!mc.length) return "";
    const rows=[...mc].sort((a,b)=>(+a.m||0)-(+b.m||0)).map(c=>`<div class="cd-row">
      <span class="cd-min">${(+c.m||0)}'</span>
      ${crest(c.club)}
      <span class="cd-name" data-player="${esc(c.p)}" data-club="${esc(c.club)}">${esc(c.p)}</span>
      <i class="cardpill ${isRed(c.type)?"r":"y"}"></i>
    </div>`).join("");
    return `<div class="cd-wrap"><div class="cd-hd">الإنذارات وحالات الطرد</div>${rows}</div>`;
  }

  /* التفاصيل مطويّة: البطاقة تبقى نظيفة، وتُفتح بالضغط */
  function detailsBlock(m, gs, mc, soon){
    if(soon) return "";
    const xi = matchPitchHTML(m);
    const tl = goalsTimeline(m, gs, mc);   /* الإنذارات مدمجة في الشريط الزمني */
    if(!xi && !tl) return "";
    const n = gs.length + (typeof matchSubs==="function" ? matchSubs(m).length : 0) + mc.length;
    return `<button type="button" class="mtog" aria-expanded="false">
        <span>التفاصيل${n?` <em>${n}</em>`:""}</span><i class="chev"></i></button>
      <div class="mdet" hidden>${xi}${tl}</div>`;
  }

  const dayLabel=iso=>{ const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return esc(iso); return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]}`; };
  let lastDay=null;
  const matchCards = list.map(m=>{
    const gs=matchGoals(m);
    const mc=CARDS.filter(x=>x.r===m.round && compOf(x)===compOf(m) && (x.club===m.home||x.club===m.away));
    const y=mc.filter(x=>isYellow(x.type)).length, r=mc.filter(x=>isRed(x.type)).length;
    const soon=isUpcoming(m), live=isLive(m);
    const st = soon ? '<span class="mc-st soon">لم تبدأ</span>' : live ? '<span class="mc-st live"><i></i>جارية الآن</span>' : '<span class="mc-st done">انتهت</span>';
    const dayHead = m.date!==lastDay ? `<div class="mc-day"><span>${dayLabel(m.date)}</span></div>` : "";
    lastDay=m.date;
    return `${dayHead}<article class="mc${soon?" soon":live?" live":" done"}" data-mopen="${matchKey(m)}">
      <div class="mc-row">
        <div class="mc-team h">${crest(m.home)}<b>${esc(m.home)}</b></div>
        <div class="mc-mid">
          ${soon ? `<span class="mc-time" dir="ltr">${m.time?esc(m.time):"—"}</span>` : `<span class="mc-score" dir="ltr">${m.ag} - ${m.hg}</span>`   /* الصف RTL: المستضيف يميناً، فرقمه يمين العلامة (منصور 2026-09-16) */}
          ${st}
          ${(()=>{ const tv=tvOf(m); return tv?`<span class="mc-tv${tv==="غير منقولة"?" off":""}">${TV_ICO}<span>${esc(tv)}</span></span>`:""; })()}
          <span class="mc-go"><em>التفاصيل</em><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
        </div>
        <div class="mc-team a">${crest(m.away)}<b>${esc(m.away)}</b></div>
      </div>
      <div class="mc-foot">
        ${(!soon && m.time)?`<span class="mc-date" dir="ltr">${esc(m.time)}</span>`:""}
        <span>الجولة ${m.round}</span>
        ${m.venue?`<span>${esc(m.venue)}</span>`:""}
        ${COMP==="الكل"?`<span>${esc(compOf(m))}</span>`:""}
        ${(y||r)?`<span class="mc-cards">${y?`<b><i class="cardpill y"></i>${y}</b>`:""}${r?`<b><i class="cardpill r"></i>${r}</b>`:""}</span>`:""}
        ${(()=>{ const cw=crewOf(m), v=cw.refs.var; return (cw.ref?`<span class="mc-ref">${refRoleIco("ref","sm")}<span class="nm">${esc(cw.ref)}</span></span>`:"")
          + (v && v!=="لا يوجد" ?`<span class="mc-ref">${refRoleIco("var","sm")}<span class="nm">${esc(v)}</span></span>`:""); /* حكم الساحة وحكم الفيديو بأيقوناتهم (منصور 2026-09-16) */ })()}
      </div>
      ${m.note?`<div class="mc-note">${esc(m.note)}</div>`:""}
    </article>`;
  }).join("");

  $("#v-matches").innerHTML = `
    <div class="mx-head"><h2 class="mx-title">المباريات</h2>${compSelect()}</div>
    ${roundStrip()}
    ${roundSummary(list)}
    <div class="mx-list">${list.length?matchCards:'<div class="mx-empty">لا توجد مباريات ضمن هذا التحديد.</div>'}</div>`;
  /* الحبّة النشطة (الجولة/اليوم) تُجلب إلى مجال الرؤية بلا تحريك الصفحة */
  $("#v-matches").querySelectorAll('.rp[aria-pressed="true"], .dp[aria-pressed="true"], .dp.today').forEach(el=>{
    try{ el.scrollIntoView({block:"nearest", inline:"center"}); }catch(e){} });

  const V=$("#v-matches");
  /* فتح التفاصيل وطيّها — مباراة واحدة مفتوحة تكفي، فلا تطول الصفحة */
  V.querySelectorAll(".mtog").forEach(b=>b.onclick=()=>{
    const box=b.nextElementSibling, open=!box.hidden;
    box.hidden=open;
    b.setAttribute("aria-expanded", String(!open));
    b.classList.toggle("on", !open);
  });
  wireComp(V);
  V.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{
    SELR_AUTO=false; SELR = b.dataset.round==="all" ? null : +b.dataset.round; SELDAY=null; renderMatches(); });
  wireDropdowns(V);
  V.querySelectorAll("[data-rstep]").forEach(b=>b.onclick=()=>{
    const rounds=[...new Set(MATCHES.map(m=>m.round))].sort((a,b)=>a-b);
    const base=SELR===null?currentRound():SELR;
    let i=rounds.indexOf(base)+(+b.dataset.rstep); i=Math.max(0,Math.min(rounds.length-1,i));
    SELR_AUTO=false; SELR=rounds[i]; SELDAY=null; renderMatches(); });
  V.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    SELDAY = SELDAY===b.dataset.day ? null : b.dataset.day; renderMatches(); });
  V.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.cal;
    if(d===0){ SELDAY=null; renderMatches(); return; }
    let [Y,Mo]=calMonth().split("-").map(Number); Mo+=d;
    if(Mo<1){Mo=12;Y--;} if(Mo>12){Mo=1;Y++;}
    CALM=`${Y}-${String(Mo).padStart(2,"0")}`; renderMatches(); });
}

/* تشكيلة النادي في جولة يختارها القارئ — تُصدَّر مع بطاقة النادي في التقرير */
function clubXIRounds(c){
  const out=[];
  MATCHES.filter(m=>m.home===c||m.away===c).forEach(m=>{
    if(xiNames(m.round, compOf(m), c).length>=7)
      out.push({m, key:m.round+"|"+compOf(m)});
  });
  return out.sort((a,b)=>(b.m.round-a.m.round));
}
function renderClubXI(c){
  const box=$("#clubXI"); if(!box) return;
  const rs=clubXIRounds(c);
  if(!rs.length){
    box.innerHTML=`<h2 class="sec">تشكيلة الجولة</h2>
      <p class="hint">لم تُرصد تشكيلة أساسية لهذا النادي بعد.</p>`;
    return;
  }
  const cur = rs.find(x=>x.key===box.dataset.pick) || rs[0];
  box.dataset.pick = cur.key;
  const m=cur.m, opp = m.home===c ? m.away : m.home, homeSide = m.home===c;
  const res = isUpcoming(m) ? "" :
    `<span class="xi-res">${homeSide?`${m.hg} - ${m.ag}`:`${m.ag} - ${m.hg}`}</span>`;
  box.innerHTML=`
    <h2 class="sec">تشكيلة الجولة</h2>
    <div class="card pad xi-card">
      <div class="xi-pick">
        <label class="lb" for="clubRound">الجولة</label>
        <select id="clubRound">${rs.map(x=>`<option value="${esc(x.key)}" ${x.key===cur.key?"selected":""}>الجولة ${x.m.round}${compOf(x.m)!=="الدوري"?" · "+esc(compOf(x.m)):""} — ${esc(x.m.home===c?x.m.away:x.m.home)}</option>`).join("")}</select>
      </div>
      <div class="xi-meta">
        <span>${homeSide?"على أرضه":"خارج أرضه"} أمام ${crest(opp)}<b>${esc(opp)}</b></span>${res}
        ${(()=>{ const S=pitchSpots(m.round, compOf(m), c); return S&&S.form? `<span class="xi-form">${esc(S.form)}</span>` : ""; })()}
      </div>
      ${clubPitchHTML(m.round, compOf(m), c)}
      ${clubXIExtras(m, c)}
    </div>`;
  $("#clubRound").onchange = e => { box.dataset.pick = e.target.value; renderClubXI(c); };
}
/* التبديلات والإنذارات في تلك الجولة — تكمل التقرير */
function clubXIExtras(m, c){
  const ss=matchSubs(m).filter(s=>s.club===c);
  const cd=CARDS.filter(x=>x.r===m.round && compOf(x)===compOf(m) && x.club===c)
                .sort((a,b)=>(+a.m||0)-(+b.m||0));
  if(!ss.length && !cd.length) return "";
  return `<div class="xi-x">
    ${ss.length?`<div class="xi-col"><div class="xi-ct">التبديلات</div>
      ${ss.map(s=>`<div class="xi-r"><span class="xi-m">${absMinute(s.h,s.m)}'</span>
        <span class="xi-io">${s.in?`<span data-player="${esc(s.in)}" data-club="${esc(c)}"><i class="ar in"></i>${esc(s.in)}</span>`:""}${s.out?`<span data-player="${esc(s.out)}" data-club="${esc(c)}"><i class="ar out"></i>${esc(s.out)}</span>`:""}</span>
      </div>`).join("")}</div>`:""}
    ${cd.length?`<div class="xi-col"><div class="xi-ct">الإنذارات</div>
      ${cd.map(x=>`<div class="xi-r"><span class="xi-m">${(+x.m||0)}'</span>
        <span class="xi-io" data-player="${esc(x.p)}" data-club="${esc(c)}">${esc(x.p)}</span><i class="cardpill ${isRed(x.type)?"r":"y"}"></i>
      </div>`).join("")}</div>`:""}
  </div>`;
}

/* ===================== قسم الجمهور ===================== */
let FANSPICK = null;      /* الجولة المعروضة */
let BALLOT   = null;      /* مسوّدة التصويت الحالية */

function renderFans(){
  const rs=voteRounds();
  const box=$("#v-fans"); if(!box) return;
  if(!rs.length){
    box.innerHTML=`<h2 class="sec">تشكيلة الجمهور</h2>
      <div class="card pad"><p class="hint" style="margin:0">يبدأ التصويت من الجولة ${VOTE_FROM_ROUND}
      بعد انتهاء مبارياتها. لم تكتمل جولة مؤهَّلة بعد.</p></div>`;
    return;
  }
  const cur = rs.find(x=>x.k===FANSPICK) || rs[0];
  FANSPICK = cur.k;
  box.innerHTML=`
    <h2 class="sec">تشكيلة الجمهور</h2>
    <div class="card pad">
      <div class="xi-pick">
        <label class="lb" for="fansRound">الجولة</label>
        <select id="fansRound">${rs.map(x=>`<option value="${esc(x.k)}" ${x.k===cur.k?"selected":""}>الجولة ${x.r}${x.comp!=="الدوري"?" · "+esc(x.comp):""}</option>`).join("")}</select>
      </div>
    </div>
    <div id="fansBody"><div class="card pad"><p class="hint" style="margin:0">جارٍ الجلب…</p></div></div>`;
  $("#fansRound").onchange = e => { FANSPICK=e.target.value; BALLOT=null; renderFans(); };
  paintFansBody(cur.r, cur.comp);
}

async function paintFansBody(round, comp){
  await loadTotVotes(round, comp);
  const box=$("#fansBody"); if(!box) return;
  const row=totRow(round,comp);
  const ballots=TOTVOTES[totKey(round,comp)]||[];
  const parts=[];

  if(row && row.done) parts.push(officialXIHTML(row, round, comp, ballots.length));
  else if(ballots.length) parts.push(liveTallyHTML(ballots, round, comp));

  if(row && row.open) parts.push(ballotHTML(round, comp));
  else if(!row || !row.done) parts.push(`<div class="card pad"><p class="hint" style="margin:0">
    لم يُفتح التصويت لهذه الجولة بعد. يفتحه فريق العمل بعد رصد المباريات.</p></div>`);

  parts.push(votersHTML(ballots));
  box.innerHTML = parts.join("");
  wireBallot(round, comp);
}

/* التشكيلة المعتمدة */

      <div class="fx-v">${esc(p.club)}${v?` · ${nVotes(v)}`:""}</div></div>`:"";

        <div class="fx-v">${g.m}' · ${esc(g.club)}${row.goalV?` · ${nVotes(row.goalV)}`:""}</div></div>`:""}

/* الفرز اللحظي قبل الاعتماد */
function liveTallyHTML(ballots, round, comp){
  const tal=tallyVotes(ballots);
  const built=buildFansXI(tal, round, comp);

      <div class="fx-p" data-player="${esc(p.n)}" data-club="${esc(p.club)}">${pav(p.n,0,false,p.club)}${crest(p.club)}<b>${esc(p.n)}</b></div>
      <div class="fx-v">${esc(p.club)} · ${nVotes(p.v)}</div></div>`:"";
  return `<div class="card pad">
    <div class="fx-hd"><span class="fx-badge live">الفرز حتى الآن</span>
      <span class="hint" style="margin:0">${nVoters(ballots.length)} · تصير رسمية باعتماد فريق العمل</span></div>
    ${built.xi.length>=7 ? fansPitchHTML({f:built.f, xi:built.xi}, tal) : `<p class="hint">لم تكتمل الأصوات لرسم التشكيلة بعد.</p>`}
    <div class="fx-grid">
      ${card("أفضل لاعب", tal.topBest)}

      ${g?`<div class="fx-card"><div class="fx-t">هدف الجولة</div>
        <div class="fx-p" data-player="${esc(g.p)}" data-club="${esc(g.club)}">${pav(g.p,0,false,g.club)}${crest(g.club)}<b>${esc(g.p)}</b></div>
        <div class="fx-v">${g.m}' · ${esc(g.club)} · ${nVotes(tal.topGoal.v)}</div></div>`:""}
    </div></div>`;
}
/* ملعب تشكيلة الجمهور: لاعبون من أندية مختلفة، فلكل واحد لون ناديه */
function fansPitchHTML(row, tal){
  const men=(row.xi||[]).map(p=>{
    const e=squadEntriesOf(p.club,[p.club]).find(z=>z.n===p.n)||{};
    return {n:p.n, club:p.club, s:e.s||0, role:e.p||"CM", line:SH_LINE[e.p||"CM"]||"M"};
  });
  if(men.length<7) return "";
  const spots=shapeSlots(men, row.f||autoForm(men));
  return `<div class="xi-t" style="justify-content:center"><i>${esc(normForm(row.f||""))}</i></div>
    <div class="xipitch half"><div class="xip-lines"></div>
    ${spots.map(({p,x,y,n})=>{
      /* بطاقة بصورة اللاعب وقميص ناديه (نفس بطاقة تشكيلة النادي والمباراة) بدل الدائرة الرقمية — 2026-09-15 */
      const kit=Object.assign(kitOf(p.club),{club:p.club});
      const v=tal ? (tal.players[p.n+"|"+p.club]||0) : 0;
      return spotHTML({n:p.n, s:p.s, p:p.role}, x, y, n, kit, null, false, v?` <i class="pp-v">${v}</i>`:"");
    }).join("")}</div>`;
}
/* ===== بطاقة التصويت =====
   الرسم الفنّي يحدّد عدد خانات كل خط، وكل خانة قائمة بلاعبي ذلك الخط
   ممن شاركوا في الجولة. الملعب فوقها يتغيّر مع كل اختيار. */
function newBallot(round, comp){
  if(MYTOT) return {f:MYTOT.f, xi:[...(MYTOT.xi||[])], best:MYTOT.best||null,
                    gk:MYTOT.gk||null, goal:MYTOT.goal||""};
  return {f:"4-3-3", xi:[], best:null, gk:null, goal:""};
}
function lineNeeds(f){
  const rows=String(f).split("-").map(Number).filter(n=>n>0);
  const D=rows[0]||0, F=rows.length>1?rows[rows.length-1]:0;
  const M=rows.length>2?rows.slice(1,-1).reduce((a,b)=>a+b,0):0;
  return [["G",1],["D",D],["M",M],["F",F]].filter(([,n])=>n>0);
}
const LINE_AR={G:"حراسة", D:"دفاع", M:"وسط", F:"هجوم"};

function ballotHTML(round, comp){
  if(!FAN) return `<h2 class="sec">صوّت بتشكيلتك</h2>
    <div class="card pad"><p class="hint">التصويت للمشتركين المسجّلين — سجّل دخولك من قسم
      <b>التوقعات</b> بنفس الحساب، ثم ارجع هنا.</p>
      <button class="btn" onclick="document.querySelector('nav.tabs button[data-v=predict]').click()">الذهاب للتسجيل</button></div>`;
  BALLOT = BALLOT || newBallot(round, comp);
  const pool=roundPlayers(round, comp);
  const gks=pool.filter(p=>p.line==="G");
  const goals=roundGoals(round, comp);
  const chosen=new Set(BALLOT.xi.map(p=>p.n+"|"+p.club));

  let i=0;
  const slots=lineNeeds(BALLOT.f).map(([line,n])=>{
    const opts=pool.filter(p=>p.line===line);
    const cells=[];
    for(let k=0;k<n;k++,i++){
      const cur=BALLOT.xi[i]||null;
      const key=cur?cur.n+"|"+cur.club:"";
      cells.push(`<label class="bl-f"><span>${LINE_AR[line]} ${n>1?k+1:""}</span>
        <select data-slot="${i}">
          <option value="">— اختر —</option>
          ${opts.map(p=>{const v=p.n+"|"+p.club;
            const taken=chosen.has(v)&&v!==key;
            return `<option value="${esc(v)}" ${v===key?"selected":""} ${taken?"disabled":""}>${esc(p.n)} — ${esc(p.club)}${p.s?" ("+p.s+")":""}</option>`;}).join("")}
        </select></label>`);
    }
    return `<div class="bl-line"><div class="bl-lt">${LINE_AR[line]}</div>${cells.join("")}</div>`;
  }).join("");

  const done=BALLOT.xi.filter(Boolean).length;
  const opt=(p,cur)=>`<option value="${esc(p.n+"|"+p.club)}" ${cur&&cur.n===p.n&&cur.club===p.club?"selected":""}>${esc(p.n)} — ${esc(p.club)}</option>`;
  return `<h2 class="sec">${MYTOT?"عدّل تصويتك":"صوّت بتشكيلتك"}</h2>
  <div class="card pad">
    ${MYTOT?`<div class="fx-hd"><span class="fx-badge live">صوتك مسجَّل</span>
      <span class="hint" style="margin:0">تقدر تعدّله ما دام التصويت مفتوحاً.</span></div>`:""}
    <div class="xi-pick">
      <label class="lb" for="blForm">الرسم الفنّي</label>
      <select id="blForm">${FORMATIONS.map(f=>`<option ${f===BALLOT.f?"selected":""}>${f}</option>`).join("")}</select>
    </div>
    <div id="blPitch">${BALLOT.xi.filter(Boolean).length>=7?fansPitchHTML({f:BALLOT.f, xi:BALLOT.xi.filter(Boolean)}):`
      <div class="bl-empty">اختر اللاعبين وتظهر تشكيلتك على الملعب</div>`}</div>
    <div class="bl-slots">${slots}</div>
    <h4 class="bl-h">اختيارات الجولة</h4>
    <div class="bl-extra">
      <label class="bl-f"><span>أفضل لاعب</span>
        <select id="blBest"><option value="">— اختر —</option>${pool.map(p=>opt(p,BALLOT.best)).join("")}</select></label>
      <label class="bl-f"><span>أفضل حارس</span>
        <select id="blGk"><option value="">— اختر —</option>${gks.map(p=>opt(p,BALLOT.gk)).join("")}</select></label>
      <label class="bl-f"><span>هدف الجولة</span>
        <select id="blGoal"><option value="">— اختر —</option>${goals.map(g=>`<option value="${esc(g.id)}" ${g.id===BALLOT.goal?"selected":""}>${esc(g.p)} (${esc(g.club)}) — ${g.m}'${g.det?" · "+esc(g.det):""}</option>`).join("")}</select></label>
    </div>
    <div class="bl-foot">
      <span class="bl-count${done===11?" ok":""}">${done} من 11</span>
      <button class="btn" id="blSave">${MYTOT?"تحديث التصويت":"إرسال التصويت"}</button>
    </div>
  </div>`;
}

function wireBallot(round, comp){
  const fm=$("#blForm");
  if(fm) fm.onchange=()=>{ BALLOT.f=fm.value; BALLOT.xi=[]; repaintBallot(round,comp); };
  document.querySelectorAll("[data-slot]").forEach(sel=>sel.onchange=()=>{
    const i=+sel.dataset.slot, v=sel.value;
    BALLOT.xi[i] = v ? {n:v.split("|")[0], club:v.split("|")[1]} : null;
    refreshBallot();          /* الملعب والعدّاد والمكرَّر فقط — لا نعيد بناء القوائم */
  });
  const pick=(id,key)=>{ const el=$(id); if(!el) return;
    el.onchange=()=>{ const v=el.value; BALLOT[key]= v? {n:v.split("|")[0], club:v.split("|")[1]} : null; }; };
  pick("#blBest","best"); pick("#blGk","gk");
  const gl=$("#blGoal"); if(gl) gl.onchange=()=>{ BALLOT.goal=gl.value; };
  const sv=$("#blSave");
  if(sv) sv.onclick=async()=>{
    const xi=BALLOT.xi.filter(Boolean);
    if(xi.length!==11){ toast("اختر أحد عشر لاعباً","err"); return; }
    if(new Set(xi.map(p=>p.n+"|"+p.club)).size!==11){ toast("لا تكرّر لاعباً","err"); return; }
    if(!BALLOT.best){ toast("اختر أفضل لاعب","err"); return; }
    if(!BALLOT.gk){ toast("اختر أفضل حارس","err"); return; }
    if(!BALLOT.goal && roundGoals(round,comp).length){ toast("اختر هدف الجولة","err"); return; }
    busy(sv,true,"جارٍ الإرسال…");
    const ok=await saveTotVote(round, comp, {...BALLOT, xi});
    busy(sv,false);
    if(ok){ toast("سُجّل تصويتك ✅","ok"); BALLOT=null; paintFansBody(round,comp); }
  };
}
/* تحديث خفيف بعد كل اختيار: القوائم فيها مئات الخيارات، فإعادة بنائها
   في كل ضغطة تُبطئ الهاتف. نكتفي بالملعب والعدّاد وتعطيل المكرَّر. */
function refreshBallot(){
  const taken=new Set(BALLOT.xi.filter(Boolean).map(p=>p.n+"|"+p.club));
  document.querySelectorAll("[data-slot]").forEach(sel=>{
    const mine=sel.value;
    [...sel.options].forEach(o=>{ if(o.value) o.disabled = taken.has(o.value) && o.value!==mine; });
  });
  const done=BALLOT.xi.filter(Boolean).length;
  const c=document.querySelector(".bl-count");
  if(c){ c.textContent=`${done} من 11`; c.classList.toggle("ok", done===11); }
  const p=$("#blPitch");
  if(p) p.innerHTML = done>=7
    ? fansPitchHTML({f:BALLOT.f, xi:BALLOT.xi.filter(Boolean)})
    : `<div class="bl-empty">اختر اللاعبين وتظهر تشكيلتك على الملعب</div>`;
}
/* تغيير الرسم وحده يستدعي إعادة بناء الخانات */
function repaintBallot(round, comp){
  const y=window.scrollY;
  const anchor=$("#blSave"); if(!anchor) return;
  const card=anchor.closest(".card");
  const holder=document.createElement("div");
  holder.innerHTML=ballotHTML(round, comp);
  const fresh=holder.querySelector(".card");
  card.replaceWith(fresh);
  wireBallot(round, comp);
  window.scrollTo(0,y);
}

function votersHTML(ballots){
  if(!ballots.length) return `<h2 class="sec">المصوّتون</h2>
    <div class="card pad"><p class="hint" style="margin:0">لا أصوات بعد — كن أول المصوّتين.</p></div>`;
  const rows=[...ballots].sort((a,b)=>String(a.ts).localeCompare(String(b.ts)))
    .map((b,i)=>`<div class="vt-row${FAN&&b.uid===FAN.uid?" me":""}">
      <span class="vt-i">${i+1}</span>
      <b>${esc(b.name||"مشترك")}</b>
      <span class="vt-f">${esc(b.f||"")}</span>
      <span class="vt-t" dir="ltr">${esc(String(b.ts||"").slice(11,16))}</span>
    </div>`).join("");
  return `<h2 class="sec">المصوّتون (${ballots.length})</h2>
    <div class="card pad">${rows}</div>`;
}

/* ===== الهدافون وصنّاع الأهداف: منصّة لأول ثلاثة + قائمة مرتّبة (تصميم 2026-09-15) =====
   الترتيب مشترك عند التساوي (1،1،1،4…)، الصورة القصّة الرسمية وإلا شعار النادي، مع المباريات والدقائق من التشكيلات. */
let TS_MODE="g";                                     /* g = الأهداف، a = صناعة الأهداف، c = المساهمات (أهداف + صناعة) */
function topScorersHTML(){
  const key=TS_MODE==="c"?"ga":TS_MODE, label=key==="g"?"أهداف":key==="a"?"صناعة":"مساهمات";   /* ga = أهداف + صناعة (c اسم حقل النادي) */
  const PP={}; playerPlay().forEach(p=>{ PP[p.n+"|"+p.c]=p; });
  const mins=p=>(PP[p.n+"|"+p.c]||{}).mins||0;
  const L=scorers().map(p=>({...p, ga:p.g+p.a})).filter(p=>p[key]>0)
    .sort((a,b)=>b[key]-a[key] || mins(a)-mins(b) || (key==="g"?b.a-a.a:b.g-a.g));   /* عند التساوي: الأقل دقائق أولاً (منصور 2026-09-17) */
  L.forEach((p,i)=>{ p.rk=i+1; });   /* ترقيم تسلسلي 1،2،3… حتى عند التساوي (منصور 2026-09-15) */
  const max=L.length?L[0][key]:1;
  const cut=p=>(PHOTOSON && typeof LOCAL_PHOTOS!=="undefined") ? photoCut(p.n,p.c) : null;
  /* المنصّة: القصّة الكبيرة (800×1000) لأنها تُعرض كبيرة؛ القوائم: قصّة الوجه _f نفسها المستخدمة في كل قوائم الموقع */
  const av=(p,cls,big)=>{ const c=cut(p);
    return c ? `<img class="${cls}" src="${c}${big?"":"_f"}.webp?v=28" alt="" loading="lazy" decoding="async">`
             : (LOGOS[p.c] ? `<img class="${cls} ts-crestfb" src="${LOGOS[p.c]}" alt="" loading="lazy">` : ""); };
  const sub=p=>{ const s=PP[p.n+"|"+p.c]; return s?`<span class="ts-sub">${s.apps} <i>مباراة</i></span><span class="ts-sub">${s.mins}′</span>`:""; };
  const medal=r=>r===1?"gold":r===2?"silver":r===3?"bronze":"";
  const podCard=(p,i)=>`<div class="ts-pod${i===0?" first":""} ${medal(p.rk)}" data-player="${esc(p.n)}" data-club="${esc(p.c)}" role="button" tabindex="0">
      ${LOGOS[p.c]?`<img class="ts-pod-bg" src="${LOGOS[p.c]}" alt="" aria-hidden="true">`:""}
      <span class="ts-badge">${p.rk}</span>
      <div class="ts-pod-av">${av(p,"ts-pod-img",true)}</div>
      <div class="ts-pod-info"><div class="ts-pod-nm">${esc(p.n)}</div><div class="ts-pod-club">${esc(p.c)}</div>
        ${mins(p)?`<div class="ts-pod-min"><bdi dir="ltr">${mins(p)}′</bdi> دقيقة</div>`:""}</div>
      <div class="ts-pod-stat"><b>${p[key]}</b><small>${label}</small></div></div>`;
  const podium = L.length>=3 ? `<div class="ts-podium">${L.slice(0,3).map(podCard).join("")}</div>` : "";

const TS_SHOW = 6;
function tsMore(rowsHTML, total, id){
  if(total<=TS_SHOW) return rowsHTML;
  const parts = rowsHTML.split('<div class="ts-row');
  const head = parts.slice(0, TS_SHOW+1).join('<div class="ts-row');
  const rest = '<div class="ts-row' + parts.slice(TS_SHOW+1).join('<div class="ts-row');
  return head + `<div class="ts-more" id="more-${id}" hidden>${rest}</div>
    <button type="button" class="ts-morebtn" data-more="more-${id}" data-n="${total-TS_SHOW}"><span>عرض المزيد</span><small>+${total-TS_SHOW}</small></button>`;
}
function tsMoreTable(trsHTML, total, id){
  if(total<=TS_SHOW) return {rows:trsHTML, btn:""};
  const parts = trsHTML.split('<tr'); const head = parts.slice(0, TS_SHOW+1).join('<tr');
  const rest = parts.slice(TS_SHOW+1).map(x=>'<tr class="ts-hid" data-more-row="more-'+id+'"'+x).join('');
  return {rows: head+rest, btn: `<button type="button" class="ts-morebtn" data-more="more-${id}" data-n="${total-TS_SHOW}"><span>عرض المزيد</span><small>+${total-TS_SHOW}</small></button>`};
}
function wireMore(box){
  box.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.more, open=b.classList.toggle("open");
    const blk=box.querySelector("#"+id); if(blk) blk.hidden=!open;
    box.querySelectorAll(`[data-more-row="${id}"]`).forEach(tr=>tr.classList.toggle("ts-hid",!open));

function wireTS(box){

function clubVars(c){

  const lum=h=>{const x=h.replace("#","");return (.2126*parseInt(x.slice(0,2),16)+.7152*parseInt(x.slice(2,4),16)+.0722*parseInt(x.slice(4,6),16))/255;};

  return `--cc:${cc[0]};--cc2:${cc[1]};--cct:${lum(cc[0])>.55?"#0B1F3A":"#fff"};--ccb:transparent;--ccd:color-mix(in srgb,${cc[0]} 70%,#000)`;

/* تحرير حيّ: كل تغيير ينعكس على SQUADS فوراً، وزر الحفظ يرفعه للسحابة */
const SQ = {
  arr(c){ return (SQUADS[c] = SQUADS[c] || []); },
  box(c){ return [...document.querySelectorAll(".squadbox")].find(b=>b.dataset.club===c); },
  set(c,i,n,p,s){ this.arr(c)[i]=sqItem(n,p,s); },
  paint(c){
    const b=this.box(c); if(!b) return;
    b.querySelector(".sqrows").innerHTML=squadRowsHTML(c);
    const n=(SQUADS[c]||[]).length, miss=squadMissing(c), lb=b.querySelector("summary label.lb");
    lb.innerHTML=`${crest(c)}<b>${esc(c)}</b> <span class="cnt">${n} لاعباً</span>`
      + (miss?` <span class="cnt miss">بلا مركز ${miss}</span>`:"");
  },
  name(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, v.trim().replace(/\s+/g," "), sqPos(x), sqNum(x)); },
  pos(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, sqName(x), v, sqNum(x)); this.paint(c); },
  num(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, sqName(x), sqPos(x), parseInt(String(v).replace(/\D/g,""),10)||0); },
  del(c,i){ const a=this.arr(c); a.splice(i,1); if(!a.length) delete SQUADS[c]; this.paint(c); },
  add(c,n,p,s){
    n=(n||"").trim().replace(/\s+/g," "); if(!n) return false;
    const a=this.arr(c);
    if(a.some(x=>sqName(x)===n)){ toast("الاسم موجود في الكشف","err"); return false; }
    a.push(sqItem(n,p,parseInt(String(s).replace(/\D/g,""),10)||0)); this.paint(c); return true;
  },
  bulk(c,txt){
    const a=this.arr(c); let added=0;
    txt.split("\n").map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean).forEach(line=>{
      let s=0, p="";
      let t=line.replace(/^(\d{1,3})\s*[-.,]?\s*/, (m,d)=>{ s=+d; return ""; });   /* رقم في أول السطر */
      t=t.replace(/[\s,،-]+([A-Za-z]{1,3})$/, (m,code)=>{                          /* مركز في آخر السطر */
        const up=POS_ALIAS[code.toUpperCase()] || code.toUpperCase();
        if(POS_ALL.includes(up)){ p=up; return ""; }
        return m;
      });
      const n=t.trim().replace(/\s+/g," ");
      if(!n || a.some(x=>sqName(x)===n)) return;
      a.push(sqItem(n,p,s)); added++;
    });
    if(!a.length) delete SQUADS[c];
    this.paint(c);
    toast(added?`أُضيف ${added} لاعب`:"ما فيه أسماء جديدة", added?"ok":"err");
  },
  sort(c){
    const main={G:0,D:1,M:2,F:3,"":4}, det={};
    POS_ALL.forEach((k,i)=>det[k]=i);
    this.arr(c).sort((x,y)=>
      (main[posMain(x)]??4)-(main[posMain(y)]??4)
      || (det[sqPos(x)]??99)-(det[sqPos(y)]??99)
      || (sqNum(x)||999)-(sqNum(y)||999)
      || sqName(x).localeCompare(sqName(y),"ar"));
    this.paint(c);
  },
  clean(){   /* قبل الحفظ: حذف الفاضي والمكرر */
    Object.keys(SQUADS).forEach(c=>{
      const seen=new Set(), out=[];
      (SQUADS[c]||[]).forEach(x=>{
        const n=sqName(x).trim().replace(/\s+/g," ");
        if(!n || seen.has(n)) return;
        seen.add(n); out.push(sqItem(n, sqPos(x), sqNum(x)));
      });
      if(out.length) SQUADS[c]=out; else delete SQUADS[c];
    });
  }
};
function wireSquads(){
  const sqb=$("#saveSquads"); if(!sqb) return;

  const ext=$("#extractNums");
  if(ext) ext.onclick=()=>{
    const n=squadsExtractNums();
    if(!n){ toast("ما فيه أرقام مدموجة بالأسماء","err"); return; }
    CLUBS.forEach(c=>SQ.paint(c));
    toast(`انفصل رقم ${n} لاعب — احفظ الكشوفات للاعتماد`,"ok");
  };

  document.querySelectorAll(".squadbox").forEach(box=>{
    const c=box.dataset.club;
    const idx=el=>+el.closest(".sqrow").dataset.i;
    box.addEventListener("input", e=>{
      const t=e.target;
      if(t.classList.contains("sqn"))  SQ.name(c, idx(t), t.value);
      if(t.classList.contains("sqno")){ t.value=t.value.replace(/\D/g,""); SQ.num(c, idx(t), t.value); }
      if(t.classList.contains("sqnewno")) t.value=t.value.replace(/\D/g,"");
    });
    box.addEventListener("change", e=>{ if(e.target.classList.contains("sqp")) SQ.pos(c, idx(e.target), e.target.value); });
    box.addEventListener("click", e=>{
      const t=e.target;
      if(t.classList.contains("sqx")) return SQ.del(c, idx(t));
      if(t.classList.contains("sqsort")) return SQ.sort(c);
      if(t.classList.contains("sqbulk")){
        const ta=box.querySelector(".sqpaste");
        if(ta.style.display==="none"){ ta.style.display="block"; ta.focus(); t.textContent="أضف الأسماء الملصوقة"; }
        else { SQ.bulk(c, ta.value); ta.value=""; ta.style.display="none"; t.textContent="لصق دفعة"; }
        return;
      }
      if(t.classList.contains("sqaddbtn")){
        const no=box.querySelector(".sqnewno"), inp=box.querySelector(".sqnew"), sel=box.querySelector(".sqnewpos");
        if(SQ.add(c, inp.value, sel.value, no.value)){ inp.value=""; no.value=""; no.focus(); }
      }
    });
    box.addEventListener("keydown", e=>{
      if(e.key==="Enter" && (e.target.classList.contains("sqnew")||e.target.classList.contains("sqnewno"))){
        e.preventDefault(); box.querySelector(".sqaddbtn").click();
      }
    });
    box.addEventListener("toggle", ()=>{ box.open ? SQOPEN.add(c) : SQOPEN.delete(c); });
  });

  sqb.onclick=async()=>{
    SQ.clean();
    busy(sqb,true,"جارٍ الحفظ…");
    /* نأخذ أحدث بيانات الموسم ثم نُعيد كشوفاتي فوقها، فلا يُمحى عمل غيري ولا عملي */

    if(reb.changed) toast(`وصل تحديث من ${reb.by||"محرّر آخر"} — دُمج قبل الحفظ`,"busy");
    const ok=await persistData();
    busy(sqb,false);
    if(ok===true){ LASTSYNC=new Date();
      const ms=squadMissingAll();
      toast(`حُفظت الكشوفات · ${squadTotal()} لاعباً ✅${ms?` · ${ms} بلا مركز`:""}`,"ok"); }
    else if(ok==="pending") toast(SYNCMSG,"busy");
    else toast(SYNCMSG||"حُفظت محلياً، وتعذّر رفعها للسحابة","err");
    renderAdmin();
  };
}

function localSet(k,v){
  try{ if(window.storage&&window.storage.set) return window.storage.set(k,v); }catch(e){}
  try{ localStorage.setItem(k,v); }catch(e){}
  return null;
}
async function localGet(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value) return r.value; } }catch(e){}
  try{ return localStorage.getItem(k); }catch(e){}
  return null;
}
async function persist(){
  await localSet("zain_admin", JSON.stringify({...assetsObject(), LASTUPDATE}));
  return await fbSaveAssets();
}
async function restore(){
  try{
    const v=await localGet("zain_admin");
    if(v){ const d=JSON.parse(v); applyAssets(d); if(d.LASTUPDATE) LASTUPDATE=d.LASTUPDATE; }
  }catch(e){}
}

/* ================= عدّاد الزوار =================
   عدّاد يومي في Firestore. القواعد تسمح بزيادة واحدة فقط لكل طلب،
   فلا يقدر أحد ينفخ الرقم دفعة واحدة. جلسة واحدة = زيارة واحدة. */
let VISITS = null;
const dayKey = d => { const x=d||new Date();
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };

async function countVisit(){
  if(!fbDb) return;
  try{
    if(sessionStorage.getItem("mf_seen")) return;   /* جلسة واحدة = زيارة واحدة */
    sessionStorage.setItem("mf_seen","1");
  }catch(e){}
  const k = dayKey();
  try{
    await fbDb.collection("stats").doc(k).set(
      {v: firebase.firestore.FieldValue.increment(1), d:k}, {merge:true});
  }catch(e){}
}
async function loadVisits(days){
  if(!fbDb) return [];
  const out=[], n=days||30, keys=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); keys.push(dayKey(d)); }
  try{
    const snaps = await Promise.all(keys.map(k=>fbDb.collection("stats").doc(k).get()));
    snaps.forEach((sn,i)=>out.push({d:keys[i], v: sn.exists ? (sn.data().v||0) : 0}));
  }catch(e){}
  VISITS = out; return out;
}

   تحدي التوقعات — تسجيل الجمهور، التوقعات، جداول الترتيب
   الاحتساب يتم من متصفح المالك (لا تتوفر Cloud Functions على Spark)
   ================================================================ */
const PT_EXACT = 5, PT_RIGHT = 2, PT_SCORER = 3;

let MYPRED = null;     /* توقعات المشترك للجولة المفتوحة */

const monthOf  = d => String(d||"").slice(0,7);

/* الجولة المفتوحة للتوقع: أقرب جولة فيها مباريات لم تُلعب بعد */
function openRound(){
  const up = MATCHES.filter(isUpcoming).filter(m=>kickoffTS(m)!==null);
  if(!up.length) return null;
  const r = Math.min(...up.map(m=>+m.round||0));
  const ms = MATCHES.filter(m=>(+m.round||0)===r)
    .sort((a,b)=>(kickoffTS(a) ?? Infinity) - (kickoffTS(b) ?? Infinity));
  const first = ms.find(m=>kickoffTS(m)!==null);
  return {round:r, matches:ms, lockMatch:first||null,
          lockAt:first?kickoffTS(first):null, month:monthOf(first?first.date:"")};
}
/* الجولة المعروضة للتوقع: ما فتحه المالك يدوياً، وإلا الجولة القادمة تلقائياً */
function predRound(){
  if(ROUNDMETA && ROUNDMETA.open){
    const ms = MATCHES.filter(m=>(+m.round||0)===+ROUNDMETA.round)
      .sort((a,b)=>(kickoffTS(a) ?? Infinity)-(kickoffTS(b) ?? Infinity));
    if(ms.length) return {round:+ROUNDMETA.round, matches:ms, lockMatch:ms[0],
                          lockAt:ROUNDMETA.lockAt, month:ROUNDMETA.month||monthOf(ms[0].date),
                          manual:true};
  }
  if(ROUNDMETA && ROUNDMETA.open===false) return null;   /* أُغلقت يدوياً */
  return openRound();
}
const isLocked = o => !o || o.lockAt===null || Date.now() >= o.lockAt;

async function loadRoundMeta(){
  if(!fbDb) return;
  try{
    const cur = await fbDb.collection("rounds").doc("current").get();
    if(!cur.exists){ ROUNDMETA=null; return; }
    const rk = cur.data().rk;
    const d = await fbDb.collection("rounds").doc(rk).get();
    if(!d.exists){ ROUNDMETA=null; return; }
    const v = d.data();
    ROUNDMETA = {round:v.round, month:v.month, open:v.open!==false,
                 lockAt: v.lockAt && v.lockAt.toMillis ? v.lockAt.toMillis() : null};
  }catch(e){ ROUNDMETA=null; }
}

/* ===== الحساب العام ===== */
function authErr(e){
  const c = (e && e.code) || "";
  if(c==="auth/invalid-email") return "صيغة البريد غير صحيحة";
  if(c==="auth/missing-password" || c==="auth/weak-password") return "كلمة المرور قصيرة — ٦ أحرف على الأقل";
  if(c==="auth/email-already-in-use") return "هذا البريد مسجّل مسبقاً — سجّل الدخول بدل إنشاء حساب";
  if(c==="auth/invalid-credential" || c==="auth/wrong-password") return "البريد أو كلمة المرور غير صحيحة";
  if(c==="auth/network-request-failed") return "تعذّر الاتصال — تحقق من الشبكة";
  if(c==="auth/operation-not-allowed" || c==="auth/admin-restricted-operation")
    return "طريقة الدخول غير مفعّلة — فعّلها من Authentication ← Sign-in method";
  if(c==="auth/unauthorized-domain")
    return "هذا النطاق غير معتمد — أضفه في Authentication ← Settings ← Authorized domains";
  if(c==="auth/too-many-requests") return "محاولات كثيرة — انتظر دقائق ثم أعد المحاولة";
  if(c==="auth/user-disabled") return "هذا الحساب موقوف";
  if(c==="auth/user-not-found") return "لا يوجد حساب بهذا البريد — أنشئ حساباً";
  if(c==="auth/internal-error" || c==="auth/web-storage-unsupported")
    return "متصفحك يمنع تخزين الجلسة — جرّب فتح الصفحة في المتصفح نفسه بدل تطبيق آخر";
  return "تعذّر الدخول: " + (c || "خطأ غير معروف");
}
/* حفظ ملف المشجّع بعد إنشاء الحساب.
   مهم: لا ننتظره بلا حدّ. على بعض الشبكات (شركات، مانعات إعلانات،
   متصفحات داخل التطبيقات) تُحجب قناة Firestore فيبقى الوعد معلقاً
   بلا خطأ — فيعلق زر التسجيل على «لحظة…» إلى الأبد، والحساب أُنشئ
   فعلاً. فنمهله ثوانٍ ثم نكمل: الحساب صالح، والاسم يُحفظ لاحقاً. */
async function saveFanProfile(uid, name, anon){
  if(!fbDb || !uid) return false;
  const r = await withTimeout(
    fbDb.collection("fans").doc(uid).set(
      {name, joined:new Date().toISOString(), anon:!!anon}, {merge:true}), 8000);
  return r === "ok";
}
async function fanSignInName(name){
  if(!fbAuth) return;
  try{
    const cred = await fbAuth.signInAnonymously();
    if(cred.user){
      try{ await withTimeout(cred.user.updateProfile({displayName:name}), 8000); }catch(e){}
      const ok = await saveFanProfile(cred.user.uid, name, true);
      if(!ok) toast("دخلت بالاسم، لكن حفظ الاسم تأخّر — قد تحتاج كتابته مرة أخرى","busy");
    }
  }catch(e){
    const c=(e&&e.code)||"";
    toast((c==="auth/operation-not-allowed" || c==="auth/admin-restricted-operation")
      ? "الدخول بالاسم غير مفعّل — فعّل Anonymous من إعدادات Authentication"
      : authErr(e), "err");
  }
}

        if(!ok) toast("أُنشئ حسابك، لكن حفظ الاسم تأخّر — عدّله من صفحتك","busy");
      }
    } else {
      await fbAuth.signInWithEmailAndPassword(email, pass);
    }
  }catch(e){ toast(authErr(e),"err"); }
}
/* ترقية حساب الاسم إلى بريد وكلمة مرور — يشتغل داخل متصفحات التطبيقات */
async function linkToEmail(email, pass){

function boardRows(mode, key){
  const rows = BOARD && BOARD.rows ? BOARD.rows : {};
  const live = Object.entries(rows).filter(([,r])=>!r.h);
  /* اسم متكرر؟ نلحق به آخر أربعة أحرف من المعرّف حتى يميّز المشترك نفسه سطره */
  const seen = {};
  live.forEach(([,r])=>{ const n=r.n||"مشترك"; seen[n]=(seen[n]||0)+1; });
  return live.map(([uid,r])=>{
    const n = r.n||"مشترك";
    return {
      uid,
      name: seen[n]>1 ? n+" · "+uid.slice(-4) : n,
      pts: mode==="season" ? (r.t||0) : mode==="round" ? ((r.r||{})[key]||0) : ((r.m||{})[key]||0)
    };
  }).sort((a,b)=> b.pts-a.pts || a.name.localeCompare(b.name,"ar"));
}

/* فتح أو إغلاق جولة التوقعات — قواعد الأمان تمنع أي توقع خارج هذه الحدود */
async function publishRound(round, lockMs, open){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const r = +round;
  if(!r) return {ok:false, msg:"اختر الجولة"};
  if(open && !lockMs) return {ok:false, msg:"حدد تاريخ ووقت الإقفال"};
  const ms = MATCHES.filter(m=>(+m.round||0)===r);
  const month = ms.length ? monthOf(ms.sort((a,b)=>(kickoffTS(a)??Infinity)-(kickoffTS(b)??Infinity))[0].date) : "";
  const rk = roundKey(r);
  try{
    await fbDb.collection("rounds").doc(rk).set({
      round:r, month, open:!!open,
      lockAt: firebase.firestore.Timestamp.fromDate(new Date(lockMs || Date.now())),
      lockLabel: new Date(lockMs || Date.now()).toISOString()
    });
    await fbDb.collection("rounds").doc("current").set({rk, round:r, open:!!open});
    ROUNDMETA = {round:r, month, open:!!open, lockAt: lockMs || Date.now()};
    return {ok:true, msg: open ? `فُتحت توقعات الجولة ${r} حتى ${stampLabel(lockMs)}`
                               : `أُغلقت توقعات الجولة ${r}`};
  }catch(e){ return {ok:false, msg:"تعذّر الحفظ — تأكد أن قواعد الأمان منشورة"}; }
}

/* احتساب جولة — يشغّله المالك بعد إدخال النتائج */
async function scoreRound(r){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const ms = MATCHES.filter(m=>(+m.round||0)===+r && !isUpcoming(m));
  if(!ms.length) return {ok:false, msg:"لا توجد نتائج مسجّلة لهذه الجولة"};
  const key = m => m.home+"|"+m.away;
  const actual = {}; ms.forEach(m=>actual[key(m)] = [+m.hg||0, +m.ag||0]);
  const month = monthOf(ms[0].date);
  const scorers = new Set(GOALS.filter(g=>(+g.r||0)===+r).map(g=>g.p));

  let snap;
  try{ snap = await fbDb.collection("preds").where("rk","==",roundKey(r)).get(); }
  catch(e){ return {ok:false, msg:"تعذّرت قراءة التوقعات"}; }

  const rows = (BOARD && BOARD.rows) ? JSON.parse(JSON.stringify(BOARD.rows)) : {};
  let n = 0;
  snap.forEach(doc=>{
    const p = doc.data(); if(!p || !p.uid) return;
    let pts = 0;
    Object.entries(p.picks||{}).forEach(([k,v])=>{
      const a = actual[k]; if(!a) return;
      const ph=+v[0]||0, pa=+v[1]||0;
      if(ph===a[0] && pa===a[1]) pts += PT_EXACT;
      else if(Math.sign(ph-pa) === Math.sign(a[0]-a[1])) pts += PT_RIGHT;
    });
    if(p.scorer && scorers.has(p.scorer)) pts += PT_SCORER;
    const row = rows[p.uid] || {n:p.name||"مشترك", t:0, r:{}, m:{}};
    row.n = p.name || row.n;
    const prev = (row.r||{})[r] || 0;      /* إعادة الاحتساب لا تُضاعف النقاط */
    row.r = row.r || {}; row.m = row.m || {};
    row.r[r] = pts;
    row.m[month] = Math.max(0, (row.m[month]||0) - prev + pts);
    row.t = Math.max(0, (row.t||0) - prev + pts);
    rows[p.uid] = row; n++;
  });

  const body = {rows, lastRound:+r, lastMonth:month, updated:new Date().toISOString()};
  try{ await fbDb.collection("boards").doc(seasonId()).set(body); }
  catch(e){ return {ok:false, msg:"تعذّر حفظ جدول الترتيب"}; }
  BOARD = body;
  return {ok:true, msg:`احتُسبت الجولة ${r} لـ ${n} مشتركاً`};
}

/* الإقلاع على مرحلتين:
   1) رسم فوري من نسخة الجهاز (آخر وثيقة موسم وصلت من السحابة) — بلا انتظار للشبكة.
   2) السحابة هي المرجع: تُقرأ بالتوازي مع الشعارات ولوحة الحساب ووصف الجولة (كانت
      خمس قراءات متتابعة قبل أول رسم، فبدا التطبيق فارغاً ثوانيَ وتبويب الفانتسي غائباً)،
      ثم تُطبَّق فقط إن اختلفت عن المرسوم. ساعات الأجهزة تختلف فلا يُعتمد على الطابع الزمني. */
async function bootLocal(){
  try{ const v=await localGet("zain_data"); if(!v) return false;
    const d=JSON.parse(v); if(!(d.clubs&&d.matches)) return false;
    LASTSTAMP=stampOf(d); applyData(d,"نسخة محلية محفوظة"); return true; }catch(e){ return false; }
}
/* المصادر بالترتيب: لقطة CDN (بدأ تحميلها في <head>) ← مكتبة Firestore ← data.json.
   كانت الصفحة تنتظر مكتبة Firestore وحدها (5–8 ثوانٍ على جوال، وأكثر في تطبيق iOS)، وفي
   الأثناء يرسم شريط النتائج البيانات المضمّنة في الملف فتظهر «نتائج الجولة 1». */
async function bootData(painted){
  const apply=(d,src)=>{
    const st=stampOf(d);
    if(st!==LASTSTAMP || !painted){ LASTSTAMP=st; applyData(d,src); }
    cacheSeasonLocal(d);
    if(!painted){ paintRail(); paintHeader(); paintFoot();
      const cur=document.querySelector('nav.tabs button[aria-selected="true"]');
      if(!(USER_NAV && cur)) go("home"); }
  };
  const ok = d => !!(d && d.clubs && d.matches);
  const id = seasonId();
  /* اللقطة وحدها أولاً؛ إن تأخرت 2.5ث تتسابق مع المكتبة ويُطبَّق أول ما يصل صالحاً */
  const snapP = SNAP.get(id).then(d=>ok(d)?[d,"السحابة (CDN)"]:null);
  let got = await Promise.race([snapP, new Promise(r=>setTimeout(()=>r(null),2500))]);
  if(!got){
    await domReady();                                 /* fbInit يسبقنا إليها في الإقلاع */
    const cloudP = fbLoad(id).then(d=>ok(d)?[d,"السحابة (Firestore)"]:null);
    got = await new Promise(res=>{ let left=2;
      [snapP, cloudP].forEach(p=>p.then(v=>{ if(v) res(v); else if(--left===0) res(null); })); });
  }
  if(got){ apply(got[0], got[1]); return true; }
  if(painted) return;   /* لا سحابة، والجهاز رسم نسخته — تكفي */
  try{
    const res=await fetch("./data.json",{cache:"no-store"});
    if(res.ok){ const d=await res.json(); if(d.clubs&&d.goals&&d.matches){ LASTSTAMP=stampOf(d); applyData(d,"data.json المنشور"); } }
  }catch(e){}
}
/* العودة للتطبيق بعد أن كان في الخلفية: iOS يوقف قناة onSnapshot فتبقى الأرقام قديمة حتى
   تُفتح من جديد. نقرأ اللقطة (مخزّنة دقيقة في CDN) ونطبّقها فقط إن كانت أحدث من المعروض. */
function watchResume(){
  let at=Date.now();
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState!=="visible" || EDIT || Date.now()-at < 60000) return;
    at=Date.now();
    const d=await SNAP.get(seasonId(), true);
    if(!d || !d.clubs || !d.matches || EDIT) return;
    if(String(d.updated||"") <= String(DATA_UPDATED||"")) return;
    const st=stampOf(d); if(st===LASTSTAMP) return;
    LASTSTAMP=st; applyRemote(d);
  });
}
/* تدفئة ملفات الفانتسي في ذاكرة خادم الخدمة بعد اكتمال الإقلاع: تبويب «فانتسي» يفتح صفحة
   كاملة (ورقة أنماط + ~20 ملف JS)، وكان أول فتح من التطبيق يبدو معلّقاً. الروابط تُقرأ من
   صفحة الفانتسي نفسها فلا يرتبط هذا برقم إصدارها. */
function warmFantasy(){
  try{
    if(navigator.connection && navigator.connection.saveData) return;
    if(!('serviceWorker' in navigator)) return;
    const run=()=>fetch(FANTASY_URL,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(html=>{
      const urls=[...html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+)"/g)].map(m=>FANTASY_URL+m[1]);
      urls.forEach(u=>fetch(u).catch(()=>{}));
    }).catch(()=>{});
    if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:8000}); else setTimeout(run,3000);
  }catch(e){}
}
/* مكتبات Firebase مؤجّلة (defer) فلا تحجب رسم الصفحة؛ تكون جاهزة عند DOMContentLoaded */
const domReady = () => new Promise(r => (DCL_FIRED || document.readyState==="complete") ? r() : document.addEventListener("DOMContentLoaded", ()=>r(), {once:true}));
/* اكتمال تحليل الصفحة (كل السكربتات السطرية ومغلّفات go نُفّذت) — قبل تحميل مكتبات Firebase */
const domParsed = () => new Promise(r => document.readyState!=="loading" ? r() : document.addEventListener("readystatechange", ()=>r(), {once:true}));
(async()=>{
  ALL = stampComp({matches:MATCHES, goals:GOALS, pens:PENS, cards:CARDS, lineups:[], subs:[]});
  applyComp();
  const painted = await bootLocal();
  if(painted){ paintRail(); paintHeader(); paintFoot(); go("home"); }
  await domParsed();
  const dataP   = bootData(painted);                             /* يرسم فور وصول اللقطة، بلا انتظار Firebase */
  await domReady();
  fbInit();
  const assetsP = bootAssets();                                  /* بالتوازي: الشعارات والهوية */
  const metaP   = Promise.all([loadBoard(), loadRoundMeta()]);   /* بالتوازي: لوحة الحساب ووصف الجولة */
  await dataP;
  watchSeason();
  watchResume();
  await assetsP;
  await metaP;
  countVisit();
  paintRail(); paintHeader(); paintFoot();
  /* المستخدم اختار قسماً أثناء الإقلاع؟ نعيد رسمه في مكانه ولا نسحبه للرئيسية */
  const cur=document.querySelector('nav.tabs button[aria-selected="true"]');
  if(USER_NAV && cur && RENDER[cur.dataset.v]) RENDER[cur.dataset.v](); else go("home");
  warmFantasy();
})();
</script>

<script>
/* الأزرار العلوية (الإحصائيات / فانتسي / التوقعات) تقود أزرار التنقل الأصلية */
(function(){
  const subs=document.querySelectorAll('.hero-sub button');
  const mapView=v=>({home:'home',predict:'predict',fantasy:'fantasy'})[v]||'home';
  function sync(){
    const cur=document.querySelector('nav.tabs button[aria-selected="true"]')?.dataset.v||'home';
    subs.forEach(b=>b.classList.toggle('on',b.dataset.go===mapView(cur)));
  }
  subs.forEach(b=>b.addEventListener('click',()=>{
    const t=document.querySelector(`nav.tabs button[data-v="${b.dataset.go}"]`);
    if(t && t.style.display!=='none') t.click();
    else if(b.dataset.go==='fantasy') location.href = window.FANTASY_URL||'/fantasy/';
    setTimeout(sync,0);
  }));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>setTimeout(sync,0)));
  window.addEventListener('hashchange',()=>setTimeout(sync,0));
  /* فتح قسم مباشرة عبر ?v=matches — تستعمله اختصارات التطبيق المثبَّت.
     نضغط زر التبويب بعد اكتمال الإقلاع بدل اعتراض go: الاعتراض كان
     يُبطله أي التفاف لاحق على الدالة، والنقر يمرّ بنفس مسار المستخدم. */
  const qv=new URLSearchParams(location.search).get('v');
  if(qv && qv!=="home"){
    let tries=0, stop=false;
    /* لمسة من المستخدم تُنهي التوجيه فوراً حتى لا نسحبه من قسم اختاره */
    /* isTrusted يميّز نقرة الإصبع عن نقرتنا البرمجية — بدونه يوقف
       التوجيهُ نفسَه عند أول محاولة. */
    document.addEventListener('click', e=>{
      if(e.isTrusted && e.target.closest('nav.tabs, .hero-sub')) stop=true;
    }, true);
    const open=()=>{
      if(stop) return;
      const cur=document.querySelector('nav.tabs button[aria-selected="true"]');
      if(!cur || cur.dataset.v!==qv){
        const b=document.querySelector('nav.tabs button[data-v="'+qv+'"]');
        if(b && b.style.display!=='none'){ b.click(); setTimeout(sync,0); }
      }
      /* نظل نراقب طوال الإقلاع: ينتهي متأخراً ويعيد الرئيسية، فلو توقفنا
         عند أول نجاح لعاد القسم للرئيسية بعدنا. */
      if(++tries<30) setTimeout(open,300);
    };
    setTimeout(open,300);
  }
  setTimeout(sync,300);
})();
</script>

      /* شريط متحرك كشريط الأخبار: يُكرَّر المحتوى مرة واحدة ليكون الدوران
         متصلاً بلا انقطاع، وتُحسب المدة من عرضه فتبقى السرعة ثابتة مهما
         كثرت المباريات. ولا يتحرك أصلاً إن كان المحتوى أقصر من الإطار. */
      function startTicker(box){
        const sc=box.querySelector(".strip-sc"), tr=box.querySelector(".strip-track");
        if(!sc || !tr) return;
        const SPEED=42;                                      /* بكسل في الثانية */
        const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
        let cycle=0;
        /* سفاري على iOS لا يُركّب طبقة أعرض من 4096 بكسل، والمسار نسختان.
           فعلى الشاشات المحمولة نقتطع من آخر البطاقات حتى تتّسع النسخة في
           النصف — تبقى نتائج الجولة كاملة ويُختصر «القادم» وهو الأقل أهمية.
           أما على سطح المكتب فلا حاجة: حدود الطبقات هناك أوسع بكثير. */
        const MAXLAYER=4000;
        const trim=()=>{
          if(innerWidth > 900) return;                       /* سطح المكتب: بلا اقتطاع */
          while(tr.scrollWidth > MAXLAYER/2 && tr.children.length>3){
            const last=tr.lastElementChild;
            if(!last) break;
            tr.removeChild(last); trimmed.push(last);
          }
        };
        let trimmed=[];
        const build=()=>{
          tr.querySelectorAll("[data-dup]").forEach(n=>n.remove());
          trimmed.forEach(n=>tr.appendChild(n)); trimmed=[];   /* نُعيد ما اقتُطع ثم نُقرّر */
          trim();
          const w=tr.scrollWidth;
          if(!w || w<=sc.clientWidth+8){ sc.classList.add("still"); cycle=0; return; }
          sc.classList.remove("still");
          cycle = w + 6;                                     /* نسخة كاملة + الفجوة */
          [...tr.children].forEach(n=>{                      /* نسخة ثانية للدوران المتصل */
            const c=n.cloneNode(true); c.setAttribute("data-dup","1");
            c.setAttribute("aria-hidden","true"); c.tabIndex=-1; tr.appendChild(c);
          });
          sc.style.setProperty("--dur", Math.max(20, Math.round(w/SPEED))+"s");
          guard();
        };

        /* حارس: بعض المتصفحات — خاصةً سفاري على iOS مع مسار بهذا العرض،
           أو وضع توفير الطاقة — لا تُشغّل رسم CSS فيبقى الشريط جامداً.
           نقيس بعد ثانية، وإن لم يتحرك نقوده بأنفسنا بإطارات JS. */
        const readX=()=>{ const t=getComputedStyle(tr).transform;
          if(!t || t==="none") return 0;
          const m=t.match(/matrix.*\((.+)\)/); if(!m) return 0;
          const p=m[1].split(","); return parseFloat(p.length>6? p[12] : p[4])||0; };
        const guard=()=>{
          clearTimeout(startTicker._g);
          if(!cycle || reduce() || startTicker._js) return;
          if(document.hidden){                               /* صفحة مخفية: الحكم غير عادل */
            startTicker._g=setTimeout(guard, 1500); return;
          }
          const a=readX();
          startTicker._g=setTimeout(()=>{
            if(!cycle || startTicker._js) return;
            if(document.hidden){ guard(); return; }           /* أُخفيت أثناء القياس: نعيد */
            if(Math.abs(readX()-a) > 0.5) return;            /* الحركة تعمل */
            startTicker._js=true; driveByJS();
          }, 1200);
        };

        /* القيادة اليدوية: نفس السرعة والاتجاه، وتتوقف من نفسها حين تُخفى الصفحة */
        function driveByJS(){
          tr.style.animation="none";
          let off=0, last=0;
          const step=(ts)=>{
            startTicker._raf=requestAnimationFrame(step);
            if(!last){ last=ts; return; }
            const dt=Math.min(64, ts-last); last=ts;
            if(sc.classList.contains("hold") || !cycle || document.hidden) return;
            off += SPEED*dt/1000;
            if(off>=cycle) off-=cycle;
            tr.style.transform="translate3d("+off.toFixed(1)+"px,0,0)";
          };
          cancelAnimationFrame(startTicker._raf);
          startTicker._raf=requestAnimationFrame(step);
        }

        build();
        clearTimeout(startTicker._t);
        startTicker._t=setTimeout(build,600);                /* بعد تحميل الشعارات */

        if(!startTicker._rs){ startTicker._rs=true;
          let t; addEventListener("resize",()=>{ clearTimeout(t);
            t=setTimeout(()=>document.querySelectorAll("#resStrip").forEach(startTicker),250); }); }

        /* الإيقاف بنمط سطري إلى جانب الصنف: النمط السطري أقوى من الورقة
           فلا يبقى الأمر معلّقاً على ترتيب القواعد. */
        let rt;
        const hold=()=>{ clearTimeout(rt); sc.classList.add("hold"); tr.style.animationPlayState="paused"; };
        const go_ =(d)=>{ clearTimeout(rt); rt=setTimeout(()=>{ sc.classList.remove("hold");
                          tr.style.animationPlayState="running"; }, d||0); };
        sc.onmouseenter=hold;  sc.onmouseleave=()=>go_(0);
        sc.onfocusin=hold;     sc.onfocusout=()=>go_(0);
        sc.ontouchstart=hold;  sc.ontouchend=()=>go_(1200); sc.ontouchcancel=()=>go_(1200);
      }
      const st=document.querySelector("#resStrip");
      /* البيانات المضمّنة في الملف (الجولة 1) لا تُعرض في الشريط — ننتظر اللقطة أو السحابة */
      if(st && Array.isArray(MATCHES) && DATA_SOURCE!=="مضمّنة في الملف"){
        const played=(typeof playedMatches==="function")?playedMatches():MATCHES.filter(m=>m.hg!=null&&m.ag!=null);
        const soon=MATCHES.filter(m=>!played.includes(m));
        let ms=[], lb="";
        if(played.length){ const r=Math.max(...played.map(m=>+m.round||0)); ms=played.filter(m=>(+m.round||0)===r); lb=`نتائج الجولة ${r}`; }
        const next=soon.length? soon.filter(m=>(+m.round||0)===Math.min(...soon.map(m=>+m.round||0))).slice(0,6):[];
        const chip=(m,isSoon)=>`<button type="button" class="rx${isSoon?' soon':''}" onclick="openMatch('${matchKey(m).replace(/'/g,"%27")}')">
            <img src="${crestImg(m.home)}" alt=""><b>${esc(m.home)}</b>
            <span class="sc">${isSoon?((m.date?m.date.slice(5).replace("-","/"):"")+(m.time?" "+m.time:"")||"—"):(m.hg+" - "+m.ag)}</span>
            <b>${esc(m.away)}</b><img src="${crestImg(m.away)}" alt=""></button>`;
        /* الشريط لنتائج آخر جولة فقط — بلا «القادم» (منصور 2026-09-15). القادم يظهر فقط قبل أن تُلعب أي مباراة. */
        const html=ms.length? ms.map(m=>chip(m,false)).join("") : next.map(m=>chip(m,true)).join("");
        const full = html ? `<div class="strip-in"><span class="strip-lb">${lb||"المباريات"}</span>
          <div class="strip-sc"><div class="strip-track">${html}</div></div></div>` : "";
        if(st._mfSrc!==full || (full && !st.firstChild)){ st._mfSrc=full; st.innerHTML=full; if(html) startTicker(st); }
      }
      const nav=document.querySelector("nav.tabs .in");
      if(nav && !nav.querySelector(".navbrand")){
        const d=document.createElement("div"); d.className="navbrand";
        d.innerHTML=`<span>بإشراف</span><img src="${BRAND}" alt="${esc(OWNER)}">`; nav.appendChild(d);
      }
    }catch(e){ console.warn("v3 strips",e); }
  }
  const _go=go; go=function(v){ _go(v); paintStrips(); };
  const _renderAll=renderAll; renderAll=function(){ _renderAll(); paintStrips(); };
  setTimeout(paintStrips,1500);
})();
</script><!-- /v3:js -->

<script>/* v4 */

    "القادسية":["#FDB913","#111111"],"الكويت":["#FFFFFF","#E31B23"],"العربي":["#007A3D","#ffffff"],
    "كاظمة":["#F68B1F","#ffffff"],"السالمية":["#3FB3E0","#ffffff"],"النصر":["#8E1B3A","#E6E6EE"],

  };
  window.CLUB_COLORS=CLUB_COLORS;
  const lum=h=>{const c=h.replace("#","");const r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;return .2126*r+.7152*g+.0722*b;};

  function colorsOf(name){ const c=CLUB_COLORS[(name||"").trim()]; if(!c) return null; const light=lum(c[0])>.9; return {c:light?"#FFFFFF":c[0],c2:light?"#C9D6E6":c[1],t:light?"#0B1F3A":textOn(c[0]),edge:light?"#FFFFFF":c[0],light}; }   /* v28: neutral trim for white clubs */

<script>/* v7 */
(function(){
  const PER=["0-15","16-30","31-45","45+","46-60","61-75","76-90","90+"];
  const norm=t=>t.replace(/\s/g,"").replace(/[\u200e\u200f]/g,"");
  const isPeriod=t=>{ const x=norm(t); return PER.includes(x) || PER.includes(x.split("-").reverse().join("-")) || x==="+45" || x==="+90"; };
  function readRows(b){
    return [...b.querySelectorAll(":scope > .bar")].map(r=>{
      const lblEl=r.querySelector(":scope > span:first-child"); const fl=r.querySelector(".fl"); const n=r.querySelector(".n");
      const val=(n?n.textContent:"").trim(); const num=parseFloat(val.replace(/[^\d.]/g,""))||0;
      return {lbl:lblEl?lblEl.textContent.trim():"", ltr:!!(lblEl&&lblEl.classList.contains("ltr")), val, num, alt:!!(fl&&fl.classList.contains("alt"))};
    });
  }
  /* v24: period lists → the same simple heat grid used on the club page (one row, one number per cell) */
  function timeline(rows){
    const byKey={}; rows.forEach(r=>{ const k=norm(r.lbl); byKey[k]=r; byKey[k.split("-").reverse().join("-")]=r; if(k==="+45") byKey["45+"]=r; if(k==="+90") byKey["90+"]=r; });
    const vals=PER.map(k=>(byKey[k]||{num:0}).num);
    const mx=Math.max(1,...vals), total=vals.reduce((a,b)=>a+b,0);
    const cell=v=>{ const lv=v?Math.max(1,Math.round(v/mx*4)):0; return `<div class="gh-c f l${lv}${v&&v===mx?" top":""}">${v}</div>`; };
    return `<div class="gh gh1">
      <div class="gh-row"><span class="gh-lab f">الأهداف</span>${vals.map(cell).join("")}<span class="gh-tot f">${total}</span></div>
      <div class="gh-row per"><span></span>${PER.map(k=>`<div class="gh-p" dir="ltr">${k}</div>`).join("")}<span class="gh-tot lbl">المجموع</span></div>
    </div>`;
  }
  /* v19: share board — one 100% strip + ranked rows with big numbers (replaces the radial gauges) */
  const PAL=["#A9E4FF","#5FBDF0","#2F94D6","#1F6FB2","#174F86","#123C66"];
  function gauges(rows){
    const total=rows.reduce((a,r)=>a+r.num,0)||1;
    const sorted=[...rows].map((r,i)=>({...r,i})).sort((a,b)=>b.num-a.num);
    const n=Math.max(1,sorted.filter(r=>r.num>0).length-1);
    const mix=(a,b,t)=>{const h=x=>[1,3,5].map(k=>parseInt(x.slice(k,k+2),16));const A=h(a),B=h(b);return "rgb("+A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(",")+")";};
    const color=k=>mix("#A9E4FF","#123C66",Math.min(1,k/n));
    const strip=sorted.filter(r=>r.num>0).map((r,k)=>{const pct=r.num/total*100;
      return `<i class="${k/n<.45?"lt":"dk"}" style="flex:${pct};background:${color(k)}" title="${r.lbl}: ${r.val}"><b>${Math.round(pct)}%</b></i>`;}).join("");
    const lead=sorted[0], leadPct=Math.round((lead?lead.num:0)/total*100);
    const top3=sorted.slice(0,3).reduce((a,r)=>a+r.num,0), top3Pct=Math.round(top3/total*100);
    const rowsHtml=sorted.map((r,k)=>{
      const pct=Math.round(r.num/total*100);
      return `<div class="sb-row${k===0&&r.num>0?" top":""}${r.num===0?" nil":""}">
        <span class="sb-rk">${k+1}</span>
        <span class="sb-dot" style="background:${color(k)}"></span>
        <span class="sb-lbl${r.ltr?" ltr":""}">${r.lbl}</span>
        <span class="sb-pct">${pct}%</span>
        <b class="sb-num">${r.val}</b>
      </div>`;}).join("");
    return `<div class="sb">
      <div class="sb-head">
        <div class="sb-kpi"><b>${total}</b><span>هدفاً</span></div>
        <div class="sb-kpi"><b>${sorted.filter(r=>r.num>0).length}</b><span>فئة</span></div>
        <div class="sb-kpi lead"><b>${leadPct}%</b><span>${lead?lead.lbl:""}</span></div>
        <div class="sb-kpi"><b>${top3Pct}%</b><span>أعلى 3 فئات</span></div>
      </div>
      <div class="sb-strip">${strip}</div>
      <div class="sb-rows${sorted.length>8?" two":""}">${rowsHtml}</div>
    </div>`;
  }
  function upgrade(){
    document.querySelectorAll(".card .bars:not([data-3d])").forEach(b=>{
      const rows=readRows(b); if(!rows.length) return;
      const periodic = rows.length>=6 && rows.every(r=>isPeriod(r.lbl));
      const html = periodic ? timeline(rows) : gauges(rows);
      const wrap=document.createElement("div"); wrap.className="viz7"; wrap.innerHTML=html;
      b.dataset["3d"]="1"; b.insertAdjacentElement("afterend",wrap);
    });
  }
  window.upgradeBars3d=upgrade;
  const _go=go; go=function(v){ _go(v); upgrade(); };
  const _renderAll=renderAll; renderAll=function(){ _renderAll(); upgrade(); };
  let t=null; const mo=new MutationObserver(()=>{ clearTimeout(t); t=setTimeout(upgrade,30); });
  const main=document.querySelector("main"); if(main) mo.observe(main,{childList:true,subtree:true});
  setTimeout(upgrade,1700);
})();
</script><!-- /v7:js -->
