<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#061529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>إحصائيات دوري زين الممتاز 2026/2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#061529; --navy-900:#0A2242; --navy-800:#0E2B52; --navy-600:#17417A;
  --sky:#5FB2E8; --sky-soft:#A9D8F5; --mist:#EDF3FA; --slate:#8FA6C4;
  --win:#35A47C; --draw:#8FA6C4; --loss:#E0644F; --sand:#E9B949;
  --display:'Readex Pro',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--mist);font-family:var(--body);
  font-size:15px;line-height:1.65;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:9px}

/* ---------- الترويسة ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0A2242,rgba(6,21,41,.94));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(143,166,196,.18);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:1rem;color:#fff;white-space:nowrap}
.brand span{font-size:.68rem;color:var(--sky);letter-spacing:.06em}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:rgba(95,178,232,.12);border:1px solid rgba(95,178,232,.28);
  color:var(--sky);font-size:1rem;flex:none;
}
.iconbtn.on{background:var(--sand);border-color:var(--sand);color:#20180a}

/* شريط الدقائق - عنصر الهوية */
.rail{display:flex;gap:2px;height:3px;max-width:1180px;margin:10px auto 0}
.rail i{flex:1;background:rgba(143,166,196,.22);border-radius:9px}
.rail i.a{background:var(--sky)} .rail i.b{background:var(--sand)}

/* ---------- التنقل ---------- */
nav.tabs{
  position:fixed;bottom:0;right:0;left:0;z-index:50;
  background:rgba(10,34,66,.97);backdrop-filter:blur(14px);
  border-top:1px solid rgba(143,166,196,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .in{display:flex;max-width:1180px;margin:0 auto}
nav.tabs button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.62rem;color:var(--slate);border-top:2px solid transparent;transition:color .15s;
  min-height:var(--nav-h);justify-content:center;
}
nav.tabs button .ic{font-size:1.15rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--sky);border-top-color:var(--sky)}

/* ---------- التخطيط ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 14px 28px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--display);font-weight:600;font-size:1.05rem;color:#fff;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec::before{content:"";width:3px;height:16px;background:var(--sky);border-radius:9px}
.hint{font-size:.78rem;color:var(--slate);margin-bottom:12px}

.card{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}

/* ---------- بطاقات المؤشرات ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(160deg,var(--navy-800),var(--navy-900));border:1px solid rgba(143,166,196,.18);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:auto auto 0 0;width:100%;height:2px;background:linear-gradient(90deg,var(--sky),transparent)}
.kpi .k{font-size:.7rem;color:var(--slate)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:.68rem;color:var(--sky)}

/* ---------- الشعار / الرمز ---------- */
.crest{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-family:var(--display);font-weight:700;font-size:.72rem;color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);background:#3B5578;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;transform-origin:center;transition:transform .15s}
.crest.has-logo{box-shadow:inset 0 0 0 1px rgba(143,166,196,.35);padding:2px}
.crest.lg{width:56px;height:56px;font-size:1.1rem;border-radius:14px}
.leaguemark{width:38px;height:38px;flex:none;border-radius:10px;background:#fff;padding:3px;
  object-fit:contain;box-shadow:0 0 0 1px rgba(143,166,196,.25)}

/* ---------- الجداول ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
thead th{background:var(--navy-800);color:var(--sky-soft);font-weight:600;font-size:.68rem;
  letter-spacing:.04em;padding:10px 6px;text-align:center;position:sticky;top:0}
thead th:first-child{text-align:right;padding-right:12px}
tbody td{padding:9px 6px;text-align:center;border-bottom:1px solid rgba(143,166,196,.12);font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:right;padding-right:12px}
tbody tr:nth-child(even){background:rgba(14,43,82,.4)}
tbody tr.top{box-shadow:inset 3px 0 0 var(--sky)}
tbody tr.rel{box-shadow:inset 3px 0 0 rgba(224,100,79,.7)}
.teamcell{display:flex;align-items:center;gap:8px}
.teamcell .pos{color:var(--slate);font-size:.72rem;width:16px;text-align:center;flex:none}
.teamcell b{font-weight:600;white-space:nowrap}
.pillrow{display:flex;gap:3px;justify-content:center}
.pl{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:.62rem;font-weight:700}
.pl.w{background:var(--win);color:#03150e}.pl.d{background:var(--draw);color:#0d1a2b}.pl.l{background:var(--loss);color:#2a0a05}

/* ---------- المباريات ---------- */
.match{border-radius:var(--r);background:var(--navy-900);border:1px solid rgba(143,166,196,.18);margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.mside{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mside.away{flex-direction:row-reverse;text-align:left}
.mside b{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;
  background:var(--navy-800);border-radius:9px;padding:3px 12px;flex:none;letter-spacing:.05em}
.score.soon{font-size:.95rem;color:var(--sand);background:rgba(233,185,73,.12);
  border:1px solid rgba(233,185,73,.35);direction:ltr}
.match.soon{border-color:rgba(233,185,73,.35);background:rgba(14,43,82,.45)}
.mstat{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mstat.soon{color:var(--sand);background:rgba(233,185,73,.14);border:1px solid rgba(233,185,73,.4)}
.mstat.live{color:#EAFBF3;background:#1D6B4E;border:1px solid #35A47C}
.cday.soon{border-color:rgba(233,185,73,.55);background:rgba(233,185,73,.13)}
.cday .dd.g{color:var(--sand)}
.mmeta{padding:0 14px 10px;font-size:.7rem;color:var(--slate);display:flex;gap:10px;flex-wrap:wrap}
.goals{border-top:1px solid rgba(143,166,196,.14);padding:10px 14px;display:grid;gap:6px;font-size:.8rem}
.gline{display:flex;align-items:center;gap:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.gmin{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--sky);font-weight:600;min-width:38px;font-size:.75rem}
.gtag{font-size:.62rem;color:var(--slate);border:1px solid rgba(143,166,196,.3);border-radius:5px;padding:0 5px;white-space:nowrap}

/* ---------- الرسوم ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;font-size:.78rem}
.bar .tr{display:block;background:rgba(143,166,196,.15);border-radius:9px;height:9px;overflow:hidden}
.bar .fl{display:block;height:100%;min-width:3px;border-radius:9px;background:linear-gradient(90deg,var(--sky),var(--navy-600))}
.bar .fl.alt{background:linear-gradient(90deg,var(--loss),#7a2f24)}
.bar .n{text-align:left;font-variant-numeric:tabular-nums;color:var(--slate);font-size:.75rem}

.timing{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;align-items:end;height:130px;margin-top:6px}
.tcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px}
.tcol .bx{border-radius:5px 5px 0 0;min-height:2px}
.tcol .for{background:var(--sky)} .tcol .ag{background:rgba(224,100,79,.75);border-radius:0 0 5px 5px}
.tlabels{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px;font-size:.58rem;color:var(--slate);text-align:center}

/* ---------- المختارات ---------- */
select,input[type=text],input[type=password]{
  width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:11px 12px;font-family:var(--body);font-size:.92rem;
}
select:focus,input:focus{outline:2px solid var(--sky);outline-offset:1px}
label.lb{display:block;font-size:.72rem;color:var(--slate);margin:0 0 6px}
.squadbox{padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.squadbox:last-of-type{border:0}
.squadbox textarea{width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:10px 12px;font-family:var(--body);font-size:.86rem;
  line-height:1.8;resize:vertical}
.squadbox textarea:focus{outline:2px solid var(--sky);outline-offset:1px}
.staffrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.staffrow:last-of-type{border:0}
.staffrow .sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.staffrow .sm b{font-size:.86rem;color:#fff;font-weight:600}
.staffrow .sm span{font-size:.72rem;color:var(--slate);direction:ltr;text-align:right}
.staffrow .sm code{font-size:.62rem;color:var(--slate);direction:ltr;text-align:right;
  opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staffrow button{font-size:.7rem;border:1px solid rgba(143,166,196,.35);border-radius:8px;
  padding:5px 10px;color:var(--mist);white-space:nowrap}
.staffrow button.dl{border-color:rgba(224,100,79,.45);color:var(--loss)}
.uidbox{background:var(--navy-800);border:1px solid rgba(95,178,232,.3);border-radius:10px;
  padding:12px;margin-bottom:14px}
.uidbox code{display:block;direction:ltr;text-align:left;font-size:.76rem;color:var(--sky);
  background:rgba(6,21,41,.6);border-radius:7px;padding:9px 10px;margin-bottom:9px;
  word-break:break-all}
.cnt.off{color:var(--loss);background:rgba(224,100,79,.12);border-color:rgba(224,100,79,.4)}
.cnt{display:inline-block;font-size:.62rem;color:var(--sky);background:rgba(95,178,232,.12);
  border:1px solid rgba(95,178,232,.3);border-radius:999px;padding:1px 7px;
  font-variant-numeric:tabular-nums}

.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(143,166,196,.16);font-size:.85rem}
.stat:last-child{border:0}
.stat .v{font-weight:700;color:#fff;font-variant-numeric:tabular-nums}

.head-story{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,166,196,.16);align-items:flex-start}
.head-story:last-child{border:0}
.head-story .num{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--sand);
  font-variant-numeric:tabular-nums;min-width:56px;text-align:center;line-height:1.2}
.head-story .tx b{display:block;font-size:.85rem;color:#fff;font-weight:600}
.head-story .tx span{font-size:.76rem;color:var(--slate)}

.note{background:rgba(233,185,73,.09);border:1px solid rgba(233,185,73,.32);border-right:3px solid var(--sand);
  border-radius:9px;padding:12px 14px;font-size:.8rem;color:var(--mist)}
.note b{color:var(--sand)}

.btn{background:var(--sky);color:#04121f;font-weight:600;border-radius:10px;padding:11px 16px;font-size:.88rem;width:100%;text-align:center}
.btn.ghost{background:transparent;border:1px solid rgba(143,166,196,.35);color:var(--mist)}
.grid2{display:grid;gap:12px}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}

/* ---------- الإدارة ---------- */
.logogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.logocell{background:var(--navy-800);border:1px dashed rgba(143,166,196,.35);border-radius:10px;padding:10px;text-align:center}
.logocell .nm{font-size:.72rem;margin-top:6px;font-weight:600}
.logocell .up{font-size:.64rem;color:var(--sky);margin-top:4px}
.logocell input[type=file]{display:none}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9px;background:rgba(143,166,196,.28);outline:none;padding:0;border:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--sky);border:2px solid #04121f;cursor:pointer}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--sky);border:2px solid #04121f;cursor:pointer}
.prevrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:var(--navy-800);border-radius:10px;justify-content:center}
.fine{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.fine:last-child{border:0}
.fine .fnm{font-size:.78rem;min-width:74px;font-weight:600}
.fine .rng{flex:1}
.fine .fval{font-size:.72rem;color:var(--slate);min-width:38px;text-align:left;font-variant-numeric:tabular-nums}

.badge{font-size:.62rem;padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge.ok{color:var(--win);border-color:rgba(53,164,124,.45);background:rgba(53,164,124,.1)}
.badge.warn{color:var(--sand);border-color:rgba(233,185,73,.45);background:rgba(233,185,73,.1)}


/* ---------- الخريطة الحرارية ---------- */
.pitchwrap{max-width:420px;margin:0 auto}
.pitch{width:100%;height:auto;display:block}
.pitch .ln{fill:none;stroke:rgba(143,166,196,.45);stroke-width:.5}
.pitch .goal{stroke:var(--sky);stroke-width:1.4}
.pitch .zn{stroke:rgba(143,166,196,.28);stroke-width:.4;transition:fill .2s}
.pitch text{font-family:var(--body);font-weight:700;font-size:4.4px;fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(6,21,41,.65);stroke-width:1.1}
.pitch text.sm{font-size:2.9px;font-weight:500;fill:var(--slate);stroke:none}
.segbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.compbar{border-bottom:1px solid rgba(143,166,196,.16);padding-bottom:12px}
/* شريط الجولات */
.roundstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.roundstrip::-webkit-scrollbar{display:none}
.rchip{flex:none;min-width:62px;border:1px solid rgba(143,166,196,.28);border-radius:10px;
  padding:7px 12px;text-align:center;background:var(--navy-900)}
.rchip .rn{font-family:var(--display);font-weight:700;font-size:.95rem;color:#fff;font-variant-numeric:tabular-nums}
.rchip .rs{font-size:.6rem;color:var(--slate)}
.rchip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky)}
.rchip[aria-pressed="true"] .rn,.rchip[aria-pressed="true"] .rs{color:#04121f}
/* الرزنامة */
.calbar{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:var(--r);padding:12px;margin-bottom:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:var(--display);font-weight:600;font-size:.9rem;color:#fff}
.calnav{display:flex;gap:6px}
.calnav button{width:30px;height:30px;border-radius:8px;background:rgba(95,178,232,.12);
  border:1px solid rgba(95,178,232,.28);color:var(--sky);font-size:.9rem}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.caldow span{text-align:center;font-size:.58rem;color:var(--slate)}
.caldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cday{border-radius:8px;padding:5px 0 4px;text-align:center;
  background:rgba(14,43,82,.5);border:1px solid rgba(143,166,196,.16)}
.cday.blank{background:none;border:0}
.cday .dw{display:none}
.cday .dn{font-family:var(--display);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;color:#fff}
.cday .dd{font-size:.55rem;color:var(--sky);height:9px}
.cday.off{opacity:.32}
.cday.has{border-color:rgba(95,178,232,.5);background:rgba(23,65,122,.6)}
.cday[aria-pressed="true"]{background:var(--sand);border-color:var(--sand)}
.cday[aria-pressed="true"] .dn,.cday[aria-pressed="true"] .dw,.cday[aria-pressed="true"] .dd{color:#20180a}
/* ملخص الجولة */
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rsum div{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:10px;padding:9px 6px;text-align:center}
.rsum .n{font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff;font-variant-numeric:tabular-nums}
.rsum .l{font-size:.6rem;color:var(--slate)}
/* البطاقات */
.cardpill{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px;margin-inline-start:3px}
.cardpill.y{background:#E9B949}.cardpill.r{background:#E0644F}
.ctag{font-size:.62rem;color:var(--slate);display:inline-flex;align-items:center;gap:2px}
/* صور اللاعبين */
.pav{display:inline-block;border-radius:50%;flex:none;overflow:hidden;background:var(--navy-800);
  box-shadow:inset 0 0 0 1.5px rgba(95,178,232,.4);vertical-align:middle}
.pav img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.pavph{border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--navy-800);color:var(--slate);font-weight:700;
  box-shadow:inset 0 0 0 1.5px rgba(143,166,196,.3);vertical-align:middle}
.tune{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.tune:last-child{border:0}
.tune .tprev{flex:none}
.tune .tbody{flex:1;min-width:0}
.tune .tnm{font-size:.8rem;font-weight:600;margin-bottom:6px}
.tune .trow{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:7px;margin-bottom:5px}
.tune .trow span{font-size:.64rem;color:var(--slate)}

/* توحيد صيغة الوقت: أرقام عربية، و«م/مساءً/PM» تُحوّل لنظام ٢٤ ساعة */
function normTime(t){
  if(!t) return null;
  let x = String(t).trim()
    .replace(/[\u0660-\u0669]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
    .replace(/[\u06F0-\u06F9]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48));
  const pm = /(م|مساء|مساءً|p\.?m\.?)/i.test(x);
  const am = /(ص|صباح|صباحاً|a\.?m\.?)/i.test(x);
  const mt = x.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if(!mt) return null;
  let h = +mt[1]; const mi = +mt[2];
  if(h>23 || mi>59) return null;
  if(pm && h<12) h += 12;
  if(am && h===12) h = 0;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function kickoffTS(m){
  if(!m || !m.date) return null;
  const t = normTime(m.time) || "23:59";
  const d = new Date(String(m.date)+"T"+t+":00");
  return isNaN(d.getTime()) ? null : d.getTime();
}

  const ap = h>=12 ? "م" : "ص"; h = h%12 || 12;
  return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]} · ${h}:${mi} ${ap}`;
}

}
function isLive(m){
  if(isUpcoming(m)) return false;
  const k=kickoffTS(m);

    if(m.hg>m.ag){H.W++;A.L++;H.Pts+=3;H.hPts+=3;H.form.push("w");A.form.push("l");}
    else if(m.hg<m.ag){A.W++;H.L++;A.Pts+=3;A.aPts+=3;A.form.push("w");H.form.push("l");}
    else {H.D++;A.D++;H.Pts++;A.Pts++;H.hPts++;A.aPts++;H.form.push("d");A.form.push("d");}
  });
  return Object.values(t).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.c.localeCompare(b.c,"ar"));
}
function scorers(){
  const p={};
  GOALS.forEach(g=>{ const k=g.p+"|"+g.sc; (p[k]??={n:g.p,c:g.sc,g:0,a:0}).g++; });
  GOALS.forEach(g=>{ if(!g.a) return; const k=g.a+"|"+g.sc; (p[k]??={n:g.a,c:g.sc,g:0,a:0}).a++; });
  return Object.values(p).sort((a,b)=>b.g-a.g||b.a-a.a);
}
function firstGoals(){
  return playedMatches().map(m=>{
    const gs=matchGoals(m);
    if(!gs.length) return {m,first:null,res:null};
    const first=gs[0].sc;
    const res = first===m.home ? (m.hg>m.ag?"فوز":m.hg===m.ag?"تعادل":"خسارة")
                               : (m.ag>m.hg?"فوز":m.hg===m.ag?"تعادل":"خسارة");
    return {m,first,res,conceded:first===m.home?m.away:m.home};
  });
}
function clubStats(c){
  const row = standings().find(x=>x.c===c);
  const gf = GOALS.filter(g=>g.sc===c), ga = GOALS.filter(g=>g.cd===c);
  const timing = PERIODS.map(p=>({p,f:gf.filter(g=>period(g)===p).length,a:ga.filter(g=>period(g)===p).length}));
  const sp = gf.filter(g=>g.cat==="كرات ثابتة").length;
  const fg = firstGoals();
  const scoredFirst = fg.filter(x=>x.first===c);
  const top = scorers().filter(p=>p.c===c)[0];
  const yc = CARDS.filter(x=>x.club===c && /إنذار/.test(x.type||"")).length;
  const rc = CARDS.filter(x=>x.club===c && /طرد/.test(x.type||"")).length;
  return {row,gf,ga,timing,sp,scoredFirst,top,yc,rc,
    pen:gf.filter(g=>g.det==="ركلة جزاء").length,
    head:gf.filter(g=>g.bp==="الرأس").length,
    late:gf.filter(g=>["76-90","90+"].includes(period(g))).length};
}
function headlines(){
  const out=[];
  const byMargin=[...MATCHES].sort((a,b)=>Math.abs(b.hg-b.ag)-Math.abs(a.hg-a.ag))[0];
  if(byMargin) out.push({v:Math.abs(byMargin.hg-byMargin.ag),t:"أكبر فارق نتيجة",
    d:`${byMargin.home} ${byMargin.hg} - ${byMargin.ag} ${byMargin.away}`});
  const byGoals=[...MATCHES].sort((a,b)=>(b.hg+b.ag)-(a.hg+a.ag))[0];
  if(byGoals) out.push({v:byGoals.hg+byGoals.ag,t:"أعلى مباراة تسجيلاً",
    d:`${byGoals.home} ${byGoals.hg} - ${byGoals.ag} ${byGoals.away}`});
  const fast=[...GOALS].sort((a,b)=>abs(a)-abs(b))[0];
  if(fast) out.push({v:minLabel(fast),t:"أسرع هدف",d:`${fast.p} — ${fast.sc} ضد ${fast.cd}`});
  const late=[...GOALS].sort((a,b)=>abs(b)-abs(a))[0];
  if(late) out.push({v:minLabel(late),t:"أكثر الأهداف تأخراً",d:`${late.p} — ${late.sc} ضد ${late.cd}`});
  const sp=GOALS.filter(g=>g.cat==="كرات ثابتة").length;
  out.push({v:pct(sp,GOALS.length)+"%",t:"نصيب الكرات الثابتة",d:`${sp} من ${GOALS.length} هدفاً`});
  const second=GOALS.filter(g=>["46-60","61-75","76-90","90+"].includes(period(g))).length;
  out.push({v:pct(second,GOALS.length)+"%",t:"نصيب الشوط الثاني",d:`${gw(second)} بعد الاستراحة`});
  const fg=firstGoals().filter(x=>x.first);
  const wins=fg.filter(x=>x.res==="فوز").length;
  out.push({v:pct(wins,fg.length)+"%",t:"نسبة فوز صاحب الهدف الأول",
    d:`${wins} من ${mw(fg.length)} حُسمت لمن سجّل أولاً`});
  const pk=PENS.filter(p=>p.res==="سجلت").length;
  out.push({v:pk,t:"ركلات جزاء مسجّلة",d:`من أصل ${pw(PENS.length)} احتُسبت`});
  return out;
}

function heatColor(t){
  if(t<=0) return "rgba(143,166,196,.06)";
  const r=Math.round(95+(233-95)*t), g=Math.round(178+(185-178)*t), b=Math.round(232+(73-232)*t);
  return `rgba(${r},${g},${b},${(0.22+0.62*t).toFixed(2)})`;
}
function heatSVG(list){
  const counts={}; ZONES.forEach(z=>counts[z.k]=0);
  list.forEach(g=>{ if(counts[g.zone]!==undefined) counts[g.zone]++; });
  const mx=Math.max(1,...Object.values(counts));
  const cell=z=>{
    const n=counts[z.k], t=n/mx, f=heatColor(t);
    const cx = z.lx ?? (z.t==="c"? z.cx : z.x+z.w/2);
    const cy = z.ly ?? (z.t==="c"? z.cy : z.y+z.h/2);
    const shape = z.t==="c"
      ? `<circle class="zn" cx="${z.cx}" cy="${z.cy}" r="${z.r}" fill="${f}"><title>${z.k}: ${n}</title></circle>`
      : `<rect class="zn" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${f}"><title>${z.k}: ${n}</title></rect>`;
    return shape + (n>0?`<text x="${cx}" y="${cy}">${n}</text>`:"");
  };
  return `<div class="pitchwrap"><svg class="pitch" viewBox="-2 -4 104 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="خريطة أماكن التسجيل">
    ${ZONES.filter(z=>z.t==="r").map(cell).join("")}
    <rect class="ln" x="0" y="2" width="100" height="98"/>
    <rect class="ln" x="21" y="2" width="58" height="32"/>
    <rect class="ln" x="36" y="2" width="28" height="12"/>
    <path class="ln" d="M 34.5 34 A 17 17 0 0 0 65.5 34"/>
    <line class="ln" x1="0" y1="64" x2="100" y2="64" stroke-dasharray="2 2"/>
    <line class="goal" x1="44" y1="2" x2="56" y2="2"/>
    <circle cx="50" cy="24" r="0.9" fill="rgba(143,166,196,.7)"/>
    ${ZONES.filter(z=>z.t==="c").map(cell).join("")}
    <text class="sm" x="50" y="-1">المرمى</text>
    <text class="sm" x="9" y="50">يسار</text>
    <text class="sm" x="91" y="50">يمين</text>
    <text class="sm" x="50" y="95">مسافة بعيدة</text>
  </svg></div>
  <div class="hlegend"><span>أقل</span><span class="sc"></span><span>أكثر</span></div>`;
}
function zoneList(list){
  const c={}; list.forEach(g=>c[g.zone]=(c[g.zone]||0)+1);
  const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...rows.map(r=>r[1]));
  if(!rows.length) return '<span style="color:var(--slate)">لا توجد أهداف ضمن هذا التصنيف.</span>';
  return `<div class="bars">${rows.map(([k,n])=>`<div class="bar">
    <span style="font-size:.7rem">${esc(k)}</span>
    <span class="tr"><span class="fl" style="width:${n/mx*100}%"></span></span>
    <span class="n">${n}</span></div>`).join("")}</div>`;
}

/* ================= مدير بيانات الموسم ================= */
const SH = {matches:"سجل المباريات", goals:"سجل الأهداف", pens:"سجل ركلات الجزاء",
            set:"الإعدادات", cards:["سجل الإنذارات","سجل البطاقات"]};
/* يبحث عن عمود اختياري باسم رأسه في أول عشرة صفوف، فلا يهمّ ترتيب الأعمدة
   ولا موضع صف الرؤوس — بعض الأوراق تبدأ من الصف الأول وبعضها من الرابع */
function findHead(rows, names){
  const N=Math.min((rows||[]).length,10);
  for(let i=0;i<N;i++){
    const row=rows[i]||[];
    for(let j=0;j<row.length;j++){
      const h=String(row[j]??"").trim();
      if(h && names.some(n=>h===n || h.includes(n))) return {row:i, col:j};
    }
  }
  return null;
}
function colOf(rows, names){ const f=findHead(rows,names); return f?f.col:-1; }
const pickComp = v => { const t=String(v??"").trim(); return COMPS.includes(t) ? t : (t||"الدوري"); };
const cellStr = v => (v===null||v===undefined) ? "" : String(v).trim();
const cellNum = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function rowsOf(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}

function buildFromWorkbook(wb){
  const warn=[], miss=[];
  const need=[SH.matches,SH.goals,SH.set].filter(n=>!wb.Sheets[n]);
  if(need.length) return {error:"الملف ينقص أوراقاً أساسية: "+need.join("، ")};

  /* الأندية والموسم */
  const setR = rowsOf(wb, SH.set) || [];
  const clubs=[];
  for(let i=4;i<16;i++){ const v=cellStr(setR[i]?.[1]); if(v) clubs.push(v); }
  /* مزامنة القوائم المرجعية مع ورقة الإعدادات */
  const grab=(col,r1,r2)=>{const out=[];for(let i=r1;i<=r2;i++){const v=cellStr(setR[i]?.[col]);if(v)out.push(v);}return out;};
  const L1=grab(3,4,16), L2=grab(6,4,8), L3=grab(7,4,14), L4=grab(10,4,8);
  if(L1.length>3) LIST.det=L1;
  if(L2.length>2) LIST.bp=L2;
  if(L3.length>5) LIST.zone=L3;
  if(L4.length>2) LIST.penres=L4;
  let season = SEASON;
  for(const r of setR){ if(cellStr(r?.[0]).includes("اسم الموسم") && cellStr(r?.[1])) season=cellStr(r[1]); }
  if(clubs.length<2) return {error:"لم أتمكن من قراءة أسماء الأندية من ورقة الإعدادات."};

  /* الأهداف */
  const goals=[];
  (rowsOf(wb, SH.goals)||[]).slice(4).forEach((r,i)=>{
    if(!r) return;
    const sc=cellStr(r[3]), cd=cellStr(r[4]);
    if(!sc || !cd) return;
    const line = i+5;
    let cat=cellStr(r[12]); const det=cellStr(r[13]);
    if(!cat && det) cat = /ركلة جزاء|ركلة حرة|ركنية|رمية تماس|كرة ثابتة/.test(det) ? "كرات ثابتة" : "لعب مفتوح";
    const g={ r:cellNum(r[1]), sc, cd, p:cellStr(r[5]), a:cellStr(r[6]),
              m:cellNum(r[8]), x:cellNum(r[9]),
              cat, det, bp:cellStr(r[14]), zone:cellStr(r[15]) };
    if(!clubs.includes(sc)) warn.push(`سجل الأهداف صف ${line}: نادٍ غير معروف «${sc}»`);
    if(!clubs.includes(cd)) warn.push(`سجل الأهداف صف ${line}: نادٍ غير معروف «${cd}»`);
    if(!g.r) warn.push(`سجل الأهداف صف ${line}: رقم الجولة فارغ`);
    if(!g.m) warn.push(`سجل الأهداف صف ${line}: الدقيقة فارغة`);
    if(!g.zone) miss.push(`سجل الأهداف صف ${line}: منطقة التسجيل فارغة`);
    if(!g.cat)  miss.push(`سجل الأهداف صف ${line}: التصنيف والتفصيل فارغان`);
    if(!g.p)    miss.push(`سجل الأهداف صف ${line}: اسم اللاعب فارغ`);
    goals.push(g);
  });

  /* المباريات — النتيجة تُشتق من الأهداف لا من خلايا الصيغ */
  const matches=[]; const seen=new Set();
  const mRows = rowsOf(wb, SH.matches)||[];
  const cCompM = colOf(mRows, ["المسابقة","البطولة"]);
  const cVenue = colOf(mRows, ["الملعب","الاستاد"]);
  const cTime  = colOf(mRows, ["الوقت","التوقيت","ساعة"]);
  mRows.slice(4).forEach((r,i)=>{
    if(!r) return;
    const home=cellStr(r[3]), away=cellStr(r[4]);
    if(!home || !away) return;
    const line=i+5, round=cellNum(r[1]);
    let date=""; const dv=r[2];
    if(dv instanceof Date) date=dv.toISOString().slice(0,10);
    else if(typeof dv==="number" && dv>20000){ const d=XLSX.SSF.parse_date_code(dv);
      if(d) date=`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
    else date=cellStr(dv).slice(0,10);
    const key=round+"|"+home+"|"+away;
    if(seen.has(key)) warn.push(`سجل المباريات صف ${line}: مباراة مكررة`);
    seen.add(key);
    if(!clubs.includes(home)) warn.push(`سجل المباريات صف ${line}: نادٍ غير معروف «${home}»`);
    if(!clubs.includes(away)) warn.push(`سجل المباريات صف ${line}: نادٍ غير معروف «${away}»`);
    if(!round) warn.push(`سجل المباريات صف ${line}: رقم الجولة فارغ`);
    const hg=goals.filter(g=>g.r===round&&g.sc===home&&g.cd===away).length;
    const ag=goals.filter(g=>g.r===round&&g.sc===away&&g.cd===home).length;
    const comp = cCompM>=0 ? pickComp(r[cCompM]) : "الدوري";
    const venue = cVenue>=0 ? cellStr(r[cVenue]) : "";
    let time = "";
    if(cTime>=0){ const tv=r[cTime];
      if(tv instanceof Date) time=tv.toISOString().slice(11,16);
      else if(typeof tv==="number" && tv<1) { const t=Math.round(tv*1440); time=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
      else time=cellStr(tv).slice(0,5); }
    matches.push({n:matches.length+1, round, comp, date, time, venue, home, away, hg, ag});
  });

  /* أهداف بلا مباراة مسجّلة */
  goals.forEach((g,i)=>{
    const ok=matches.some(m=>m.round===g.r && ((m.home===g.sc&&m.away===g.cd)||(m.home===g.cd&&m.away===g.sc)));
    if(!ok) warn.push(`سجل الأهداف صف ${i+5}: لا توجد مباراة مطابقة في سجل المباريات`);
  });

  /* ركلات الجزاء */
  const pens=[];
  const pRows = rowsOf(wb, SH.pens)||[];
  const cPlace = colOf(pRows, ["مكان التسديد","موضع التسديد","مكان الركلة"]);
  pRows.slice(4).forEach((r,i)=>{
    if(!r) return;
    const by=cellStr(r[2]), vs=cellStr(r[3]);
    if(!by || !vs) return;
    const place = cPlace>=0 ? cellStr(r[cPlace]) : "";
    if(place && !PZONES.includes(place))
      warn.push(`سجل ركلات الجزاء صف ${i+5}: مكان تسديد غير معروف «${place}»`);
    pens.push({r:cellNum(r[1]), by, vs, p:cellStr(r[4]), m:cellNum(r[5]), res:cellStr(r[6]), place});
  });

  /* الإنذارات — ورقة اختيارية */
  const cards=[];
  const cSheet = SH.cards.find(n=>wb.Sheets[n]);
  if(cSheet){
    const cRows = rowsOf(wb, cSheet)||[];
    const hd = findHead(cRows,["النادي","الفريق"]);
    const hRow = hd ? hd.row : 3;
    const col = names => { const head=cRows[hRow]||[];
      for(let i=0;i<head.length;i++){ const h=String(head[i]??"").trim();
        if(h && names.some(n=>h===n||h.includes(n))) return i; } return -1; };
    const iRound=col(["الجولة"]), iComp=col(["المسابقة","البطولة"]), iClub=col(["النادي","الفريق"]);
    const iP=col(["اللاعب"]), iMin=col(["الدقيقة"]), iType=col(["النوع","البطاقة"]);
    const off = hRow+1;
    cRows.slice(off).forEach((r,i)=>{
      if(!r) return;
      const club = iClub>=0 ? cellStr(r[iClub]) : "";
      if(!club) return;
      const type = iType>=0 ? cellStr(r[iType]) : "إنذار";
      if(!clubs.includes(club)) warn.push(`${cSheet} صف ${i+off+1}: نادٍ غير معروف «${club}»`);
      if(!/إنذار|طرد/.test(type)) warn.push(`${cSheet} صف ${i+off+1}: نوع بطاقة غير معروف «${type}»`);
      cards.push({ r: iRound>=0?cellNum(r[iRound]):0,
                   comp: iComp>=0?pickComp(r[iComp]):"الدوري",
                   club, p: iP>=0?cellStr(r[iP]):"", m: iMin>=0?cellNum(r[iMin]):0, type });
    });
  }

  const blank = goals.filter(g=>!g.det).length;
  const stale = goals.length>3 && blank >= goals.length*0.5;
  return {season, clubs, matches, goals, pens, cards, warn, miss, stale};
}

function applyData(d, source){
  SEASON = d.season || SEASON;
  ALL = stampComp({matches:d.matches||[], goals:d.goals||[], pens:d.pens||[], cards:d.cards||[]});
  SQUADS = d.squads || SQUADS || {};   /* ملف بلا كشوفات لا يمسح الكشوفات الحالية */
  CLUBS = d.clubs;
  const have = compsPresent();
  if(!have.includes(COMP)) COMP = have[0] || "الدوري";
  SELR=null; SELDAY=null; CALM=null;
  applyComp();
  DATA_UPDATED = d.updated || new Date().toISOString();
  DATA_BY = d.updatedBy || "";
  DATA_SOURCE  = source || "ملف بيانات";
  const mx = ALL.matches.length ? Math.max(...ALL.matches.map(m=>m.round)) : 0;
  if(!/الجولة/.test(LASTUPDATE)) LASTUPDATE = `الجولة ${mx}`;
  $("#seasonLbl").textContent = SEASON;
  paintRail(); paintFoot(); renderAll();
}

function dataObject(){
  return {season:SEASON, clubs:CLUBS,
          matches:ALL?ALL.matches:MATCHES, goals:ALL?ALL.goals:GOALS,
          pens:ALL?ALL.pens:PENS, cards:ALL?ALL.cards:CARDS, squads:SQUADS,
          lastUpdate:LASTUPDATE, updated:new Date().toISOString(),
          updatedBy:(FBUSER&&FBUSER.email)||""};
}
function downloadJSON(){
  const blob=new Blob([JSON.stringify(dataObject(),null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download="data.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function persistData(){

let PENDING=null;
function readDataFile(file){
  const box=$("#dataReport");
  const fr=new FileReader();
  if(/\.json$/i.test(file.name)){
    fr.onload=()=>{ try{
        const d=JSON.parse(fr.result);
        if(!d.clubs||!d.goals||!d.matches) throw new Error("بنية غير متوقعة");
        PENDING={...d, warn:[], miss:[]};
        showReport(PENDING, file.name);
      }catch(e){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(e.message)}</div>`; } };
    fr.readAsText(file);
    return;
  }
  if(typeof XLSX==="undefined"){
    box.innerHTML=`<div class="note"><b>مكتبة قراءة الإكسل غير متاحة الآن.</b> تحتاج اتصالاً بالإنترنت لقراءة ملفات xlsx، أو استخدم ملف data.json بدلاً منها.</div>`;
    return;
  }
  fr.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true});
      const d=buildFromWorkbook(wb);
      if(d.error){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(d.error)}</div>`; return; }
      PENDING=d; showReport(d, file.name);
    }catch(e){ box.innerHTML=`<div class="note"><b>تعذّرت القراءة:</b> ${esc(e.message)}</div>`; }
  };
  fr.readAsArrayBuffer(file);
}

function showReport(d, fname){
  const rounds = d.matches.length ? Math.max(...d.matches.map(m=>m.round)) : 0;
  const warn=d.warn||[], miss=d.miss||[];
  const list=(arr,cls)=>arr.slice(0,12).map(w=>`<div class="stat"><span style="font-size:.78rem">${esc(w)}</span><span class="badge ${cls}">${cls==="warn"?"⚠️":"✅"}</span></div>`).join("")
    + (arr.length>12?`<p class="hint">و${arr.length-12} تنبيهاً آخر…</p>`:"");
  $("#dataReport").innerHTML=`
    <div class="card pad" style="margin-top:12px">
      <div class="stat"><span>الملف</span><span class="v" style="font-size:.8rem">${esc(fname)}</span></div>
      <div class="stat"><span>الموسم</span><span class="v">${esc(d.season||"—")}</span></div>
      <div class="stat"><span>الأندية</span><span class="v">${d.clubs.length}</span></div>
      <div class="stat"><span>المباريات</span><span class="v">${d.matches.length}</span></div>
      <div class="stat"><span>الأهداف</span><span class="v">${d.goals.length}</span></div>
      <div class="stat"><span>ركلات الجزاء</span><span class="v">${(d.pens||[]).length}</span></div>
      <div class="stat"><span>الإنذارات وحالات الطرد</span><span class="v">${(d.cards||[]).length}</span></div>
      <div class="stat"><span>المسابقات</span><span class="v" style="font-size:.8rem">${esc([...new Set((d.matches||[]).map(m=>m.comp||"الدوري"))].join("، ")||"—")}</span></div>
      <div class="stat"><span>آخر جولة</span><span class="v">${rounds}</span></div>
      <div class="stat"><span>تنبيهات تحتاج مراجعة</span><span class="v" style="color:${warn.length?"var(--loss)":"var(--win)"}">${warn.length}</span></div>
      <div class="stat"><span>حقول ناقصة</span><span class="v" style="color:${miss.length?"var(--sand)":"var(--win)"}">${miss.length}</span></div>
    </div>
    ${d.stale?`<div class="note" style="margin-top:12px"><b>يبدو أن صيغ الملف لم تُحدَّث.</b> أعمدة التفصيل والتصنيف تُحسب بصيغ داخل الإكسل، وهي فارغة هنا. افتح الملف في إكسل واحفظه مرة واحدة، ثم أعد الرفع.</div>`:""}
    ${warn.length?`<h2 class="sec">تنبيهات</h2><div class="card pad">${list(warn,"warn")}</div>`:""}
    ${miss.length?`<h2 class="sec">حقول ناقصة</h2><div class="card pad">${list(miss,"warn")}</div>`:""}
    <div style="height:12px"></div>
    <button class="btn" id="applyBtn">اعتماد هذه البيانات وتحديث الموقع</button>
    <p class="hint" style="margin-top:8px">${warn.length?"يمكنك الاعتماد رغم التنبيهات، لكن الأرقام قد تكون ناقصة. راجع الصفوف أعلاه في ملف الإكسل أولاً.":"لا توجد أخطاء بنيوية — البيانات جاهزة للاعتماد."}</p>`;
  $("#applyBtn").onclick=async(ev)=>{
    const btn=ev.currentTarget;
    busy(btn,true,"جارٍ الاعتماد…");
    applyData(PENDING, "ملف مرفوع: "+fname);
    paintRail(); renderAll();
    const ok=await persistData();
    busy(btn,false);
    if(ok===true){ LASTSYNC=new Date();
      toast(`اعتُمدت البيانات: ${MATCHES.length} مباراة و${GOALS.length} هدفاً · حُفظت في السحابة ✅`,"ok"); }
    else if(ok==="pending") toast(SYNCMSG,"busy");
    else toast(SYNCMSG||"اعتُمدت محلياً، لكن تعذّر الحفظ في السحابة","err");
    renderAdmin();
  };
}



/* ================= إشعار مرئي ================= */
let toastTimer=null;
function toast(msg, kind, sticky){
  const t=$("#toast"); if(!t) return;
  t.className=""; t.textContent=msg;
  t.classList.add(kind||"ok","on");
  clearTimeout(toastTimer);
  /* حتى الإشعار "الملتصق" له عمر أقصى — لا شيء يبقى معلّقاً على الشاشة */
  toastTimer=setTimeout(()=>t.classList.remove("on"), sticky?12000:(kind==="err"?7000:3500));
}
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.orig=btn.dataset.orig||btn.textContent; btn.textContent=label||"جارٍ التنفيذ…"; btn.disabled=true; }
  else { if(btn.dataset.orig) btn.textContent=btn.dataset.orig; btn.disabled=false; }
}

/* ================= ضغط الصور قبل الحفظ ================= */
/* الصور الأصلية تزن مئات الكيلوبايتات، ووثيقة Firestore محدودة بميغابايت واحد.
   نصغّرها إلى الحجم المعروض فعلاً فتصير بضعة كيلوبايتات مع حفظ الشفافية. */
function compressImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("الملف ليس صورة صالحة"));
      img.onload=()=>{
        try{
          const sc=Math.min(1, maxDim/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          let out=""; 
          try{ out=c.toDataURL("image/webp", quality); }catch(e){}
          if(!out || out.indexOf("data:image/webp")!==0) out=c.toDataURL("image/png");
          res(out);
        }catch(e){ rej(e); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const dataUrlKB = u => Math.round((String(u||"").length*0.75)/1024);
function assetsKB(){ return Math.round(JSON.stringify(assetsObject()).length/1024); }

/* يلتقط صورة من حقل ملف، يضغطها، ويعيد رسالة النتيجة */
async function takeImage(file, maxDim, quality, label){
  if(!file) return null;
  const before=Math.round(file.size/1024);
  try{
    const url=await compressImage(file, maxDim, quality);
    const after=dataUrlKB(url);
    return {url, msg:`${label}: ${before} ك.ب ← ${after} ك.ب`};
  }catch(e){ return {url:null, msg:`تعذّرت معالجة ${label}: ${e.message}`}; }
}

const seasonId = () => String(SEASON||"2026-2027").replace(/\//g,"-");
/* Firestore يطبّق الكتابة محلياً فوراً، لكن الوعد لا يُحسم إلا بتأكيد الخادم.
   بلا اتصال يبقى معلّقاً بلا نهاية — فنسابقه بمهلة. */
function withTimeout(p, ms){
  return Promise.race([ p.then(()=>"ok").catch(e=>({err:e})),
                        new Promise(r=>setTimeout(()=>r("timeout"), ms)) ]);
}

async function fbLoad(docId){
  if(!fbDb) return null;
  try{ const d=await fbDb.collection("seasons").doc(docId).get(); return d.exists?d.data():null; }
  catch(e){ FBSTATE="تعذّرت القراءة من السحابة"; return null; }
}
async function fbSaveSeason(){
  if(!fbDb || !isAdmin) return false;
  const r = await withTimeout(fbDb.collection("seasons").doc(seasonId()).set(dataObject()), 9000);
  if(r==="ok"){ SYNCMSG=""; return true; }
  if(r==="timeout"){ SYNCMSG="الاتصال بطيء — حُفظ محلياً وسيُرسل تلقائياً عند عودة الشبكة."; return "pending"; }
  SYNCMSG="تعذّر الحفظ: "+((r.err&&(r.err.code||r.err.message))||"خطأ غير معروف"); return false;
}
let SEASON_UNSUB=null, LASTSTAMP="", PENDING_REMOTE=null;
/* استماع حيّ لوثيقة الموسم: أي حفظ من أي عضو يظهر عند الجميع فوراً بلا تحديث للصفحة */
function watchSeason(){
  if(!fbDb) return;
  if(SEASON_UNSUB){ try{ SEASON_UNSUB(); }catch(e){} SEASON_UNSUB=null; }
  try{
    SEASON_UNSUB = fbDb.collection("seasons").doc(seasonId()).onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return;   /* تجاهل صدى كتابتنا */
      const d=snap.data();
      if(!d || !d.clubs || !d.matches) return;
      const stamp=(d.updated||"")+"|"+(d.updatedBy||"");
      if(stamp===LASTSTAMP) return;
      LASTSTAMP=stamp;
      if(EDIT){ PENDING_REMOTE=d; return; }   /* لا نقاطع نموذج مباراة مفتوحاً */
      applyRemote(d);
    }, ()=>{});
  }catch(e){}
}
function applyRemote(d){
  const mine=(FBUSER&&FBUSER.email)||"";
  applyData(d,"السحابة (تحديث حيّ)");
  if(d.updatedBy && d.updatedBy!==mine) toast(`وصل تحديث من ${d.updatedBy}`,"ok");
}
function flushRemote(){
  if(PENDING_REMOTE && !EDIT){ const d=PENDING_REMOTE; PENDING_REMOTE=null; applyRemote(d); }
}

/* ================= تشخيص الاتصال بالسحابة ================= */
async function diagnose(){
  const out=[];
  const add=(ok,t,d)=>out.push({ok,t,d:d||""});
  add(typeof firebase!=="undefined","تحميل مكتبة Firebase",
      typeof firebase==="undefined"?"لم تُحمّل — تحقق من الاتصال أو من مانع الإعلانات":"");
  if(typeof firebase==="undefined") return out;
  add(!!fbDb,"تهيئة Firestore", fbDb?"":FBSTATE);
  add(location.protocol!=="file:","طريقة الفتح",
      location.protocol==="file:"?"الملف مفتوح محلياً — Firestore يرفض file://":location.origin);
  add(!!FBUSER,"تسجيل الدخول", FBUSER?FBUSER.email:"لم تسجّل الدخول");
  add(!!(FBUSER&&FBUSER.uid===ADMIN_UID),"مطابقة حساب المدير",
      FBUSER? (FBUSER.uid===ADMIN_UID?"":"الـ UID لا يطابق: "+FBUSER.uid) : "—");
  if(!fbDb) return out;

  /* قراءة */
  let r=await Promise.race([
    fbDb.collection("seasons").doc(seasonId()).get().then(d=>({ok:true,ex:d.exists})).catch(e=>({ok:false,e})),
    new Promise(z=>setTimeout(()=>z({to:true}),9000))]);
  if(r.to) add(false,"قراءة من السحابة","لا استجابة خلال 9 ثوانٍ — الاتصال محجوب غالباً");
  else if(r.ok) add(true,"قراءة من السحابة", r.ex?"الوثيقة موجودة":"القاعدة تعمل لكن الوثيقة غير موجودة بعد");
  else add(false,"قراءة من السحابة", r.e.code||r.e.message);

  /* كتابة اختبارية */
  let w=await Promise.race([
    fbDb.collection("seasons").doc("_ping").set({t:Date.now()}).then(()=>({ok:true})).catch(e=>({ok:false,e})),
    new Promise(z=>setTimeout(()=>z({to:true}),9000))]);
  if(w.to) add(false,"كتابة اختبارية","لا استجابة خلال 9 ثوانٍ");
  else if(w.ok) add(true,"كتابة اختبارية","نجحت");
  else add(false,"كتابة اختبارية", w.e.code||w.e.message);
  return out;
}
function diagAdvice(res){
  const f=n=>res.find(x=>x.t===n);
  if(f("تحميل مكتبة Firebase") && !f("تحميل مكتبة Firebase").ok)
    return "مانع إعلانات أو برنامج حماية يحجب مكتبة Firebase. عطّله لهذا الموقع.";
  if(f("طريقة الفتح") && !f("طريقة الفتح").ok)
    return "افتح الموقع من رابط mfsoccer.netlify.app لا من ملف على جهازك.";
  if(f("تسجيل الدخول") && !f("تسجيل الدخول").ok) return "سجّل الدخول أولاً.";
  if(f("مطابقة حساب المدير") && !f("مطابقة حساب المدير").ok)
    return "هذا الحساب ليس المدير — الكتابة مرفوضة بالقواعد.";
  const rd=f("قراءة من السحابة"), wr=f("كتابة اختبارية");
  if(rd && !rd.ok && /9 ثوانٍ/.test(rd.d))
    return "الاتصال بـ Firestore محجوب تماماً. الأسباب الشائعة: برنامج حماية مثل McAfee، أو إضافة حجب إعلانات، أو شبكة مقيّدة. جرّب نافذة تصفح خفي بلا إضافات، أو شبكة أخرى مثل بيانات الجوال.";
  if(rd && !rd.ok && /not-found|NOT_FOUND/i.test(rd.d))
    return "قاعدة Firestore لم تُنشأ بعد. ارجع لـ Firebase ← Firestore Database ← Create database.";
  if(wr && !wr.ok && /permission-denied/i.test(wr.d))
    return "القواعد ترفض الكتابة. تأكد من نشر قواعد Firestore بالضغط على Publish، ومن صحة الـ UID فيها.";
  if(wr && !wr.ok && /9 ثوانٍ/.test(wr.d))
    return "القراءة تعمل والكتابة معلّقة — غالباً حجب جزئي. جرّب تصفحاً خفياً أو شبكة أخرى.";
  if(rd && rd.ok && wr && wr.ok) return "كل شيء سليم. أعد المحاولة الآن.";
  return "";
}

  const ps=(ALL.pens||[]).filter(x=>x.r===m.round && compOf(x)===compOf(m) &&
      ((x.by===m.home&&x.vs===m.away)||(x.by===m.away&&x.vs===m.home)));
  return {orig:mkey(m),
    match:{round:m.round, comp:compOf(m), home:m.home, away:m.away, venue:m.venue||"", date:m.date||"", time:m.time||""},
    goals:gs.map(g=>({sc:g.sc,p:g.p,a:g.a||"",m:g.m,x:g.x||0,det:g.det||"",bp:g.bp||"",zone:g.zone||""})),
    cards:cs.map(x=>({club:x.club,p:x.p,m:x.m,type:x.type})),
    pens:ps.map(x=>({by:x.by,p:x.p,m:x.m,res:x.res,place:x.place||""}))};
}

/* أسماء لاعبي نادٍ: الكشف المُدخل + كل اسم ظهر له في السجلات */
function playersOf(club){
  if(!club) return [];
  const s=new Set((SQUADS[club]||[]).map(x=>String(x).trim()).filter(Boolean));
  (ALL?.goals||[]).forEach(g=>{ if(g.sc===club){ if(g.p) s.add(g.p); if(g.a) s.add(g.a); } });
  (ALL?.cards||[]).forEach(x=>{ if(x.club===club && x.p) s.add(x.p); });
  (ALL?.pens ||[]).forEach(x=>{ if(x.by===club && x.p) s.add(x.p); });
  return [...s].sort((a,b)=>String(a).localeCompare(String(b),"ar"));
}
function playersOfSides(sides){
  const s=new Set(); (sides||[]).forEach(c=>playersOf(c).forEach(n=>s.add(n)));
  return [...s].sort((a,b)=>String(a).localeCompare(String(b),"ar"));
}
function squadTotal(){ return Object.values(SQUADS).reduce((a,b)=>a+(b?b.length:0),0); }

function fld(label, key, kind, list, val){
  const v = val==null?"":val;
  if(kind==="select") return `<div class="fld"><label>${label}</label>
    <select data-k="${key}">${opt(list, v, "اختر")}</select></div>`;
  if(kind==="combo"){
    const id="dl_"+key.replace(/[^A-Za-z0-9_]/g,"_");
    const names=(list||[]);
    return `<div class="fld"><label>${label}${names.length?` <span class="cnt">${names.length}</span>`:""}</label>
      <input type="text" data-k="${key}" value="${esc(v)}" list="${id}" autocomplete="off"
             placeholder="${names.length?"اختر من القائمة أو اكتب":"اكتب الاسم"}">
      <datalist id="${id}">${names.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>`;
  }
  return `<div class="fld"><label>${label}</label>
    <input type="${kind}" data-k="${key}" value="${esc(v)}"></div>`;
}

function setPath(path, val){
  const parts=path.split(".");
  if(parts[0]==="match"){ EDIT.match[parts[1]] = val; return; }
  const arr=EDIT[parts[0]]; if(!arr) return;
  arr[+parts[1]][parts[2]] = val;
}

function validateEdit(){
  const m=EDIT.match;
  if(!m.round || +m.round<1) return "أدخل رقم الجولة.";
  if(!m.home || !m.away) return "اختر الفريق المضيف والفريق الضيف.";
  if(m.home===m.away) return "لا يمكن أن يواجه النادي نفسه.";
  if(!m.date) return "أدخل تاريخ المباراة.";
  const dup=(ALL.matches||[]).some(x=>mkey(x)===`${+m.round}|${m.comp}|${m.home}|${m.away}` && mkey(x)!==EDIT.orig);
  if(dup) return "هذه المباراة مسجّلة مسبقاً في هذه الجولة والمسابقة.";
  for(const [i,g] of EDIT.goals.entries()){
    if(!g.sc) return `الهدف ${i+1}: اختر الفريق المسجل.`;
    if(!g.p) return `الهدف ${i+1}: اكتب اسم اللاعب.`;
    if(!g.m || +g.m<1) return `الهدف ${i+1}: أدخل الدقيقة.`;
    if(!g.det) return `الهدف ${i+1}: اختر تفصيل طريقة التسجيل.`;
  }
  for(const [i,x] of EDIT.cards.entries()){
    if(!x.club) return `البطاقة ${i+1}: اختر النادي.`;
    if(!x.type) return `البطاقة ${i+1}: اختر النوع.`;
  }
  for(const [i,x] of EDIT.pens.entries()){
    if(!x.by) return `ركلة الجزاء ${i+1}: اختر الفريق المنفّذ.`;
    if(!x.res) return `ركلة الجزاء ${i+1}: اختر النتيجة.`;
  }
  return "";
}

function removeMatchByKey(key){
  const old=(ALL.matches||[]).find(m=>mkey(m)===key);
  if(!old) return;
  const pair=(a,b)=>(a===old.home&&b===old.away)||(a===old.away&&b===old.home);
  ALL.matches = ALL.matches.filter(m=>mkey(m)!==key);
  ALL.goals   = ALL.goals.filter(g=>!(g.r===old.round && compOf(g)===compOf(old) && pair(g.sc,g.cd)));
  ALL.cards   = (ALL.cards||[]).filter(x=>!(x.r===old.round && compOf(x)===compOf(old) && (x.club===old.home||x.club===old.away)));
  ALL.pens    = (ALL.pens||[]).filter(x=>!(x.r===old.round && compOf(x)===compOf(old) && pair(x.by,x.vs)));
}

async function saveMatch(){
  FORMERR = validateEdit();
  if(FORMERR){ renderMatchAdmin(); return; }
  const m=EDIT.match, round=+m.round;
  if(EDIT.orig) removeMatchByKey(EDIT.orig);
  const other = t => t===m.home ? m.away : m.home;
  ALL.matches.push({n:ALL.matches.length+1, round, comp:m.comp, date:m.date, time:m.time,
                    venue:m.venue, home:m.home, away:m.away, hg:0, ag:0});
  EDIT.goals.forEach(g=>ALL.goals.push({r:round, comp:m.comp, sc:g.sc, cd:other(g.sc), p:g.p, a:g.a||"",
      m:+g.m, x:+g.x||0, cat:catOf(g.det), det:g.det, bp:g.bp||"", zone:g.zone||""}));
  EDIT.cards.forEach(x=>ALL.cards.push({r:round, comp:m.comp, club:x.club, p:x.p, m:+x.m||0, type:x.type}));
  EDIT.pens.forEach(x=>ALL.pens.push({r:round, comp:m.comp, by:x.by, vs:other(x.by), p:x.p,
      m:+x.m||0, res:x.res, place:x.place||""}));
  /* النتيجة تُشتق من الأهداف */
  ALL.matches.forEach(mm=>{
    mm.hg = ALL.goals.filter(g=>g.r===mm.round && compOf(g)===compOf(mm) && g.sc===mm.home && g.cd===mm.away).length;
    mm.ag = ALL.goals.filter(g=>g.r===mm.round && compOf(g)===compOf(mm) && g.sc===mm.away && g.cd===mm.home).length;
  });
  ALL.matches.sort((a,b)=>(a.round-b.round)||String(a.date).localeCompare(String(b.date)));
  ALL.matches.forEach((mm,i)=>mm.n=i+1);
  stampComp(ALL);
  const have=compsPresent(); if(!have.includes(COMP)) COMP=have[0]||"الدوري";
  applyComp(); DATA_SOURCE="إدخال يدوي في الموقع"; DATA_UPDATED=new Date().toISOString();
  DATA_BY=(FBUSER&&FBUSER.email)||"";
  EDIT=null; FORMERR="";
  toast("جارٍ حفظ المباراة…","busy",true);
  const okm = await persistData();
  if(okm===true){ LASTSYNC=new Date(); toast(`حُفظت المباراة: ${m.home} ضد ${m.away} ✅`,"ok"); }
  else if(okm==="pending") toast(SYNCMSG,"busy");
  else toast(SYNCMSG||"حُفظت محلياً، لكن تعذّر الحفظ في السحابة","err");
  paintRail(); renderAll(); renderMatchAdmin(); flushRemote();
}

function rr(ctx,x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function cardData(mode, club){
  const T=standings(), tg=GOALS.length, pl=playedMatches().length;
  if(mode==="club"){
    const st=clubStats(club), r=st.row, pos=T.findIndex(x=>x.c===club)+1;
    const L={w:"ف",d:"ت",l:"خ"};
    return {title:club, sub:`الجولة ${Math.max(...MATCHES.map(m=>m.round))} · ${SEASON}`, rows:[
      ["المركز", String(pos)],
      ["النقاط", String(r.Pts)],
      ["سجّل / استقبل", `${r.GF} - ${r.GA}`],
      ["الفورمة", r.form.slice(-5).reverse().map(x=>L[x]).join(" ") || "—"],
      ["الهدّاف", st.top?`${st.top.n} (${st.top.g})`:"—"],
      ["نصيب الكرات الثابتة", r.GF?`${pct(st.sp,r.GF)}%`:"—"]
    ]};
  }
  const sp=GOALS.filter(g=>g.cat==="كرات ثابتة").length;
  const second=GOALS.filter(g=>["46-60","61-75","76-90","90+"].includes(period(g))).length;
  const top=scorers()[0];
  const fg=firstGoals().filter(x=>x.first);
  return {title:"ملخص الدوري", sub:`الجولة ${Math.max(...MATCHES.map(m=>m.round))} · ${SEASON}`, rows:[
    ["إجمالي الأهداف", `${tg} في ${mw(pl)}`],
    ["معدل أهداف المباراة", pl?(tg/pl).toFixed(2):"—"],
    ["المتصدر", `${T[0].c} (${T[0].Pts})`],
    ["الهدّاف", top?`${top.n} (${top.g})`:"—"],
    ["نصيب الكرات الثابتة", `${pct(sp,tg)}%`],
    ["نصيب الشوط الثاني", `${pct(second,tg)}%`],
    ["فوز صاحب الهدف الأول", `${pct(fg.filter(x=>x.res==="فوز").length,fg.length)}%`]
  ]};
}

async function exportImage(mode, club){
  const S=1080, c=document.createElement("canvas"); c.width=S; c.height=S;
  const x=c.getContext("2d");
  try{ await document.fonts.ready; }catch(e){}
  const F=(w,sz)=>`${w} ${sz}px "IBM Plex Sans Arabic", system-ui, sans-serif`;

  const bg=x.createLinearGradient(0,0,S,S);
  bg.addColorStop(0,"#0E2B52"); bg.addColorStop(.55,"#0A2242"); bg.addColorStop(1,"#061529");
  x.fillStyle=bg; x.fillRect(0,0,S,S);
  const glow=x.createRadialGradient(S*.85,S*.08,20,S*.85,S*.08,S*.7);
  glow.addColorStop(0,"rgba(95,178,232,.20)"); glow.addColorStop(1,"rgba(95,178,232,0)");
  x.fillStyle=glow; x.fillRect(0,0,S,S);

  x.direction="rtl"; x.textAlign="right";
  const D=cardData(mode,club);

  /* الشعار أعلى اليسار */
  const img=new Image();
  await new Promise(res=>{ img.onload=res; img.onerror=res; img.src=BRAND; });
  if(img.width){ const lw=190, lh=lw*img.height/img.width; x.globalAlpha=1; x.drawImage(img,72,64,lw,lh); }

  /* العنوان */
  x.fillStyle="#5FB2E8"; x.font=F(600,30); x.fillText(D.sub, S-72, 106);
  x.fillStyle="#FFFFFF"; x.font=F(700,64); x.fillText(D.title, S-72, 178);

  /* شريط الدقائق */
  const rw=(S-144)/16;
  PERIODS.forEach((pp,i)=>{ const n=GOALS.filter(g=>period(g)===pp).length;
    x.fillStyle = n>2?"#E9B949" : n>0?"#5FB2E8" : "rgba(143,166,196,.25)";
    rr(x,72+i*2*rw,214,rw*2-8,7,4); x.fill(); });

  /* لوحة الأرقام */
  const py=268, ph=S-py-190;
  x.fillStyle="rgba(14,43,82,.72)"; rr(x,72,py,S-144,ph,26); x.fill();
  x.strokeStyle="rgba(143,166,196,.28)"; x.lineWidth=2; x.stroke();

  const n=D.rows.length, step=ph/n;
  D.rows.forEach((row,i)=>{
    const y=py+step*(i+.5);
    x.fillStyle="#A9D8F5"; x.font=F(500,30); x.fillText(row[0], S-112, y-4);
    x.textAlign="left";
    x.fillStyle="#FFFFFF"; x.font=F(700,42); x.fillText(row[1], 112, y+4);
    x.textAlign="right";
    if(i<n-1){ x.strokeStyle="rgba(143,166,196,.16)"; x.lineWidth=1;
      x.beginPath(); x.moveTo(112,py+step*(i+1)); x.lineTo(S-112,py+step*(i+1)); x.stroke(); }
  });

  /* التذييل: الحقوق */
  x.fillStyle="#8FA6C4"; x.font=F(400,26);
  x.fillText("المصدر: رصد يدوي ✅ · " + LASTUPDATE, S-72, S-96);
  x.textAlign="left"; x.direction="ltr";
  x.fillStyle="#E9B949"; x.font=F(600,30); x.fillText(HANDLES, 72, S-96);
  x.fillStyle="rgba(143,166,196,.75)"; x.font=F(400,24); x.fillText("© "+OWNER, 72, S-56);

  const name = (mode==="club" ? club : "ملخص-الدوري") + "-الجولة-" + Math.max(...MATCHES.map(m=>m.round)) + ".png";
  c.toBlob(b=>{ const u=URL.createObjectURL(b); const a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); }, "image/png");
}

const AR_DOW=["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];  /* getDay(): 0=الأحد */
const AR_MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

function calMonth(){
  const dates=MATCHES.map(m=>m.date).filter(Boolean).sort();
  return CALM || (dates.length ? dates[dates.length-1].slice(0,7) : new Date().toISOString().slice(0,7));
}
function calendarBar(){
  const base=calMonth();
  const [Y,Mo]=base.split("-").map(Number);
  const days=new Date(Y,Mo,0).getDate();
  const counts={}, soonDays={};
  MATCHES.forEach(m=>{ if(m.date && m.date.startsWith(base)){
    counts[m.date]=(counts[m.date]||0)+1;
    if(isUpcoming(m)) soonDays[m.date]=(soonDays[m.date]||0)+1; } });
  const lead=new Date(Y,Mo-1,1).getDay();          /* 0 = الأحد */
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="cday blank"></div>');
  for(let d=1; d<=days; d++){
    const iso=`${Y}-${String(Mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n=counts[iso]||0;
    const sn=soonDays[iso]||0;
    cells.push(`<button class="cday ${n?(sn===n?"has soon":"has"):"off"}" data-day="${iso}" ${n?"":"disabled"} aria-pressed="${SELDAY===iso}">
      <div class="dn">${d}</div><div class="dd${sn?" g":""}">${n?"●".repeat(Math.min(n,3)):""}</div></button>`);
  }
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  return `<div class="calbar">
    <div class="calhead"><b>${AR_MON[Mo-1]} ${Y}</b>
      <div class="calnav">
        <button data-cal="1" title="الشهر التالي">›</button>
        <button data-cal="-1" title="الشهر السابق">‹</button>

      </div></div>
    <div class="caldow">${AR_DOW.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="caldays">${cells.join("")}</div>
    <p class="hint" style="margin:8px 0 0">${total?`${mw(total)} في هذا الشهر — اضغط أي يوم مضيء لعرض مبارياته.${Object.keys(soonDays).length?" الأيام الذهبية مبارياتها لم تبدأ بعد.":""}`:"لا مباريات في هذا الشهر."}</p>
  </div>`;
}

  if(isNaN(d.getTime())) return esc(dstr||"");

}
function countdown(ts){
  const ms = ts - Date.now();
  if(ms<=0) return "";
  const mins=Math.floor(ms/60000), hrs=Math.floor(mins/60), days=Math.floor(hrs/24);
  if(days>=1) return days===1?"بعد يوم واحد":days===2?"بعد يومين":days<=10?`بعد ${days} أيام`:`بعد ${days} يوماً`;
  if(hrs>=1)  return hrs===1?"بعد ساعة":hrs===2?"بعد ساعتين":`بعد ${hrs} ساعات`;
  return mins<=1?"بعد دقيقة":`بعد ${mins} دقيقة`;
}

function wireSquads(){
  const sqb=$("#saveSquads"); if(!sqb) return;
  sqb.onclick=async()=>{
    document.querySelectorAll("[data-squad]").forEach(t=>{
      const seen=new Set(), names=[];
      t.value.split("\n").map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean)
        .forEach(n=>{ if(!seen.has(n)){ seen.add(n); names.push(n); } });
      if(names.length) SQUADS[t.dataset.squad]=names; else delete SQUADS[t.dataset.squad];
    });
    busy(sqb,true,"جارٍ الحفظ…");
    const ok=await persistData();
    busy(sqb,false);
    if(ok===true){ LASTSYNC=new Date(); toast(`حُفظت الكشوفات · ${squadTotal()} لاعباً ✅`,"ok"); }
    else if(ok==="pending") toast(SYNCMSG,"busy");
    else toast(SYNCMSG||"حُفظت محلياً، وتعذّر رفعها للسحابة","err");
    renderAdmin();
  };
}
async function saveStaff(btn, msg){
  if(btn) busy(btn,true,"جارٍ الحفظ…");
  const ok=await fbSaveStaff();
  if(btn) busy(btn,false);
  toast(ok===true?msg:(SYNCMSG||"تعذّر الحفظ"), ok===true?"ok":"err");
  renderAdmin();
}
function wireFanList(){
  document.querySelectorAll("[data-fan]").forEach(b=>b.onclick=async()=>{
    busy(b,true,"…");
    const ok=await toggleFan(b.dataset.fan);
    busy(b,false);
    toast(ok?"حُدّث الجدول ✅":"تعذّر التحديث", ok?"ok":"err");
    if(ok) renderAdmin();
  });
}
function wireStaff(){
  const add=$("#addStaff");
  if(add) add.onclick=async()=>{
    const name=($("#stName").value||"").trim();
    const mail=($("#stMail").value||"").trim();
    const uid =($("#stUid").value||"").trim();
    if(!uid){ toast("الصق رمز الحساب (UID)","err"); return; }
    if(uid===ADMIN_UID){ toast("هذا حسابك أنت — المالك مضاف أصلاً","err"); return; }
    if(STAFF[uid]){ toast("هذا العضو مضاف مسبقاً","err"); return; }
    STAFF[uid]={name, email:mail, role:"editor", active:true};
    await saveStaff(add, `أُضيف ${name||"العضو"} كمحرّر ✅`);
  };
  document.querySelectorAll("[data-staff-toggle]").forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.staffToggle, m=STAFF[uid]; if(!m) return;
    m.active = m.active===false;
    await saveStaff(b, m.active?"فُعّل الحساب ✅":"أُوقف الحساب");
  });
  document.querySelectorAll("[data-staff-rm]").forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.staffRm;
    if(!confirm(`حذف ${STAFF[uid]?.name||"هذا العضو"} من فريق العمل؟`)) return;
    delete STAFF[uid];
    await saveStaff(b, "حُذف العضو");
  });
}

/* ================= التخزين ================= */
function localSet(k,v){
  try{ if(window.storage&&window.storage.set) return window.storage.set(k,v); }catch(e){}
  try{ localStorage.setItem(k,v); }catch(e){}
  return null;
}
async function localGet(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value) return r.value; } }catch(e){}
  try{ return localStorage.getItem(k); }catch(e){}
  return null;
}
async function persist(){
  await localSet("zain_admin", JSON.stringify({...assetsObject(), LASTUPDATE}));
  return await fbSaveAssets();
}
async function restore(){
  try{
    const v=await localGet("zain_admin");
    if(v){ const d=JSON.parse(v); applyAssets(d); if(d.LASTUPDATE) LASTUPDATE=d.LASTUPDATE; }
  }catch(e){}
}

/* ================================================================
   تحدي التوقعات — تسجيل الجمهور، التوقعات، جداول الترتيب
   الاحتساب يتم من متصفح المالك (لا تتوفر Cloud Functions على Spark)
   ================================================================ */
const PT_EXACT = 5, PT_RIGHT = 2, PT_SCORER = 3;
let FAN = null;        /* {uid,name,email} المشترك العام */
let MYPRED = null;     /* توقعات المشترك للجولة المفتوحة */

let BOARDTAB = "season";
let SCCLUB = "";        /* نادي الهداف المختار في نموذج التوقعات */
let AUTHTAB = "name";   /* name | mail */
let AUTHMODE = "in";    /* in | up */

const roundKey = r => seasonId() + "_" + r;
const isAnonFan = () => !!(fbAuth && fbAuth.currentUser && fbAuth.currentUser.isAnonymous);
const monthOf  = d => String(d||"").slice(0,7);

/* الجولة المفتوحة للتوقع: أقرب جولة فيها مباريات لم تُلعب بعد */
function openRound(){
  const up = MATCHES.filter(isUpcoming).filter(m=>kickoffTS(m)!==null);
  if(!up.length) return null;
  const r = Math.min(...up.map(m=>+m.round||0));
  const ms = MATCHES.filter(m=>(+m.round||0)===r)
    .sort((a,b)=>(kickoffTS(a) ?? Infinity) - (kickoffTS(b) ?? Infinity));
  const first = ms.find(m=>kickoffTS(m)!==null);
  return {round:r, matches:ms, lockMatch:first||null,
          lockAt:first?kickoffTS(first):null, month:monthOf(first?first.date:"")};
}
/* الجولة المعروضة للتوقع: ما فتحه المالك يدوياً، وإلا الجولة القادمة تلقائياً */
function predRound(){
  if(ROUNDMETA && ROUNDMETA.open){
    const ms = MATCHES.filter(m=>(+m.round||0)===+ROUNDMETA.round)
      .sort((a,b)=>(kickoffTS(a) ?? Infinity)-(kickoffTS(b) ?? Infinity));
    if(ms.length) return {round:+ROUNDMETA.round, matches:ms, lockMatch:ms[0],
                          lockAt:ROUNDMETA.lockAt, month:ROUNDMETA.month||monthOf(ms[0].date),
                          manual:true};
  }
  if(ROUNDMETA && ROUNDMETA.open===false) return null;   /* أُغلقت يدوياً */
  return openRound();
}
const isLocked = o => !o || o.lockAt===null || Date.now() >= o.lockAt;

async function loadRoundMeta(){
  if(!fbDb) return;
  try{
    const cur = await fbDb.collection("rounds").doc("current").get();
    if(!cur.exists){ ROUNDMETA=null; return; }
    const rk = cur.data().rk;
    const d = await fbDb.collection("rounds").doc(rk).get();
    if(!d.exists){ ROUNDMETA=null; return; }
    const v = d.data();
    ROUNDMETA = {round:v.round, month:v.month, open:v.open!==false,
                 lockAt: v.lockAt && v.lockAt.toMillis ? v.lockAt.toMillis() : null};
  }catch(e){ ROUNDMETA=null; }
}

/* ===== الحساب العام ===== */
function authErr(e){
  const c = (e && e.code) || "";
  if(c==="auth/invalid-email") return "صيغة البريد غير صحيحة";
  if(c==="auth/missing-password" || c==="auth/weak-password") return "كلمة المرور قصيرة — ٦ أحرف على الأقل";
  if(c==="auth/email-already-in-use") return "هذا البريد مسجّل مسبقاً — سجّل الدخول بدل إنشاء حساب";
  if(c==="auth/invalid-credential" || c==="auth/wrong-password") return "البريد أو كلمة المرور غير صحيحة";
  if(c==="auth/network-request-failed") return "تعذّر الاتصال — تحقق من الشبكة";
  if(c==="auth/operation-not-allowed") return "طريقة الدخول غير مفعّلة — فعّلها من Authentication ← Sign-in method";
  return "تعذّر الدخول: " + (c || "خطأ غير معروف");
}

      ? "الدخول بالاسم غير مفعّل — فعّل Anonymous من إعدادات Authentication"
      : authErr(e), "err");

async function loadBoard(){

function boardRows(mode, key){
  const rows = BOARD && BOARD.rows ? BOARD.rows : {};
  const live = Object.entries(rows).filter(([,r])=>!r.h);
  /* اسم متكرر؟ نلحق به آخر أربعة أحرف من المعرّف حتى يميّز المشترك نفسه سطره */
  const seen = {};
  live.forEach(([,r])=>{ const n=r.n||"مشترك"; seen[n]=(seen[n]||0)+1; });
  return live.map(([uid,r])=>{
    const n = r.n||"مشترك";
    return {
      uid,
      name: seen[n]>1 ? n+" · "+uid.slice(-4) : n,
      pts: mode==="season" ? (r.t||0) : mode==="round" ? ((r.r||{})[key]||0) : ((r.m||{})[key]||0)
    };
  }).sort((a,b)=> b.pts-a.pts || a.name.localeCompare(b.name,"ar"));
}
