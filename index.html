/* فتح أو إغلاق جولة التوقعات — قواعد الأمان تمنع أي توقع خارج هذه الحدود */
async function publishRound(round, lockMs, open){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const r = +round;
  if(!r) return {ok:false, msg:"اختر الجولة"};
  if(open && !lockMs) return {ok:false, msg:"حدد تاريخ ووقت الإقفال"};
  const ms = MATCHES.filter(m=>(+m.round||0)===r);
  const month = ms.length ? monthOf(ms.sort((a,b)=>(kickoffTS(a)??Infinity)-(kickoffTS(b)??Infinity))[0].date) : "";
  const rk = roundKey(r);
  try{
    await fbDb.collection("rounds").doc(rk).set({
      round:r, month, open:!!open,
      lockAt: firebase.firestore.Timestamp.fromDate(new Date(lockMs || Date.now())),
      lockLabel: new Date(lockMs || Date.now()).toISOString()
    });
    await fbDb.collection("rounds").doc("current").set({rk, round:r, open:!!open});
    ROUNDMETA = {round:r, month, open:!!open, lockAt: lockMs || Date.now()};
    return {ok:true, msg: open ? `فُتحت توقعات الجولة ${r} حتى ${stampLabel(lockMs)}`
                               : `أُغلقت توقعات الجولة ${r}`};
  }catch(e){ return {ok:false, msg:"تعذّر الحفظ — تأكد أن قواعد الأمان منشورة"}; }
}

/* احتساب جولة — يشغّله المالك بعد إدخال النتائج */
async function scoreRound(r){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const ms = MATCHES.filter(m=>(+m.round||0)===+r && !isUpcoming(m));
  if(!ms.length) return {ok:false, msg:"لا توجد نتائج مسجّلة لهذه الجولة"};
  const key = m => m.home+"|"+m.away;
  const actual = {}; ms.forEach(m=>actual[key(m)] = [+m.hg||0, +m.ag||0]);
  const month = monthOf(ms[0].date);
  const scorers = new Set(GOALS.filter(g=>(+g.r||0)===+r).map(g=>g.p));

  let snap;
  try{ snap = await fbDb.collection("preds").where("rk","==",roundKey(r)).get(); }
  catch(e){ return {ok:false, msg:"تعذّرت قراءة التوقعات"}; }

  const rows = (BOARD && BOARD.rows) ? JSON.parse(JSON.stringify(BOARD.rows)) : {};
  let n = 0;
  snap.forEach(doc=>{
    const p = doc.data(); if(!p || !p.uid) return;
    let pts = 0;
    Object.entries(p.picks||{}).forEach(([k,v])=>{
      const a = actual[k]; if(!a) return;
      const ph=+v[0]||0, pa=+v[1]||0;
      if(ph===a[0] && pa===a[1]) pts += PT_EXACT;
      else if(Math.sign(ph-pa) === Math.sign(a[0]-a[1])) pts += PT_RIGHT;
    });
    if(p.scorer && scorers.has(p.scorer)) pts += PT_SCORER;
    const row = rows[p.uid] || {n:p.name||"مشترك", t:0, r:{}, m:{}};
    row.n = p.name || row.n;
    const prev = (row.r||{})[r] || 0;      /* إعادة الاحتساب لا تُضاعف النقاط */
    row.r = row.r || {}; row.m = row.m || {};
    row.r[r] = pts;
    row.m[month] = Math.max(0, (row.m[month]||0) - prev + pts);
    row.t = Math.max(0, (row.t||0) - prev + pts);
    rows[p.uid] = row; n++;
  });

  const body = {rows, lastRound:+r, lastMonth:month, updated:new Date().toISOString()};
  try{ await fbDb.collection("boards").doc(seasonId()).set(body); }
  catch(e){ return {ok:false, msg:"تعذّر حفظ جدول الترتيب"}; }
  BOARD = body;
  return {ok:true, msg:`احتُسبت الجولة ${r} لـ ${n} مشتركاً`};
}

function fanListHTML(q){
  const rows = Object.entries((BOARD&&BOARD.rows)||{})
    .filter(([,r])=>!q || String(r.n||"").includes(q))
    .sort((a,b)=>(b[1].t||0)-(a[1].t||0)).slice(0,30);
  if(!rows.length) return `<span style="color:var(--slate);font-size:.78rem">لا نتائج.</span>`;
  return rows.map(([uid,r])=>`<div class="staffrow">
      <div class="sm"><b>${esc(r.n||"مشترك")}${r.h?' <span class="cnt off">مخفي</span>':""}</b>
        <span style="direction:rtl">${r.t||0} نقطة</span>
        <code>${esc(uid)}</code></div>
      <button data-fan="${esc(uid)}">${r.h?"إظهار":"إخفاء"}</button>
    </div>`).join("");
}

/* ===== واجهة التبويب ===== */
function renderPredict(){
  const box = $("#v-predict");
  const o = predRound(), locked = isLocked(o);

  if(!FAN){ box.innerHTML = authCard(); wireAuth(); return; }

  const picks = (MYPRED && MYPRED.picks) || {};
  const myRank = BOARD ? boardRows("season").findIndex(x=>x.uid===FAN.uid) + 1 : 0;

  box.innerHTML = `
    <div class="fanbar">
      <div class="fi">
        <b>${esc(FAN.name)}</b>
        <span>${myRank ? "ترتيبك في الموسم: "+myRank : "لم تُحتسب لك نقاط بعد"}</span>
      </div>
      <button class="lnk" id="editName">تغيير الاسم</button>
      <button class="lnk" id="fanOut">خروج</button>
    </div>
    ${isAnonFan() ? `<div class="anonbar">
      نقاطك محفوظة على هذا المتصفح فقط — أضف بريداً لتدخل بها من أي جهاز.
      <button class="lnk" id="linkM">أضف بريداً</button>
    </div>` : ""}

    <h2 class="sec">${o ? `توقعات الجولة ${o.round}` : "التوقعات"}</h2>
    ${!o ? `<div class="card pad" style="color:var(--slate);text-align:center">لا توجد جولة مفتوحة للتوقع حالياً.</div>` : `
      <p class="hint">${locked
        ? "أُقفلت هذه الجولة ببداية أول مباراة. هذي توقعاتك المسجّلة."
        : `نتيجة مطابقة ${PT_EXACT} نقاط · اتجاه صحيح نقطتان · هداف الجولة ${PT_SCORER} نقاط. تُقفل التوقعات مع صافرة أول مباراة.`}</p>
      ${o.lockAt && !locked ? `<div class="lockbar">تُقفل ${esc(stampLabel(o.lockAt))}${
        o.lockMatch?` — مع انطلاق ${esc(o.lockMatch.home)} ضد ${esc(o.lockMatch.away)}`:""}</div>` : ""}

      ${o.matches.map((m,i)=>{
        const k = m.home+"|"+m.away, v = picks[k] || [0,0];
        return `<div class="pm">
          <span class="tm">${esc(m.home)}</span>
          <div class="stp">
            <button data-pk="${esc(k)}" data-side="0" data-d="1" ${locked?"disabled":""}>+</button>
            <span class="val" data-v="${esc(k)}|0">${v[0]}</span>
            <button data-pk="${esc(k)}" data-side="0" data-d="-1" ${locked?"disabled":""}>−</button>
          </div>
          <span class="dsh">−</span>
          <div class="stp">
            <button data-pk="${esc(k)}" data-side="1" data-d="1" ${locked?"disabled":""}>+</button>
            <span class="val" data-v="${esc(k)}|1">${v[1]}</span>
            <button data-pk="${esc(k)}" data-side="1" data-d="-1" ${locked?"disabled":""}>−</button>
          </div>
          <span class="tm a">${esc(m.away)}</span>
        </div>`;
      }).join("")}

      ${(()=>{
        const clubs=[...new Set(o.matches.flatMap(m=>[m.home,m.away]))].filter(Boolean)
          .sort((a,b)=>String(a).localeCompare(String(b),"ar"));
        const sel = SCCLUB || (MYPRED&&MYPRED.scorerClub) || "";
        return `<h2 class="sec" style="font-size:.92rem">هداف الجولة</h2>
        <p class="hint">اختر النادي أولاً، وتظهر لك قائمة لاعبيه.</p>
        <div class="fgrid">
          <div class="fld"><label>النادي</label>
            <select id="scClub" ${locked?"disabled":""}>
              <option value="">— اختر النادي —</option>
              ${clubs.map(c=>`<option value="${esc(c)}" ${sel===c?"selected":""}>${esc(c)}</option>`).join("")}
            </select></div>
          <div class="fld"><label>اللاعب</label>
            <select id="predScorer" ${locked||!sel?"disabled":""}>${scorerOptions(sel)}</select></div>
        </div>`;
      })()}

      ${locked ? "" : `<div style="height:12px"></div>
        <button class="btn" id="sendPred" style="width:100%">${MYPRED?"تحديث توقعاتي":"أرسل توقعاتي"}</button>`}
    `}

    <h2 class="sec">ترتيب الجمهور</h2>
    ${boardBlock()}`;

  wirePredict(o, locked);
}

function scorerOptions(club){
  if(!club) return `<option value="">— اختر النادي أولاً —</option>`;
  const ns = playersOf(club);
  if(!ns.length) return `<option value="">— لا كشف لهذا النادي بعد —</option>`;
  const cur = (MYPRED&&MYPRED.scorer)||"";
  return `<option value="">— اختر اللاعب —</option>` +
    ns.map(n=>`<option value="${esc(n)}" ${cur===n?"selected":""}>${esc(n)}</option>`).join("");
}
function allSquadNames(){
  const s = new Set();
  Object.values(SQUADS).forEach(a=>(a||[]).forEach(n=>s.add(n)));
  GOALS.forEach(g=>{ if(g.p) s.add(g.p); if(g.a) s.add(g.a); });
  return [...s].sort((a,b)=>String(a).localeCompare(String(b),"ar"));
}

function authCard(){
  const mail = AUTHTAB==="mail", up = AUTHMODE==="up";
  return `
    <h2 class="sec">تحدي التوقعات</h2>
    <p class="hint">توقّع نتائج الجولة قبل انطلاقها ونافس بقية الجمهور. نتيجة مطابقة ${PT_EXACT} نقاط، اتجاه صحيح نقطتان، وهداف الجولة ${PT_SCORER} نقاط.</p>
    <div class="card pad">
      <div class="bchips" style="margin-bottom:12px">
        <button class="chip ${mail?"":"on"}" data-at="name">بالاسم فقط</button>
        <button class="chip ${mail?"on":""}" data-at="mail">ببريد إلكتروني</button>
      </div>

      ${mail?`
        ${up?`<div class="fld"><label>الاسم الظاهر في جدول الترتيب</label>
          <input type="text" id="auName" maxlength="24" placeholder="مثال: أبو فهد"></div>`:""}
        <div class="fld"><label>البريد الإلكتروني</label><input type="email" id="auMail" dir="ltr" autocomplete="email"></div>
        <div class="fld"><label>كلمة المرور</label><input type="password" id="auPass" dir="ltr"></div>
        <div style="height:10px"></div>
        <button class="btn" id="auGo" style="width:100%">${up?"إنشاء حساب":"دخول"}</button>
        <p class="hint" style="margin:12px 0 0;text-align:center">
          ${up?"عندك حساب؟":"ما عندك حساب؟"}
          <button class="lnk" id="auSwap">${up?"سجّل الدخول":"أنشئ حساباً"}</button></p>
        <p class="hint" style="margin:8px 0 0">تدخل بنقاطك من أي جهاز، ويشتغل في كل المتصفحات.</p>
      `:`
        <div class="fld"><label>الاسم الظاهر في جدول الترتيب</label>
          <input type="text" id="nmOnly" maxlength="24" placeholder="مثال: أبو فهد"></div>
        <div style="height:10px"></div>
        <button class="btn" id="nmGo" style="width:100%">ادخل بالاسم</button>
        <p class="hint" style="margin:12px 0 0">أسرع طريقة، بلا بريد ولا كلمة مرور. نقاطك تبقى على هذا المتصفح فقط — وتقدر تضيف بريداً لاحقاً وتحتفظ بها كاملة.</p>
      `}
    </div>`;
}

function boardBlock(){
  if(!BOARD || !BOARD.rows || !Object.keys(BOARD.rows).length)
    return `<div class="card pad" style="color:var(--slate);text-align:center">
      لم يُحتسب أي ترتيب بعد. يظهر الجدول بعد انتهاء أول جولة.</div>`;

  const lastR = BOARD.lastRound, lastM = BOARD.lastMonth;
  const months = [...new Set(Object.values(BOARD.rows).flatMap(r=>Object.keys(r.m||{})))].sort();
  const key = BOARDTAB==="round" ? lastR : BOARDTAB==="month" ? (lastM||months[months.length-1]) : null;
  const rows = boardRows(BOARDTAB, key).filter(r=>BOARDTAB==="season" || r.pts>0).slice(0,50);

  return `
    <div class="bchips">
      <button class="chip ${BOARDTAB==="season"?"on":""}" data-bt="season">الموسم</button>
      <button class="chip ${BOARDTAB==="round"?"on":""}" data-bt="round">الجولة ${lastR||""}</button>
      <button class="chip ${BOARDTAB==="month"?"on":""}" data-bt="month">${key&&BOARDTAB==="month"?esc(monthName(key)):"الشهر"}</button>
    </div>
    <div class="card">
      <table class="lb">
        <thead><tr><th style="width:44px">#</th><th>المشترك</th><th style="width:64px">النقاط</th></tr></thead>
        <tbody>${rows.length?rows.map((r,i)=>`<tr class="${FAN&&r.uid===FAN.uid?"me":""}">
          <td class="rk ${i<3?"top":""}">${i+1}</td>
          <td>${esc(r.name)}</td>
          <td class="pt">${r.pts}</td>
        </tr>`).join(""):`<tr><td colspan="3" style="color:var(--slate);text-align:center">لا نقاط في هذه الفترة.</td></tr>`}</tbody>
      </table>
    </div>`;
}
const AR_MONTHS_LB = {"01":"يناير","02":"فبراير","03":"مارس","04":"أبريل","05":"مايو","06":"يونيو",
  "07":"يوليو","08":"أغسطس","09":"سبتمبر","10":"أكتوبر","11":"نوفمبر","12":"ديسمبر"};
const monthName = k => (AR_MONTHS_LB[String(k).slice(5,7)]||"") + " " + String(k).slice(0,4);

/* ===== الربط ===== */
function wireAuth(){
  document.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{ AUTHTAB=b.dataset.at; renderPredict(); });
  const sw=$("#auSwap"); if(sw) sw.onclick=()=>{ AUTHMODE = AUTHMODE==="up"?"in":"up"; renderPredict(); };
  const nm=$("#nmGo");
  if(nm) nm.onclick=async()=>{
    const v=($("#nmOnly").value||"").trim().replace(/\s+/g," ");
    if(v.length<2){ toast("اكتب اسماً من حرفين فأكثر","err"); return; }
    busy(nm,true,"لحظة…"); await fanSignInName(v.slice(0,24)); busy(nm,false);
  };
  const go=$("#auGo");
  if(go) go.onclick=async()=>{
    const mail=($("#auMail").value||"").trim(), pass=$("#auPass").value||"";
    const name=$("#auName")?($("#auName").value||"").trim():"";
    if(!mail || !pass){ toast("عبّي البريد وكلمة المرور","err"); return; }
    if(AUTHMODE==="up" && name.length<2){ toast("اكتب الاسم الظاهر في الترتيب","err"); return; }
    busy(go,true,"لحظة…"); await fanEmailAuth(mail,pass,name.slice(0,24),AUTHMODE); busy(go,false);
  };
}
function wirePredict(o, locked){
  const out=$("#fanOut"); if(out) out.onclick=()=>fbAuth.signOut();
  const lm=$("#linkM");
  if(lm) lm.onclick=async()=>{
    const em=(prompt("البريد الإلكتروني:")||"").trim(); if(!em) return;
    const pw=(prompt("كلمة مرور جديدة (٦ أحرف فأكثر):")||"").trim(); if(!pw) return;
    await linkToEmail(em, pw);
  };
  const en=$("#editName");
  if(en) en.onclick=async()=>{
    const n=(prompt("الاسم الظاهر في جدول الترتيب:", FAN.name)||"").trim();
    if(!n || n===FAN.name) return;
    toast(await saveFanName(n.slice(0,24)) ? "حُدّث الاسم ✅" : "تعذّر تغيير الاسم","ok");
    renderPredict();
  };
  document.querySelectorAll("[data-bt]").forEach(b=>b.onclick=()=>{ BOARDTAB=b.dataset.bt; renderPredict(); });

  if(!o || locked) return;
  const picks = (MYPRED && MYPRED.picks) || {};
  o.matches.forEach(m=>{ const k=m.home+"|"+m.away; if(!picks[k]) picks[k]=[0,0]; });
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.pk, s=+b.dataset.side, d=+b.dataset.d;
    const cur = picks[k][s] + d;
    if(cur<0 || cur>9) return;
    picks[k][s]=cur;
    const el=document.querySelector(`[data-v="${CSS.escape(k+"|"+s)}"]`);
    if(el) el.textContent=cur;
  });
  const sc=$("#scClub");
  if(sc) sc.onchange=()=>{
    SCCLUB = sc.value;
    const ps=$("#predScorer");
    if(ps){ ps.innerHTML = scorerOptions(SCCLUB); ps.disabled = !SCCLUB; }
  };
  const sp=$("#sendPred");
  if(sp) sp.onclick=async()=>{
    const club = ($("#scClub")&&$("#scClub").value) || "";
    busy(sp,true,"جارٍ الإرسال…");
    const ok = await savePred(picks, $("#predScorer").value, club);
    busy(sp,false);
    if(ok){ toast("سُجّلت توقعاتك ✅","ok"); renderPredict(); }
  };
}


const RENDER={home:renderHome,matches:renderMatches,clubs:renderClubs,players:renderPlayers,predict:renderPredict,analysis:renderAnalysis,admin:renderAdmin};
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute("aria-selected", b.dataset.v===v));
  RENDER[v]();
  window.scrollTo({top:0,behavior:"instant"});
}
function renderAll(){ renderHome(); renderMatches(); if($("#clubSel")) renderClubs(); renderPlayers(); }

function paintFoot(){

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#adminBtn").onclick=()=>go("admin");

/* شريط الدقائق في الترويسة */
function paintRail(){
  $("#rail").innerHTML = Array.from({length:16},(_,i)=>{
    const p=PERIODS[Math.floor(i/2)]; const n=GOALS.filter(g=>period(g)===p).length;
    return `<i class="${n>2?"b":n>0?"a":""}"></i>`;
  }).join("");
}
$("#seasonLbl").textContent = SEASON;

/* الإقلاع: ملف data.json المنشور بجوار الصفحة يفوز إن كان أحدث من النسخة المحفوظة محلياً */
async function bootData(){
  const cands=[];
  const cloud = await fbLoad(seasonId());
  if(cloud && cloud.clubs && cloud.matches) cands.push([cloud,"السحابة (Firestore)"]);
  try{ const v=await localGet("zain_data"); if(v){
    const d=JSON.parse(v); if(d.clubs&&d.matches) cands.push([d,"نسخة محلية محفوظة"]); } }catch(e){}
  try{
    const res=await fetch("./data.json",{cache:"no-store"});
    if(res.ok){ const d=await res.json(); if(d.clubs&&d.goals&&d.matches) cands.push([d,"data.json المنشور"]); }
  }catch(e){}
  if(!cands.length) return;
  /* السحابة هي المرجع متى ما وُجدت — ساعات الأجهزة تختلف فلا يُعتمد على الطابع الزمني */
  const pick = cands.find(c=>c[1]==="السحابة (Firestore)")
            || cands.sort((a,b)=> new Date(b[0].updated||0) - new Date(a[0].updated||0))[0];
  LASTSTAMP=(pick[0].updated||"")+"|"+(pick[0].updatedBy||"");
  applyData(pick[0], pick[1]);
}
(async()=>{
  fbInit();
  await bootAssets();
  ALL = stampComp({matches:MATCHES, goals:GOALS, pens:PENS, cards:CARDS});
  applyComp();
  await bootData();
  watchSeason();
  await loadBoard();
  await loadRoundMeta();
  paintRail(); paintHeader(); paintFoot(); go("home");
})();
</script>
