<script>
/* المظهر (فاتح/داكن): يُضبط قبل الرسم حتى لا تومض الصفحة — مفتاح mf_theme */
const THEME={KEY:'mf_theme',
  get(){ try{ const q=new URLSearchParams(location.search).get('theme'); if(q==='dark'||q==='light'){ localStorage.setItem(this.KEY,q); return q; }
      return localStorage.getItem(this.KEY)==='light'?'light':'dark'; }catch(e){ return 'dark'; } },   /* الافتراضي داكن */
  apply(t){ document.documentElement.setAttribute('data-theme',t);
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==='dark' ? '#081527' : '#061529';
    const b=document.getElementById('themeBtn'); if(b){ b.innerHTML = t==='dark' ? THEME.SUN : THEME.MOON; b.title = b.ariaLabel = (t==='dark' ? 'الوضع الفاتح' : 'الوضع الداكن'); } },
  set(t){ try{ localStorage.setItem(this.KEY,t); }catch(e){} this.apply(t); },
  toggle(){ const t=this.get()==='dark'?'light':'dark'; this.set(t); if(typeof toast==='function') toast(t==='dark' ? 'الوضع الداكن' : 'الوضع الفاتح'); },
  MOON:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  SUN:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'};
THEME.apply(THEME.get());
</script>

<style>
:root{
  --ink:#061529; --navy-900:#0A2242; --navy-800:#0E2B52; --navy-600:#17417A;
  --sky:#5FB2E8; --sky-soft:#A9D8F5; --mist:#EDF3FA; --slate:#8FA6C4;
  --win:#35A47C; --draw:#8FA6C4; --loss:#E0644F; --sand:#E9B949;
  --display:'Readex Pro',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--mist);font-family:var(--body);
  font-size:15px;line-height:1.65;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:9px}

/* ---------- الترويسة ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0A2242,rgba(6,21,41,.94));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(143,166,196,.18);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:1rem;color:#fff;white-space:nowrap}
.brand span{font-size:.68rem;color:var(--sky);letter-spacing:.06em}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:rgba(95,178,232,.12);border:1px solid rgba(95,178,232,.28);
  color:var(--sky);font-size:1rem;flex:none;
}
.iconbtn.on{background:var(--sand);border-color:var(--sand);color:#20180a}

/* شريط الدقائق - عنصر الهوية */
.rail{display:flex;gap:2px;height:3px;max-width:1180px;margin:10px auto 0}
.rail i{flex:1;background:rgba(143,166,196,.22);border-radius:9px}
.rail i.a{background:var(--sky)} .rail i.b{background:var(--sand)}

/* ---------- التنقل ---------- */
nav.tabs{
  position:fixed;bottom:0;right:0;left:0;z-index:50;
  background:rgba(10,34,66,.97);backdrop-filter:blur(14px);
  border-top:1px solid rgba(143,166,196,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .in{display:flex;max-width:1180px;margin:0 auto}
nav.tabs button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.62rem;color:var(--slate);border-top:2px solid transparent;transition:color .15s;
  min-height:var(--nav-h);justify-content:center;
}
nav.tabs button .ic{font-size:1.15rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--sky);border-top-color:var(--sky)}

/* ---------- التخطيط ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 14px 28px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--display);font-weight:600;font-size:1.05rem;color:#fff;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec::before{content:"";width:3px;height:16px;background:var(--sky);border-radius:9px}
.hint{font-size:.78rem;color:var(--slate);margin-bottom:12px}

.card{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}

/* ---------- بطاقات المؤشرات ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(160deg,var(--navy-800),var(--navy-900));border:1px solid rgba(143,166,196,.18);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:auto auto 0 0;width:100%;height:2px;background:linear-gradient(90deg,var(--sky),transparent)}
.kpi .k{font-size:.7rem;color:var(--slate)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:.68rem;color:var(--sky)}

/* ---------- الشعار / الرمز ---------- */
.crest{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-family:var(--display);font-weight:700;font-size:.72rem;color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);background:#3B5578;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;transform-origin:center;transition:transform .15s}
.crest.has-logo{box-shadow:inset 0 0 0 1px rgba(143,166,196,.35);padding:2px}
.crest.lg{width:56px;height:56px;font-size:1.1rem;border-radius:14px}
.leaguemark{width:38px;height:38px;flex:none;border-radius:10px;background:#fff;padding:3px;
  object-fit:contain;box-shadow:0 0 0 1px rgba(143,166,196,.25)}

/* ---------- الجداول ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
thead th{background:var(--navy-800);color:var(--sky-soft);font-weight:600;font-size:.68rem;
  letter-spacing:.04em;padding:10px 6px;text-align:center;position:sticky;top:0}
thead th:first-child{text-align:right;padding-right:12px}
tbody td{padding:9px 6px;text-align:center;border-bottom:1px solid rgba(143,166,196,.12);font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:right;padding-right:12px}
tbody tr:nth-child(even){background:rgba(14,43,82,.4)}
tbody tr.top{box-shadow:inset 3px 0 0 var(--sky)}
tbody tr.rel{box-shadow:inset 3px 0 0 rgba(224,100,79,.7)}
.teamcell{display:flex;align-items:center;gap:8px}
.teamcell .pos{color:var(--slate);font-size:.72rem;width:16px;text-align:center;flex:none}
.teamcell b{font-weight:600;white-space:nowrap}
.pillrow{display:flex;gap:3px;justify-content:center}
.pl{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:.62rem;font-weight:700}
.pl.w{background:var(--win);color:#03150e}.pl.d{background:var(--draw);color:#0d1a2b}.pl.l{background:var(--loss);color:#2a0a05}

/* ---------- المباريات ---------- */
.match{border-radius:var(--r);background:var(--navy-900);border:1px solid rgba(143,166,196,.18);margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.mside{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mside.away{flex-direction:row-reverse;text-align:left}
.mside b{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;
  background:var(--navy-800);border-radius:9px;padding:3px 12px;flex:none;letter-spacing:.05em}
.score.soon{font-size:.95rem;color:var(--sand);background:rgba(233,185,73,.12);
  border:1px solid rgba(233,185,73,.35);direction:ltr}
.match.soon{border-color:rgba(233,185,73,.35);background:rgba(14,43,82,.45)}
/* ---- ملاحظة المباراة ---- */
.mnote{margin:0 14px 10px;padding:7px 11px;border-radius:9px;font-size:.78rem;line-height:1.6;
  color:#7A4B00;background:#FFF6E0;border:1px solid rgba(233,185,73,.5)}
.mnote::before{content:"ملاحظة: ";font-weight:700}
/* ---- المناسبات وفترات التوقف ---- */
.evlist{display:grid;gap:7px;margin-top:10px}
.evrow{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;
  background:rgba(95,178,232,.07);border:1px solid rgba(95,178,232,.22)}
.evrow.brk{background:rgba(233,185,73,.1);border-color:rgba(233,185,73,.4)}
/* بلا direction:ltr عمداً: التاريخ عربي مختلط بأرقام، ولو فُرض LTR وقعت
   البداية يساراً فتُقرأ آخراً — «من 6 أكتوبر إلى 21 سبتمبر». */
.ev-d{flex:none;font-size:.7rem;font-weight:700;color:var(--sky,#5FB2E8);min-width:82px;
  text-align:center;padding-top:1px;line-height:1.5}
.evrow.brk .ev-d{color:#B8860B}
.ev-t{flex:1;min-width:0;font-size:.82rem;line-height:1.6;color:var(--head,#0B1F3A)}
.ev-k{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;
  background:rgba(11,31,58,.08);color:var(--slate,#8FA6C4);margin-inline-start:6px}
.ev-n{display:block;font-size:.72rem;color:var(--slate,#8FA6C4);margin-top:2px}
.cday.evd{box-shadow:inset 0 -3px 0 #E9B949}
/* ---- المباريات الجارية على الرئيسية ---- */
.livewrap{background:#fff;border:1px solid var(--line,rgba(143,166,196,.18));border-radius:14px;
  overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow,0 6px 18px rgba(11,31,58,.06))}
.live-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;font-family:var(--display,inherit);
  font-weight:800;font-size:.82rem;color:#fff;background:linear-gradient(90deg,#C62828,#8E1B3A)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:livePulse 1.6s infinite}
@keyframes livePulse{70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.liverow{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:11px 14px;cursor:pointer;text-align:inherit;font-family:inherit;
  border-top:1px solid var(--line,rgba(143,166,196,.14))}
.liverow:first-of-type{border-top:0}
.liverow:hover{background:rgba(198,40,40,.05)}
.lv-side{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.lv-side.a{flex-direction:row-reverse}
.lv-side b{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--head,#0B1F3A)}
.lv-sc{flex:none;font-family:var(--display,inherit);font-weight:800;font-size:1rem;
  background:var(--navy,#0B1F3A);color:#fff;border-radius:7px;padding:3px 11px;min-width:56px;text-align:center}
.lv-min{flex:none;font-size:.72rem;font-weight:700;color:#C62828;min-width:46px;text-align:center;
  direction:ltr;unicode-bidi:isolate}
@media(max-width:480px){
  .liverow{gap:6px;padding:10px}
  .lv-side .crest,.lv-side .crest.has-logo{width:26px;height:26px}
  .lv-side b{font-size:.78rem}
  .lv-sc{font-size:.9rem;padding:2px 8px;min-width:46px}
  .lv-min{min-width:38px;font-size:.68rem}
}
/* ---- زر التفاصيل وطيّها ---- */
.mtog{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  border:0;border-top:1px solid var(--line,rgba(143,166,196,.18));background:transparent;
  padding:9px 12px;color:var(--sky,#5FB2E8);font-family:var(--display,inherit);
  font-weight:700;font-size:.78rem;cursor:pointer;transition:background .15s}
.mtog:hover{background:rgba(95,178,232,.07)}
.mtog em{font-style:normal;background:rgba(95,178,232,.16);border-radius:999px;
  padding:1px 7px;font-size:.72rem}
.mtog .chev{width:0;height:0;border-inline:4.5px solid transparent;
  border-top:5.5px solid currentColor;transition:transform .18s}
.mtog.on .chev{transform:rotate(180deg)}
.mdet[hidden]{display:none}
/* ---- قائمة الإنذارات ---- */
.cd-wrap{border-top:1px dashed rgba(143,166,196,.22);padding:10px 14px;display:grid;gap:6px}
.cd-hd{font-size:.72rem;color:var(--slate,#8FA6C4);margin-bottom:2px}
.cd-row{display:flex;align-items:center;gap:8px;font-size:.8rem}
.cd-min{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;
  color:var(--sky,#5FB2E8);font-weight:600;min-width:34px;font-size:.74rem}
.cd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* الشاشات الضيقة: اسم النادي كاملاً بلا قطع. نُفسح له بتصغير الشعار
   وحشو النتيجة والفجوات — «الصليبخات» أطولها وهي المقياس. */
@media(max-width:480px){
  .match .mhead{gap:6px}
  .match .mside{gap:5px}
  .match .mside .crest,.match .mside .crest.has-logo{width:30px;height:30px;border-radius:7px}
  .match .mside b{font-size:.88rem}
  .match .score{font-size:1.05rem;padding:3px 7px;letter-spacing:0}
}
@media(max-width:360px){
  .match .mside .crest,.match .mside .crest.has-logo{width:26px;height:26px}
  .match .mside b{font-size:.8rem}
  .match .score{font-size:.95rem;padding:3px 5px}
}
.mstat{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mstat.soon{color:var(--sand);background:rgba(233,185,73,.14);border:1px solid rgba(233,185,73,.4)}
.mstat.live{color:#EAFBF3;background:#1D6B4E;border:1px solid #35A47C}
.cday.soon{border-color:rgba(233,185,73,.55);background:rgba(233,185,73,.13)}
.cday .dd.g{color:var(--sand)}
.mmeta{padding:0 14px 10px;font-size:.7rem;color:var(--slate);display:flex;gap:10px;flex-wrap:wrap}
.goals{border-top:1px solid rgba(143,166,196,.14);padding:10px 14px;display:grid;gap:6px;font-size:.8rem}
.gline{display:flex;align-items:center;gap:8px}
/* التبديلات: سهم أخضر لأعلى للداخل، وأحمر لأسفل للخارج */
.goals.subs{border-top:1px dashed rgba(143,166,196,.2)}
.subhd{color:var(--slate);font-size:.72rem;letter-spacing:.02em;margin-bottom:2px}
.subpair{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.subin,.subout{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.subin{color:var(--win)}
.subout{color:var(--loss)}
.arw{width:0;height:0;flex:none;border-left:4.5px solid transparent;border-right:4.5px solid transparent}
.arw.up{border-bottom:7px solid var(--win)}
.arw.dn{border-top:7px solid var(--loss)}
@media(max-width:420px){ .subpair{flex-direction:column;align-items:flex-start;gap:2px} }
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.gmin{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--sky);font-weight:600;min-width:38px;font-size:.75rem}
.gtag{font-size:.62rem;color:var(--slate);border:1px solid rgba(143,166,196,.3);border-radius:5px;padding:0 5px;white-space:nowrap}

/* ---------- الرسوم ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;font-size:.78rem}
.bar .tr{display:block;background:rgba(143,166,196,.15);border-radius:9px;height:9px;overflow:hidden}
.bar .fl{display:block;height:100%;min-width:3px;border-radius:9px;background:linear-gradient(90deg,var(--sky),var(--navy-600))}
.bar .fl.alt{background:linear-gradient(90deg,var(--loss),#7a2f24)}
.bar .n{text-align:left;font-variant-numeric:tabular-nums;color:var(--slate);font-size:.75rem}

.timing{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;align-items:end;height:130px;margin-top:6px}
.tcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px}
.tcol .bx{border-radius:5px 5px 0 0;min-height:2px}
.tcol .for{background:var(--sky)} .tcol .ag{background:rgba(224,100,79,.75);border-radius:0 0 5px 5px}
.tlabels{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px;font-size:.58rem;color:var(--slate);text-align:center}

/* ---------- المختارات ---------- */
select,input[type=text],input[type=password]{
  width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:11px 12px;font-family:var(--body);font-size:.92rem;
}
select:focus,input:focus{outline:2px solid var(--sky);outline-offset:1px}
label.lb{display:block;font-size:.72rem;color:var(--slate);margin:0 0 6px}
.squadbox{padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.squadbox:last-of-type{border:0}
.squadbox textarea{width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:10px 12px;font-family:var(--body);font-size:.86rem;
  line-height:1.8;resize:vertical}
.squadbox textarea:focus{outline:2px solid var(--sky);outline-offset:1px}
/* أكورديون كشوفات الأندية */
details.squadbox{padding:0;overflow:hidden}
details.squadbox summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;gap:8px;user-select:none}
details.squadbox summary::-webkit-details-marker{display:none}
details.squadbox summary::after{content:"⌄";margin-inline-start:auto;color:var(--slate);
  font-size:1rem;transition:transform .18s;line-height:1}
details.squadbox[open] summary::after{transform:rotate(180deg)}
details.squadbox summary:hover{background:rgba(95,178,232,.06)}
details.squadbox > .sqbody{padding:0 13px 13px}
/* أكورديون المباريات حسب الجولة في الإدارة */
details.rndbox{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:10px}
details.rndbox:last-of-type{margin-bottom:0}
details.rndbox summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;
  gap:9px;user-select:none;font-size:.95rem}
details.rndbox summary::-webkit-details-marker{display:none}
details.rndbox summary b{font-weight:700}
details.rndbox summary::after{content:"⌄";margin-inline-start:auto;color:var(--slate);
  font-size:1.1rem;transition:transform .18s;line-height:1}
details.rndbox[open] summary::after{transform:rotate(180deg)}
details.rndbox[open] summary{border-bottom:1px solid var(--line)}
details.rndbox summary:hover{background:rgba(95,178,232,.06)}
details.rndbox summary .rc{font-size:.68rem;color:var(--slate);background:rgba(143,166,196,.16);
  padding:3px 9px;border-radius:20px;font-weight:600}
details.rndbox summary .rc.soon{color:#B57A15;background:rgba(233,185,73,.18)}
details.rndbox > .rndbody{padding:2px 14px 10px}
details.squadbox summary label.lb{margin:0;cursor:pointer}
/* خانة رقم اللاعب في نماذج المباريات */
.pfld .prow{display:grid;grid-template-columns:60px 1fr;gap:6px}
.pfld .pnum{text-align:center;font-variant-numeric:tabular-nums}
.pfld .phint{font-size:.64rem;color:#E0B23C;min-height:11px;margin-top:3px}
/* صفوف الكشف: رقم + اسم + مركز + حذف */
.sqrow{display:grid;grid-template-columns:56px 1fr 92px 32px;gap:6px;align-items:center;margin-bottom:5px}
.sqrow input,.sqrow select{padding:8px 10px;font-size:.84rem;border-radius:9px}
.sqrow .sqno{text-align:center;font-variant-numeric:tabular-nums;padding:8px 4px}
.sqrow .sqno.dup{border-color:rgba(224,100,79,.6)}
.sqrow select{background:var(--navy-800);padding:8px 6px}
.sqrow.nopos select{border-color:rgba(224,178,60,.55)}
.sqrow .sqx{border:1px solid rgba(143,166,196,.28);border-radius:9px;color:var(--slate);
  font-size:.9rem;line-height:1;height:34px}
.sqrow .sqx:hover{border-color:rgba(224,100,79,.5);color:var(--loss)}
.sqadd{display:grid;grid-template-columns:56px 1fr 92px 78px;gap:6px;margin-top:8px}
.sqadd input,.sqadd select{padding:8px 10px;font-size:.84rem;border-radius:9px}
.sqadd .sqnewno{text-align:center;padding:8px 4px}
.sqadd button{border:1px solid rgba(95,178,232,.45);border-radius:9px;color:var(--sky);font-size:.78rem}
@media(max-width:520px){

}
.sqtools{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.sqtools button{border:1px solid rgba(143,166,196,.28);border-radius:8px;color:var(--slate);
  font-size:.68rem;padding:4px 9px}
.cnt.miss{color:#E0B23C;background:rgba(224,178,60,.12)}
.staffrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.staffrow:last-of-type{border:0}
.staffrow .sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.staffrow .sm b{font-size:.86rem;color:#fff;font-weight:600}
.staffrow .sm span{font-size:.72rem;color:var(--slate);direction:ltr;text-align:right}

.uidbox code{display:block;direction:ltr;text-align:left;font-size:.76rem;color:var(--sky);

.cnt.off{color:var(--loss);background:rgba(224,100,79,.12);border-color:rgba(224,100,79,.4)}

.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(143,166,196,.16);font-size:.85rem}

.head-story{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,166,196,.16);align-items:flex-start}

.note{background:rgba(233,185,73,.09);border:1px solid rgba(233,185,73,.32);border-right:3px solid var(--sand);

.btn{background:var(--sky);color:#04121f;font-weight:600;border-radius:10px;padding:11px 16px;font-size:.88rem;width:100%;text-align:center}

@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}

/* ---------- الإدارة ---------- */
.logogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.logocell{background:var(--navy-800);border:1px dashed rgba(143,166,196,.35);border-radius:10px;padding:10px;text-align:center}
.logocell .nm{font-size:.72rem;margin-top:6px;font-weight:600}
.logocell .up{font-size:.64rem;color:var(--sky);margin-top:4px}
.logocell input[type=file]{display:none}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9px;background:rgba(143,166,196,.28);outline:none;padding:0;border:0}

.fine .rng{flex:1}
.fine .fval{font-size:.72rem;color:var(--slate);min-width:38px;text-align:left;font-variant-numeric:tabular-nums}

.badge{font-size:.62rem;padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge.ok{color:var(--win);border-color:rgba(53,164,124,.45);background:rgba(53,164,124,.1)}
.badge.warn{color:var(--sand);border-color:rgba(233,185,73,.45);background:rgba(233,185,73,.1)}


/* ---------- الخريطة الحرارية ---------- */
.pitchwrap{max-width:420px;margin:0 auto}
.pitch{width:100%;height:auto;display:block}
.pitch .ln{fill:none;stroke:rgba(143,166,196,.45);stroke-width:.5}
.pitch .goal{stroke:var(--sky);stroke-width:1.4}
.pitch .zn{stroke:rgba(143,166,196,.28);stroke-width:.4;transition:fill .2s}
.pitch text{font-family:var(--body);font-weight:700;font-size:4.4px;fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(6,21,41,.65);stroke-width:1.1}
.pitch text.sm{font-size:2.9px;font-weight:500;fill:var(--slate);stroke:none}
.segbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.compbar{border-bottom:1px solid rgba(143,166,196,.16);padding-bottom:12px}
/* شريط الجولات */
.roundstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.roundstrip::-webkit-scrollbar{display:none}
.rchip{flex:none;min-width:62px;border:1px solid rgba(143,166,196,.28);border-radius:10px;
  padding:7px 12px;text-align:center;background:var(--navy-900)}
.rchip .rn{font-family:var(--display);font-weight:700;font-size:.95rem;color:#fff;font-variant-numeric:tabular-nums}
.rchip .rs{font-size:.6rem;color:var(--slate)}
.rchip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky)}
.rchip[aria-pressed="true"] .rn,.rchip[aria-pressed="true"] .rs{color:#04121f}
/* الرزنامة */
.calbar{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:var(--r);padding:12px;margin-bottom:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:var(--display);font-weight:600;font-size:.9rem;color:#fff}
.calnav{display:flex;gap:6px}
.calnav button{width:30px;height:30px;border-radius:8px;background:rgba(95,178,232,.12);
  border:1px solid rgba(95,178,232,.28);color:var(--sky);font-size:.9rem}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.caldow span{text-align:center;font-size:.58rem;color:var(--slate)}
.caldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cday{border-radius:8px;padding:5px 0 4px;text-align:center;
  background:rgba(14,43,82,.5);border:1px solid rgba(143,166,196,.16)}
.cday.blank{background:none;border:0}
.cday .dw{display:none}
.cday .dn{font-family:var(--display);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;color:#fff}
.cday .dd{font-size:.55rem;color:var(--sky);height:9px}
.cday.off{opacity:.32}
.cday.has{border-color:rgba(95,178,232,.5);background:rgba(23,65,122,.6)}
.cday[aria-pressed="true"]{background:var(--sand);border-color:var(--sand)}
.cday[aria-pressed="true"] .dn,.cday[aria-pressed="true"] .dw,.cday[aria-pressed="true"] .dd{color:#20180a}
/* ملخص الجولة */
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rsum div{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:10px;padding:9px 6px;text-align:center}
.rsum .n{font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff;font-variant-numeric:tabular-nums}
.rsum .l{font-size:.6rem;color:var(--slate)}
/* البطاقات */
.cardpill{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px;margin-inline-start:3px}
.cardpill.y{background:#E9B949}.cardpill.r{background:#E0644F}
.ctag{font-size:.62rem;color:var(--slate);display:inline-flex;align-items:center;gap:2px}
/* صور اللاعبين */
.pav{display:inline-block;border-radius:50%;flex:none;overflow:hidden;background:var(--navy-800);
  box-shadow:inset 0 0 0 1.5px rgba(95,178,232,.4);vertical-align:middle}
.pav img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.pavph{border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--navy-800);color:var(--slate);font-weight:700;
  box-shadow:inset 0 0 0 1.5px rgba(143,166,196,.3);vertical-align:middle}
.tune{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.tune:last-child{border:0}
.tune .tprev{flex:none}
.tune .tbody{flex:1;min-width:0}
.tune .tnm{font-size:.8rem;font-weight:600;margin-bottom:6px}
.tune .trow{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:7px;margin-bottom:5px}
.tune .trow span{font-size:.64rem;color:var(--slate)}
.tune .trow span:last-child{text-align:left;font-variant-numeric:tabular-nums}
.tune .rng{height:4px}
.tune .tdel{flex:none;width:28px;height:28px;border-radius:8px;background:rgba(224,100,79,.14);
  border:1px solid rgba(224,100,79,.35);color:var(--loss);font-size:.85rem}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.86rem}
.toggle input{width:20px;height:20px;accent-color:var(--sky)}
/* إشعار الحفظ */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:200;
  max-width:min(560px,92vw);padding:13px 18px;border-radius:12px;
  font-size:.84rem;font-weight:600;line-height:1.5;text-align:center;
  box-shadow:0 10px 34px rgba(0,0,0,.5);transition:transform .28s ease,opacity .28s ease;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:#1D6B4E;color:#EAFBF3;border:1px solid #35A47C}
#toast.err{background:#7A2B21;color:#FFE3DF;border:1px solid #E0644F}
#toast.busy{background:#123B6B;color:#DCEEFB;border:1px solid #5FB2E8}
@media(min-width:900px){#toast{bottom:24px}}
.btn[disabled]{opacity:.55}
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.photocell{background:var(--navy-800);border:1px dashed rgba(143,166,196,.35);border-radius:10px;padding:10px;text-align:center}
.photocell .nm{font-size:.7rem;margin-top:6px;font-weight:600}
.photocell .up{font-size:.62rem;color:var(--sky);margin-top:3px}
.photocell img,.photocell .ph{width:54px;height:54px;margin:0 auto}
/* نموذج إدخال المباراة */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:.68rem;color:var(--slate);margin-bottom:4px}
.fld input,.fld select{width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);

.fld input:focus,.fld select:focus{outline:2px solid var(--sky);outline-offset:1px}
.subrow{background:rgba(14,43,82,.55);border:1px solid rgba(143,166,196,.2);

.subrow .del{position:absolute;inset-inline-start:8px;top:8px;width:26px;height:26px;border-radius:7px;
  background:rgba(224,100,79,.16);border:1px solid rgba(224,100,79,.4);color:var(--loss);font-size:.9rem;line-height:1}
.subrow .idx{font-size:.65rem;color:var(--sky);font-weight:700;margin-bottom:8px}
.addbtn{width:100%;border:1px dashed rgba(95,178,232,.5);border-radius:10px;padding:10px;
  color:var(--sky);font-size:.82rem;background:rgba(95,178,232,.06)}
/* محرّر شكل التشكيلة: ملعب أخضر، اللاعب نقطة تُسحب بالإصبع أو الفأرة */
.shapes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.shapebox{border:1px solid rgba(143,166,196,.22);border-radius:12px;padding:10px;
  background:rgba(14,43,82,.35)}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.shead>*{margin:0}
.shead b{flex:1;min-width:0;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .btn.sm{flex:0 0 auto;width:auto;padding:5px 10px;font-size:.72rem;white-space:nowrap}
.shead select{flex:0 0 auto;width:auto;background:#fff;color:var(--head);
  border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit;
  font-size:.78rem;font-variant-numeric:tabular-nums}
/* ملعب التشكيلة — واحد يخدم المحرّر وصفحة المباراة وملف النادي.
   الاسم xipitch لا pitch: الأخير محجوز لخريطة أماكن التسجيل. */
.xipitch{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;
  user-select:none;max-width:400px;margin-inline:auto;
  background:linear-gradient(#1f7a45,#166035)}
.xipitch.half{aspect-ratio:3/4}          /* فريق واحد */
.xipitch.full{aspect-ratio:1/1.82}       /* الفريقان وجهاً لوجه: أطول ليتّسع للـ22 لاعباً */
/* على ملعب الفريقين: دوائر وأسماء وشارات أصغر لتخفيف الازدحام */
.xipitch.full .pp-dot{width:clamp(19px,7cqw,26px);height:clamp(19px,7cqw,26px);
  font-size:clamp(9px,2.9cqw,12px);border-width:1.25px}
.xipitch.full .pp-nm{font-size:clamp(7.5px,2.5cqw,10.5px);gap:1px}
.xipitch.full .pp-b .ico-ball,.xipitch.full .pp-b .ico-boot{width:clamp(7px,2.2cqw,10px);height:clamp(7px,2.2cqw,10px)}
.xipitch.full .pp-b.goal{top:-5px;left:-5px}
.xipitch.full .pp-b.assist{bottom:-5px;right:-5px}
.xipitch.full .pp-b.card{width:clamp(6px,1.7cqw,8px);height:clamp(8px,2.4cqw,10px)}
.xipitch.full .pp-b.off{width:clamp(9px,2.5cqw,12px);height:clamp(9px,2.5cqw,12px)}
.pp-spot.cmp{gap:1px}
.xipitch::before,.xipitch::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:44%;height:11%;border:1px solid rgba(255,255,255,.28);pointer-events:none}
.xipitch::before{top:0;border-top:0}
.xipitch::after{bottom:0;border-bottom:0}
.xip-lines{position:absolute;inset:0;pointer-events:none;
  --l:rgba(255,255,255,.28);
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 8%,transparent 8% 16%),
    linear-gradient(var(--l),var(--l)) 50% 50%/100% 1px no-repeat,
    linear-gradient(var(--l),var(--l)) 0 50%/1px 100% no-repeat,
    linear-gradient(var(--l),var(--l)) 100% 50%/1px 100% no-repeat}
.xip-lines::before{content:"";position:absolute;left:50%;top:50%;
  width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid rgba(255,255,255,.28)}
.pp-spot{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:2px;text-align:center}
.pp-dot{width:clamp(22px,9cqw,34px);height:clamp(22px,9cqw,34px);border-radius:50%;
  display:grid;place-items:center;background:var(--pc);color:var(--pt,#0B1F3A);font-weight:800;
  font-size:clamp(10px,3.4cqw,14px);line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);
  border:1.5px solid var(--pe,rgba(255,255,255,.85));font-variant-numeric:tabular-nums}
.pp-nm{font-size:clamp(8.5px,2.9cqw,12px);color:#fff;font-weight:600;max-width:100%;
  text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* شارات الأحداث على شارة اللاعب: في الأركان الأربعة، بأحجام تتناسب مع الملعب */
.pp-dot{position:relative}
.pp-b{position:absolute;display:inline-flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 1px 2px rgba(0,0,0,.4);line-height:1}
.pp-b .ico-ball,.pp-b .ico-boot{width:clamp(9px,2.7cqw,13px);height:clamp(9px,2.7cqw,13px)}
/* الهدف: أعلى اليسار (شريحة بيضاء، وعدد إن تعدّد) */
.pp-b.goal{top:-6px;left:-6px;background:#fff;border-radius:8px;padding:1px;gap:1px}
.pp-b.goal em{font-style:normal;font-weight:800;color:#0B1F3A;font-size:clamp(7px,2.1cqw,10px);padding-inline-end:1px}
/* الصناعة: أسفل اليمين */
.pp-b.assist{bottom:-6px;right:-6px;background:#fff;border-radius:50%;padding:1px}
/* الكرت: أعلى اليمين على القميص */
.pp-b.card{top:-5px;right:-5px;width:clamp(7px,2cqw,9px);height:clamp(10px,2.8cqw,12px);border-radius:2px}
.pp-b.card.y{background:#E9B949}
.pp-b.card.r{background:#D9453B}
/* الخروج: أسفل اليسار، دائرة حمراء بسهم أبيض للأسفل */
.pp-b.off{bottom:-5px;left:-5px;width:clamp(11px,3cqw,15px);height:clamp(11px,3cqw,15px);
  border-radius:50%;background:#D9453B}
.pp-b.off::after{content:"";border-inline:clamp(2.5px,.7cqw,3.5px) solid transparent;
  border-top:clamp(3.5px,1cqw,5px) solid #fff;margin-top:1px}
/* التشكيلة في صفحة المباراة وفي ملف النادي */
.xi{margin:10px 0 4px}
.xi-t{display:flex;align-items:center;gap:6px;min-width:0;font-size:.78rem;
  max-width:400px;margin-inline:auto;padding:5px 2px}
.xi-t img,.xi-t svg{width:18px;height:18px;flex:0 0 auto}
.xi-t b{color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xi-t i{font-style:normal;font-size:.7rem;color:var(--slate);font-variant-numeric:tabular-nums;
  border:1px solid var(--line2);border-radius:6px;padding:1px 5px;flex:0 0 auto}
.xi-card .lb{margin:0}
.xi-pick{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.xi-pick select{flex:1;min-width:0}
.xi-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;
  color:var(--slate);margin-bottom:10px}
.xi-meta b{color:var(--head)}
.xi-meta img,.xi-meta svg{width:18px;height:18px;vertical-align:middle;margin-inline-end:4px}
/* بلا dir=ltr: في سياق عربي يقع رقم النادي يميناً فيُقرأ أولاً */
.xi-res{font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;
  background:var(--navy-800);border-radius:7px;padding:2px 8px}
.xi-x{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.xi-ct{font-size:.72rem;color:var(--slate);font-weight:700;margin-bottom:6px}
.xi-r{display:flex;align-items:center;gap:8px;font-size:.78rem;padding:4px 0;
  border-bottom:1px dashed rgba(143,166,196,.16)}
.xi-r:last-child{border:0}
.xi-m{color:var(--zain-mid);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.xi-io{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xi-io .ar{display:inline-block;width:0;height:0;margin-inline-end:5px;
  border-inline:4px solid transparent}
.xi-io .ar.in{border-bottom:6px solid var(--win)}
.xi-io .ar.out{border-top:6px solid var(--loss)}

/* ===== قسم الجمهور ===== */
.fx-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fx-badge{font-size:.7rem;font-weight:800;border-radius:7px;padding:3px 9px;
  background:var(--zain-deep);color:#fff}
.fx-badge.live{background:var(--amber-bg,#FFF3D6);color:var(--amber-tx,#8A6100);
  border:1px solid var(--amber-ln,#E8C97A)}
.fx-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:14px}
.fx-card{border:1px solid var(--line);border-radius:11px;padding:10px;background:#F7FAFD}
.fx-t{font-size:.7rem;color:var(--slate);font-weight:700;margin-bottom:6px}
.fx-p{display:flex;align-items:center;gap:6px;min-width:0}
.fx-p img,.fx-p svg{width:22px;height:22px;flex:0 0 auto}
.fx-p b{color:var(--head);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-v{font-size:.7rem;color:var(--slate);margin-top:4px}
.pp-v{font-style:normal;background:rgba(11,31,58,.55);border-radius:5px;padding:0 4px;
  font-size:.85em;font-weight:800}
/* بطاقة التصويت */
.bl-empty{border:1px dashed var(--line2);border-radius:11px;padding:26px 12px;text-align:center;
  color:var(--slate);font-size:.82rem;background:#F7FAFD;max-width:400px;margin:0 auto}
.bl-slots{display:grid;gap:12px;margin-top:14px}
.bl-line{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  border:1px solid var(--line);border-radius:11px;padding:10px;background:#F7FAFD}
.bl-lt{grid-column:1/-1;font-size:.72rem;font-weight:800;color:var(--zain-deep)}
.bl-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.bl-f>span{font-size:.68rem;color:var(--slate);font-weight:600}
.bl-f select{width:100%;font-size:.8rem}
.bl-h{margin:18px 0 8px;font-size:.85rem;color:var(--head)}
.bl-extra{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.bl-foot{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.bl-foot .btn{flex:1;min-width:150px}
.bl-count{font-size:.78rem;font-weight:800;color:var(--slate);
  background:var(--navy-800);border-radius:8px;padding:5px 11px;font-variant-numeric:tabular-nums}
.bl-count.ok{color:#116B45;background:#E7F6EF}
/* المصوّتون */
.vt-row{display:flex;align-items:center;gap:10px;font-size:.8rem;padding:7px 0;
  border-bottom:1px dashed rgba(143,166,196,.16)}
.vt-row:last-child{border:0}
.vt-row.me{background:#F0F7FD;border-radius:8px;padding-inline:8px}
.vt-i{color:var(--slate);font-variant-numeric:tabular-nums;min-width:20px}
.vt-row b{flex:1;min-width:0;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-f{font-size:.7rem;color:var(--slate);border:1px solid var(--line2);border-radius:6px;
  padding:1px 6px;font-variant-numeric:tabular-nums}
.vt-t{font-size:.7rem;color:var(--slate);font-variant-numeric:tabular-nums}
/* حالة التصويت في اللوحة */
.tot-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tot-pill{font-size:.72rem;font-weight:700;border-radius:7px;padding:4px 10px;
  border:1px solid var(--line2);color:var(--slate);background:#fff}
.tot-pill.on{background:#E7F6EF;border-color:#A8DCC4;color:#116B45}
.tot-pill.ok{background:var(--zain-deep);border-color:var(--zain-deep);color:#fff}
.tot-n{font-size:.75rem;color:var(--slate);font-variant-numeric:tabular-nums}

.kits{display:grid;gap:8px}
.kitrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#F7FAFD}
.kitrow b{flex:1;min-width:70px;font-size:.85rem;color:var(--head)}
.kit-prev{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(#1f7a45,#166035)}
.kit-prev .pp-dot{width:24px;height:24px;font-size:11px;font-style:normal}
.kit-f{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--slate);flex:0 0 auto}
.kit-f input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line2);
  border-radius:7px;background:none;cursor:pointer}
.kitrow .dl[disabled]{opacity:.4;cursor:default}
.xitally{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:10px 0}
.xitl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;
  border:1px solid var(--line2);border-radius:9px;padding:7px 10px;background:#F7FAFD}
.xitl b{flex:1;min-width:0;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xitl span{font-weight:700;font-variant-numeric:tabular-nums;color:var(--slate)}
.xitl.bad{border-color:#F5B5B0;background:#FDECEC}
.xitl.bad span{color:#8A1F1A}
.xitl em{font-style:normal;font-size:.72rem;color:#8A1F1A;flex-basis:100%}

/* المحرّر وحده يسحب */
.epitch{touch-action:none}
.epitch .pp-spot{cursor:grab}
.epitch .pp-spot.drag{cursor:grabbing;z-index:5}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.mrow:last-child{border:0}
.mrow .mm{flex:1;min-width:0;font-size:.82rem}
.mrow .mm b{display:block;font-weight:600}
.mrow .mm span{font-size:.68rem;color:var(--slate)}
.mrow button{padding:5px 10px;border-radius:8px;font-size:.7rem;border:1px solid rgba(143,166,196,.3);color:var(--mist)}
.mrow button.dl{border-color:rgba(224,100,79,.4);color:var(--loss)}
.formerr{background:rgba(224,100,79,.12);border:1px solid rgba(224,100,79,.4);border-right:3px solid var(--loss);
  border-radius:9px;padding:11px 13px;font-size:.8rem;color:#FFD9D3;margin-bottom:12px}
/* مرمى ركلات الجزاء */
.goalwrap{max-width:400px;margin:0 auto}
.goalsvg{width:100%;height:auto;display:block}
.goalsvg .frame{fill:none;stroke:var(--sky);stroke-width:2}
.goalsvg .zn{stroke:rgba(143,166,196,.3);stroke-width:.6}
.goalsvg text{font-family:var(--body);font-weight:700;font-size:7px;fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(6,21,41,.6);stroke-width:1.6}
.goalsvg text.sm{font-size:4px;font-weight:500;fill:var(--slate);stroke:none}
/* ---------- بطاقة المباراة القادمة ---------- */
.nextm{position:relative;display:block;width:100%;text-align:right;
  background:linear-gradient(135deg,#12386A 0%,#0A2242 55%,#061529 100%);
  border:1px solid rgba(95,178,232,.32);border-radius:16px;overflow:hidden;
  margin-bottom:16px;box-shadow:0 10px 26px rgba(6,21,41,.55);
  transition:border-color .18s,transform .18s}
.nextm:hover{border-color:var(--sky);transform:translateY(-1px)}
.nextm::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 130% at 50% -30%,rgba(95,178,232,.22),transparent 62%)}
.nextm-top{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid rgba(143,166,196,.16);
  font-size:.68rem;color:var(--slate)}
.nextm-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);
  font-weight:600;font-size:.68rem;color:var(--sand);background:rgba(233,185,73,.12);
  border:1px solid rgba(233,185,73,.4);border-radius:999px;padding:3px 10px}
.nextm-tag i{width:6px;height:6px;border-radius:50%;background:var(--sand);flex:none;
  box-shadow:0 0 0 3px rgba(233,185,73,.2)}
.nextm-body{position:relative;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:10px;padding:16px 14px 14px}
.nextm-team{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.nextm-team b{font-family:var(--display);font-weight:600;font-size:.86rem;color:#fff;
  text-align:center;line-height:1.35;white-space:nowrap}
.nextm .crest.lg{width:66px;height:66px;border-radius:18px}
.nextm .crest.has-logo{box-shadow:inset 0 0 0 1px rgba(143,166,196,.28),0 6px 16px rgba(6,21,41,.5)}
.nextm-mid{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;padding:0 4px}
.nextm-vs{font-family:var(--display);font-size:.62rem;color:var(--sky);letter-spacing:.14em;
  direction:ltr;unicode-bidi:isolate}
.nextm-time{font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff;
  font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.nextm-cd{font-size:.66rem;color:var(--sand);font-weight:600;white-space:nowrap}
.nextm-foot{position:relative;display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  padding:9px 14px;font-size:.68rem;color:var(--slate);
  border-top:1px solid rgba(143,166,196,.14);background:rgba(6,21,41,.35)}
.nextm-foot .go{margin-inline-start:auto;color:var(--sky);font-weight:600}
@media(min-width:640px){
  .nextm .crest.lg{width:80px;height:80px;border-radius:20px}
  .nextm-team b{font-size:.98rem}
  .nextm-time{font-size:1.45rem}
}

/* ---------- تحدي التوقعات ---------- */
.fanbar{display:flex;align-items:center;gap:10px;background:var(--navy-800);
  border:1px solid rgba(95,178,232,.28);border-radius:12px;padding:10px 13px;margin-bottom:6px}
.fanbar .fi{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.fanbar .fi b{font-family:var(--display);font-size:.88rem;color:#fff;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fanbar .fi span{font-size:.68rem;color:var(--slate)}
.lnk{background:none;border:0;color:var(--sky);font-family:var(--body);font-size:.72rem;
  cursor:pointer;padding:2px;white-space:nowrap;text-decoration:underline}
.gbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:#fff;color:#1f1f1f}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0}
.orline i{flex:1;height:1px;background:rgba(143,166,196,.2)}
.orline span{font-size:.7rem;color:var(--slate)}
.anonbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:rgba(233,185,73,.09);border:1px solid rgba(233,185,73,.32);border-radius:10px;
  padding:8px 12px;font-size:.71rem;color:var(--sand);margin-bottom:6px}
.anonbar .lnk{color:var(--sand)}
.spark{display:flex;align-items:flex-end;gap:2px;height:70px;
  background:rgba(6,21,41,.45);border-radius:9px;padding:7px}
.spark i{flex:1;background:linear-gradient(180deg,var(--sky),rgba(95,178,232,.35));
  border-radius:2px 2px 0 0;min-height:3px}
.lockbar{background:rgba(233,185,73,.1);border:1px solid rgba(233,185,73,.35);border-radius:10px;
  padding:8px 12px;font-size:.72rem;color:var(--sand);margin-bottom:11px}
.pm{display:flex;align-items:center;gap:8px;background:var(--navy-900);
  border:1px solid rgba(143,166,196,.16);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.pm .tm{flex:1;min-width:0;font-size:.82rem;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pm .tm.a{text-align:left}
.pm .dsh{color:var(--slate);font-family:var(--display)}
.stp{display:flex;align-items:center;gap:1px;flex:none}
.stp button{width:28px;height:28px;border-radius:8px;border:1px solid rgba(143,166,196,.28);
  background:none;color:var(--sky);font-size:.95rem;line-height:1;cursor:pointer;font-family:var(--display)}
.stp button:disabled{opacity:.3;cursor:default}
.stp .val{width:26px;text-align:center;font-family:var(--display);font-weight:700;
  font-size:1.05rem;color:#fff;font-variant-numeric:tabular-nums}
.bchips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.bchips .chip{flex:none;background:none;border:1px solid rgba(143,166,196,.3);border-radius:999px;
  padding:6px 13px;font-family:var(--body);font-size:.74rem;color:var(--slate);cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
.bchips .chip.on{background:var(--sky);border-color:var(--sky);color:#04101f;font-weight:600}
table.lb{width:100%;border-collapse:collapse;font-size:.82rem}
table.lb th,table.lb td{padding:9px 11px;text-align:right;border-bottom:1px solid rgba(143,166,196,.13)}
table.lb th{font-family:var(--display);font-weight:600;font-size:.7rem;color:var(--slate);
  background:rgba(14,43,82,.5)}
table.lb tr:last-child td{border-bottom:0}
table.lb tr.me{background:rgba(95,178,232,.09)}
table.lb tr.me td{color:#fff;font-weight:600}
table.lb td.rk{font-family:var(--display);color:var(--slate);font-variant-numeric:tabular-nums}
table.lb td.rk.top{color:var(--sand);font-weight:700}
table.lb td.pt{font-family:var(--display);font-weight:700;color:var(--sky);
  font-variant-numeric:tabular-nums}

/* ---------- العلامة والتصدير ---------- */
.brandcard{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#0E2B52,#061529);
  border:1px solid rgba(233,185,73,.3);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.brandcard img{height:44px;width:auto;flex:none}
.brandcard .bt{flex:1;min-width:0}
.brandcard .bt b{display:block;font-family:var(--display);font-weight:600;font-size:.95rem;color:#fff}
.brandcard .bt span{font-size:.7rem;color:var(--sand);letter-spacing:.04em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.handles{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.hchip{display:inline-flex;align-items:center;gap:6px;direction:ltr;
  border:1px solid rgba(233,185,73,.35);background:rgba(233,185,73,.09);
  color:var(--sand);border-radius:999px;padding:4px 11px 4px 8px;
  font-size:.74rem;font-weight:600;text-decoration:none;transition:background .16s,border-color .16s}
.hchip:hover{background:rgba(233,185,73,.18);border-color:var(--sand)}
.hchip svg{width:14px;height:14px;flex:none}
.sitefoot .handles{margin:0}
.sitefoot .hchip{font-size:.7rem;padding:3px 9px 3px 7px}

/* ---------- واتساب: شريحة + زر عائم ---------- */
.hchip.wa{border-color:rgba(53,164,124,.42);background:rgba(53,164,124,.12);color:#4FD1A0}
.hchip.wa:hover{background:rgba(53,164,124,.22);border-color:#35A47C}
.wafab{
  position:fixed;left:14px;z-index:60;
  bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;
  padding:10px 15px 10px 13px;border-radius:999px;
  background:#1E7A5A;color:#EAFBF3;text-decoration:none;
  font-family:var(--body);font-size:.78rem;font-weight:600;
  border:1px solid rgba(79,209,160,.45);
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:transform .16s ease,background .16s ease;
}
.wafab:hover{background:#23906B;transform:translateY(-2px)}
.wafab:active{transform:translateY(0)}
.wafab .waic{display:flex;align-items:center}
.wafab svg{width:19px;height:19px;flex:none}
.wafab .lbl{white-space:nowrap}
@media(max-width:400px){.wafab .lbl{display:none}.wafab{padding:12px}}
@media(min-width:900px){.wafab{bottom:24px;left:24px}}
.exportbar{display:flex;gap:8px;margin:14px 0 4px}
.exportbar .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px}
.sitefoot{display:flex;align-items:center;justify-content:center;gap:10px;margin:34px 0 6px;
  padding-top:18px;border-top:1px solid rgba(143,166,196,.16);color:var(--slate);font-size:.7rem;flex-wrap:wrap}

  nav.tabs button{font-family:var(--display);font-weight:600;font-size:.9rem;min-height:52px;padding:0 18px;letter-spacing:.01em;position:relative}
  nav.tabs button[aria-selected="true"]{background:rgba(255,255,255,.09);border-bottom-color:var(--ice)}
  nav.tabs .in{position:relative}

/* ---- results strip ---- */
.strip{background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden}
.strip:empty{display:none}
.strip-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 20px;height:46px}
.strip-lb{flex:none;font-family:var(--display);font-weight:700;font-size:.72rem;color:var(--ice);letter-spacing:.06em;
  padding:4px 10px;border:1px solid rgba(127,224,255,.35);border-radius:4px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
/* ---- شريط متحرك كشريط الأخبار ----
   المحتوى مكرر مرتين داخل مسار واحد، والحركة تنقله بمقدار نسخة كاملة
   ثم تعيد الكرة — فلا يظهر انقطاع. الاتجاه من اليسار إلى اليمين لأن
   القراءة عربية: الجديد يدخل من اليسار. يتوقف عند اللمس أو المرور. */
.strip-sc{display:flex;gap:6px;overflow:hidden;flex:1;padding:4px 0}
/* القناع للشاشات الواسعة فقط: سفاري على iOS يتعثّر بقناع فوق عنصر
   متحرك فيُخفي المحتوى أو يجمّده. */
@media(min-width:601px){
  .strip-sc{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);
                    mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
}
/* على الجوال نضغط البطاقات: سفاري لا يُركّب طبقة أعرض من 4096 بكسل،
   والمسار نسختان — فلو بقيت البطاقات بحجمها تجاوز الحد وتجمّد الشريط. */
@media(max-width:600px){
  .strip .rx{gap:5px;padding:3px 7px;font-size:.68rem}
  .strip .rx img{width:16px;height:16px;border-radius:3px}
  .strip .rx .sc{font-size:.76rem;padding:0 5px;min-width:32px}
  .strip-lb{font-size:.66rem;padding:3px 7px}
}
/* translate3d لا translateX: أضمن للتسريع على iOS. وبلا will-change لأن
   المسار عريض جداً (آلاف البكسلات) وقد يرفض سفاري تركيب طبقة بهذا الحجم
   فتتجمّد الحركة — والحارس أدناه يكتشف ذلك ويتولّى القيادة بنفسه. */
.strip-track{display:flex;gap:6px;flex:none;
  animation:strip-run var(--dur,45s) linear infinite}
@keyframes strip-run{from{transform:translate3d(0,0,0)} to{transform:translate3d(calc(50% + 3px),0,0)}}
.strip-sc:hover .strip-track,.strip-sc.hold .strip-track{animation-play-state:paused}
.strip-sc.still .strip-track{animation:none}
@media (prefers-reduced-motion: reduce){
  .strip-sc{overflow-x:auto;scrollbar-width:none}
  .strip-track{animation:none}
}
/* المحتوى يتّسع كله أو المستخدم يفضّل تقليل الحركة: لا تحريك، تمرير يدوي */
.strip-sc.still{overflow-x:auto;scrollbar-width:none}
.strip-sc.still .strip-track{transform:none!important}
.strip-sc::-webkit-scrollbar{display:none}
.strip .rx{flex:none;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:4px 10px;color:#fff;font-size:.74rem;font-weight:600;transition:background .15s}

.strip .rx img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:4px;padding:1px}
/* النتيجة بلا direction:ltr عمداً: الصفحة RTL والمضيف يمين الشارة، فلو
   فُرض LTR وقعت أهداف المضيف يسار الشارة عند الضيف — فتُقرأ معكوسة.
   الموعد في المباراة القادمة رقمٌ لا نتيجة، فيبقى LTR. */
.strip .rx .sc{font-family:var(--display);font-weight:800;font-size:.86rem;color:var(--ice);
  background:rgba(127,224,255,.12);padding:0 7px;border-radius:4px;min-width:40px;text-align:center}

  position:relative;overflow:hidden}
.card:has(> .bars)::after,.card:has(> .timing)::after,.card:has(> .pitchwrap)::after,.card:has(> .goalwrap)::after,.card:has(> .zlist)::after{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(to left,var(--ice),var(--zain),transparent);pointer-events:none}
/* --- أشرطة أفقية ثلاثية الأبعاد --- */

.card:has(.bars) .bar .fl::before{content:"";position:absolute;top:2px;bottom:-4px;left:-5px;width:5px;background:#0A3A70;transform:skewY(-35deg);border-radius:0 0 0 2px}
.card:has(.bars) .bar .fl.alt{background:linear-gradient(180deg,#FFB3A8 0%,#EE6B5A 40%,#B8322A 100%);box-shadow:0 4px 0 #6E1B15,0 8px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.7)}

  border-radius:5px;padding:1px 0;text-align:center;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.card:has(.bars) .hint,.card:has(.bars) p{color:#BFD8EE}

/* --- أعمدة التوقيت ثلاثية الأبعاد --- */
.card:has(.timing) .timing{height:160px;padding:0 10px 0 6px;gap:12px;

.card:has(.timing) .tcol .ag::after{background:#6E1B15}

.card:has(.pitchwrap) .zlist .bar>span:first-child{color:#DCEEFB!important}

.card:has(.pitchwrap) .zlist .bar .n{font-family:var(--display);font-weight:800;color:#fff;background:rgba(127,224,255,.14);border:1px solid rgba(127,224,255,.35);border-radius:5px;text-align:center}
.card:has(.pitchwrap) .hint,.card:has(.pitchwrap) p{color:#BFD8EE}

/* ===== /v5 charts3d ===== */



/* ===== v7 timeline+gauges ===== */
.bars[data-3d]{display:none!important}
/* ---- خط زمن المباراة (0' → 90'+) ---- */
.tl{direction:ltr;position:relative;padding:34px 18px 30px;margin:6px 0 0}
.tl-halves{display:flex;gap:6px;font-family:var(--display);font-weight:700;font-size:.7rem;color:#8ED3FA;letter-spacing:.06em;margin-bottom:30px}
.tl-halves span{flex:1;text-align:center;position:relative;padding-bottom:6px}
.tl-halves span::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(127,224,255,.6),transparent)}
.tl-track{position:relative;height:14px;border-radius:8px;
  background:linear-gradient(90deg,#0A3A70,#1878BE 50%,#0A3A70);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 18px rgba(46,176,240,.25)}
.tl-track::before{content:"";position:absolute;inset:0;border-radius:8px;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100%/8 - 1px),rgba(255,255,255,.35) calc(100%/8 - 1px) calc(100%/8))}
.tl-ht{position:absolute;top:-8px;bottom:-8px;left:50%;width:3px;background:#FFD97A;border-radius:2px;box-shadow:0 0 10px rgba(255,217,122,.8)}
.tl-ht::after{content:"HT";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font:700 .6rem var(--display);color:#FFD97A}
.tl-segs{display:grid;grid-template-columns:repeat(8,1fr);position:absolute;left:18px;right:18px;top:64px;height:120px}
.tl-seg{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tl-seg .bub{--sz:30px;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;position:relative;
  font-family:var(--display);font-weight:900;color:#fff;font-size:calc(var(--sz)*.42);
  background:radial-gradient(circle at 35% 30%,#BDF1FF,#3DBCF5 45%,#0D4F92 100%);
  box-shadow:0 0 0 3px rgba(127,224,255,.25),0 0 22px rgba(46,176,240,.6),0 10px 18px rgba(0,0,0,.45);
  transition:transform .2s}
.tl-seg .bub::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:14px;background:rgba(127,224,255,.55);transform:translateX(-50%)}
.tl-seg .bub:hover{transform:scale(1.08)}
.tl-seg .bub.zero{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px rgba(127,224,255,.35);color:#8ED3FA;font-weight:600}
.tl-seg .bub.max{background:radial-gradient(circle at 35% 30%,#FFF4CF,#FFD97A 45%,#B8780C 100%);box-shadow:0 0 0 3px rgba(255,217,122,.3),0 0 26px rgba(255,217,122,.65),0 10px 18px rgba(0,0,0,.45)}
.tl-seg .bub.alt{background:radial-gradient(circle at 35% 30%,#FFD8D2,#EE6B5A 45%,#8E1B3A 100%);box-shadow:0 0 0 3px rgba(238,107,90,.25),0 0 22px rgba(238,107,90,.55),0 10px 18px rgba(0,0,0,.45)}
.tl-seg .lb{position:absolute;bottom:-4px;font-family:var(--display);font-weight:600;font-size:.66rem;color:#DCEEFB;white-space:nowrap}
.tl-seg .lb b{color:#8ED3FA;font-weight:600}
.tl-seg.x .lb{color:#FFD97A}
.tl-ticks{display:grid;grid-template-columns:repeat(8,1fr);margin-top:6px;font-family:var(--display);font-size:.58rem;color:rgba(220,238,251,.6)}
.tl-ticks span{text-align:center}
.tl-wrap{min-height:210px;position:relative}
/* ---- بلاطات المؤشرات الدائرية ---- */
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;padding:8px 2px 4px}
.gg{--p:0;--c:#3DBCF5;--c2:#8EE6FF;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(127,224,255,.16);border-radius:12px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.gg .ring{position:relative;width:86px;height:86px;border-radius:50%;
  background:conic-gradient(from -90deg,var(--c2) 0,var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) calc(var(--p)*1%) 100%);
  -webkit-mask:radial-gradient(circle,transparent 0 30px,#000 31px 43px,transparent 44px);mask:radial-gradient(circle,transparent 0 30px,#000 31px 43px,transparent 44px);
  filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 60%,transparent))}
.gg .core{position:absolute;top:14px;width:86px;height:86px;display:grid;place-items:center;pointer-events:none}
.gg .core b{font-family:var(--display);font-weight:900;font-size:1.55rem;color:#fff;line-height:1}
.gg .core small{font-family:var(--display);font-size:.62rem;color:#8ED3FA;font-weight:600;margin-top:2px}
.gg .lbl{font-family:var(--display);font-weight:600;font-size:.72rem;color:#DCEEFB;text-align:center;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.gg .lbl.ltr{direction:ltr}
.gg.max{--c:#FFD97A;--c2:#FFF1C2;border-color:rgba(255,217,122,.4);background:linear-gradient(180deg,rgba(255,217,122,.14),rgba(255,255,255,.02))}
.gg.max .core b{color:#FFE8A8}
.gg.alt{--c:#EE6B5A;--c2:#FFB3A8}
.gg .rk{position:absolute;top:8px;right:10px;font-family:var(--display);font-weight:800;font-size:.62rem;color:#0B1F3A;background:#8ED3FA;
  width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.gg.max .rk{background:#FFD97A}
@media(max-width:640px){
  .tl{padding:30px 10px 26px}
  .tl-segs{left:10px;right:10px}
  .tl-seg .lb{font-size:.56rem}
  .gauges{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .gg .ring,.gg .core{width:72px;height:72px}
  .gg .ring{-webkit-mask:radial-gradient(circle,transparent 0 25px,#000 26px 36px,transparent 37px);mask:radial-gradient(circle,transparent 0 25px,#000 26px 36px,transparent 37px)}
  .gg .core b{font-size:1.3rem}
}
/* ===== /v7 timeline+gauges ===== */

/* ===== v9: crests — no clipping box, uniform size, centred ===== */
.crest.has-logo{overflow:visible;background:transparent!important;box-shadow:none;padding:0;border-radius:0}

/* ===== /v9 ===== */

/* ===== v10: match-card details — readable meta line & scorers ===== */
.mmeta{font-size:.86rem;color:#34517A;font-weight:600;gap:8px;padding:2px 16px 12px;align-items:center;line-height:1.5}
.mmeta>span:not(.mstat):not(.ctag){color:#34517A}
.mmeta>span:first-of-type:not(.mstat),.mmeta .mstat+span{color:var(--head);font-weight:700;font-family:var(--display)}
.mstat{font-size:.72rem;padding:3px 10px}
.mstat.soon{color:#7A4B00;background:#FFF1CC;border-color:#F0C24B}
.ctag{font-size:.78rem;color:#34517A;font-weight:700}
.goals{font-size:.9rem;gap:8px;padding:12px 16px}
.gline{gap:10px;color:var(--head);font-weight:600}
.gmin{font-size:.86rem;font-weight:800;color:var(--zain-deep);min-width:42px}
.gline .crest{width:26px;height:26px}
@media(max-width:640px){.mmeta{font-size:.8rem}.goals{font-size:.84rem}}
/* ===== /v10 ===== */

/* ===== v11: assist pill separated from scorer ===== */
.gassist{display:inline-flex;align-items:center;gap:6px;margin-inline-start:14px;padding:2px 10px 2px 8px;border-radius:999px;
  background:#EEF4FB;border:1px solid #CFDDEE;color:#34517A;font-size:.78rem;font-weight:600;white-space:nowrap;vertical-align:middle;
  position:relative}
.gassist::before{content:"";width:1px;height:16px;background:#C5D3E4;position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%)}
.gassist i{font-style:normal;font-size:.68rem;font-weight:700;color:#1878BE;background:#fff;border-radius:999px;padding:0 6px;border:1px solid #BFD9F0}
@media(max-width:640px){.gassist{margin-inline-start:8px;padding:1px 8px 1px 6px;font-size:.72rem}}
/* ===== /v11 ===== */

/* ===== v12: white-edge clubs (الجهراء، الكويت) keep a hairline so the stripe stays visible ===== */
.match[data-hw]{box-shadow:var(--shadow),inset -1px 0 0 #C9D6E6}
.match[data-aw]{box-shadow:var(--shadow),inset 1px 0 0 #C9D6E6}
.match[data-hw][data-aw]{box-shadow:var(--shadow),inset -1px 0 0 #C9D6E6,inset 1px 0 0 #C9D6E6}
/* ===== /v12 ===== */

/* ===== v13: match meta as chips ===== */
.mmeta{gap:8px;padding:4px 16px 14px;align-items:center}
.mmeta>span{display:inline-flex;align-items:center;gap:6px;line-height:1;white-space:nowrap}
.mdate{font-family:var(--display);font-weight:700;color:var(--head);font-size:.9rem;margin-inline-end:4px;direction:ltr;unicode-bidi:isolate}
.mdate em{font-style:normal;color:#fff;background:var(--zain-deep);padding:4px 8px;border-radius:5px;font-size:.8rem;margin-left:8px}
.mround{background:#0B1F3A;color:#fff;font-weight:700;font-size:.74rem;padding:5px 11px;border-radius:5px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.mvenue,.mcomp,.mgoals{background:#EEF4FB;border:1px solid #CFDDEE;color:#34517A;font-weight:600;font-size:.76rem;padding:4px 10px;border-radius:999px}
.mvenue::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--zain-mid,#1878BE);flex:none}
.mcards{gap:4px;padding:3px 6px;border:1px solid #E1E8F1;border-radius:6px;background:#fff}
.mcards b{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.8rem;color:var(--head);padding:0 5px}
.mcards b+b{border-inline-start:1px solid #E1E8F1}
.mcards .cardpill{width:9px;height:13px;border-radius:2px;display:inline-block}
.mcards .cardpill.y{background:#F5C400} .mcards .cardpill.r{background:#E23B3B}
.mmeta .mstat{margin-inline-end:2px}
@media(max-width:640px){.mmeta{gap:6px}.mdate{font-size:.82rem}.mround,.mvenue,.mcomp,.mgoals{font-size:.7rem;padding:3px 8px}}
/* ===== /v13 ===== */

/* ===== v14: calmer meta — round & venue as separated text, pin icon for venue ===== */
.mround,.mvenue,.mcomp,.mgoals{background:none;border:0;border-radius:0;clip-path:none;padding:0 0 0 12px;margin:0;
  color:#34517A;font-weight:600;font-size:.82rem;border-inline-start:1px solid #D5DEE9;padding-inline-start:12px;padding-inline-end:0}
.mround{color:var(--zain-deep);font-weight:800;font-family:var(--display)}
.mround::before{display:none}

  if(!t) return null;
  let x = String(t).trim()
    .replace(/[\u0660-\u0669]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
    .replace(/[\u06F0-\u06F9]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48));
  const pm = /(م|مساء|مساءً|p\.?m\.?)/i.test(x);

  if(!mt) return null;
  let h = +mt[1]; const mi = +mt[2];
  if(h>23 || mi>59) return null;
  if(pm && h<12) h += 12;
  if(am && h===12) h = 0;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");

const matchGoals = m => GOALS.filter(g=>g.r===m.round &&
  ((g.sc===m.home&&g.cd===m.away)||(g.sc===m.away&&g.cd===m.home))).sort((a,b)=>abs(a)-abs(b));

/* ================= الحسابات ================= */
function standings(){
  const t = {};
  CLUBS.forEach(c=>t[c]={c,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[],hP:0,hPts:0,aP:0,aPts:0,cs:0,fts:0});
  playedMatches().forEach(m=>{
    const H=t[m.home], A=t[m.away]; if(!H||!A) return;
    H.P++;A.P++;H.GF+=m.hg;H.GA+=m.ag;A.GF+=m.ag;A.GA+=m.hg;
    H.hP++;A.aP++;
    if(m.ag===0)H.cs++; if(m.hg===0)A.cs++;
    if(m.hg===0)H.fts++; if(m.ag===0)A.fts++;
    if(m.hg>m.ag){H.W++;A.L++;H.Pts+=3;H.hPts+=3;H.form.push("w");A.form.push("l");}
    else if(m.hg<m.ag){A.W++;H.L++;A.Pts+=3;A.aPts+=3;A.form.push("w");H.form.push("l");}
    else {H.D++;A.D++;H.Pts++;A.Pts++;H.hPts++;A.aPts++;H.form.push("d");A.form.push("d");}
  });
  return Object.values(t).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.c.localeCompare(b.c,"ar"));
}
function scorers(){
  const p={};
  GOALS.forEach(g=>{ const k=g.p+"|"+g.sc; (p[k]??={n:g.p,c:g.sc,g:0,a:0}).g++; });
  GOALS.forEach(g=>{ if(!g.a) return; const k=g.a+"|"+g.sc; (p[k]??={n:g.a,c:g.sc,g:0,a:0}).a++; });
  return Object.values(p).sort((a,b)=>b.g-a.g||b.a-a.a);
}
function firstGoals(){
  return playedMatches().map(m=>{
    const gs=matchGoals(m);
    if(!gs.length) return {m,first:null,res:null};
    const first=gs[0].sc;
    const res = first===m.home ? (m.hg>m.ag?"فوز":m.hg===m.ag?"تعادل":"خسارة")
                               : (m.ag>m.hg?"فوز":m.hg===m.ag?"تعادل":"خسارة");
    return {m,first,res,conceded:first===m.home?m.away:m.home};
  });
}
function clubStats(c){
  const row = standings().find(x=>x.c===c);
  const gf = GOALS.filter(g=>g.sc===c), ga = GOALS.filter(g=>g.cd===c);
  const timing = PERIODS.map(p=>({p,f:gf.filter(g=>period(g)===p).length,a:ga.filter(g=>period(g)===p).length}));
  const sp = gf.filter(g=>g.cat==="كرات ثابتة").length;
  const fg = firstGoals();
  const scoredFirst = fg.filter(x=>x.first===c);
  const top = scorers().filter(p=>p.c===c)[0];
  const yc = CARDS.filter(x=>x.club===c && isYellow(x.type)).length;
  const rc = CARDS.filter(x=>x.club===c && isRed(x.type)).length;
  return {row,gf,ga,timing,sp,scoredFirst,top,yc,rc,
    pen:gf.filter(g=>g.det==="ركلة جزاء").length,
    head:gf.filter(g=>g.bp==="الرأس").length,
    late:gf.filter(g=>["76-90","90+"].includes(period(g))).length};
}
/* ===== دقائق اللعب والشباك النظيفة =====
   تُحسب من المباريات الملعّبة: التشكيلة الأساسية + التبديلات (خروج/دخول)
   والنتيجة. الأساسي يبدأ من 0، والبديل من دقيقة دخوله، وينتهي عند خروجه
   أو نهاية المباراة. الشباك النظيفة للاعب: لعب 60 دقيقة فأكثر ولم يستقبل
   فريقه هدفاً في تلك المباراة. */
/* المباراة 90 دقيقة (بلا وقت بدل ضائع) لأرقام نظيفة ومفهومة */
const MATCH_MIN = 90;
const capMin = x => Math.max(0, Math.min(MATCH_MIN, x));
function playerMatchMinutes(m, club, name){
  const comp = compOf(m);
  const starter = xiNames(m.round, comp, club).includes(name);
  const subs = matchSubs(m).filter(s=>s.club===club);
  const inSub  = subs.find(s=>s.in===name);
  const outSub = subs.find(s=>s.out===name);
  let start;
  if(starter) start = 0;
  else if(inSub) start = capMin(absMinute(inSub.h, inSub.m));
  else return 0;                                   /* لم يشارك */
  const end = outSub ? capMin(absMinute(outSub.h, outSub.m)) : MATCH_MIN;
  return Math.max(0, end - start);
}
/* هل اللاعب حارس مرمى؟ (من مركزه في الكشف) */
function isGoalkeeper(club, name){
  const e = (SQUADS[club]||[]).find(x=>sqName(x)===name);
  return !!e && sqPos(e)==="GK";
}
/* تجميع لكل لاعب: مباريات، دقائق، شباك نظيفة (على المسابقة المختارة).
   الشباك النظيفة للحرّاس فقط: حارس لعب 60 دقيقة فأكثر ولم يستقبل هدفاً. */
function playerPlay(){
  const out = {};
  MATCHES.filter(m=>!isUpcoming(m)).forEach(m=>{
    const comp = compOf(m);
    [m.home, m.away].forEach(club=>{
      const conceded = club===m.home ? +m.ag : +m.hg;
      const men = new Set();
      xiNames(m.round, comp, club).forEach(n=>men.add(n));
      matchSubs(m).filter(s=>s.club===club && s.in).forEach(s=>men.add(s.in));
      men.forEach(name=>{
        const mins = playerMatchMinutes(m, club, name);
        if(mins<=0) return;
        const k = name+"|"+club;
        const e = out[k] || (out[k] = {n:name, c:club, apps:0, mins:0, cs:0, gk:isGoalkeeper(club,name)});
        e.apps++; e.mins += mins;
        if(e.gk && conceded===0 && mins>=60) e.cs++;
      });
    });
  });
  return Object.values(out);
}
/* شباك نظيفة للنادي: مباريات ملعّبة لم يستقبل فيها هدفاً */
function clubCleanSheets(c){
  return MATCHES.filter(m=>!isUpcoming(m) && (m.home===c||m.away===c))
    .filter(m => (c===m.home ? +m.ag : +m.hg)===0).length;
}
function playerPlayOf(club){ return playerPlay().filter(p=>p.c===club).sort((a,b)=>b.mins-a.mins); }

function headlines(){
  const out=[];
  const byMargin=[...MATCHES].sort((a,b)=>Math.abs(b.hg-b.ag)-Math.abs(a.hg-a.ag))[0];
  if(byMargin) out.push({v:Math.abs(byMargin.hg-byMargin.ag),t:"أكبر فارق نتيجة",
    d:`${byMargin.home} ${byMargin.hg} - ${byMargin.ag} ${byMargin.away}`});
  const byGoals=[...MATCHES].sort((a,b)=>(b.hg+b.ag)-(a.hg+a.ag))[0];
  if(byGoals) out.push({v:byGoals.hg+byGoals.ag,t:"أعلى مباراة تسجيلاً",
    d:`${byGoals.home} ${byGoals.hg} - ${byGoals.ag} ${byGoals.away}`});
  const fast=[...GOALS].sort((a,b)=>abs(a)-abs(b))[0];
  if(fast) out.push({v:minLabel(fast),t:"أسرع هدف",d:`${fast.p} — ${fast.sc} ضد ${fast.cd}`});
  const late=[...GOALS].sort((a,b)=>abs(b)-abs(a))[0];
  if(late) out.push({v:minLabel(late),t:"أكثر الأهداف تأخراً",d:`${late.p} — ${late.sc} ضد ${late.cd}`});
  const sp=GOALS.filter(g=>g.cat==="كرات ثابتة").length;
  out.push({v:pct(sp,GOALS.length)+"%",t:"نصيب الكرات الثابتة",d:`${sp} من ${GOALS.length} هدفاً`});
  const second=GOALS.filter(g=>["46-60","61-75","76-90","90+"].includes(period(g))).length;
  out.push({v:pct(second,GOALS.length)+"%",t:"نصيب الشوط الثاني",d:`${gw(second)} بعد الاستراحة`});
  const fg=firstGoals().filter(x=>x.first);
  const wins=fg.filter(x=>x.res==="فوز").length;
  out.push({v:pct(wins,fg.length)+"%",t:"نسبة فوز صاحب الهدف الأول",
    d:`${wins} من ${mw(fg.length)} حُسمت لمن سجّل أولاً`});
  const pk=PENS.filter(p=>p.res==="سجلت").length;
  out.push({v:pk,t:"ركلات جزاء مسجّلة",d:`من أصل ${pw(PENS.length)} احتُسبت`});
  return out;
}

function heatColor(t){
  if(t<=0) return "rgba(143,166,196,.06)";
  const r=Math.round(95+(233-95)*t), g=Math.round(178+(185-178)*t), b=Math.round(232+(73-232)*t);
  return `rgba(${r},${g},${b},${(0.22+0.62*t).toFixed(2)})`;
}
function heatSVG(list){
  const counts={}; ZONES.forEach(z=>counts[z.k]=0);
  list.forEach(g=>{ if(counts[g.zone]!==undefined) counts[g.zone]++; });
  const mx=Math.max(1,...Object.values(counts));
  const cell=z=>{
    const n=counts[z.k], t=n/mx, f=heatColor(t);
    const cx = z.lx ?? (z.t==="c"? z.cx : z.x+z.w/2);
    const cy = z.ly ?? (z.t==="c"? z.cy : z.y+z.h/2);
    const shape = z.t==="c"
      ? `<circle class="zn" cx="${z.cx}" cy="${z.cy}" r="${z.r}" fill="${f}"><title>${z.k}: ${n}</title></circle>`
      : `<rect class="zn" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${f}"><title>${z.k}: ${n}</title></rect>`;
    return shape + (n>0?`<text x="${cx}" y="${cy}">${n}</text>`:"");
  };
  return `<div class="pitchwrap"><svg class="pitch" viewBox="-2 -4 104 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="خريطة أماكن التسجيل">
    ${ZONES.filter(z=>z.t==="r").map(cell).join("")}
    <rect class="ln" x="0" y="2" width="100" height="98"/>
    <rect class="ln" x="21" y="2" width="58" height="32"/>
    <rect class="ln" x="36" y="2" width="28" height="12"/>
    <path class="ln" d="M 34.5 34 A 17 17 0 0 0 65.5 34"/>
    <line class="ln" x1="0" y1="64" x2="100" y2="64" stroke-dasharray="2 2"/>
    <line class="goal" x1="44" y1="2" x2="56" y2="2"/>
    <circle cx="50" cy="24" r="0.9" fill="rgba(143,166,196,.7)"/>
    ${ZONES.filter(z=>z.t==="c").map(cell).join("")}
    <text class="sm" x="50" y="-1">المرمى</text>
    <text class="sm" x="9" y="50">يسار</text>
    <text class="sm" x="91" y="50">يمين</text>
    <text class="sm" x="50" y="95">مسافة بعيدة</text>
  </svg></div>
  <div class="hlegend"><span>أقل</span><span class="sc"></span><span>أكثر</span></div>`;
}
function zoneList(list){
  const c={}; list.forEach(g=>c[g.zone]=(c[g.zone]||0)+1);
  const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...rows.map(r=>r[1]));
  if(!rows.length) return '<span style="color:var(--slate)">لا توجد أهداف ضمن هذا التصنيف.</span>';
  return `<div class="bars">${rows.map(([k,n])=>`<div class="bar">
    <span style="font-size:.7rem">${esc(k)}</span>
    <span class="tr"><span class="fl" style="width:${n/mx*100}%"></span></span>
    <span class="n">${n}</span></div>`).join("")}</div>`;
}
