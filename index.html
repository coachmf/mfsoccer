function renderAnalysis(){
  const tg=GOALS.length;
  const per=PERIODS.map(p=>({p:plab(p),n:GOALS.filter(g=>period(g)===p).length}));
  const mxP=Math.max(1,...per.map(x=>x.n));
  const cats=[...new Set(GOALS.map(g=>g.det))].map(d=>({d,n:GOALS.filter(g=>g.det===d).length})).sort((a,b)=>b.n-a.n);
  const mxC=Math.max(1,...cats.map(x=>x.n));
  const zones=[...new Set(GOALS.map(g=>g.zone))].map(z=>({z,n:GOALS.filter(g=>g.zone===z).length})).sort((a,b)=>b.n-a.n);
  const mxZ=Math.max(1,...zones.map(x=>x.n));
  const fg=firstGoals().filter(x=>x.first);
  const w=fg.filter(x=>x.res==="فوز").length, d=fg.filter(x=>x.res==="تعادل").length, l=fg.filter(x=>x.res==="خسارة").length;
  const bp=[...new Set(GOALS.map(g=>g.bp))].map(b=>({b,n:GOALS.filter(g=>g.bp===b).length})).sort((a,b)=>b.n-a.n);
  const mxB=Math.max(1,...bp.map(x=>x.n));

  const bars=(arr,key,mx,alt,ltr)=>`<div class="bars">${arr.map(x=>`<div class="bar">
      <span class="${ltr?'ltr':''}" style="font-size:.72rem;color:var(--mist)">${esc(x[key])}</span>
      <span class="tr"><span class="fl${alt?" alt":""}" style="width:${x.n/mx*100}%"></span></span>
      <span class="n">${x.n}</span></div>`).join("")}</div>`;

  $("#v-analysis").innerHTML=`
    ${compChips()}
    <h2 class="sec">توزيع الأهداف على فترات المباراة</h2>
    <div class="card pad">${bars(per,"p",mxP,false,true)}</div>
    <p class="hint">أكثر ما يميّز هذا الموقع عن مواقع النتائج — لا أحد يوفّر هذا التفصيل للدوري الكويتي.</p>

    <h2 class="sec">الخريطة الحرارية لأماكن التسجيل</h2>
    <p class="hint">من أين تُسجَّل أهداف الدوري فعلياً؟ بدّل بين اللعب المفتوح والكرات الثابتة لترى الفرق.</p>
    <div class="card pad" id="heatLeague"></div>

    <h2 class="sec">ركلات الجزاء — خريطة المرمى</h2>
    <p class="hint">أين توضع ركلات الجزاء في هذا الدوري؟</p>
    <div class="card pad">${goalMap(PENS)}</div>

    <h2 class="sec">أثر الهدف الأول</h2>
    <div class="card pad">
      <div class="stat"><span>مباريات شهدت أهدافاً</span><span class="v">${fg.length}</span></div>
      <div class="stat"><span>فاز صاحب الهدف الأول</span><span class="v">${w} · ${pct(w,fg.length)}%</span></div>
      <div class="stat"><span>تعادل</span><span class="v">${d} · ${pct(d,fg.length)}%</span></div>
      <div class="stat"><span>قُلبت النتيجة عليه</span><span class="v">${l} · ${pct(l,fg.length)}%</span></div>
    </div>

    <h2 class="sec">طريقة التسجيل</h2>
    <div class="card pad">${bars(cats,"d",mxC)}</div>

    <h2 class="sec">منطقة التسجيل</h2>
    <div class="card pad">${bars(zones,"z",mxZ,true)}</div>

    <h2 class="sec">وضعية التسجيل</h2>
    <div class="card pad">${bars(bp,"b",mxB)}</div>`;
  renderLeagueHeat();
  wireComp($("#v-analysis"));
}

function squadRowsHTML(club){
  const a=SQUADS[club]||[];
  if(!a.length) return `<p class="hint" style="margin:2px 0 0">لا كشف لهذا النادي بعد.</p>`;
  const dup=squadDupNums(club);
  return a.map((x,i)=>{
    const p=sqPos(x), s=sqNum(x);
    return `<div class="sqrow ${p?"":"nopos"} pg-${posMain(x)||"x"}" data-i="${i}">
      <input type="text" class="sqno ${dup.has(s)?"dup":""}" inputmode="numeric" maxlength="3"
        value="${s||""}" placeholder="#" title="رقم القميص">
      <input type="text" class="sqn" value="${esc(sqName(x))}" spellcheck="false" placeholder="اسم اللاعب">
      <select class="sqp">${posSelectHTML(p)}</select>
      <button type="button" class="sqx" title="حذف">✕</button>
    </div>`;
  }).join("");
}
/* v23: club colour CSS vars for admin widgets (white-primary clubs use their secondary) */
function clubVars(c){
  const cc=(window.CLUB_COLORS||{})[c]; if(!cc) return "--cc:#0D4F92;--cc2:#7FE0FF;--cct:#fff;--ccb:transparent;--ccd:#083B70";
  const lum=h=>{const x=h.replace("#","");return (.2126*parseInt(x.slice(0,2),16)+.7152*parseInt(x.slice(2,4),16)+.0722*parseInt(x.slice(4,6),16))/255;};
  if(lum(cc[0])>.9) return `--cc:#FFFFFF;--cc2:${cc[1]};--cct:#0B1F3A;--ccb:${cc[1]};--ccd:#E6EBF2`;
  return `--cc:${cc[0]};--cc2:${cc[1]};--cct:#fff;--ccb:transparent;--ccd:color-mix(in srgb,${cc[0]} 70%,#000)`;
}

/* تحرير حيّ: كل تغيير ينعكس على SQUADS فوراً، وزر الحفظ يرفعه للسحابة */
const SQ = {
  arr(c){ return (SQUADS[c] = SQUADS[c] || []); },
  box(c){ return [...document.querySelectorAll(".squadbox")].find(b=>b.dataset.club===c); },
  set(c,i,n,p,s){ this.arr(c)[i]=sqItem(n,p,s); },
  paint(c){
    const b=this.box(c); if(!b) return;
    b.querySelector(".sqrows").innerHTML=squadRowsHTML(c);
    const n=(SQUADS[c]||[]).length, miss=squadMissing(c), lb=b.querySelector("summary label.lb");
    lb.innerHTML=`${crest(c)}<b>${esc(c)}</b> <span class="cnt">${n} لاعباً</span>`
      + (miss?` <span class="cnt miss">بلا مركز ${miss}</span>`:"");
  },
  name(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, v.trim().replace(/\s+/g," "), sqPos(x), sqNum(x)); },
  pos(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, sqName(x), v, sqNum(x)); this.paint(c); },
  num(c,i,v){ const x=this.arr(c)[i]; this.set(c,i, sqName(x), sqPos(x), parseInt(String(v).replace(/\D/g,""),10)||0); },
  del(c,i){ const a=this.arr(c); a.splice(i,1); if(!a.length) delete SQUADS[c]; this.paint(c); },
  add(c,n,p,s){
    n=(n||"").trim().replace(/\s+/g," "); if(!n) return false;
    const a=this.arr(c);
    if(a.some(x=>sqName(x)===n)){ toast("الاسم موجود في الكشف","err"); return false; }
    a.push(sqItem(n,p,parseInt(String(s).replace(/\D/g,""),10)||0)); this.paint(c); return true;
  },
  bulk(c,txt){
    const a=this.arr(c); let added=0;
    txt.split("\n").map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean).forEach(line=>{
      let s=0, p="";
      let t=line.replace(/^(\d{1,3})\s*[-.,]?\s*/, (m,d)=>{ s=+d; return ""; });   /* رقم في أول السطر */
      t=t.replace(/[\s,،-]+([A-Za-z]{1,3})$/, (m,code)=>{                          /* مركز في آخر السطر */
        const up=POS_ALIAS[code.toUpperCase()] || code.toUpperCase();
        if(POS_ALL.includes(up)){ p=up; return ""; }
        return m;
      });
      const n=t.trim().replace(/\s+/g," ");
      if(!n || a.some(x=>sqName(x)===n)) return;
      a.push(sqItem(n,p,s)); added++;
    });
    if(!a.length) delete SQUADS[c];
    this.paint(c);
    toast(added?`أُضيف ${added} لاعب`:"ما فيه أسماء جديدة", added?"ok":"err");
  },
  sort(c){
    const main={G:0,D:1,M:2,F:3,"":4}, det={};
    POS_ALL.forEach((k,i)=>det[k]=i);
    this.arr(c).sort((x,y)=>
      (main[posMain(x)]??4)-(main[posMain(y)]??4)
      || (det[sqPos(x)]??99)-(det[sqPos(y)]??99)
      || (sqNum(x)||999)-(sqNum(y)||999)
      || sqName(x).localeCompare(sqName(y),"ar"));
    this.paint(c);
  },
  clean(){   /* قبل الحفظ: حذف الفاضي والمكرر */
    Object.keys(SQUADS).forEach(c=>{
      const seen=new Set(), out=[];
      (SQUADS[c]||[]).forEach(x=>{
        const n=sqName(x).trim().replace(/\s+/g," ");
        if(!n || seen.has(n)) return;
        seen.add(n); out.push(sqItem(n, sqPos(x), sqNum(x)));
      });
      if(out.length) SQUADS[c]=out; else delete SQUADS[c];
    });
  }
};
function wireSquads(){
  const sqb=$("#saveSquads"); if(!sqb) return;

  const ext=$("#extractNums");
  if(ext) ext.onclick=()=>{
    const n=squadsExtractNums();
    if(!n){ toast("ما فيه أرقام مدموجة بالأسماء","err"); return; }
    CLUBS.forEach(c=>SQ.paint(c));
    toast(`انفصل رقم ${n} لاعب — احفظ الكشوفات للاعتماد`,"ok");
  };

  document.querySelectorAll(".squadbox").forEach(box=>{
    const c=box.dataset.club;
    const idx=el=>+el.closest(".sqrow").dataset.i;
    box.addEventListener("input", e=>{
      const t=e.target;
      if(t.classList.contains("sqn"))  SQ.name(c, idx(t), t.value);
      if(t.classList.contains("sqno")){ t.value=t.value.replace(/\D/g,""); SQ.num(c, idx(t), t.value); }
      if(t.classList.contains("sqnewno")) t.value=t.value.replace(/\D/g,"");
    });
    box.addEventListener("change", e=>{ if(e.target.classList.contains("sqp")) SQ.pos(c, idx(e.target), e.target.value); });
    box.addEventListener("click", e=>{
      const t=e.target;
      if(t.classList.contains("sqx")) return SQ.del(c, idx(t));
      if(t.classList.contains("sqsort")) return SQ.sort(c);
      if(t.classList.contains("sqbulk")){
        const ta=box.querySelector(".sqpaste");
        if(ta.style.display==="none"){ ta.style.display="block"; ta.focus(); t.textContent="أضف الأسماء الملصوقة"; }
        else { SQ.bulk(c, ta.value); ta.value=""; ta.style.display="none"; t.textContent="لصق دفعة"; }
        return;
      }
      if(t.classList.contains("sqaddbtn")){
        const no=box.querySelector(".sqnewno"), inp=box.querySelector(".sqnew"), sel=box.querySelector(".sqnewpos");
        if(SQ.add(c, inp.value, sel.value, no.value)){ inp.value=""; no.value=""; no.focus(); }
      }
    });
    box.addEventListener("keydown", e=>{
      if(e.key==="Enter" && (e.target.classList.contains("sqnew")||e.target.classList.contains("sqnewno"))){
        e.preventDefault(); box.querySelector(".sqaddbtn").click();
      }
    });
    box.addEventListener("toggle", ()=>{ box.open ? SQOPEN.add(c) : SQOPEN.delete(c); });
  });

  sqb.onclick=async()=>{
    SQ.clean();
    busy(sqb,true,"جارٍ الحفظ…");
    /* نأخذ أحدث بيانات الموسم ثم نُعيد كشوفاتي فوقها، فلا يُمحى عمل غيري ولا عملي */
    const reb = await rebaseOnCloud(()=>{ const mine=SQUADS; return ()=>{ SQUADS=mine; SQNUMS_FOUND=squadsExtractNums(); }; });   /* v27 */
    if(reb.changed) toast(`وصل تحديث من ${reb.by||"محرّر آخر"} — دُمج قبل الحفظ`,"busy");
    const ok=await persistData();
    busy(sqb,false);
    if(ok===true){ LASTSYNC=new Date();
      const ms=squadMissingAll();
      toast(`حُفظت الكشوفات · ${squadTotal()} لاعباً ✅${ms?` · ${ms} بلا مركز`:""}`,"ok"); }
    else if(ok==="pending") toast(SYNCMSG,"busy");
    else toast(SYNCMSG||"حُفظت محلياً، وتعذّر رفعها للسحابة","err");
    renderAdmin();
  };
}

}

}

async function loadVisits(days){

/* ================================================================
   تحدي التوقعات — تسجيل الجمهور، التوقعات، جداول الترتيب
   الاحتساب يتم من متصفح المالك (لا تتوفر Cloud Functions على Spark)
   ================================================================ */
const PT_EXACT = 5, PT_RIGHT = 2, PT_SCORER = 3;
let FAN = null;        /* {uid,name,email} المشترك العام */

const monthOf  = d => String(d||"").slice(0,7);

/* الجولة المفتوحة للتوقع: أقرب جولة فيها مباريات لم تُلعب بعد */
function openRound(){
  const up = MATCHES.filter(isUpcoming).filter(m=>kickoffTS(m)!==null);
  if(!up.length) return null;
  const r = Math.min(...up.map(m=>+m.round||0));
  const ms = MATCHES.filter(m=>(+m.round||0)===r)
    .sort((a,b)=>(kickoffTS(a) ?? Infinity) - (kickoffTS(b) ?? Infinity));
  const first = ms.find(m=>kickoffTS(m)!==null);
  return {round:r, matches:ms, lockMatch:first||null,
          lockAt:first?kickoffTS(first):null, month:monthOf(first?first.date:"")};
}
/* الجولة المعروضة للتوقع: ما فتحه المالك يدوياً، وإلا الجولة القادمة تلقائياً */
function predRound(){
  if(ROUNDMETA && ROUNDMETA.open){
    const ms = MATCHES.filter(m=>(+m.round||0)===+ROUNDMETA.round)
      .sort((a,b)=>(kickoffTS(a) ?? Infinity)-(kickoffTS(b) ?? Infinity));
    if(ms.length) return {round:+ROUNDMETA.round, matches:ms, lockMatch:ms[0],
                          lockAt:ROUNDMETA.lockAt, month:ROUNDMETA.month||monthOf(ms[0].date),
                          manual:true};
  }
  if(ROUNDMETA && ROUNDMETA.open===false) return null;   /* أُغلقت يدوياً */
  return openRound();
}
const isLocked = o => !o || o.lockAt===null || Date.now() >= o.lockAt;

async function loadRoundMeta(){
  if(!fbDb) return;
  try{
    const cur = await fbDb.collection("rounds").doc("current").get();
    if(!cur.exists){ ROUNDMETA=null; return; }
    const rk = cur.data().rk;
    const d = await fbDb.collection("rounds").doc(rk).get();
    if(!d.exists){ ROUNDMETA=null; return; }
    const v = d.data();
    ROUNDMETA = {round:v.round, month:v.month, open:v.open!==false,
                 lockAt: v.lockAt && v.lockAt.toMillis ? v.lockAt.toMillis() : null};
  }catch(e){ ROUNDMETA=null; }
}

/* ===== الحساب العام ===== */
function authErr(e){
  const c = (e && e.code) || "";
  if(c==="auth/invalid-email") return "صيغة البريد غير صحيحة";
  if(c==="auth/missing-password" || c==="auth/weak-password") return "كلمة المرور قصيرة — ٦ أحرف على الأقل";
  if(c==="auth/email-already-in-use") return "هذا البريد مسجّل مسبقاً — سجّل الدخول بدل إنشاء حساب";
  if(c==="auth/invalid-credential" || c==="auth/wrong-password") return "البريد أو كلمة المرور غير صحيحة";
  if(c==="auth/network-request-failed") return "تعذّر الاتصال — تحقق من الشبكة";
  if(c==="auth/operation-not-allowed" || c==="auth/admin-restricted-operation")
    return "طريقة الدخول غير مفعّلة — فعّلها من Authentication ← Sign-in method";
  if(c==="auth/unauthorized-domain")
    return "هذا النطاق غير معتمد — أضفه في Authentication ← Settings ← Authorized domains";
  if(c==="auth/too-many-requests") return "محاولات كثيرة — انتظر دقائق ثم أعد المحاولة";
  if(c==="auth/user-disabled") return "هذا الحساب موقوف";
  if(c==="auth/user-not-found") return "لا يوجد حساب بهذا البريد — أنشئ حساباً";
  if(c==="auth/internal-error" || c==="auth/web-storage-unsupported")
    return "متصفحك يمنع تخزين الجلسة — جرّب فتح الصفحة في المتصفح نفسه بدل تطبيق آخر";
  return "تعذّر الدخول: " + (c || "خطأ غير معروف");
}

   متصفحات داخل التطبيقات) تُحجب قناة Firestore فيبقى الوعد معلقاً

function boardRows(mode, key){
  const rows = BOARD && BOARD.rows ? BOARD.rows : {};
  const live = Object.entries(rows).filter(([,r])=>!r.h);
  /* اسم متكرر؟ نلحق به آخر أربعة أحرف من المعرّف حتى يميّز المشترك نفسه سطره */
  const seen = {};
  live.forEach(([,r])=>{ const n=r.n||"مشترك"; seen[n]=(seen[n]||0)+1; });
  return live.map(([uid,r])=>{

    return {
      uid,
      name: seen[n]>1 ? n+" · "+uid.slice(-4) : n,
      pts: mode==="season" ? (r.t||0) : mode==="round" ? ((r.r||{})[key]||0) : ((r.m||{})[key]||0)
    };
  }).sort((a,b)=> b.pts-a.pts || a.name.localeCompare(b.name,"ar"));
}

/* فتح أو إغلاق جولة التوقعات — قواعد الأمان تمنع أي توقع خارج هذه الحدود */
async function publishRound(round, lockMs, open){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const r = +round;
  if(!r) return {ok:false, msg:"اختر الجولة"};
  if(open && !lockMs) return {ok:false, msg:"حدد تاريخ ووقت الإقفال"};
  const ms = MATCHES.filter(m=>(+m.round||0)===r);
  const month = ms.length ? monthOf(ms.sort((a,b)=>(kickoffTS(a)??Infinity)-(kickoffTS(b)??Infinity))[0].date) : "";
  const rk = roundKey(r);
  try{
    await fbDb.collection("rounds").doc(rk).set({
      round:r, month, open:!!open,
      lockAt: firebase.firestore.Timestamp.fromDate(new Date(lockMs || Date.now())),
      lockLabel: new Date(lockMs || Date.now()).toISOString()
    });
    await fbDb.collection("rounds").doc("current").set({rk, round:r, open:!!open});
    ROUNDMETA = {round:r, month, open:!!open, lockAt: lockMs || Date.now()};
    return {ok:true, msg: open ? `فُتحت توقعات الجولة ${r} حتى ${stampLabel(lockMs)}`
                               : `أُغلقت توقعات الجولة ${r}`};
  }catch(e){ return {ok:false, msg:"تعذّر الحفظ — تأكد أن قواعد الأمان منشورة"}; }
}

/* احتساب جولة — يشغّله المالك بعد إدخال النتائج */
async function scoreRound(r){
  if(!isOwner || !fbDb) return {ok:false, msg:"غير مصرّح"};
  const ms = MATCHES.filter(m=>(+m.round||0)===+r && !isUpcoming(m));
  if(!ms.length) return {ok:false, msg:"لا توجد نتائج مسجّلة لهذه الجولة"};
  const key = m => m.home+"|"+m.away;
  const actual = {}; ms.forEach(m=>actual[key(m)] = [+m.hg||0, +m.ag||0]);
  const month = monthOf(ms[0].date);
  const scorers = new Set(GOALS.filter(g=>(+g.r||0)===+r).map(g=>g.p));

  let snap;
  try{ snap = await fbDb.collection("preds").where("rk","==",roundKey(r)).get(); }
  catch(e){ return {ok:false, msg:"تعذّرت قراءة التوقعات"}; }

  const rows = (BOARD && BOARD.rows) ? JSON.parse(JSON.stringify(BOARD.rows)) : {};
  let n = 0;
  snap.forEach(doc=>{
    const p = doc.data(); if(!p || !p.uid) return;
    let pts = 0;
    Object.entries(p.picks||{}).forEach(([k,v])=>{
      const a = actual[k]; if(!a) return;
      const ph=+v[0]||0, pa=+v[1]||0;
      if(ph===a[0] && pa===a[1]) pts += PT_EXACT;
      else if(Math.sign(ph-pa) === Math.sign(a[0]-a[1])) pts += PT_RIGHT;
    });
    if(p.scorer && scorers.has(p.scorer)) pts += PT_SCORER;
    const row = rows[p.uid] || {n:p.name||"مشترك", t:0, r:{}, m:{}};
    row.n = p.name || row.n;
    const prev = (row.r||{})[r] || 0;      /* إعادة الاحتساب لا تُضاعف النقاط */
    row.r = row.r || {}; row.m = row.m || {};
    row.r[r] = pts;
    row.m[month] = Math.max(0, (row.m[month]||0) - prev + pts);
    row.t = Math.max(0, (row.t||0) - prev + pts);
    rows[p.uid] = row; n++;
  });

  const body = {rows, lastRound:+r, lastMonth:month, updated:new Date().toISOString()};
  try{ await fbDb.collection("boards").doc(seasonId()).set(body); }
  catch(e){ return {ok:false, msg:"تعذّر حفظ جدول الترتيب"}; }
  BOARD = body;
  return {ok:true, msg:`احتُسبت الجولة ${r} لـ ${n} مشتركاً`};
}

function wirePredict(o, locked){
  const out=$("#fanOut"); if(out) out.onclick=()=>fbAuth.signOut();

  if(lm) lm.onclick=async()=>{
    const em=(prompt("البريد الإلكتروني:")||"").trim(); if(!em) return;
    const pw=(prompt("كلمة مرور جديدة (٦ أحرف فأكثر):")||"").trim(); if(!pw) return;
    await linkToEmail(em, pw);
  };
  const en=$("#editName");
  if(en) en.onclick=async()=>{
    const n=(prompt("الاسم الظاهر في جدول الترتيب:", FAN.name)||"").trim();
    if(!n || n===FAN.name) return;
    toast(await saveFanName(n.slice(0,24)) ? "حُدّث الاسم ✅" : "تعذّر تغيير الاسم","ok");
    renderPredict();
  };
  document.querySelectorAll("[data-bt]").forEach(b=>b.onclick=()=>{ BOARDTAB=b.dataset.bt; renderPredict(); });

  if(!o || locked) return;
  const picks = (MYPRED && MYPRED.picks) || {};
  o.matches.forEach(m=>{ const k=m.home+"|"+m.away; if(!picks[k]) picks[k]=[0,0]; });
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.pk, s=+b.dataset.side, d=+b.dataset.d;
    const cur = picks[k][s] + d;
    if(cur<0 || cur>9) return;
    picks[k][s]=cur;
    const el=document.querySelector(`[data-v="${CSS.escape(k+"|"+s)}"]`);
    if(el) el.textContent=cur;
  });
  const sc=$("#scClub");
  if(sc) sc.onchange=()=>{
    SCCLUB = sc.value;
    const ps=$("#predScorer");
    if(ps){ ps.innerHTML = scorerOptions(SCCLUB); ps.disabled = !SCCLUB; }
  };
  const sp=$("#sendPred");
  if(sp) sp.onclick=async()=>{
    const club = ($("#scClub")&&$("#scClub").value) || "";
    busy(sp,true,"جارٍ الإرسال…");
    const ok = await savePred(picks, $("#predScorer").value, club);
    busy(sp,false);
    if(ok){ toast("سُجّلت توقعاتك ✅","ok"); renderPredict(); }
  };
}

/* الإقلاع على مرحلتين:
   1) رسم فوري من نسخة الجهاز (آخر وثيقة موسم وصلت من السحابة) — بلا انتظار للشبكة.
   2) السحابة هي المرجع: تُقرأ بالتوازي مع الشعارات ولوحة الحساب ووصف الجولة (كانت
      خمس قراءات متتابعة قبل أول رسم، فبدا التطبيق فارغاً ثوانيَ وتبويب الفانتسي غائباً)،
      ثم تُطبَّق فقط إن اختلفت عن المرسوم. ساعات الأجهزة تختلف فلا يُعتمد على الطابع الزمني. */
async function bootLocal(){
  try{ const v=await localGet("zain_data"); if(!v) return false;
    const d=JSON.parse(v); if(!(d.clubs&&d.matches)) return false;
    LASTSTAMP=stampOf(d); applyData(d,"نسخة محلية محفوظة"); return true; }catch(e){ return false; }
}
async function bootData(cloudP, painted){
  const cloud = await cloudP;
  if(cloud && cloud.clubs && cloud.matches){
    const st=stampOf(cloud);
    if(st!==LASTSTAMP || !painted){ LASTSTAMP=st; applyData(cloud,"السحابة (Firestore)"); }
    cacheSeasonLocal(cloud);
    return;
  }
  if(painted) return;   /* لا سحابة، والجهاز رسم نسخته — تكفي */
  try{
    const res=await fetch("./data.json",{cache:"no-store"});
    if(res.ok){ const d=await res.json(); if(d.clubs&&d.goals&&d.matches){ LASTSTAMP=stampOf(d); applyData(d,"data.json المنشور"); } }
  }catch(e){}
}
/* تدفئة ملفات الفانتسي في ذاكرة خادم الخدمة بعد اكتمال الإقلاع: تبويب «فانتسي» يفتح صفحة
   كاملة (ورقة أنماط + ~20 ملف JS)، وكان أول فتح من التطبيق يبدو معلّقاً. الروابط تُقرأ من
   صفحة الفانتسي نفسها فلا يرتبط هذا برقم إصدارها. */
function warmFantasy(){
  try{
    if(navigator.connection && navigator.connection.saveData) return;
    if(!('serviceWorker' in navigator)) return;
    const run=()=>fetch(FANTASY_URL,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(html=>{
      const urls=[...html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+)"/g)].map(m=>FANTASY_URL+m[1]);
      urls.forEach(u=>fetch(u).catch(()=>{}));
    }).catch(()=>{});
    if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:8000}); else setTimeout(run,3000);
  }catch(e){}
}

(function(){

  const isPeriod=t=>{ const x=norm(t); return PER.includes(x) || PER.includes(x.split("-").reverse().join("-")) || x==="+45" || x==="+90"; };
  function readRows(b){
    return [...b.querySelectorAll(":scope > .bar")].map(r=>{
      const lblEl=r.querySelector(":scope > span:first-child"); const fl=r.querySelector(".fl"); const n=r.querySelector(".n");

  function timeline(rows){

    const vals=PER.map(k=>(byKey[k]||{num:0}).num);
    const mx=Math.max(1,...vals), total=vals.reduce((a,b)=>a+b,0);
    const cell=v=>{ const lv=v?Math.max(1,Math.round(v/mx*4)):0; return `<div class="gh-c f l${lv}${v&&v===mx?" top":""}">${v}</div>`; };

      <div class="gh-row per"><span></span>${PER.map(k=>`<div class="gh-p" dir="ltr">${k}</div>`).join("")}<span class="gh-tot lbl">المجموع</span></div>

<style>/* التطبيق: شريط التثبيت وتنبيه التحديث */
#pwaBar{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0) + 74px);z-index:60;
  display:none;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;
  background:var(--navy,#0B1F3A);color:#fff;box-shadow:0 10px 30px rgba(11,31,58,.35);
  font-size:.85rem;line-height:1.5;animation:pwaIn .25s ease}
#pwaBar.on{display:flex}
#pwaBar img{width:34px;height:34px;border-radius:9px;flex:none;background:#fff;padding:2px}
#pwaBar .txt{flex:1;min-width:0}
#pwaBar b{display:block;font-family:var(--display,inherit);font-size:.9rem}
#pwaBar .go{flex:none;background:#FFD97A;color:#0B1F3A;border:0;border-radius:9px;
  padding:7px 13px;font-weight:800;font-size:.82rem;font-family:inherit;cursor:pointer}
#pwaBar .x{flex:none;background:none;border:0;color:#9DB6D2;font-size:1.2rem;cursor:pointer;padding:0 2px}
@keyframes pwaIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(min-width:700px){#pwaBar{inset-inline:auto 20px;max-width:380px;bottom:20px}}
</style>
<div id="pwaBar" role="dialog" aria-live="polite">
  <img src="/icon-192.png" alt="">
  <div class="txt"><b>ثبّت التطبيق</b><span id="pwaMsg">افتحه من شاشتك مباشرة، ويعمل بلا إنترنت.</span></div>
  <button class="go" id="pwaGo">تثبيت</button>
  <button class="x" id="pwaX" aria-label="إغلاق">✕</button>
</div>

<script>
/* ===== التطبيق: خادم الخدمة + التثبيت + التحديث =====
   خادم الخدمة يجعل الموقع قابلاً للتثبيت كتطبيق على الآيفون
   والأندرويد ويفتح بلا إنترنت. لا يُسجَّل إلا على https أو localhost. */
(function(){
  var bar=document.getElementById('pwaBar'), msg=document.getElementById('pwaMsg'),
      go=document.getElementById('pwaGo'), x=document.getElementById('pwaX');
  var KEY='mf_pwa_hide';
  var hidden=function(){ try{ return (+localStorage.getItem(KEY)||0) > Date.now(); }catch(e){ return false; } };
  var hide=function(days){ try{ localStorage.setItem(KEY, Date.now()+(days||14)*864e5); }catch(e){}
                           bar.classList.remove('on'); };
  var installed=function(){
    return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  };
  x.onclick=function(){ hide(14); };

  /* أندرويد: المتصفح يعرض التثبيت الأصلي */
  var prompt=null;
  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); prompt=e;
    if(installed()||hidden()) return;
    msg.textContent='افتحه من شاشتك مباشرة، ويعمل بلا إنترنت.';
    go.textContent='تثبيت'; go.style.display='';
    bar.classList.add('on');
  });
  go.onclick=async function(){
    if(!prompt){ hide(1); return; }
    bar.classList.remove('on');
    prompt.prompt();
    try{ await prompt.userChoice; }catch(e){}
    prompt=null; hide(90);
  };
  addEventListener('appinstalled', function(){ hide(3650); });

  /* آيفون: لا توجد نافذة تثبيت — نشرح الخطوة مرة واحدة */
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var safari = iOS && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
  if(safari && !installed() && !hidden()){
    setTimeout(function(){
      msg.innerHTML='اضغط زر المشاركة <b style="display:inline">⬆</b> ثم «إضافة إلى الشاشة الرئيسية».';
      go.style.display='none';
      bar.classList.add('on');
    }, 4000);
  }

  /* التسجيل + تنبيه النسخة الجديدة */
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var sw=reg.installing; if(!sw) return;
          sw.addEventListener('statechange', function(){
            /* نسخة جاهزة وهناك نسخة تعمل الآن: نعرض التحديث بدل فرضه */
            if(sw.state==='installed' && navigator.serviceWorker.controller){
              if(typeof toast==='function')
                toast('صدرت نسخة جديدة — أعد التحميل لتظهر','busy',true);
              msg.textContent='نسخة جديدة جاهزة.';
              go.textContent='تحديث'; go.style.display='';
              go.onclick=function(){ sw.postMessage('SKIP_WAITING'); };
              bar.classList.add('on');
            }
          });
        });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(reloaded) return; reloaded=true; location.reload();
      });
      /* الصفحة تُقدَّم من الذاكرة فوراً ويُجلب الجديد في الخلفية؛ إن اختلف عُرض زر التحديث */
      navigator.serviceWorker.addEventListener('message', function(e){
        if(!e.data || e.data.type!=='HTML_UPDATED') return;
        if(typeof toast==='function') toast('صدرت نسخة جديدة — أعد التحميل لتظهر','busy',true);
        msg.textContent='نسخة جديدة جاهزة.';
        go.textContent='تحديث'; go.style.display='';
        go.onclick=function(){ location.reload(); };
        bar.classList.add('on');
      });
    });
  }
})();
</script>
</body>
</html>
