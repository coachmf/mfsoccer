<meta charset="utf-8">

<meta name="theme-color" content="#061529">
<script>
/* المظهر (فاتح/داكن): يُضبط قبل الرسم حتى لا تومض الصفحة — مفتاح mf_theme */
const THEME={KEY:'mf_theme',
  get(){ try{ const q=new URLSearchParams(location.search).get('theme'); if(q==='dark'||q==='light'){ localStorage.setItem(this.KEY,q); return q; }
      return localStorage.getItem(this.KEY)==='light'?'light':'dark'; }catch(e){ return 'dark'; } },   /* الافتراضي داكن */
  apply(t){ document.documentElement.setAttribute('data-theme',t);
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==='dark' ? '#081527' : '#061529';
    const b=document.getElementById('themeBtn'); if(b){ b.innerHTML = t==='dark' ? THEME.SUN : THEME.MOON; b.title = b.ariaLabel = (t==='dark' ? 'الوضع الفاتح' : 'الوضع الداكن'); } },
  set(t){ try{ localStorage.setItem(this.KEY,t); }catch(e){} this.apply(t); },
  toggle(){ const t=this.get()==='dark'?'light':'dark'; this.set(t); if(typeof toast==='function') toast(t==='dark' ? 'الوضع الداكن' : 'الوضع الفاتح'); },
  MOON:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  SUN:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'};
THEME.apply(THEME.get());
/* أي طباعة تُرسم بالوضع الداكن (منصور 2026-09-17؛ كانت فاتحة): قواعد الصفحة الأساسية فاتحة والداكن طبقة فوقها،
   ومع @media print الذي يفرض ورقاً أبيض كان النص الفاتح يخرج أبيض على أبيض فتظهر الصفحات فارغة.
   beforeprint يعمل مع Ctrl+P وقائمة المتصفح وwindow.print() معاً (منصور 2026-09-16) */
addEventListener('beforeprint',function(){ document.documentElement.setAttribute('data-theme','dark');   /* تقارير PDF بالوضع الداكن دائماً (منصور 2026-09-17) */
  document.querySelectorAll('img[loading="lazy"]').forEach(function(i){ i.loading='eager'; });   /* صور تحت الشاشة لم تُحمَّل بعد كانت تخرج فارغة */ });
addEventListener('afterprint', function(){ THEME.apply(THEME.get()); });
</script>
<script>
/* لقطة البيانات من CDN تبدأ قبل تحليل بقية الصفحة (~600 ك.ب) ومكتبة Firestore — انظر bootData.
   SNAP.get(id) يعيد وعداً بالوثيقة أو null؛ لا يرمي أبداً. */
const SNAP={_p:{},
  get(id, fresh){
    if(!fresh && this._p[id]) return this._p[id];
    const ctl=('AbortController' in window)?new AbortController():null;
    const t=setTimeout(()=>ctl&&ctl.abort(), 8000);
    return this._p[id]=fetch('/api/doc/'+id, {cache:'no-cache', signal:ctl&&ctl.signal})
      .then(r=>r.ok?r.json():null).catch(()=>null).finally(()=>clearTimeout(t)); }};
if(/^https?:$/.test(location.protocol)){ SNAP.get('2026-2027'); SNAP.get('assets'); }
/* بعد التحليل تكون الحالة interactive قبل تنفيذ سكربتات defer (Firebase) — فعلامة
   DOMContentLoaded هي الدليل الوحيد على جاهزيتها (انظر domReady) */
var DCL_FIRED=false; document.addEventListener('DOMContentLoaded', ()=>{ DCL_FIRED=true; }, {once:true});
</script>

<style>
:root{
  --ink:#061529; --navy-900:#0A2242; --navy-800:#0E2B52; --navy-600:#17417A;
  --sky:#5FB2E8; --sky-soft:#A9D8F5; --mist:#EDF3FA; --slate:#8FA6C4;
  --win:#35A47C; --draw:#8FA6C4; --loss:#E0644F; --sand:#E9B949;
  --display:'Vazirmatn',system-ui,sans-serif;
  --body:'Vazirmatn',system-ui,sans-serif;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--mist);font-family:var(--body);
  font-size:15px;line-height:1.65;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:9px}

/* ---------- الترويسة ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0A2242,rgba(6,21,41,.94));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(143,166,196,.18);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:1rem;color:#fff;white-space:nowrap}
.brand span{font-size:.68rem;color:var(--sky);letter-spacing:.06em}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:rgba(95,178,232,.12);border:1px solid rgba(95,178,232,.28);
  color:var(--sky);font-size:1rem;flex:none;
}
.iconbtn.on{background:var(--sand);border-color:var(--sand);color:#20180a}

/* شريط الدقائق - عنصر الهوية */
.rail{display:flex;gap:2px;height:3px;max-width:1180px;margin:10px auto 0}
.rail i{flex:1;background:rgba(143,166,196,.22);border-radius:9px}
.rail i.a{background:var(--sky)} .rail i.b{background:var(--sand)}

/* ---------- التنقل ---------- */
nav.tabs{
  position:fixed;bottom:0;right:0;left:0;z-index:50;
  background:rgba(10,34,66,.97);backdrop-filter:blur(14px);
  border-top:1px solid rgba(143,166,196,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .in{display:flex;max-width:1180px;margin:0 auto}
nav.tabs button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.62rem;color:var(--slate);border-top:2px solid transparent;transition:color .15s;
  min-height:var(--nav-h);justify-content:center;
}
nav.tabs button .ic{font-size:1.15rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--sky);border-top-color:var(--sky)}

/* ---------- التخطيط ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 14px 28px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--display);font-weight:600;font-size:1.05rem;color:#fff;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec::before{content:"";width:3px;height:16px;background:var(--sky);border-radius:9px}
.hint{font-size:.78rem;color:var(--slate);margin-bottom:12px}

.card{background:var(--navy-900);border:1px solid rgba(143,166,196,.18);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}

/* ---------- بطاقات المؤشرات ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(160deg,var(--navy-800),var(--navy-900));border:1px solid rgba(143,166,196,.18);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:auto auto 0 0;width:100%;height:2px;background:linear-gradient(90deg,var(--sky),transparent)}
.kpi .k{font-size:.7rem;color:var(--slate)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:.68rem;color:var(--sky)}

/* ---------- الشعار / الرمز ---------- */
.crest{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-family:var(--display);font-weight:700;font-size:.72rem;color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);background:#3B5578;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;transform-origin:center;transition:transform .15s}
.crest.has-logo{box-shadow:inset 0 0 0 1px rgba(143,166,196,.35);padding:2px}
.crest.lg{width:56px;height:56px;font-size:1.1rem;border-radius:14px}
.leaguemark{width:38px;height:38px;flex:none;border-radius:10px;background:#fff;padding:3px;
  object-fit:contain;box-shadow:0 0 0 1px rgba(143,166,196,.25)}

/* ---------- الجداول ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
thead th{background:var(--navy-800);color:var(--sky-soft);font-weight:600;font-size:.68rem;
  letter-spacing:.04em;padding:10px 6px;text-align:center;position:sticky;top:0}
thead th:first-child{text-align:start;padding-inline-start:12px}
tbody td{padding:9px 6px;text-align:center;border-bottom:1px solid rgba(143,166,196,.12);font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:start;padding-inline-start:12px}
tbody tr:nth-child(even){background:rgba(14,43,82,.4)}
tbody tr.top{box-shadow:inset 3px 0 0 var(--sky)}
tbody tr.rel{box-shadow:inset 3px 0 0 rgba(224,100,79,.7)}
.teamcell{display:flex;align-items:center;gap:8px}
.teamcell .pos{color:var(--slate);font-size:.72rem;width:16px;text-align:center;flex:none}
.teamcell b{font-weight:600;white-space:nowrap}
/* ===== الهدافون: منصّة أول ثلاثة + قائمة مرتّبة (2026-09-15) ===== */
.ts-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.ts-toggle{display:flex;background:var(--navy-900);border:1px solid var(--line);border-radius:8px;padding:2px}
.ts-toggle button{padding:5px 12px;font-family:var(--display);font-weight:600;font-size:.78rem;border:0;background:transparent;color:var(--slate);border-radius:6px;cursor:pointer}
.ts-toggle button.on{background:var(--blue-bg);color:var(--head)}
.ts-podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:14px}
.ts-pod{background:var(--navy-900);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s ease}
.ts-pod:hover{transform:translateY(-2px)}
.ts-pod:nth-child(1){order:2}.ts-pod:nth-child(2){order:1}.ts-pod:nth-child(3){order:3}
.ts-pod.first{background:linear-gradient(180deg,var(--blue-bg),var(--navy-900))}
.ts-pod.gold{border-color:rgba(233,185,73,.45)}
.ts-badge{position:static;margin:0 auto 8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;background:var(--navy-800);color:var(--head);border:1px solid var(--line)}
.ts-pod.gold .ts-badge{background:var(--sand);color:#0B1F3A;border-color:transparent}
.ts-pod.silver .ts-badge{background:#A0B2C6;color:#0B1F3A;border-color:transparent}
.ts-pod.bronze .ts-badge{background:#C8864B;color:#fff;border-color:transparent}
.ts-pod{overflow:hidden}
.ts-pod-bg{position:absolute;left:50%;top:42%;width:150%;max-width:none;transform:translate(-50%,-50%);opacity:.07;pointer-events:none;filter:grayscale(.2)}
.ts-pod>*:not(.ts-pod-bg){position:relative;z-index:1}
.ts-pod-av{position:relative;width:150px;height:188px;margin:0 0 8px;overflow:hidden;border-radius:10px;
  /* حواف ناعمة بدل قصّ الأكتاف بخط مستقيم (كان يظهر كصندوق خلف اللاعب في أندرويد) */
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%)}
.ts-pod.first .ts-pod-av{width:196px;height:245px}
/* كل القصّات بإطار موحّد (الوجه 190 من 1000 عند 85) → تكبير موحّد 1.55 من الأعلى فيظهر الثلاثة بحجم واحد وتُقصّ الخصور بحد الصندوق */
.ts-pod-img{width:100%;height:100%;object-fit:contain;object-position:top;transform:scale(1.55);transform-origin:top center}
.ts-pod-img.ts-crestfb{padding:14px;filter:none;transform:none}
.ts-pod-crest{position:absolute;bottom:6px;left:2px;width:34px;height:34px;background:#fff;border:1px solid var(--line);border-radius:50%;padding:3px;display:grid;place-items:center}
.ts-pod-crest img{width:100%;height:100%;object-fit:contain}
.ts-pod-info{width:100%;min-width:0}
.ts-pod-nm{font-weight:700;font-size:.95rem;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-pod-club{font-size:.75rem;color:var(--slate);margin:2px 0 4px}
.ts-pod-min{font-size:.68rem;color:var(--slate);opacity:.85;margin:0 0 10px;font-variant-numeric:tabular-nums}
.ts-pod-stat{display:flex;align-items:baseline;gap:5px;background:var(--navy-800);padding:4px 12px;border-radius:8px;border:1px solid var(--line)}
.ts-pod-stat b{font-size:1.4rem;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums}
.ts-pod.first .ts-pod-stat b{color:var(--sand);font-size:1.6rem}
.ts-pod-stat small{font-size:.7rem;color:var(--slate)}
.ts-list{background:var(--navy-900);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ts-head,.ts-row{display:grid;grid-template-columns:40px 1fr 130px 64px;align-items:center;padding:10px 14px;gap:8px}
.ts-head{background:var(--navy-800);border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--slate);position:sticky;top:0;z-index:2}
.ts-head span:last-child,.ts-val,.ts-head .ts-subs-h{text-align:left}
.ts-row{position:relative;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s ease}
.ts-row:last-child{border-bottom:0}
.ts-row:nth-child(even){background:rgba(127,150,180,.05)}
.ts-row:hover{background:var(--blue-bg)}
.ts-bar{position:absolute;bottom:0;right:0;height:2px;background:var(--zain-mid);opacity:.6}
.ts-rk{font-weight:700;font-size:.85rem;color:var(--slate);font-variant-numeric:tabular-nums}
.ts-row.top .ts-rk{color:var(--sand)}
.ts-pl{display:flex;align-items:center;gap:10px;min-width:0}
.ts-av{width:56px;height:56px;flex:none;display:grid;place-items:end center;overflow:visible;margin:-8px 0}  /* قصّة الوجه كما في جدول الدقائق (منصور 2026-09-15) */
.ts-av img{width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ts-av img.ts-crestfb{width:38px;height:38px;object-fit:contain;padding:5px;background:#fff;border-radius:50%;border:1px solid var(--line);filter:none;align-self:center}
.ts-pl .crest{width:26px;height:26px;border-radius:7px;flex:none}
.ts-pi{display:flex;flex-direction:column;min-width:0}
.ts-pi b{font-weight:700;font-size:.88rem;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-pi small{font-size:.73rem;color:var(--slate)}
.ts-subs{display:flex;gap:10px;justify-content:flex-end;font-size:.75rem;color:var(--mist);font-variant-numeric:tabular-nums}
.ts-sub i{font-style:normal;color:var(--slate);font-size:.68rem}
.ts-val{font-size:1.2rem;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums}
.ts-empty{padding:16px;text-align:center;color:var(--slate)}
.ts-more[hidden]{display:none}
.ts-hid{display:none}
.ts-morebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:0;border-top:1px solid var(--line);background:var(--navy-800);color:var(--head);font-family:var(--display);font-weight:700;font-size:.8rem;cursor:pointer}
.ts-morebtn small{font-size:.7rem;color:var(--slate);font-variant-numeric:tabular-nums}
.ts-morebtn:hover{background:var(--blue-bg)}
.ts-morebtn.open{color:var(--slate)}
.card>.ts-morebtn{border-radius:0 0 14px 14px}
@media (max-width:640px){
  .ts-podium{grid-template-columns:1fr;gap:8px}
  .ts-pod:nth-child(n){order:0}
  .ts-pod{flex-direction:row;justify-content:space-between;text-align:right;padding:10px 12px;gap:10px}
  .ts-badge{margin:0;flex:none}
  .ts-pod-av,.ts-pod.first .ts-pod-av{width:96px;height:120px;margin:0;flex:none}
  .ts-pod-bg{width:64%;left:24%;top:50%;opacity:.06}
  .ts-pod-info{flex:1}
  .ts-pod-club{margin-bottom:0}
  .ts-pod-min{margin:2px 0 0}
  .ts-pod-stat{flex:none}
  .ts-head,.ts-row{grid-template-columns:32px 1fr 54px;padding:10px 10px}
  .ts-subs,.ts-subs-h{display:none}
}
.pillrow{display:flex;gap:3px;justify-content:center}
.pl{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:.62rem;font-weight:700}
.pl.w{background:var(--win);color:#03150e}.pl.d{background:var(--draw);color:#0d1a2b}.pl.l{background:var(--loss);color:#2a0a05}

/* ---------- المباريات ---------- */
.match{border-radius:var(--r);background:var(--navy-900);border:1px solid rgba(143,166,196,.18);margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.mside{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mside.away{flex-direction:row-reverse;text-align:left}
.mside b{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;
  background:var(--navy-800);border-radius:9px;padding:3px 12px;flex:none;letter-spacing:.05em}
.score.soon{font-size:.95rem;color:var(--sand);background:rgba(233,185,73,.12);
  border:1px solid rgba(233,185,73,.35);direction:ltr}
.match.soon{border-color:rgba(233,185,73,.35);background:rgba(14,43,82,.45)}
/* ---- ملاحظة المباراة ---- */
.mnote{margin:0 14px 10px;padding:7px 11px;border-radius:9px;font-size:.78rem;line-height:1.6;
  color:#7A4B00;background:#FFF6E0;border:1px solid rgba(233,185,73,.5)}
.mnote::before{content:"ملاحظة: ";font-weight:700}
/* ---- المناسبات وفترات التوقف ---- */
.evlist{display:grid;gap:7px;margin-top:10px}
.evrow{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;
  background:rgba(95,178,232,.07);border:1px solid rgba(95,178,232,.22)}
.evrow.brk{background:rgba(233,185,73,.1);border-color:rgba(233,185,73,.4)}
/* بلا direction:ltr عمداً: التاريخ عربي مختلط بأرقام، ولو فُرض LTR وقعت
   البداية يساراً فتُقرأ آخراً — «من 6 أكتوبر إلى 21 سبتمبر». */
.ev-d{flex:none;font-size:.7rem;font-weight:700;color:var(--sky,#5FB2E8);min-width:82px;
  text-align:center;padding-top:1px;line-height:1.5}
.evrow.brk .ev-d{color:#B8860B}
.ev-t{flex:1;min-width:0;font-size:.82rem;line-height:1.6;color:var(--head,#0B1F3A)}
.ev-k{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;
  background:rgba(11,31,58,.08);color:var(--slate,#8FA6C4);margin-inline-start:6px}
.ev-n{display:block;font-size:.72rem;color:var(--slate,#8FA6C4);margin-top:2px}
.ev-match{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px 8px;vertical-align:middle}
.ev-team{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ev-team .crest{width:24px;height:24px;border-radius:7px;font-size:.6rem}
.ev-flag{width:24px;height:17px;border-radius:4px;object-fit:cover;flex:none;box-shadow:inset 0 0 0 1px rgba(11,31,58,.15)}
.ev-x{color:var(--slate,#8FA6C4);font-weight:400}
.ev-comp{display:inline-block;font-style:normal;font-size:.74rem;color:var(--slate,#8FA6C4);margin-inline-start:8px}
.cday.evd{box-shadow:inset 0 -3px 0 #E9B949}
/* ---- المباريات الجارية على الرئيسية ---- */
.livewrap{background:#fff;border:1px solid var(--line,rgba(143,166,196,.18));border-radius:14px;
  overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow,0 6px 18px rgba(11,31,58,.06))}
.live-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;font-family:var(--display,inherit);
  font-weight:800;font-size:.82rem;color:#fff;background:linear-gradient(90deg,#C62828,#8E1B3A)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:livePulse 1.6s infinite}
@keyframes livePulse{70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.liverow{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:11px 14px;cursor:pointer;text-align:inherit;font-family:inherit;
  border-top:1px solid var(--line,rgba(143,166,196,.14))}
.liverow:first-of-type{border-top:0}
.liverow:hover{background:rgba(198,40,40,.05)}
.lv-side{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.lv-side.a{flex-direction:row-reverse}
.lv-side b{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--head,#0B1F3A)}
.lv-sc{flex:none;font-family:var(--display,inherit);font-weight:800;font-size:1rem;
  background:var(--navy,#0B1F3A);color:#fff;border-radius:7px;padding:3px 11px;min-width:56px;text-align:center}
.lv-min{flex:none;font-size:.72rem;font-weight:700;color:#C62828;min-width:46px;text-align:center;
  direction:ltr;unicode-bidi:isolate}
@media(max-width:480px){
  .liverow{gap:6px;padding:10px}
  .lv-side .crest,.lv-side .crest.has-logo{width:26px;height:26px}
  .lv-side b{font-size:.78rem}
  .lv-sc{font-size:.9rem;padding:2px 8px;min-width:46px}
  .lv-min{min-width:38px;font-size:.68rem}
}
/* ---- زر التفاصيل وطيّها ---- */
.mtog{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  border:0;border-top:1px solid var(--line,rgba(143,166,196,.18));background:transparent;
  padding:9px 12px;color:var(--sky,#5FB2E8);font-family:var(--display,inherit);

  padding:1px 7px;font-size:.72rem}
.mtog .chev{width:0;height:0;border-inline:4.5px solid transparent;
  border-top:5.5px solid currentColor;transition:transform .18s}
.mtog.on .chev{transform:rotate(180deg)}
.mdet[hidden]{display:none}
/* ---- قائمة الإنذارات ---- */
.cd-wrap{border-top:1px dashed rgba(143,166,196,.22);padding:10px 14px;display:grid;gap:6px}
.cd-hd{font-size:.72rem;color:var(--slate,#8FA6C4);margin-bottom:2px}
.cd-row{display:flex;align-items:center;gap:8px;font-size:.8rem}
.cd-min{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;
  color:var(--sky,#5FB2E8);font-weight:600;min-width:34px;font-size:.74rem}
.cd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* الشاشات الضيقة: اسم النادي كاملاً بلا قطع. نُفسح له بتصغير الشعار
   وحشو النتيجة والفجوات — «الصليبخات» أطولها وهي المقياس. */
@media(max-width:480px){
  .match .mhead{gap:6px}
  .match .mside{gap:5px}
  .match .mside .crest,.match .mside .crest.has-logo{width:30px;height:30px;border-radius:7px}
  .match .mside b{font-size:.88rem}
  .match .score{font-size:1.05rem;padding:3px 7px;letter-spacing:0}
}
@media(max-width:360px){
  .match .mside .crest,.match .mside .crest.has-logo{width:26px;height:26px}
  .match .mside b{font-size:.8rem}
  .match .score{font-size:.95rem;padding:3px 5px}
}
.mstat{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mstat.soon{color:var(--sand);background:rgba(233,185,73,.14);border:1px solid rgba(233,185,73,.4)}
.mstat.live{color:#EAFBF3;background:#1D6B4E;border:1px solid #35A47C}
.cday.soon{border-color:rgba(233,185,73,.55);background:rgba(233,185,73,.13)}
.cday .dd.g{color:var(--sand)}
.mmeta{padding:0 14px 10px;font-size:.7rem;color:var(--slate);display:flex;gap:10px;flex-wrap:wrap}
.goals{border-top:1px solid rgba(143,166,196,.14);padding:10px 14px;display:grid;gap:6px;font-size:.8rem}
.gline{display:flex;align-items:center;gap:8px}
/* التبديلات: سهم أخضر لأعلى للداخل، وأحمر لأسفل للخارج */
.goals.subs{border-top:1px dashed rgba(143,166,196,.2)}
.subhd{color:var(--slate);font-size:.72rem;letter-spacing:.02em;margin-bottom:2px}
.subpair{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.subin,.subout{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.subin{color:var(--win)}
.subout{color:var(--loss)}
.arw{width:0;height:0;flex:none;border-left:4.5px solid transparent;border-right:4.5px solid transparent}
.arw.up{border-bottom:7px solid var(--win)}
.arw.dn{border-top:7px solid var(--loss)}
@media(max-width:420px){ .subpair{flex-direction:column;align-items:flex-start;gap:2px} }
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.gmin{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--sky);font-weight:600;min-width:38px;font-size:.75rem}
.gtag{font-size:.62rem;color:var(--slate);border:1px solid rgba(143,166,196,.3);border-radius:5px;padding:0 5px;white-space:nowrap}

/* ---------- الرسوم ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;font-size:.78rem}
.bar .tr{display:block;background:rgba(143,166,196,.15);border-radius:9px;height:9px;overflow:hidden}
.bar .fl{display:block;height:100%;min-width:3px;border-radius:9px;background:linear-gradient(90deg,var(--sky),var(--navy-600))}
.bar .fl.alt{background:linear-gradient(90deg,var(--loss),#7a2f24)}
.bar .n{text-align:left;font-variant-numeric:tabular-nums;color:var(--slate);font-size:.75rem}

.timing{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;align-items:end;height:130px;margin-top:6px}
.tcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px}
.tcol .bx{border-radius:5px 5px 0 0;min-height:2px}
.tcol .for{background:var(--sky)} .tcol .ag{background:rgba(224,100,79,.75);border-radius:0 0 5px 5px}
.tlabels{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px;font-size:.58rem;color:var(--slate);text-align:center}

/* ---------- المختارات ---------- */
select,input[type=text],input[type=password]{
  width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:11px 12px;font-family:var(--body);font-size:.92rem;
}
select:focus,input:focus{outline:2px solid var(--sky);outline-offset:1px}
label.lb{display:block;font-size:.72rem;color:var(--slate);margin:0 0 6px}
.squadbox{padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.squadbox:last-of-type{border:0}
.squadbox textarea{width:100%;background:var(--navy-800);border:1px solid rgba(143,166,196,.3);
  color:#fff;border-radius:10px;padding:10px 12px;font-family:var(--body);font-size:.86rem;
  line-height:1.8;resize:vertical}
.squadbox textarea:focus{outline:2px solid var(--sky);outline-offset:1px}
/* أكورديون كشوفات الأندية */
details.squadbox{padding:0;overflow:hidden}
details.squadbox summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;gap:8px;user-select:none}
details.squadbox summary::-webkit-details-marker{display:none}
details.squadbox summary::after{content:"⌄";margin-inline-start:auto;color:var(--slate);
  font-size:1rem;transition:transform .18s;line-height:1}
details.squadbox[open] summary::after{transform:rotate(180deg)}
details.squadbox summary:hover{background:rgba(95,178,232,.06)}
details.squadbox > .sqbody{padding:0 13px 13px}
/* أكورديون المباريات حسب الجولة في الإدارة */
details.rndbox{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:10px}
details.rndbox:last-of-type{margin-bottom:0}
details.rndbox summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;
  gap:9px;user-select:none;font-size:.95rem}
details.rndbox summary::-webkit-details-marker{display:none}
details.rndbox summary b{font-weight:700}
details.rndbox summary::after{content:"⌄";margin-inline-start:auto;color:var(--slate);
  font-size:1.1rem;transition:transform .18s;line-height:1}
details.rndbox[open] summary::after{transform:rotate(180deg)}
details.rndbox[open] summary{border-bottom:1px solid var(--line)}
details.rndbox summary:hover{background:rgba(95,178,232,.06)}
details.rndbox summary .rc{font-size:.68rem;color:var(--slate);background:rgba(143,166,196,.16);
  padding:3px 9px;border-radius:20px;font-weight:600}
details.rndbox summary .rc.soon{color:#B57A15;background:rgba(233,185,73,.18)}
details.rndbox > .rndbody{padding:2px 14px 10px}
details.squadbox summary label.lb{margin:0;cursor:pointer}
/* خانة رقم اللاعب في نماذج المباريات */
.pfld .prow{display:grid;grid-template-columns:60px 1fr;gap:6px}
.pfld .pnum{text-align:center;font-variant-numeric:tabular-nums}
.pfld .phint{font-size:.64rem;color:#E0B23C;min-height:11px;margin-top:3px}
/* صفوف الكشف: رقم + اسم + مركز + حذف */
.sqrow{display:grid;grid-template-columns:56px 1fr 92px 32px;gap:6px;align-items:center;margin-bottom:5px}
.sqrow input,.sqrow select{padding:8px 10px;font-size:.84rem;border-radius:9px}
.sqrow .sqno{text-align:center;font-variant-numeric:tabular-nums;padding:8px 4px}
.sqrow .sqno.dup{border-color:rgba(224,100,79,.6)}
.sqrow select{background:var(--navy-800);padding:8px 6px}
.sqrow.nopos select{border-color:rgba(224,178,60,.55)}
.sqrow .sqx{border:1px solid rgba(143,166,196,.28);border-radius:9px;color:var(--slate);
  font-size:.9rem;line-height:1;height:34px}
.sqrow .sqx:hover{border-color:rgba(224,100,79,.5);color:var(--loss)}
.sqadd{display:grid;grid-template-columns:56px 1fr 92px 78px;gap:6px;margin-top:8px}
.sqadd input,.sqadd select{padding:8px 10px;font-size:.84rem;border-radius:9px}
.sqadd .sqnewno{text-align:center;padding:8px 4px}
.sqadd button{border:1px solid rgba(95,178,232,.45);border-radius:9px;color:var(--sky);font-size:.78rem}
@media(max-width:520px){
  .sqrow{grid-template-columns:52px 1fr 32px}

}
.sqtools{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.sqtools button{border:1px solid rgba(143,166,196,.28);border-radius:8px;color:var(--slate);
  font-size:.68rem;padding:4px 9px}
.cnt.miss{color:#E0B23C;background:rgba(224,178,60,.12)}
.staffrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(143,166,196,.16)}
.staffrow:last-of-type{border:0}
.staffrow .sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.staffrow .sm b{font-size:.86rem;color:#fff;font-weight:600}
.staffrow .sm span{font-size:.72rem;color:var(--slate);direction:ltr;text-align:right}

.uidbox{background:var(--navy-800);border:1px solid rgba(95,178,232,.3);border-radius:10px;
  padding:12px;margin-bottom:14px}
.uidbox code{display:block;direction:ltr;text-align:left;font-size:.76rem;color:var(--sky);
  background:rgba(6,21,41,.6);border-radius:7px;padding:9px 10px;margin-bottom:9px;

.cnt.off{color:var(--loss);background:rgba(224,100,79,.12);border-color:rgba(224,100,79,.4)}
.cnt{display:inline-block;font-size:.62rem;color:var(--sky);background:rgba(95,178,232,.12);

.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(143,166,196,.16);font-size:.85rem}
.stat:last-child{border:0}

.head-story{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,166,196,.16);align-items:flex-start}

.head-story .tx span{font-size:.76rem;color:var(--slate)}

.note{background:rgba(233,185,73,.09);border:1px solid rgba(233,185,73,.32);border-right:3px solid var(--sand);

.note b{color:var(--sand)}

.btn{background:var(--sky);color:#04121f;font-weight:600;border-radius:10px;padding:11px 16px;font-size:.88rem;width:100%;text-align:center}

.badge.warn{color:var(--sand);border-color:rgba(233,185,73,.45);background:rgba(233,185,73,.1)}

.segbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.compbar{border-bottom:1px solid rgba(143,166,196,.16);padding-bottom:12px}

.roundstrip::-webkit-scrollbar{display:none}

.pav.pav-cut{border-radius:0;background:none;box-shadow:none}

.fld label{display:block;font-size:.68rem;color:var(--slate);margin-bottom:4px}

.addbtn{width:100%;border:1px dashed rgba(95,178,232,.5);border-radius:10px;padding:10px;

/* محرّر شكل التشكيلة: ملعب أخضر، اللاعب نقطة تُسحب بالإصبع أو الفأرة */
.shapes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.shapebox{border:1px solid rgba(143,166,196,.22);border-radius:12px;padding:10px;
  background:rgba(14,43,82,.35)}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}

  border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit;
  font-size:.78rem;font-variant-numeric:tabular-nums}
/* ملعب التشكيلة — واحد يخدم المحرّر وصفحة المباراة وملف النادي.
   الاسم xipitch لا pitch: الأخير محجوز لخريطة أماكن التسجيل. */
.xipitch{position:relative;container-type:inline-size;border-radius:16px;overflow:hidden;
  user-select:none;max-width:400px;margin-inline:auto;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.10),transparent 60%),
    radial-gradient(90% 50% at 50% 100%,rgba(0,0,0,.35),transparent 65%),
    linear-gradient(180deg,#1b6f3d 0%,#135a30 55%,#0e4726 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15)}
.xipitch.half{aspect-ratio:5/7}          /* فريق واحد — أطول قليلاً لتتّسع البطاقات */
.xipitch.full{aspect-ratio:1/2}          /* الفريقان وجهاً لوجه: أطول ليتّسع للـ22 بطاقة */
/* على ملعب الفريقين: دوائر وأسماء وشارات أصغر لتخفيف الازدحام */
.xipitch.full .pp-dot{width:clamp(19px,7cqw,26px);height:clamp(19px,7cqw,26px);
  font-size:clamp(9px,2.9cqw,12px);border-width:1.25px}
.xipitch.full .pp-nm{font-size:clamp(7.5px,2.5cqw,10.5px);gap:1px}
.xipitch.full .pp-b .ico-ball,.xipitch.full .pp-b .ico-boot{width:clamp(7px,2.2cqw,10px);height:clamp(7px,2.2cqw,10px)}
/* الهدف والصناعة في الزاوية السفلى اليمنى مثل بطاقة الفريق الواحد؛ top/left:auto ضروري وإلا امتدّت الشارة على البطاقة كلها (خطأ 2026-09-15) */
.xipitch.full .pp-b.goal{top:auto;left:auto;bottom:-5px;right:-5px}
.xipitch.full .pp-b.assist{bottom:-5px;right:-5px}
.xipitch.full .pp-b.goal + .pp-b.assist{bottom:calc(-5px + 1.5em)}
.xipitch.full .pp-b.card{width:clamp(6px,1.7cqw,8px);height:clamp(8px,2.4cqw,10px)}
.xipitch.full .pp-b.off{width:clamp(9px,2.5cqw,12px);height:clamp(9px,2.5cqw,12px)}
.pp-spot.cmp{gap:1px}
.xipitch::before,.xipitch::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:44%;height:11%;border:1px solid rgba(255,255,255,.28);pointer-events:none;z-index:0}
.xipitch .pp-spot{z-index:2}   /* البطاقات فوق خطوط الملعب دائماً (كان خط منطقة الجزاء يمرّ فوق وجه الحارس) */
.xipitch::before{top:0;border-top:0}
.xipitch::after{bottom:0;border-bottom:0}
.xip-lines{position:absolute;inset:0;pointer-events:none;
  --l:rgba(255,255,255,.30);
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 8%,transparent 8% 16%),
    radial-gradient(60% 40% at 50% 50%,rgba(255,255,255,.04),transparent 70%),
    linear-gradient(var(--l),var(--l)) 50% 50%/100% 1px no-repeat,
    linear-gradient(var(--l),var(--l)) 0 50%/1px 100% no-repeat,
    linear-gradient(var(--l),var(--l)) 100% 50%/1px 100% no-repeat}
.xip-lines::before{content:"";position:absolute;left:50%;top:50%;
  width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid rgba(255,255,255,.28)}
.pp-spot{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:2px;text-align:center}
.pp-dot{width:clamp(22px,9cqw,34px);height:clamp(22px,9cqw,34px);border-radius:50%;
  display:grid;place-items:center;background:var(--pc);color:var(--pt,#0B1F3A);font-weight:800;
  font-size:clamp(10px,3.4cqw,14px);line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);
  border:1.5px solid var(--pe,rgba(255,255,255,.85));font-variant-numeric:tabular-nums}
/* بطاقة اللاعب على الملعب: خلفية بتدرّج لون النادي، القصّة داخلها، الرقم في الزاوية */
.pp-card{position:relative;display:block;width:clamp(44px,16cqw,66px);aspect-ratio:4/5;border-radius:10px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%),
    linear-gradient(165deg,var(--pc) 0%,var(--pd,#0B1F3A) 100%);
  border:1.5px solid var(--pe,rgba(255,255,255,.85));
  box-shadow:0 6px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);overflow:visible;
  transition:transform .15s ease}
.pp-card:hover{transform:translateY(-2px)}
.pp-card .pp-img{position:absolute;left:0;right:0;top:0;width:100%;height:78%;object-fit:contain;object-position:bottom center;
  border-radius:8px 8px 0 0;pointer-events:none}
/* الاسم شريط داخل البطاقة من الأسفل — فلا يزيد ارتفاع العقدة ولا تتداخل الخطوط */
.pp-card .pp-nm{position:absolute;left:0;right:0;bottom:0;height:23%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(6,16,34,.55),rgba(6,16,34,.92));backdrop-filter:blur(2px);color:#fff;
  font-size:clamp(7px,2.4cqw,10px);font-weight:700;padding:0 3px;letter-spacing:.1px;
  border-radius:0 0 9px 9px;text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none}
.pp-card.nophoto .pp-num{position:absolute;inset:0 0 22% 0;display:grid;place-items:center;width:auto;height:auto;background:none;
  color:var(--pt,#fff);font-size:clamp(13px,4.6cqw,20px);padding:0;border-radius:8px 8px 0 0}
.pp-card .pp-num{position:absolute;top:-11px;right:-7px;min-width:1.6em;padding:1px 3px;border-radius:6px;
  background:rgba(255,255,255,.94);color:#0B1F3A;font-weight:800;font-size:clamp(8px,2.6cqw,11px);line-height:1.15;
  font-variant-numeric:tabular-nums;text-align:center;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.xipitch.full .pp-card{width:clamp(34px,12.5cqw,52px);border-width:1.25px;border-radius:6px}
.xipitch.full .pp-card .pp-nm{font-size:clamp(6px,2cqw,8.5px)}
.xipitch.full .pp-card .pp-num{font-size:clamp(7px,2.2cqw,9.5px)}
.xipitch.full .pp-card.nophoto .pp-num{font-size:clamp(11px,3.6cqw,16px)}
.pp-card .pp-b.goal{top:-6px;left:-6px}
/* علم جنسية المحترف بجانب الصورة */
.natf{position:absolute;z-index:3;display:block;width:clamp(18px,5.4cqw,24px);aspect-ratio:3/2;object-fit:cover;border-radius:3px;
  box-shadow:0 0 0 1.5px #fff,0 2px 5px rgba(0,0,0,.35);pointer-events:none}
.pp-card .natf{left:auto;right:-8px;top:56%}
.pcard .natf{top:10px;left:10px;width:26px}
.natf.inl{position:static;display:inline-block;vertical-align:-2px;width:18px;margin-inline-start:6px;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.pprof-hero .ph img.natf{position:absolute;top:auto;bottom:14px;left:14px;width:34px;height:auto;max-width:none;filter:none}
.pp-card .pp-b.assist{bottom:-6px;right:-6px}
.pp-card .pp-b.card{right:auto;left:-4px;top:auto;bottom:34%}
.pp-card .pp-b.goal{top:auto;left:auto;bottom:-6px;right:-6px;background:#fff}
.pp-card .pp-b.goal + .pp-b.assist{bottom:calc(-6px + 1.5em)}
.pp-card .pp-b.off{bottom:-5px;left:-5px}
.pp-nm{font-size:clamp(8.5px,2.9cqw,12px);color:#fff;font-weight:600;max-width:100%;
  text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* شارات الأحداث على شارة اللاعب: في الأركان الأربعة، بأحجام تتناسب مع الملعب */
.pp-dot{position:relative}
.pp-b{position:absolute;display:inline-flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 1px 2px rgba(0,0,0,.4);line-height:1}
.pp-b .ico-ball,.pp-b .ico-boot{width:clamp(9px,2.7cqw,13px);height:clamp(9px,2.7cqw,13px)}
/* الهدف: أعلى اليسار (شريحة بيضاء، وعدد إن تعدّد) */
.pp-b.goal{top:-6px;left:-6px;background:#fff;border-radius:999px;padding:1px;gap:1px} /* SVG كرة بنفس مقاس البوت؛ دائرة لهدف واحد وحبّة مع العدد */
.pp-b.goal em{font-style:normal;font-weight:800;color:#0B1F3A;font-size:clamp(7px,2.1cqw,10px);padding-inline-end:2px}
/* الصناعة: أسفل اليمين */
.pp-b.assist{bottom:-6px;right:-6px;background:#fff;border-radius:50%;padding:1px}
/* الكرت: أعلى اليمين على القميص */
.pp-b.card{top:-5px;right:-5px;width:clamp(7px,2cqw,9px);height:clamp(10px,2.8cqw,12px);border-radius:2px}
.pp-b.card.y{background:#E9B949}
.pp-b.card.r{background:#D9453B}
/* الخروج: أسفل اليسار، دائرة حمراء بسهم أبيض للأسفل */
.pp-b.off{bottom:-5px;left:-5px;width:clamp(11px,3cqw,15px);height:clamp(11px,3cqw,15px);
  border-radius:50%;background:#D9453B}
.pp-b.off::after{content:"";border-inline:clamp(2.5px,.7cqw,3.5px) solid transparent;
  border-top:clamp(3.5px,1cqw,5px) solid #fff;margin-top:1px}
/* التشكيلة في صفحة المباراة وفي ملف النادي */
.xi{margin:10px 0 4px}
.xi-t{display:flex;align-items:center;gap:6px;min-width:0;font-size:.78rem;padding:6px 10px;border-radius:999px;

.xi-t img,.xi-t svg{width:18px;height:18px;flex:0 0 auto}

.xi-card .lb{margin:0}
.xi-pick{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.xi-pick select{flex:1;min-width:0}

.xi-meta b{color:var(--head)}
.xi-form{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;background:var(--zain-mid,#1e5fb4);padding:2px 10px;border-radius:999px;font-size:.74rem;letter-spacing:.3px}
.xi-meta img,.xi-meta svg{width:18px;height:18px;vertical-align:middle;margin-inline-end:4px}
/* بلا dir=ltr: في سياق عربي يقع رقم النادي يميناً فيُقرأ أولاً */
.xi-res{font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;
  background:var(--navy-800);border-radius:7px;padding:2px 8px}
.xi-x{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.xi-ct{font-size:.72rem;color:var(--slate);font-weight:700;margin-bottom:6px}
.xi-r{display:flex;align-items:center;gap:8px;font-size:.78rem;padding:4px 0;

.printonly{display:none}
@media print{
  @page{size:A4;margin:0}   /* بلا هامش أبيض حول الورقة الداكنة */
  main{padding:10mm 10mm!important}
  /* اللوحات المخفية (display:none) تظهر عند الطباعة فيبدأ حركة fade من الشفافية 0 داخل نسخة الطباعة — فتخرج صفحات بيضاء. لا حركات في الطباعة (منصور 2026-09-17) */
  *,*::before,*::after{animation:none!important;transition:none!important}
  /* ملف اللاعب وصفحة المباراة نوافذ ثابتة (fixed) فتتكرر فوق كل ورقة: عند الطباعة تُطبع وحدها كصفحة عادية ممتدة */
  html.pp-open body :is(main,#resStrip,#crestBar,#lfoot),html.mp-open body :is(main,#resStrip,#crestBar,#lfoot),html.pp-open body .mpage{display:none!important}
  #toast{display:none!important}
  .pprof.on,.mpage.on{position:static!important;display:block!important;background:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .pprof.on .pprof-sheet,.mpage.on .mp-sheet{max-height:none!important;height:auto!important;overflow:visible!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;border:0!important}
  .mp-tabs{position:static!important}
  html,body{background:#081527!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0}   /* الطباعة بالوضع الداكن دائماً (منصور 2026-09-17) */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,nav.tabs,.exportbar,.segbar,.iconbtn,.sitefoot,.wafab{display:none!important}
  .printonly{display:flex!important;align-items:center;gap:14px;border-bottom:2px solid #E9B949;
    padding-bottom:10px;margin-bottom:16px}
  .printonly img{height:46px}
  .match,.kpi,.pcard,.mc,.pstat,.plog-r,.tp{break-inside:avoid;page-break-inside:avoid}
  .card{break-inside:auto;page-break-inside:auto}   /* بطاقة أطول من الورقة كان منع كسرها يولّد صفحات فارغة */
  main{max-width:none}
  .twrap{overflow:visible}
  table{min-width:0!important}
  .grid2{grid-template-columns:1fr 1fr}
}
.seg{border:1px solid rgba(143,166,196,.3);border-radius:999px;padding:6px 13px;font-size:.76rem;color:var(--slate);white-space:nowrap}
.seg[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#04121f;font-weight:600}
.hlegend{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-size:.68rem;color:var(--slate)}
.hlegend .sc{height:8px;width:120px;border-radius:9px;background:linear-gradient(90deg,rgba(95,178,232,.25),#5FB2E8,#E9B949)}
.zlist{margin-top:14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){
  body{padding-bottom:20px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid rgba(143,166,196,.2)}
  nav.tabs button{flex-direction:row;gap:7px;font-size:.8rem;min-height:52px;border-top:0;border-bottom:2px solid transparent}
  nav.tabs button[aria-selected="true"]{border-bottom-color:var(--sky)}
  main{padding:24px 20px 40px}
}

/* ===== ترويسة بأسلوب FPL — ألوان الدوري الكويتي ===== */
:root{--zain:#2eb0f0;--zain-mid:#1878be;--zain-deep:#0d4f92;--zain-ice:#7fe0ff;--sky:#2eb0f0;--sky-soft:#a9e0fb}
.topbar.hero{position:relative;top:auto;padding:0;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden;
  background:linear-gradient(to left,#8ee6ff 0%,#2eb0f0 28%,#1878be 62%,#0d4f92 100%)}
.topbar.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 140% at 100% 50%,rgba(255,255,255,.28),transparent 60%),
    radial-gradient(40% 120% at 0% 100%,rgba(46,176,240,.55),transparent 70%)}
.topbar.hero::after{content:"";position:absolute;top:-40px;bottom:-40px;left:-60px;width:260px;pointer-events:none;opacity:.55;
  background:conic-gradient(from 210deg at 50% 50%,#0d4f92,#2eb0f0,#8ee6ff,#1878be,#0d4f92);filter:blur(28px)}
.hero-in{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;gap:16px;
  padding:calc(16px + env(safe-area-inset-top)) 20px 0;min-height:158px}
.hero-brand{display:flex;align-items:center;gap:12px;margin-bottom:50px;flex:none}
.hero-logo{height:86px;width:auto;flex:none;max-width:100%;filter:drop-shadow(0 4px 12px rgba(0,0,0,.28))}
.hero-word{display:flex;flex-direction:column;line-height:1}
.hero-word b{font-family:var(--display);font-weight:700;font-size:2.35rem;color:#fff;text-shadow:0 2px 10px rgba(6,21,41,.35)}
.hero-word small{font-family:var(--display);font-size:.82rem;color:#eaf8ff;letter-spacing:.1em;margin-top:8px;font-weight:600}
.hero-players{display:flex;align-items:flex-end;direction:ltr;margin-inline-start:auto;margin-inline-end:120px;height:158px;pointer-events:none;flex:none}
.hero-players img{height:142px;width:auto;margin-left:-36px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));
  -webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%)}
.hero-players img:first-child{margin-left:0}
.hero-players img:nth-child(2){height:130px}
.hero-players img:nth-child(4){height:134px}
.hero-players img:nth-child(5){height:148px}
.hero-admin{position:absolute;top:calc(12px + env(safe-area-inset-top));left:20px;z-index:2;
  display:none;   /* مخفي عن الزوار — يظهر للمدير فقط أو عبر المدخل السرّي */
  background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.hero-admin.show{display:grid}
.hero-admin.on{background:var(--sand);border-color:var(--sand);color:#20180a}
.hero-sub{position:absolute;bottom:0;right:20px;display:flex;gap:4px;z-index:2}
.hero-brand{-webkit-touch-callout:none;user-select:none}
.hero-sub button{background:rgba(255,255,255,.62);color:var(--zain-deep);font-family:var(--display);font-weight:600;
  font-size:.84rem;padding:10px 18px;border-radius:9px 9px 0 0;transition:background .15s}
.hero-sub button:hover{background:rgba(255,255,255,.85)}
.hero-sub button.on{background:#fff;color:var(--zain-deep);font-weight:700}
.topbar.hero .rail{margin:0 auto;gap:2px;height:3px}
.topbar.hero .leaguemark{display:none}
@media(max-width:1100px){.hero-players img:nth-child(2),.hero-players img:nth-child(4){display:none}.hero-players{margin-inline-end:60px}}
@media(max-width:899px){
  .hero-players{display:none}
  .hero-in{min-height:118px;padding-top:calc(12px + env(safe-area-inset-top))}
  .hero-brand{margin-bottom:44px}
  .hero-logo{height:58px}
  .hero-word b{font-size:1.6rem}
  .hero-word small{font-size:.7rem;margin-top:5px}
  .hero-sub{right:14px}
  .hero-sub button{padding:8px 14px;font-size:.78rem}
  .hero-admin{left:14px}
}
@media(min-width:900px){
  nav.tabs{background:var(--zain-deep);border-bottom:0;box-shadow:0 3px 10px rgba(6,21,41,.35)}
  nav.tabs .in{justify-content:flex-start;padding:0 12px}
  nav.tabs button{flex:0 0 auto;padding:0 14px;color:#dceefb;font-weight:500;font-size:.86rem;min-height:46px}
  nav.tabs button .ic{display:none}
  nav.tabs button:hover{color:#fff}
  nav.tabs button[aria-selected="true"]{color:#fff;font-weight:700;border-bottom-color:var(--zain-ice)}
}

/* ===== v3 official ===== */
:root{--display:'Vazirmatn',system-ui,sans-serif;--ice:#7FE0FF;--navy:#0B1F3A}
body{background:
  radial-gradient(70% 40% at 50% 0%,rgba(46,176,240,.10),transparent 70%),
  repeating-linear-gradient(135deg,rgba(13,79,146,.035) 0 1px,transparent 1px 16px),
  var(--ink)}
/* ---- hero ---- */
.topbar.hero{background:#0D4F92 url(assets/hero/stadium.jpg) center 38%/cover no-repeat}
.topbar.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to left,rgba(46,176,240,.62) 0%,rgba(24,120,190,.80) 38%,rgba(13,79,146,.90) 70%,rgba(8,40,79,.94) 100%),
    linear-gradient(180deg,rgba(6,21,41,.25),transparent 40%,rgba(6,21,41,.45) 100%)}

  right:0;left:0}
.hero-in{min-height:196px;padding-top:calc(18px + env(safe-area-inset-top))}
.hero-brand{margin-bottom:58px;gap:18px}
.hero-logo{height:104px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.hero-word{gap:0}
.hero-kick{display:inline-block;font-style:normal;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.12em;
  color:#fff;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);
  padding:3px 12px;border-radius:4px;margin-bottom:8px;width:max-content;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}

  padding:4px 10px;border:1px solid rgba(127,224,255,.35);border-radius:4px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
/* ---- شريط متحرك كشريط الأخبار ----
   المحتوى مكرر مرتين داخل مسار واحد، والحركة تنقله بمقدار نسخة كاملة
   ثم تعيد الكرة — فلا يظهر انقطاع. الاتجاه من اليسار إلى اليمين لأن
   القراءة عربية: الجديد يدخل من اليسار. يتوقف عند اللمس أو المرور. */
.strip-sc{display:flex;gap:6px;overflow:hidden;flex:1;padding:4px 0}
/* القناع للشاشات الواسعة فقط: سفاري على iOS يتعثّر بقناع فوق عنصر
   متحرك فيُخفي المحتوى أو يجمّده. */
@media(min-width:601px){
  .strip-sc{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);
                    mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
}
/* على الجوال نضغط البطاقات: سفاري لا يُركّب طبقة أعرض من 4096 بكسل،
   والمسار نسختان — فلو بقيت البطاقات بحجمها تجاوز الحد وتجمّد الشريط. */
@media(max-width:600px){
  .strip .rx{gap:5px;padding:3px 7px;font-size:.68rem}
  .strip .rx img{width:16px;height:16px;border-radius:3px}
  .strip .rx .sc{font-size:.76rem;padding:0 5px;min-width:32px}
  .strip-lb{font-size:.66rem;padding:3px 7px}
}
/* translate3d لا translateX: أضمن للتسريع على iOS. وبلا will-change لأن
   المسار عريض جداً (آلاف البكسلات) وقد يرفض سفاري تركيب طبقة بهذا الحجم
   فتتجمّد الحركة — والحارس أدناه يكتشف ذلك ويتولّى القيادة بنفسه. */
.strip-track{display:flex;gap:6px;flex:none;
  animation:strip-run var(--dur,45s) linear infinite}
@keyframes strip-run{from{transform:translate3d(0,0,0)} to{transform:translate3d(calc(50% + 3px),0,0)}}
.strip-sc:hover .strip-track,.strip-sc.hold .strip-track{animation-play-state:paused}
.strip-sc.still .strip-track{animation:none}
@media (prefers-reduced-motion: reduce){
  .strip-sc{overflow-x:auto;scrollbar-width:none}
  .strip-track{animation:none}
}
/* المحتوى يتّسع كله أو المستخدم يفضّل تقليل الحركة: لا تحريك، تمرير يدوي */
.strip-sc.still{overflow-x:auto;scrollbar-width:none}
.strip-sc.still .strip-track{transform:none!important}
.strip-sc::-webkit-scrollbar{display:none}
.strip .rx{flex:none;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:4px 10px;color:#fff;font-size:.74rem;font-weight:600;transition:background .15s}
.strip .rx:hover{background:rgba(255,255,255,.14)}
.strip .rx img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:4px;padding:1px}
/* النتيجة بلا direction:ltr عمداً: الصفحة RTL والمضيف يمين الشارة، فلو
   فُرض LTR وقعت أهداف المضيف يسار الشارة عند الضيف — فتُقرأ معكوسة.
   الموعد في المباراة القادمة رقمٌ لا نتيجة، فيبقى LTR. */
.strip .rx .sc{font-family:var(--display);font-weight:800;font-size:.86rem;color:var(--ice);
  background:rgba(127,224,255,.12);padding:0 7px;border-radius:4px;min-width:40px;text-align:center}

  direction:ltr;unicode-bidi:isolate}

/* الشعارات داخل البطاقات بلا loading="lazy": سفاري iOS يؤخّر الصور الكسولة التي يُعاد رسمها أثناء الإقلاع
   (أقراص المباراة القادمة بقيت بيضاء ~5 ث)، والملفات صغيرة ومخزّنة أصلاً فلا فائدة من التأجيل. */
function crest(club, big){
  const l = LOGOS[club];
  if(!l) return `<div class="crest${big?' lg':''}" style="background:${TINT[club]||'#3B5578'}">${esc(MONO[club]||club.slice(0,2))}</div>`;
  const sc = (GSCALE/100) * ((LSCALE[club]??100)/100);
  const bg = LOGOBG ? "#fff" : "transparent";
  return `<div class="crest has-logo${big?' lg':''}" style="background:${bg}">
    <img src="${l}" alt="${esc(club)}" decoding="async" style="transform:scale(${sc.toFixed(2)})"></div>`;
}
const compOf = x => x.comp || "الدوري";
function stampComp(d){
  /* المسابقة المسجّلة مع الهدف/الركلة لها الأولوية؛ البحث عن المباراة للسجلات القديمة بلا comp فقط.
     (كان البحث يطغى عليها: هدف «كأس الأمير ج1 العربي × الكويت» يُنسب لمباراة الدوري ج1 بين الفريقين نفسيهما) */
  (d.goals||[]).forEach(g=>{
    if(g.comp) return;
    const m=(d.matches||[]).find(m=>m.round===g.r && ((m.home===g.sc&&m.away===g.cd)||(m.home===g.cd&&m.away===g.sc)));
    g.comp = m ? compOf(m) : compOf(g);
  });
  (d.pens||[]).forEach(x=>{
    if(x.comp) return;
    const m=(d.matches||[]).find(m=>m.round===x.r && ((m.home===x.by&&m.away===x.vs)||(m.home===x.vs&&m.away===x.by)));
    x.comp = m ? compOf(m) : compOf(x);
  });
  (d.cards||[]).forEach(x=>{ if(!x.comp) x.comp="الدوري"; });
  (d.lineups||[]).forEach(x=>{ if(!x.comp) x.comp="الدوري"; });
  (d.shapes||[]).forEach(x=>{ if(!x.comp) x.comp="الدوري"; });
  (d.subs||[]).forEach(x=>{ if(!x.comp) x.comp="الدوري"; });
  return d;
}
function applyComp(){
  const keep = x => COMP==="الكل" || compOf(x)===COMP;
  MATCHES = ALL.matches.filter(keep);
  GOALS   = ALL.goals.filter(keep);
  PENS    = (ALL.pens||[]).filter(keep);
  CARDS   = (ALL.cards||[]).filter(keep);
}
function compsPresent(){
  const set=new Set((ALL?.matches||[]).map(compOf));
  return COMPS.filter(c=>set.has(c));
}
/* «الكل» = إجمالي البطولات المحلية: الدوري + كأس الأمير + كأس سمو ولي العهد + كأس السوبر (ALL لا يحوي البطولات الخارجية؛ تلك في EXT_FIXTURES).
   لا يُخزَّن أي مجموع: applyComp يرشّح المصفوفات الأصلية، وكل إحصاء يُحسب منها لحظة العرض. */
const COMP_TOTAL_LABEL = "إجمالي البطولات المحلية";
const compLabel = c => c==="الكل" ? COMP_TOTAL_LABEL : c;
/* يشغّل fn على مسابقة أخرى مؤقتاً (نفس الدوال والمصفوفات المرشّحة) ثم يعيد الحالة كما كانت — لملف اللاعب */
function withComp(comp, fn){
  const saved={COMP, MATCHES, GOALS, PENS, CARDS};
  try{ COMP=comp; applyComp(); return fn(); }
  finally{ ({COMP, MATCHES, GOALS, PENS, CARDS}=saved); }
}
/* شرائح المسابقة: always=true في صفحات الإحصاء (اللاعبون/التحليل) فتظهر الكؤوس حتى قبل أول مباراة (قائمة فارغة لا خطأ)؛
   في الرئيسية تبقى كما كانت (تظهر فقط عند وجود أكثر من مسابقة) */
function compChips(always){
  const have=compsPresent();
  if(!always && have.length<2) return "";
  return `<div class="segbar compbar">
    <button class="seg" data-comp="الكل" aria-pressed="${COMP==="الكل"}">${COMP_TOTAL_LABEL}</button>
    ${COMPS.map(c=>`<button class="seg" data-comp="${esc(c)}" aria-pressed="${c===COMP}">${esc(c)}</button>`).join("")}</div>`;
}
function wireComp(root){
  (root||document).querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>{
    MXC=null; COMP=b.dataset.comp; SELR=null; SELDAY=null; applyComp(); paintRail(); renderAll();
    go(document.querySelector('nav.tabs button[aria-selected="true"]').dataset.v);
  });
}
/* اختيار المسابقة في صفحة المباريات (2026-09-15): قائمة واحدة — محلي (الدوري والكؤوس، تبدّل COMP كالشرائح)
   وخارجي (من EXT_COMPS: جدول ترتيب المجموعة ثم المباريات كبطاقات، دون المساس ببيانات الإحصاء). */
function compSelect(){
  const cnt={}; (ALL?.matches||[]).forEach(m=>{ const c=compOf(m); cnt[c]=(cnt[c]||0)+1; });
  const ext=EXT_COMPS.map(c=>({...c, n:extEvents(c.id).filter(e=>!(e.to&&e.to!==e.d)).length}));
  const curName = MXC==="upcoming" ? "المباريات القادمة" : MXC ? ((EXT_COMPS.find(c=>c.id===MXC)||{}).name||"") : compLabel(COMP);
  const opt=(attr,label,n,sel)=>`<button type="button" class="rs-opt" role="option" ${attr} aria-selected="${sel}">${esc(label)}${n?`<em>${n}</em>`:""}</button>`;
  return `<div class="rs-dd mx-comp" aria-label="المسابقة">
    <button type="button" class="rs-btn" aria-haspopup="listbox" aria-expanded="false"><span>${esc(curName)}</span><i class="chev"></i></button>

function extTeamCell(x){

const extIsKw = x => x && (x.t==="club" || (x.t==="flag" && x.c==="kw"));
/* جدول ترتيب مجموعة الفريق الكويتي: يُحسب من المباريات التي لها نتيجة (hg/ag) فقط؛ قبل أول مباراة الكل أصفار */
function extTableHTML(c, evs){
  const groups=EXT_GROUPS[c.id]||[]; if(!groups.length) return "";
  /* نتائج المجموعة التي لا تظهر في قوائم المباريات */
  evs = evs.concat((typeof EXT_TABLE_RESULTS!=="undefined" ? EXT_TABLE_RESULTS : []).filter(r=>r.comp===c.id));
  return groups.map(g=>{
    const rows=g.teams.map(n=>{ const x=evTeam(n,c.kind); return {x, key:_norm(x.n), P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[]}; });
    const byKey={}; rows.forEach(r=>{ byKey[r.key]=r; });
    evs.forEach(e=>{
      if(e.hg==null || e.ag==null || e.live || (e.to && e.to!==e.d)) return;   /* المباراة الجارية لا تدخل الجدول حتى تنتهي */
      const parts=evParts(e); if(parts.length<2) return;
      const a=evTeam(parts[0],e.k), b=evTeam(parts[1],e.k); if(!a||!b) return;
      const ra=byKey[_norm(a.n)], rb=byKey[_norm(b.n)]; if(!ra||!rb) return;
      const hg=+e.hg, ag=+e.ag;
      ra.P++; rb.P++; ra.GF+=hg; ra.GA+=ag; rb.GF+=ag; rb.GA+=hg;
      if(hg>ag){ ra.W++; rb.L++; ra.Pts+=3; ra.form.push("w"); rb.form.push("l"); }
      else if(hg<ag){ rb.W++; ra.L++; rb.Pts+=3; ra.form.push("l"); rb.form.push("w"); }
      else { ra.D++; rb.D++; ra.Pts++; rb.Pts++; ra.form.push("d"); rb.form.push("d"); }
    });
    rows.sort((p,q)=>q.Pts-p.Pts||((q.GF-q.GA)-(p.GF-p.GA))||q.GF-p.GF||p.x.n.localeCompare(q.x.n,"ar"));
    /* نفس جدول الرئيسية (hm-tbl داخل .hm لترث الخطوط والألوان)؛ الأول والثاني بالأصفر (التأهل) */
    return `<div class="hm xt-hm"><section class="hm-std xt">
      <h2 class="sec">جدول الترتيب<span class="sq-n">${esc(g.name)}</span></h2>
      <div class="hm-card hm-tblwrap"><table class="hm-tbl">
        <thead><tr><th class="c">#</th><th class="club">الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>+/-</th><th class="pts">ن</th><th class="frm">الفورمة</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr class="${i<2?"champ":""}${extIsKw(r.x)?" kw":""}">
          <td class="c">${i+1}</td>
          <td class="club"><span>${extTeamCell(r.x)}</span></td>
          <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td dir="ltr">${(r.GF-r.GA)>0?"+":""}${r.GF-r.GA}</td>
          <td class="pts">${r.Pts}</td><td class="frm">${formPills(r.form)}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="hm-legend"><span><i class="champ"></i>المركزان 1–2</span></div>
    </section></div>`;
  }).join("");
}
/* هدافو مباراة خارجية — نصّ للعرض فقط (منصور 2026-09-16): لا روابط ولا ربط بملفات اللاعبين،
   ولا يقرؤه أي حساب إحصائي (الهدافون، الفانتسي، ملف اللاعب). الحقل: scorers:[{side:"h"|"a", name:"", min:"80"}].
   يُعرض فقط إذا اكتمل هدافو الفريقين (عدد أهداف كل جهة = نتيجتها)، وإلا تبقى النتيجة وحدها. */
function extScorersHTML(e){
  const L=Array.isArray(e&&e.scorers)?e.scorers:[]; if(!L.length || e.hg==null || e.ag==null) return "";
  const h=L.filter(x=>x&&x.side==="h"), a=L.filter(x=>x&&x.side==="a");
  if(h.length!==+e.hg || a.length!==+e.ag || h.length+a.length!==L.length) return "";
  const col=xs=>xs.map(x=>`<span>${esc(x.name||"")}${x.min?` <i dir="ltr">${esc(String(x.min))}′</i>`:""}</span>`).join("");
  return `<div class="mc-sc" aria-label="الهدافون"><div class="h">${col(h)}</div><div class="a">${col(a)}</div></div>`;
}
function extCardsHTML(evs, compName){
  const t=new Date(); const todayIso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const dayLabel=iso=>{ const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return esc(iso); return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]}`; };
  let lastDay=null, soon=0, done=0;
  const html=evs.map(e=>{
    const parts=evParts(e);
    const span=!!(e.to && e.to!==e.d);
    const a=parts.length>=2?evTeam(parts[0],e.k):null, b=parts.length>=2?evTeam(parts[1],e.k):null;
    const isMatch=!span && a && b && (a.t!=="other"||b.t!=="other") && !/نصف|نهائي|ربع|مباريات/.test(parts[0]);
    const played = e.hg!=null && e.ag!=null;
    const up = !played && e.d>=todayIso;
    const dayHead=e.d!==lastDay?`<div class="mc-day"><span>${span?esc(evRange(e)):dayLabel(e.d)}</span></div>`:""; lastDay=e.d;
    if(!isMatch) return `${dayHead}<article class="mc soon"><div class="mc-stage">${esc(span?e.t:(parts.slice(0,-1).join(" - ")||e.t))}${e.n?`<em>${esc(e.n)}</em>`:""}</div></article>`;
    if(up) soon++; else done++;
    /* live:true = مباراة جارية تُحدَّث نتيجتها أثناء اللعب (المتابعة المباشرة من SofaScore) — تُزال عند صافرة النهاية */
    const st=(played&&e.live)?'<span class="mc-st live"><i></i>جارية الآن</span>':up?'<span class="mc-st soon">لم تبدأ</span>':'<span class="mc-st done">انتهت</span>';
    const mid = played ? `<span class="mc-score" dir="ltr">${+e.ag} - ${+e.hg}</span>` : `<span class="mc-time" dir="ltr">${e.time?esc(e.time):"—"}</span>`;
    return `${dayHead}<article class="mc${up?" soon":" done"}">
      <div class="mc-row">
        <div class="mc-team h">${extTeamCell(a)}</div>
        <div class="mc-mid">${mid}${st}</div>
        <div class="mc-team a">${extTeamCell(b)}</div>
      </div>
      ${extScorersHTML(e)}
      <div class="mc-foot"><span>${esc(compName)}</span>${e.n?`<span>${esc(e.n)}</span>`:""}${(played&&e.time)?`<span class="mc-date" dir="ltr">${esc(e.time)}</span>`:""}${e.venue?`<span>${esc(e.venue)}</span>`:""}</div>
    </article>`;
  }).join("");
  return {html, soon, done};
}
/* «المباريات القادمة»: كل ما لم يُلعب بعد (أو يُلعب الآن) من الدوري والكؤوس والبطولات الخارجية، مرتبة بالموعد */
function upcomingItems(){
  const now=Date.now(), t=new Date(), todayIso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const loc=(ALL?.matches||[]).filter(m=>{ const k=kickoffTS(m); if(k===null) return false;
      return (k>now) || (m.time && now>=k && now<k+2*3600e3 && !matchGoalsAll(m)); })
    .map(m=>({d:m.date, time:normTime(m.time)||"", ts:kickoffTS(m), m}));
  const ext=[];
  EXT_COMPS.forEach(c=>extEvents(c.id).forEach(e=>{
    if(e.to && e.to!==e.d) return;
    const parts=evParts(e); if(parts.length<2 || /نصف|نهائي|ربع|مباريات/.test(parts[0])) return;
    if(e.live || (e.hg==null && e.d>=todayIso)) ext.push({d:e.d, time:String(e.time||""), ts:new Date(e.d+"T"+(normTime(e.time)||"23:59")+":00").getTime(), e, c});
  }));
  return [...loc,...ext].sort((a,b)=>String(a.d).localeCompare(String(b.d))||((a.ts||0)-(b.ts||0)));
}
function matchGoalsAll(m){ return (ALL?.goals||[]).some(g=>compOf(g)===compOf(m) && +g.r===+m.round && (g.sc===m.home||g.sc===m.away)); }

        <div class="mc-team a">${crest(m.away)}<b>${esc(m.away)}</b></div>

  const V=$("#v-matches"); wireComp(V); wireDropdowns(V);

/* القوائم المنسدلة (الجولة/المسابقة): فتح وإغلاق وخارج النقر وEscape */
function wireDropdowns(V){
  V.querySelectorAll(".rs-dd").forEach(dd=>{
    const rsBtn=dd.querySelector(".rs-btn"), rsMenu=dd.querySelector(".rs-menu"); if(!rsBtn||!rsMenu) return;
    const close=()=>{ rsMenu.hidden=true; rsBtn.setAttribute("aria-expanded","false"); document.removeEventListener("click",onDoc,true); };
    const onDoc=e=>{ if(!rsBtn.contains(e.target) && !rsMenu.contains(e.target)) close(); };
    rsBtn.onclick=()=>{
      const open=rsMenu.hidden; rsMenu.hidden=!open; rsBtn.setAttribute("aria-expanded",String(open));
      if(open){ document.addEventListener("click",onDoc,true);
        const cur=rsMenu.querySelector('[aria-selected="true"]'); if(cur) cur.scrollIntoView({block:"nearest"}); }
    };
    rsMenu.addEventListener("keydown",e=>{ if(e.key==="Escape"){ close(); rsBtn.focus(); } });
  });
  V.querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{ MXC=b.dataset.ext; SELDAY=null; renderMatches(); });
}
/* حالة المباراة تُشتق من التاريخ والوقت — لا تُكتب يدوياً */
/* توحيد صيغة الوقت: أرقام عربية، و«م/مساءً/PM» تُحوّل لنظام ٢٤ ساعة */
function normTime(t){
  if(!t) return null;
  let x = String(t).trim()
    .replace(/[\u0660-\u0669]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
    .replace(/[\u06F0-\u06F9]/g, d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48));
  const pm = /(م|مساء|مساءً|p\.?m\.?)/i.test(x);
  const am = /(ص|صباح|صباحاً|a\.?m\.?)/i.test(x);
  const mt = x.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if(!mt) return null;
  let h = +mt[1]; const mi = +mt[2];
  if(h>23 || mi>59) return null;
  if(pm && h<12) h += 12;
  if(am && h===12) h = 0;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function kickoffTS(m){
  if(!m || !m.date) return null;
  const t = normTime(m.time) || "23:59";
  const d = new Date(String(m.date)+"T"+t+":00");
  return isNaN(d.getTime()) ? null : d.getTime();
}
/* وقت الإقفال بصيغة مقروءة — نفس الحساب الذي يقفل فعلاً */
function stampLabel(ts){
  if(ts===null || ts===undefined) return "—";
  const d = new Date(ts);
  let h = d.getHours(); const mi = String(d.getMinutes()).padStart(2,"0");
  const ap = h>=12 ? "م" : "ص"; h = h%12 || 12;
  return `${AR_DOW[d.getDay()]} ${d.getDate()} ${AR_MON[d.getMonth()]} · ${h}:${mi} ${ap}`;
}
function isUpcoming(m){
  if(matchGoals(m).length) return false;      /* فيها أهداف = أُقيمت */
  const k=kickoffTS(m);
  if(k!==null && k > Date.now()) return true;
  /* مضى الموعد بلا أهداف: تُعدّ مُقامة (0-0) فقط إذا سُجّلت تشكيلة — وإلا فهي مؤجلة أو لم تُدخل بياناتها بعد */
  const comp=compOf(m);
  return !(xiNames(m.round, comp, m.home).length || xiNames(m.round, comp, m.away).length);
}
function isLive(m){
  if(isUpcoming(m)) return false;
  const k=kickoffTS(m);
  if(k===null || !m.time) return false;
  const n=Date.now();
  return n>=k && n < k+2*60*60*1000;
}
const playedMatches = () => MATCHES.filter(m=>!isUpcoming(m));
const matchGoals = m => GOALS.filter(g=>g.r===m.round && compOf(g)===compOf(m) &&
  ((g.sc===m.home&&g.cd===m.away)||(g.sc===m.away&&g.cd===m.home))).sort((a,b)=>abs(a)-abs(b));

/* ================= الحسابات ================= */
function standings(){
  const t = {};
  CLUBS.forEach(c=>t[c]={c,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[],hP:0,hPts:0,aP:0,aPts:0,cs:0,fts:0});
  playedMatches().forEach(m=>{
    const H=t[m.home], A=t[m.away]; if(!H||!A) return;
    H.P++;A.P++;H.GF+=m.hg;H.GA+=m.ag;A.GF+=m.ag;A.GA+=m.hg;
    H.hP++;A.aP++;
    if(m.ag===0)H.cs++; if(m.hg===0)A.cs++;
    if(m.hg===0)H.fts++; if(m.ag===0)A.fts++;
    if(m.hg>m.ag){H.W++;A.L++;H.Pts+=3;H.hPts+=3;H.form.push("w");A.form.push("l");}
    else if(m.hg<m.ag){A.W++;H.L++;A.Pts+=3;A.aPts+=3;A.form.push("w");H.form.push("l");}
    else {H.D++;A.D++;H.Pts++;A.Pts++;H.hPts++;A.aPts++;H.form.push("d");A.form.push("d");}
  });
  return Object.values(t).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.c.localeCompare(b.c,"ar"));
}
function scorers(){
  const p={};
  GOALS.forEach(g=>{ if(g.bp==="هدف عكسي") return; const k=g.p+"|"+g.sc; (p[k]??={n:g.p,c:g.sc,g:0,a:0}).g++; });   /* الهدف العكسي ليس للمسجّل — نفس تعريف ملف اللاعب */
  GOALS.forEach(g=>{ if(!g.a || isOG(g)) return; const k=g.a+"|"+g.sc; (p[k]??={n:g.a,c:g.sc,g:0,a:0}).a++; });
  return Object.values(p).sort((a,b)=>b.g-a.g||b.a-a.a);
}
function firstGoals(){
  return playedMatches().map(m=>{
    const gs=matchGoals(m);
    if(!gs.length) return {m,first:null,res:null};
    const first=gs[0].sc;
    const res = first===m.home ? (m.hg>m.ag?"فوز":m.hg===m.ag?"تعادل":"خسارة")
                               : (m.ag>m.hg?"فوز":m.hg===m.ag?"تعادل":"خسارة");
    return {m,first,res,conceded:first===m.home?m.away:m.home};
  });
}
function clubStats(c){
  const row = standings().find(x=>x.c===c);
  const gf = GOALS.filter(g=>g.sc===c), ga = GOALS.filter(g=>g.cd===c);
  const timing = PERIODS.map(p=>({p,f:gf.filter(g=>period(g)===p).length,a:ga.filter(g=>period(g)===p).length}));
  const sp = gf.filter(g=>isSetPiece(g)).length;
  const fg = firstGoals();
  const scoredFirst = fg.filter(x=>x.first===c);
  const top = scorers().filter(p=>p.c===c)[0];
  const yc = CARDS.filter(x=>x.club===c && isYellow(x.type)).length;
  const rc = CARDS.filter(x=>x.club===c && isRed(x.type)).length;
  return {row,gf,ga,timing,sp,scoredFirst,top,yc,rc,
    pen:gf.filter(g=>/جزاء/.test(g.det||"")).length,
    head:gf.filter(g=>isHeader(g)).length,
    late:gf.filter(g=>["76-90","90+"].includes(period(g))).length};
}
/* ===== دقائق اللعب والشباك النظيفة =====
   تُحسب من المباريات الملعّبة: التشكيلة الأساسية + التبديلات (خروج/دخول)
   والنتيجة. الأساسي يبدأ من 0، والبديل من دقيقة دخوله، وينتهي عند خروجه
   أو نهاية المباراة. الشباك النظيفة للاعب: لعب ثلثَي المباراة فأكثر ولم يستقبل
   فريقه هدفاً في تلك المباراة. */
/* طول المباراة = 90 + بدل ضائع الشوطين. الدقائق حقيقية بطلب منصور
   (2026-09-17): من أكمل مباراة فيها 7+5 يُسجَّل له 102 لا 90، والبديل
   الذي دخل في 45+3 تُحتسب له دقائق الوقت المحتسب كاملة. */
const MATCH_MIN = 90;                       /* الأساس فقط — لا يُستعمل سقفاً */
const capTo = (len, v) => Math.max(0, Math.min(len, v));
const capMin = x => Math.max(0, Math.min(MATCH_MIN, x));   /* متبقٍّ لمن لا يعرف المباراة */
function playerMatchMinutes(m, club, name){
  const comp = compOf(m);
  const starter = xiNames(m.round, comp, club).includes(name);
  const subs = matchSubs(m).filter(s=>s.club===club);
  const inSub  = subs.find(s=>s.in===name);
  const outSub = subs.find(s=>s.out===name);
  const LEN = matchLen(m);
  let start;
  if(starter) start = 0;
  else if(inSub) start = capTo(LEN, evAbs(m, inSub.h, inSub.m, inSub.x));
  else return 0;                                   /* لم يشارك */
  const end = outSub ? capTo(LEN, evAbs(m, outSub.h, outSub.m, outSub.x)) : LEN;
  return Math.max(inSub ? 1 : 0, end - start);   /* بديل دخل في آخر لحظة يُحسب له ظهور بدقيقة واحدة */
}
/* هل اللاعب حارس مرمى؟ (من مركزه في الكشف) */
function isGoalkeeper(club, name){
  const e = (SQUADS[club]||[]).find(x=>sqName(x)===name);
  return !!e && sqPos(e)==="GK";
}
/* تجميع لكل لاعب: مباريات، دقائق، شباك نظيفة (على المسابقة المختارة).
   الشباك النظيفة للحرّاس فقط: حارس لعب ثلثَي المباراة فأكثر (60 دقيقة في
   مباراة 90) ولم يستقبل هدفاً. */
function playerPlay(){
  const out = {};
  MATCHES.filter(m=>!isUpcoming(m)).forEach(m=>{
    const comp = compOf(m);
    [m.home, m.away].forEach(club=>{
      const conceded = club===m.home ? +m.ag : +m.hg;
      const men = new Set();
      xiNames(m.round, comp, club).forEach(n=>men.add(n));
      matchSubs(m).filter(s=>s.club===club && s.in).forEach(s=>men.add(s.in));
      men.forEach(name=>{
        const mins = playerMatchMinutes(m, club, name);
        if(mins<=0) return;
        const k = name+"|"+club;
        const e = out[k] || (out[k] = {n:name, c:club, apps:0, mins:0, cs:0, gk:isGoalkeeper(club,name)});
        e.apps++; e.mins += mins;
        if(e.gk && conceded===0 && mins>=csLimit(m)) e.cs++;
      });
    });
  });
  return Object.values(out);
}
/* شباك نظيفة للنادي: مباريات ملعّبة لم يستقبل فيها هدفاً */
function clubCleanSheets(c){
  return MATCHES.filter(m=>!isUpcoming(m) && (m.home===c||m.away===c))
    .filter(m => (c===m.home ? +m.ag : +m.hg)===0).length;
}
function playerPlayOf(club){ return playerPlay().filter(p=>p.c===club).sort((a,b)=>b.mins-a.mins); }

function headlines(){
  const out=[];
  const byMargin=[...MATCHES].sort((a,b)=>Math.abs(b.hg-b.ag)-Math.abs(a.hg-a.ag))[0];
  if(byMargin) out.push({v:Math.abs(byMargin.hg-byMargin.ag),t:"أكبر فارق نتيجة",
    d:`${byMargin.home} ${byMargin.hg} - ${byMargin.ag} ${byMargin.away}`});
  const byGoals=[...MATCHES].sort((a,b)=>(b.hg+b.ag)-(a.hg+a.ag))[0];
  if(byGoals) out.push({v:byGoals.hg+byGoals.ag,t:"أعلى مباراة تسجيلاً",
    d:`${byGoals.home} ${byGoals.hg} - ${byGoals.ag} ${byGoals.away}`});
  const fast=[...GOALS].sort((a,b)=>abs(a)-abs(b))[0];
  if(fast) out.push({v:minLabel(fast),t:"أسرع هدف",d:`${fast.p} — ${fast.sc} ضد ${fast.cd}`});
  const late=[...GOALS].sort((a,b)=>abs(b)-abs(a))[0];
  if(late) out.push({v:minLabel(late),t:"أكثر الأهداف تأخراً",d:`${late.p} — ${late.sc} ضد ${late.cd}`});
  const sp=GOALS.filter(g=>g.cat==="كرات ثابتة").length;
  out.push({v:pct(sp,GOALS.length)+"%",t:"نصيب الكرات الثابتة",d:`${sp} من ${GOALS.length} هدفاً`});
  const second=GOALS.filter(g=>["46-60","61-75","76-90","90+"].includes(period(g))).length;
  out.push({v:pct(second,GOALS.length)+"%",t:"نصيب الشوط الثاني",d:`${gw(second)} بعد الاستراحة`});
  const fg=firstGoals().filter(x=>x.first);
  const wins=fg.filter(x=>x.res==="فوز").length;
  out.push({v:pct(wins,fg.length)+"%",t:"نسبة فوز صاحب الهدف الأول",
    d:`${wins} من ${mw(fg.length)} حُسمت لمن سجّل أولاً`});
  const pk=PENS.filter(p=>p.res==="سجلت").length;
  out.push({v:pk,t:"ركلات جزاء مسجّلة",d:`من أصل ${pw(PENS.length)} احتُسبت`});
  return out;
}

 {k:"داخل منطقة الجزاء - وسط",  t:"r", x:36,   y:14, w:28,   h:20, lx:50, ly:31},
 {k:"داخل منطقة الجزاء - يمين", t:"r", x:64,   y:2,  w:15,   h:32},
 {k:"خارج منطقة الجزاء - يسار", t:"r", x:0,    y:2,  w:21,   h:62},
