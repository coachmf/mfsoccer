      go=document.getElementById('pwaGo'), x=document.getElementById('pwaX');
  var KEY='mf_pwa_hide';
  var hidden=function(){ try{ return (+localStorage.getItem(KEY)||0) > Date.now(); }catch(e){ return false; } };
  var hide=function(days){ try{ localStorage.setItem(KEY, Date.now()+(days||14)*864e5); }catch(e){}
                           bar.classList.remove('on'); };
  var installed=function(){
    return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  };
  x.onclick=function(){ hide(14); };

  /* أندرويد: المتصفح يعرض التثبيت الأصلي */
  var prompt=null;
  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); prompt=e;
    if(installed()||hidden()) return;
    msg.textContent='افتحه من شاشتك مباشرة، ويعمل بلا إنترنت.';
    go.textContent='تثبيت'; go.style.display='';
    bar.classList.add('on');
  });
  go.onclick=async function(){
    if(!prompt){ hide(1); return; }
    bar.classList.remove('on');
    prompt.prompt();
    try{ await prompt.userChoice; }catch(e){}
    prompt=null; hide(90);
  };
  addEventListener('appinstalled', function(){ hide(3650); });

  /* آيفون: لا توجد نافذة تثبيت — نشرح الخطوة مرة واحدة */
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var safari = iOS && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
  if(safari && !installed() && !hidden()){
    setTimeout(function(){
      msg.innerHTML='اضغط زر المشاركة <b style="display:inline">⬆</b> ثم «إضافة إلى الشاشة الرئيسية».';
      go.style.display='none';
      bar.classList.add('on');
    }, 4000);
  }

  /* التسجيل + تنبيه النسخة الجديدة */
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var sw=reg.installing; if(!sw) return;
          sw.addEventListener('statechange', function(){
            /* نسخة جاهزة وهناك نسخة تعمل الآن: نعرض التحديث بدل فرضه */
            if(sw.state==='installed' && navigator.serviceWorker.controller){
              if(typeof toast==='function')
                toast('صدرت نسخة جديدة — أعد التحميل لتظهر','busy',true);
              msg.textContent='نسخة جديدة جاهزة.';
              go.textContent='تحديث'; go.style.display='';
              go.onclick=function(){ sw.postMessage('SKIP_WAITING'); };
              bar.classList.add('on');
            }
          });
        });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(reloaded) return; reloaded=true; location.reload();
      });
      /* الصفحة تُقدَّم من الذاكرة فوراً ويُجلب الجديد في الخلفية؛ إن اختلف عُرض زر التحديث */
      navigator.serviceWorker.addEventListener('message', function(e){
        if(!e.data || e.data.type!=='HTML_UPDATED') return;
        if(typeof toast==='function') toast('صدرت نسخة جديدة — أعد التحميل لتظهر','busy',true);
        msg.textContent='نسخة جديدة جاهزة.';
        go.textContent='تحديث'; go.style.display='';
        go.onclick=function(){ location.reload(); };
        bar.classList.add('on');
      });
    });
  }
})();

.ds-nav{display:flex;gap:4px;align-items:center}
.ds-nav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line,rgba(143,166,196,.25));background:transparent;color:var(--head,#fff);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s}
.ds-nav button:hover{background:rgba(143,166,196,.12)}
.ds-nav .ds-clear{width:auto;padding:0 10px;font-size:.68rem;font-weight:700;color:var(--zain-text,var(--sky));border-color:transparent}
.ds-days{display:flex;gap:4px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.ds-days::-webkit-scrollbar{display:none}
.dp{flex:none;width:48px;height:66px;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--slate);cursor:default;padding:0;scroll-snap-align:center;transition:background .15s,border-color .15s,color .15s;clip-path:none}
.dp .dw{font-size:.56rem;letter-spacing:0;opacity:.8;white-space:nowrap}
.dp .dn{font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1.1;font-variant-numeric:tabular-nums}
/* علامة البطولة تحت رقم اليوم بدل النقاط: كرة الدوري (والعدد إن تعدّدت المباريات) أو اسم الكأس مختصراً */
.dp .dd{height:16px;display:flex;align-items:center;justify-content:center;gap:3px;line-height:1}
.dp .dk{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.dp .dk img{width:15px;height:15px;object-fit:contain;display:block}
.dp .dk em{font-style:normal;font-family:var(--display);font-size:.6rem;font-weight:800;color:var(--head,#fff);font-variant-numeric:tabular-nums}
.dp .dk.cup{font-size:.5rem;font-weight:700;color:var(--sand);white-space:nowrap;letter-spacing:0}
.dp[aria-pressed="true"] .dk em,.dp[aria-pressed="true"] .dk.cup{color:#fff}
.dp.has{color:var(--head,#fff);cursor:pointer;border-color:var(--blue-ln,rgba(143,166,196,.3));background:var(--blue-bg,rgba(143,166,196,.08))}
.dp.has.soon{border-color:rgba(233,185,73,.5)}
.dp.evd .dw{text-decoration:underline;text-decoration-color:var(--sand);text-underline-offset:2px}
.dp.today{box-shadow:inset 0 0 0 1px var(--zain-text,var(--sky))}
.dp:disabled{opacity:.45}
.dp.has:hover{background:rgba(143,166,196,.14)}
.dp[aria-pressed="true"]{background:var(--zain-deep,#0D4F92);border-color:var(--zain-deep,#0D4F92);color:#fff;box-shadow:0 4px 12px rgba(13,79,146,.28)}
.dp[aria-pressed="true"] .dd{color:#fff}
html[data-theme="dark"] .dp[aria-pressed="true"]{background:#1878BE;border-color:#1878BE}
.ds-ev{margin-top:6px;border-top:1px solid var(--line,rgba(143,166,196,.14));padding-top:4px}
.ds-ev summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:.78rem;font-weight:700;color:var(--head,#fff);cursor:pointer}
.ds-ev summary::-webkit-details-marker{display:none}
.ds-evn{font-size:.66rem;font-weight:700;color:var(--slate);background:rgba(143,166,196,.14);padding:1px 8px;border-radius:999px}
.ds-ev summary .chev{margin-inline-start:auto;width:0;height:0;border-inline:4.5px solid transparent;border-top:5px solid currentColor;transition:transform .2s}
.ds-ev[open] summary .chev{transform:rotate(180deg)}
.ds-ev .evlist{margin-top:2px;margin-bottom:6px}
.msum{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.msum span{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--slate);padding:5px 10px;border-radius:999px;border:1px solid var(--line,rgba(143,166,196,.18));background:var(--navy-900)}
.msum span b{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--head,#fff);font-variant-numeric:tabular-nums}
html[data-theme="dark"] .msum span{background:#0F1E35;border-color:#213653}
.mc-day{display:flex;align-items:center;gap:10px;margin:14px 2px 8px;font-size:.72rem;font-weight:700;color:var(--slate)}
.mc-day::after{content:"";flex:1;height:1px;background:var(--line,rgba(143,166,196,.16))}
.mx-list>.mc-day:first-child{margin-top:2px}
.mx-empty{padding:28px 14px;text-align:center;color:var(--slate);font-size:.85rem;border:1px dashed var(--line,rgba(143,166,196,.25));border-radius:14px}
@media(prefers-reduced-motion:reduce){.mc-st.live i{animation:none}.rp,.dp,.mc{transition:none}}
/* --- الرئيسية: أبرز اللاعبين (رادار) + حالة الفرق --- */
.tp-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tp{--ca:#1878BE;--cb:#0B1F3A;--ca-rgb:24,120,190;--ctab-fg:#fff;position:relative;border-radius:16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,rgba(var(--ca-rgb),.16),var(--navy-900) 55%);border:1px solid var(--line,rgba(143,166,196,.18));box-shadow:var(--shadow,none);transition:transform .18s,border-color .18s}
html[data-theme="dark"] .tp{background:linear-gradient(160deg,rgba(var(--ca-rgb),.22),#0F1E35 58%);border-color:#213653;box-shadow:none}
.tp:hover{transform:translateY(-2px);border-color:rgba(var(--ca-rgb),.7)}
.tp-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 4px}
.tp-t{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--head,#fff)}
.tp-sub{font-size:.64rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp-body{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:6px;padding:0 10px 0 4px}
.tp-id{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:4px 4px 8px}
.tp-ph{width:74px;height:74px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(var(--ca-rgb),.55),rgba(var(--ca-rgb),.15));box-shadow:0 0 0 2px rgba(var(--ca-rgb),.8),0 6px 14px rgba(0,0,0,.3);margin-bottom:4px;display:grid;place-items:center}
.tp-ph img{width:100%;height:100%;object-fit:cover;object-position:top center}
.tp-ph .pavph{width:100%;height:100%;border-radius:50%;font-size:1.2rem;display:grid;place-items:center;color:var(--head,#fff)}
.tp-id b{font-family:var(--display);font-weight:800;font-size:1.02rem;color:var(--head,#fff);line-height:1.2;overflow-wrap:anywhere}
.tp-club{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--slate)}
.tp-club .crest{width:18px;height:18px;border-radius:5px}
.tp-pos{font-size:.64rem;padding:2px 8px;border-radius:999px;background:rgba(143,166,196,.12);color:var(--mist);border:1px solid var(--line,rgba(143,166,196,.2))}
.rad{width:100%;height:auto;display:block}
/* أسماء محاور الرادار في شارات خارج الرسم على الكمبيوتر والهاتف (منصور 2026-09-16) */
.tp-body .rad-full{display:none}
.rad-mini .rl rect{fill:rgba(143,166,196,.10);stroke:rgba(var(--ca-rgb),.55);stroke-width:1}
.rad-mini .rl text{font-size:13.5px;font-weight:700;fill:#DCE6F2}
html[data-theme="light"] .rad-mini .rl text{fill:#0B1F3A}
.rad .rg{fill:none;stroke:rgba(143,166,196,.28);stroke-width:1}
.rad .rp{fill-opacity:.32;stroke-width:1.8;stroke-linejoin:round}
.rad text{font-family:var(--body);font-size:9.5px;fill:var(--slate)}
html[data-theme="dark"] .rad text{fill:#B3C4D9}
.tp-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line,rgba(143,166,196,.14));background:rgba(0,0,0,.08)}
html[data-theme="light"] .tp-stats{background:rgba(11,31,58,.03)}
.tp-stats span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;font-size:.62rem;color:var(--slate)}
.tp-stats span+span{border-inline-start:1px solid var(--line,rgba(143,166,196,.12))}
.tp-stats b{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--head,#fff);font-variant-numeric:tabular-nums}
/* قواعد الجوال بعد القواعد العامة — كانت قبلها فتغلبها القواعد العامة (نفس الأولوية، الأخير يفوز) فتنقصّ الصورة والاسم */
/* على الشاشات الضيقة: البطاقات جنباً إلى جنب على عرض الشاشة بلا تمرير أفقي (منصور 2026-09-15) — عمودان، والبطاقة الثالثة بعرض الصف */
/* منصور 2026-09-16: البطاقات أصغر وبالعرض — على الهاتف بطاقة بعرض الشاشة: الهوية يمين والرادار يسار والأرقام تحت */
.tp-body{grid-template-columns:minmax(0,1fr) 176px}
.tp-ph{width:60px;height:60px}
.tp-id b{font-size:.95rem}
/* الهاتف (منصور 2026-09-16): كل البطاقات ظاهرة بلا تمرير — شبكة عمودين ببطاقات مدمجة: العنوان، الصورة والاسم بجانب رادار صغير، والأرقام تحت */
@media(max-width:900px){
  .tp-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tp{border-radius:12px}
  .tp:hover{transform:none}
  .tp:last-child:nth-child(odd){grid-column:1/-1}
  .tp-hd{padding:6px 8px 0}
  .tp-t{font-size:.74rem} .tp-sub{display:none}
  .tp-body{display:block;padding:0 4px}
  /* الرادار بأسماء محاوره (منصور): أعرض، والخط مكبَّر داخل الرسم ليُقرأ على الهاتف */
  .tp-body .rad-mini{display:block;width:100%;max-width:168px;height:auto;margin:2px auto 0}
  .tp-id{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:6px;row-gap:0;align-items:center;justify-items:start;text-align:start;padding:3px 2px 0;min-width:0}
  .tp-ph{width:34px;height:34px;margin:0;grid-column:1;grid-row:1/span 2;box-shadow:0 0 0 1.5px rgba(var(--ca-rgb),.8)}
  .tp-id b,.tp-id .tp-club{grid-column:2;max-width:100%}
  .tp-id b{font-size:.72rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tp-club{font-size:.56rem;gap:3px} .tp-club .crest{width:12px;height:12px;border-radius:3px}
  .tp-id .tp-pos{display:none}
  .tp:last-child:nth-child(odd) .tp-body{display:grid;grid-template-columns:minmax(0,1fr) 170px;align-items:center}
  .tp-stats span{padding:3px 1px;font-size:.48rem;gap:0} .tp-stats b{font-size:.74rem}}
.tf{padding:4px 12px}
.tf-r{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line,rgba(143,166,196,.12));cursor:pointer}
.tf-r:last-child{border-bottom:0}
.tf-pos{font-size:.66rem;color:var(--slate);text-align:center;font-variant-numeric:tabular-nums}
.tf-club{display:flex;align-items:center;gap:8px;min-width:0}
.tf-club b{font-family:var(--display);font-weight:700;font-size:.88rem;color:var(--head,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-club .crest{width:26px;height:26px;border-radius:7px}
.tf-pts{font-family:var(--display);font-weight:800;font-size:.84rem;color:var(--head,#fff);font-variant-numeric:tabular-nums;white-space:nowrap}
.tf-pts i{font-style:normal;font-weight:400;font-size:.6rem;color:var(--slate)}
.tf .pillrow{display:flex;gap:4px;direction:ltr}
.tf .pl{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.66rem;font-weight:800}
/* أرقام لافتة (القائمة): الرقم بنفس خط ولون بلاطات المؤشرات (Changa أبيض) — منصور 2026-09-15 */
#v-home .head-story .num{font-family:'Changa',var(--display),system-ui,sans-serif;font-weight:700;font-size:1.6rem;color:var(--head,#fff);font-variant-numeric:tabular-nums;line-height:1.1}
html[data-theme="light"] #v-home .head-story .num{color:#0B1F3A}
#v-home .head-story .tx b{font-family:'Tajawal',var(--body),system-ui,sans-serif;font-weight:700}
/* بطاقة المباراة القادمة: أصغر وأقل ارتفاعاً (منصور 2026-09-15) — الشعار والاسم في صف واحد */
#v-home .nextm-body{padding:10px 16px 10px;gap:12px}
#v-home .nextm-team{flex-direction:row;gap:10px;justify-content:center;align-items:center}
#v-home .nextm .crest.lg{width:72px;height:72px}
#v-home .nextm-team b{font-family:'Changa',var(--display),system-ui,sans-serif;font-size:1.12rem;font-weight:700;letter-spacing:.01em;padding:4px 12px;margin:0;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(6,21,41,.62);box-shadow:0 2px 8px rgba(0,0,0,.35);text-shadow:none;position:static;transform:none;color:#fff}
#v-home .nextm-mid{gap:2px}
#v-home .nextm-time{font-size:1.15rem}
#v-home .nextm-top{padding:8px 14px 6px}
#v-home .nextm-foot{padding:6px 14px}
@media(max-width:640px){#v-home .nextm-team{flex-direction:column;gap:6px}#v-home .nextm .crest.lg{width:64px;height:64px}#v-home .nextm-team b{font-size:.95rem;padding:3px 10px}}
/* ===== الرئيسية v2 — رموز المواصفة ===== */
.hm{--bg-card:#1E293B;--border-card:#334155;--text-primary:#E2E8F0;--text-muted:#94A3B8;--gold:#E9B949;--skyc:#5FB2E8;
  --win-c:#10B981;--draw-c:#6B7280;--loss-c:#EF4444;--champ:rgba(251,191,36,.10);--relc:rgba(248,113,113,.12);
  --f-head:'Changa',var(--display),system-ui,sans-serif;--f-body:'Tajawal',var(--body),system-ui,sans-serif;
  --gap-page:12px;--gap-content:8px;--p-md:16px;--p-sm:12px;--r-card:18px;display:flex;flex-direction:column;gap:var(--gap-page);color:var(--text-primary);font-family:var(--f-body)}
html[data-theme="light"] .hm{--bg-card:#FFFFFF;--border-card:#E2E8F0;--text-primary:#0B1F3A;--text-muted:#64748B;--champ:rgba(251,191,36,.16);--relc:rgba(248,113,113,.14)}
.hm .segbar{margin:0}
.hm .exportbar{margin:0}
.hm-card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--r-card)}
.hm-sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 8px}
.hm .sec{margin-top:26px}
.hm-std{margin-top:4px}
/* بطاقة MF أعلى الرئيسية: صف واحد مضغوط (منصور 2026-09-15) */
#v-home .brandcard{padding:8px 14px;gap:12px;align-items:center;margin-bottom:12px}
#v-home .brandcard img{height:30px}
#v-home .brandcard .bt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
#v-home .brandcard .bt b{font-size:.9rem;display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap}
#v-home .brandcard .bt b::after{display:inline;margin:0;font-size:.68rem}
#v-home .brandcard .handles{margin:0;margin-inline-start:auto}
#v-home .brandcard .hchip{font-size:.68rem;padding:3px 9px 3px 7px}
@media(max-width:640px){#v-home .brandcard{padding:8px 12px}#v-home .brandcard .bt{gap:4px 8px}#v-home .brandcard .handles{margin-inline-start:0}}
.hm-sec-hd h2{margin:0;font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.2;color:var(--text-primary)}
.hm-muted{font-size:12px;color:var(--text-muted);line-height:1.4}
.hm-link{background:none;border:0;color:var(--skyc);font-family:var(--f-body);font-weight:700;font-size:13px;cursor:pointer;padding:6px 4px;min-height:32px}
.hm-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold)}
.hm-tag i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(233,185,73,.2)}
/* المباراة القادمة */
.hm-nm{background:linear-gradient(160deg,rgba(95,178,232,.10),var(--bg-card) 55%);border:1px solid var(--border-card);border-radius:var(--r-card);padding:var(--p-md);display:flex;flex-direction:column;gap:var(--gap-content)}
.hm-nm-hd{display:flex;justify-content:space-between;align-items:center}
.hm-nm-body{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:4px 0}
.hm-nm-team{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:pointer;padding:6px 2px;border-radius:12px;color:inherit;font-family:inherit}
.hm-nm-team:hover{background:rgba(148,163,184,.08)}
.hm-nm-team .crest.lg{width:64px;height:64px;border-radius:16px;background:#fff!important}
.hm-nm-team b{font-family:var(--f-head);font-weight:700;font-size:16px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.hm-nm-mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.hm-nm-time{font-family:var(--f-head);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.hm-nm-venue{text-align:center;font-size:13px;color:var(--text-muted)}
.hm-cd{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:6px 0 2px}
.hm-cd span{display:flex;flex-direction:column;align-items:center;min-width:56px}
.hm-cd b{font-family:var(--f-head);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.hm-cd small{font-size:11px;color:var(--text-muted);margin-top:3px}
.hm-cd i{font-style:normal;font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1;color:var(--text-muted);padding-top:1px}
.hm-cta{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-content);margin-top:2px}
.hm-btn{min-height:44px;border-radius:12px;border:1px solid var(--border-card);background:transparent;color:var(--text-primary);font-family:var(--f-body);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s}
.hm-btn:hover{box-shadow:0 0 0 3px rgba(233,185,73,.18);border-color:var(--gold)}
.hm-btn:active{transform:scale(.98)}
.hm-btn.primary{background:var(--gold);color:#0B1F3A;border-color:var(--gold)}
.hm-btn:focus-visible,.hm-teaser:focus-visible,.hm-tsc:focus-visible,.hm-tile:focus-visible{outline:2px solid var(--skyc);outline-offset:2px}
/* المؤشرات */
.hm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-content)}
@media(min-width:900px){.hm-tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.hm-tile{background:var(--bg-card);border:1px solid var(--border-card);border-radius:14px;padding:var(--p-sm);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-height:76px;justify-content:center}
.hm-tile[data-player]{cursor:pointer}
.hm-tile b{font-family:var(--f-head);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.hm-tile span{font-size:12px;color:var(--text-muted)}
.hm-tile em{font-style:normal;font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hm-story{margin-top:var(--gap-content);background:var(--bg-card);border:1px solid var(--border-card);border-radius:14px;padding:var(--p-sm) var(--p-md);display:flex;flex-direction:column;gap:4px}
.hm-spark{width:120px;height:34px;grid-row:span 3}
.hm-spark path{fill:none;stroke:var(--skyc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.hm-spark circle{fill:var(--gold)}
.hm-story p{margin:0;font-size:13px;line-height:1.5;color:var(--text-muted)}
.hm-story p b{color:var(--text-primary);font-weight:700}
/* الجدول */
/* بلا سقف ارتفاع: كان 70vh يقصّ الجدول ببضع بكسلات فيظهر شريط تمرير داخلي
   يدفع صاحب المركز الأول تحت رأس الجدول اللاصق (منصور 2026-09-16) */
.hm-tblwrap{overflow:auto;max-height:none;-webkit-overflow-scrolling:touch}
.hm-tbl{width:100%;min-width:0;border-collapse:separate;border-spacing:0;font-size:14px}

.motm-top>small{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-muted,var(--slate))}
.motm-top>small .crest{width:18px;height:18px}
.rt-cols{display:grid;grid-template-columns:1fr;gap:14px}

.rt-colhd .crest{width:22px;height:22px}
.rt-colhd b{flex:1;font-size:.86rem;color:var(--text-primary,#fff)}

/* ===== صفحة المباراة (2026-09-15) ===== */
.mc[data-mopen]{cursor:pointer}
.mc[data-mopen] .mc-row:hover .mc-mid{opacity:.85}
html.mp-open{overflow:hidden}
.mpage{position:fixed;inset:0;z-index:85;display:none;justify-content:center;background:rgba(3,10,22,.72)}
.mpage.on{display:flex;animation:fade .18s ease}
.mp-sheet{position:relative;width:100%;max-width:760px;height:100%;overflow:auto;overscroll-behavior:contain;
  background:var(--bg,#0a1628);-webkit-overflow-scrolling:touch}
.mp-head{position:relative;overflow:hidden;padding:env(safe-area-inset-top) 0 6px;color:#fff;background:#0a1626}
.mp-head::before,.mp-head::after{content:"";position:absolute;top:-30%;width:75%;height:130%;pointer-events:none;filter:blur(8px)}
.mp-head::before{right:-22%;background:radial-gradient(closest-side,color-mix(in srgb,var(--hc) 55%,transparent),transparent)}
.mp-head::after{left:-22%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 55%,transparent),transparent)}
.mp-head>*{position:relative;z-index:1}
.mp-top{display:flex;align-items:center;padding:12px 14px 0}
.mp-back{width:40px;height:40px;display:grid;place-items:center;color:#fff;background:none;border:0}
.mp-when{width:max-content;max-width:90%;margin:4px auto 0;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.1);font-size:.8rem;font-weight:600;color:rgba(255,255,255,.9)}
.mp-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:16px 14px 6px}
.mp-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;min-width:0}
.mp-team .crest{width:62px;height:62px}
.mp-team>b{font-family:var(--display);font-size:1rem;font-weight:700;line-height:1.2}
.mp-mid{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px}
.mp-res{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
.mp-res i{font-style:normal;opacity:.55;font-size:1.8rem}
.mp-time{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1}
.mp-st{font-size:.9rem;font-weight:600;color:rgba(255,255,255,.88);display:inline-flex;align-items:center;gap:6px}
.mp-st.live{color:#ff8a80}
.mp-st.live i{width:7px;height:7px;border-radius:50%;background:#ff5252;animation:pulse 1.4s infinite}
.mp-scorers{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px 8px}
.mp-scorers .h,.mp-scorers .a{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:rgba(255,255,255,.78)}
.mp-scorers .h{text-align:left;align-items:flex-end}
.mp-scorers .a{text-align:right;align-items:flex-start}
.mp-scorers span[data-player]{cursor:pointer}
.mp-scorers em{font-style:normal;color:rgba(255,255,255,.6);display:inline-block;unicode-bidi:isolate;direction:ltr}
.mp-scorers .ball{display:grid;place-items:center;color:#4ade80}
.mp-scorers .ball svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.mp-compcard{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;color:var(--text-primary,#fff);font-size:.88rem;font-weight:600;cursor:pointer}
.mp-compcard svg{color:var(--sky,#5FB2E8);flex:none}
.mp-tabs{position:sticky;top:0;z-index:3;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 8px;background:#0b1f3a;border-bottom:1px solid rgba(255,255,255,.08)}
.mp-tabs::-webkit-scrollbar{display:none}
.mp-tabs button{flex:1 0 auto;padding:13px 12px 11px;font-size:.9rem;font-weight:700;color:rgba(255,255,255,.62);background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap}
.mp-tabs button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--sky,#5FB2E8)}
.mp-body{padding:12px 12px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.mp-card{background:var(--bg-card,var(--navy-900));border:1px solid var(--border-card,rgba(143,166,196,.18));border-radius:var(--r-card,14px);padding:12px}
.mp-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mp-hd h3{margin:0;font-family:var(--display);font-size:.95rem;font-weight:700;color:var(--text-primary,#fff)}
.mp-sub{font-size:.7rem;color:var(--text-muted,var(--slate))}
.mp-link{font-size:.74rem;font-weight:700;color:var(--sky,#5FB2E8);background:none;border:0}
.mp-empty{color:var(--text-muted,var(--slate));font-size:.84rem;text-align:center;padding:18px 8px}
.mp-card.mp-empty{padding:26px 12px}
.ref-face{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto;display:inline-block;
  background:var(--navy-800,#0f1b2d) radial-gradient(circle at 50% 38%,rgba(143,166,196,.35) 0 22%,transparent 23%),
  var(--navy-800,#0f1b2d);border:1px solid var(--border-card,rgba(143,166,196,.2))}
.ref-face-ph{background:radial-gradient(circle at 50% 36%,rgba(143,166,196,.32) 0 19%,transparent 20%),radial-gradient(ellipse at 50% 100%,rgba(143,166,196,.32) 0 38%,transparent 39%),var(--navy-800,#0f1b2d)}
.ref-face.lg{width:64px;height:64px}
.ref-face.sm{width:18px;height:18px;border:0}
.ref-role{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1f3a60,#0f1b2d);border:1px solid rgba(143,166,196,.28)}
.ref-role svg{width:62%;height:62%}
.ref-role.sm{width:18px;height:18px;border:0;background:none;display:inline-grid;vertical-align:-4px;margin-inline-end:4px}
.ref-role.sm svg{width:100%;height:100%}
.crew-p.none .ref-role{opacity:.45}
.mp-crew .crew-shirt{width:92px;flex:0 0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.mp-crew .crew-shirt svg{width:100%;height:auto;display:block}
.mp-crew .crew-main{display:flex;align-items:center;gap:12px;padding:4px 2px 12px;border-bottom:1px solid var(--border-card,rgba(143,166,196,.14))}
.mp-crew small{display:block;font-size:.7rem;color:var(--text-muted,var(--slate))}
.mp-crew b{display:block;color:var(--text-primary,#fff);font-weight:700;font-size:.86rem;line-height:1.35}
.mp-crew .crew-main b{font-size:1rem}
.mp-crew .crew-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;padding-top:2px}
.mp-crew .crew-p{display:flex;align-items:center;gap:8px;min-width:0}
.mp-crew .crew-p>div{min-width:0}
.mp-crew .crew-p .ref-role{width:30px;height:30px}
.mp-crew .crew-p small{font-size:.62rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-crew .crew-p b{font-size:.78rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mp-crew .crew-p.none b{color:var(--text-muted,var(--slate));font-weight:500}
.refrow .ref-face{width:30px;height:30px}
.mp-irow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--border-card,rgba(143,166,196,.14));font-size:.82rem}
.mp-irow:last-of-type{border-bottom:0}
.mp-irow span{color:var(--text-muted,var(--slate))}
.mp-irow b{color:var(--text-primary,#fff);font-weight:600;text-align:left}
.mp-note{margin-top:8px;font-size:.78rem;color:var(--text-muted,var(--slate))}
.mp-tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.mp-tbl th{font-size:.66rem;font-weight:600;color:var(--text-muted,var(--slate));padding:4px 4px 8px;text-align:center}
.mp-tbl td{padding:8px 4px;text-align:center;border-top:1px solid var(--border-card,rgba(143,166,196,.14));color:var(--text-primary,#fff);font-variant-numeric:tabular-nums}
.mp-tbl .club{text-align:start}
.mp-tbl .club span{display:flex;align-items:center;gap:8px}
.mp-tbl .club .crest{width:22px;height:22px}
.mp-tbl .pts{font-weight:800}
.mp-tbl tr{cursor:pointer}
@media(max-width:480px){.mp-tbl .frm{display:none}}
/* جدول الترتيب المصغّر لا يرث قيود الجداول العامة (min-width:520px وخلفية رأس الجدول) */
.mp-sheet table.mp-tbl{min-width:0}
.mp-sheet .mp-tbl thead th{background:none;color:var(--text-muted,var(--slate));font-family:inherit;border-radius:0;padding:4px 4px 8px}
.mp-std .hm-std{margin:0}
.mp-std tr[data-mp-hl]{background:rgba(95,178,232,.14)}
.mp-std tr[data-mp-hl] td{font-weight:700}
.mp-xi{padding:8px}
.mp-xi .xi{margin:0}
.mp-seg{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px;margin-bottom:10px;background:rgba(0,0,0,.18);padding:4px;border-radius:12px}
.mp-seg button{height:38px;border-radius:9px;border:0;background:none;color:var(--text-muted,var(--slate));font-weight:700;font-size:.8rem;display:grid;place-items:center}
.mp-seg button .crest{width:24px;height:24px}
.mp-seg button[aria-pressed="true"]{background:var(--text-primary,#fff);color:#0b1f3a}
.mp-mlist{display:flex;flex-direction:column}
.mp-mgrp{font-size:.72rem;font-weight:700;color:var(--text-muted,var(--slate));margin:10px 2px 2px}
.mp-mrow{display:grid;grid-template-columns:64px minmax(0,1fr) 28px 26px;align-items:center;gap:8px;padding:9px 2px;background:none;border:0;border-top:1px solid var(--border-card,rgba(143,166,196,.14));color:inherit;text-align:right;width:100%}
.mp-mrow:first-child{border-top:0}
.mp-mrow .d{display:flex;flex-direction:column;font-size:.72rem;color:var(--text-primary,#fff);font-variant-numeric:tabular-nums}
.mp-mrow .d i{font-style:normal;font-size:.6rem;color:var(--text-muted,var(--slate))}
.mp-mrow .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.mp-mrow .t>span{display:flex;align-items:center;gap:7px;min-width:0}
.mp-mrow .t .crest{width:20px;height:20px;flex:none}
.mp-mrow .t b{font-size:.8rem;font-weight:600;color:var(--text-primary,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-mrow .s{display:flex;flex-direction:column;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.mp-mrow .s b{font-size:.82rem;color:var(--text-primary,#fff)}
.mp-mrow .s em{font-style:normal;font-size:.7rem;color:var(--text-muted,var(--slate))}
.mp-mrow .r{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
.mp-mrow .r.w{background:var(--win,#35a47c)}
.mp-mrow .r.d{background:var(--draw,#8a97a8)}
.mp-mrow .r.l{background:var(--loss,#d9534f)}
[data-theme="light"] .mp-sheet{background:#f3f6fa;--text-primary:#0B1F3A;--text-muted:#5B6B80;--border-card:#E2E8F0;--bg-card:#FFFFFF}
/* الوضع الفاتح: رأس الصفحة يبقى داكناً بنصّه الأبيض؛ ما تحته يأخذ ألوان النص الداكنة */
[data-theme="light"] .mp-head{--text-primary:#fff;--text-muted:rgba(255,255,255,.7)}
[data-theme="light"] .mp-seg button[aria-pressed="true"]{background:#0b1f3a;color:#fff}
.mp-seg.two{grid-template-columns:1fr 1fr}
.mp-seg.two button{display:flex;align-items:center;justify-content:center;gap:8px}
.mp-seg.two button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function kfaFind(name){
  const n=_norm(name);
  for(const c of Object.keys(SQUADS||{})){
    const x=(SQUADS[c]||[]).find(x=>_norm(sqName(x))===n);
    if(x) return {club:c, pos:sqPos(x), num:sqNum(x), site:sqName(x)};
  }
  return null;
}

/* ---------- تبويبات صفحة النادي ---------- */
let CLUB_TAB = "about";
function wireClubTabs(){
  const w=$("#clubBody .clubwrap"); if(!w) return;
  const bs=[...w.querySelectorAll(".ctabs button")], ind=w.querySelector(".ctab-ind");
  const set=k=>{
    if(!bs.some(b=>b.dataset.ct===k)) k="about";
    CLUB_TAB=k; const i=bs.findIndex(b=>b.dataset.ct===k);
    bs.forEach(b=>{ b.setAttribute("aria-selected", b.dataset.ct===k); b.tabIndex = b.dataset.ct===k ? 0 : -1; });
    w.querySelectorAll(".ctab-panel").forEach(p=>p.classList.toggle("on", p.dataset.cp===k));
    const rtl=getComputedStyle(w).direction!=="ltr";
    ind.style.transform=`translateX(${(rtl?-100:100)*i}%)`;
  };
  bs.forEach(b=>b.onclick=()=>set(b.dataset.ct));
  ind.style.transition="none"; set(CLUB_TAB);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ ind.style.transition=""; }));
}

/* ترجمة نص من بيانات الإنجازات: HON_EN أولاً ثم القاموس العام، وإلا يبقى عربياً */
function honT(s){
  if(typeof I18N==="undefined" || !I18N.isEn || !I18N.isEn()) return s;
  const k=String(s||"").trim(); if(!k) return s;
  if(HON_EN[k]!=null) return HON_EN[k];
  const d=I18N.tr ? I18N.tr(k) : null;
  return d!=null ? d : s;
}
/* تاريخ المحطة: «20 أكتوبر 1960» ← «20 October 1960» (الأرقام كما هي) */
function honDate(s){
  if(typeof I18N==="undefined" || !I18N.isEn || !I18N.isEn()) return s;
  return String(s||"").replace(/[ء-ي]+/g, w => (I18N.MON && I18N.MON[w]) || w);
}
function clubHonoursHTML(c){
  const H=CLUB_HONOURS[c]; if(!H) return "";
  /* الأرقام بشرطة (مواسم 2009–10، نتائج 2-1) معزولة باتجاه LTR حتى لا تنقلب داخل النص العربي */
  const nums=t=>esc(t).replace(/(\d+(?:[-–]\d+)+)/g,'<bdi dir="ltr">$1</bdi>');
  const titles=(H.titles||[]).filter(x=>x.n>0), intl=H.intl||[], ms=H.milestones||[];
  const total=titles.reduce((a,x)=>a+x.n,0);
  let out="";
  if(titles.length||intl.length){
    out+=`<h2 class="sec">الإنجازات${total?`<span class="sq-n">${total} لقباً محلياً</span>`:""}</h2>`;
    if(titles.length) out+=`<div class="chon">${titles.map(x=>`<div class="card chon-it">
        <div class="chon-top"><b class="n">${x.n}</b><span class="t">${esc(honT(x.t))}</span></div>
        ${x.years?`<div class="y">${String(x.years).split("، ").map(y=>`<bdi dir="ltr">${esc(y)}</bdi>`).join("")}</div>`:""}</div>`).join("")}</div>`;
    if(intl.length) out+=`<div class="kfa-hon chon-intl">${intl.map(h=>`<div class="card pad kfa-hon-it"><b>${esc(honT(h.t))}</b><small>${nums(honT(h.d))}</small></div>`).join("")}</div>`;
  }
  if(ms.length) out+=`<h2 class="sec">محطات في تاريخ النادي<span class="sq-n">${ms.length}</span></h2>
    <div class="card pad ctl">${ms.map(([d,t])=>`<div class="ctl-it"><span class="d">${esc(honDate(d))}</span><span class="t">${nums(honT(t))}</span></div>`).join("")}</div>`;
  return out;
}

}

function coachFlag(nat, cls){ if(!nat) return "";

function coachCardHTML(c){

    return `<h2 class="sec sq-grp">${t}<span class="sq-n">${L.length}</span></h2><div class="sq-grid">${L.map(p=>playerCardHTML(p,c)).join("")}</div>`;

/* نافذة وجود اللاعب في المباراة (بداية/نهاية بالدقائق المطلقة) — نفس منطق playerMatchMinutes */
function playerWindow(m, club, name){
  const comp=compOf(m);
  const starter=xiNames(m.round, comp, club).includes(name);
  const subs=matchSubs(m).filter(s=>s.club===club);
  const inSub=subs.find(s=>s.in===name), outSub=subs.find(s=>s.out===name);
  const LEN=matchLen(m);
  let start; if(starter) start=0; else if(inSub) start=capTo(LEN, evAbs(m,inSub.h,inSub.m,inSub.x)); else return null;
  let end = outSub ? capTo(LEN, evAbs(m,outSub.h,outSub.m,outSub.x)) : LEN;
  if(inSub && end<=start) end=start+1;           /* بديل الدقيقة 90+: نافذة بدقيقة واحدة حتى يظهر في السجل */
  return {start, end};
}
function clubOfPlayer(name){
  for(const c of Object.keys(SQUADS||{})) if((SQUADS[c]||[]).some(x=>sqName(x)===name)) return c;
  const g=GOALS.find(x=>x.p===name && x.bp!=="هدف عكسي") || GOALS.find(x=>x.a===name);
  if(g) return g.sc;
  const cd=CARDS.find(x=>x.p===name); if(cd) return cd.club;
  return "";
}
/* أندية سابقة لعب لها اللاعب هذا الموسم: بعد انتقاله تبقى مبارياته معها في ملفه.
   نضمّ النادي السابق فقط إن لم يعد اسمه في كشفه، حتى لا يندمج لاعبان يتشابه اسمهما (منصور 2026-09-16) */
function playerFormerClubs(name, club, pp){
  const L=pp||(typeof playerPlay==="function" ? playerPlay() : []);
  return [...new Set(L.filter(p=>p.n===name && p.c!==club && !(SQUADS[p.c]||[]).some(x=>sqName(x)===name)).map(p=>p.c))];
}
function playerProfileData(name, club){
  const sq=(SQUADS[club]||[]).find(x=>sqName(x)===name)||null;
  const pos=sq?sqPos(sq):"", num=sq?sqNum(sq):0, gk=String(pos).toUpperCase()==="GK";
  const PP=(typeof playerPlay==="function" ? playerPlay() : []);
  const former=playerFormerClubs(name, club, PP), clubs=[club, ...former];
  const sum=f=>clubs.reduce((t,c)=>t+f(c),0);
  const goals   = sum(c=>GOALS.filter(g=>g.sc===c && g.p===name && g.bp!=="هدف عكسي").length);
  const assists = sum(c=>GOALS.filter(g=>g.sc===c && g.a===name && !isOG(g)).length);
  const ownG    = GOALS.filter(g=>isOG(g) && g.og===name && clubs.includes(g.cd)).length;
  const y = sum(c=>CARDS.filter(x=>x.p===name && x.club===c && isYellow(x.type)).length);
  const rd= sum(c=>CARDS.filter(x=>x.p===name && x.club===c && isRed(x.type)).length);
  const pens = sum(c=>PENS.filter(x=>x.p===name && x.by===c).length);
  const pp=clubs.reduce((t,c)=>{ const e=PP.find(x=>x.n===name && x.c===c); return e?{apps:t.apps+e.apps, mins:t.mins+e.mins, cs:t.cs+e.cs}:t; }, {apps:0,mins:0,cs:0});
  const log=[]; let conceded=0;
  clubs.forEach(cl=>{
    MATCHES.filter(m=>!isUpcoming(m) && (m.home===cl||m.away===cl)).forEach(m=>{
      const w=playerWindow(m,cl,name); if(!w || w.end<=w.start) return;
      const gs=matchGoals(m);
      const g=gs.filter(x=>x.sc===cl && x.p===name && x.bp!=="هدف عكسي").length;
      const a=gs.filter(x=>x.sc===cl && x.a===name && !isOG(x)).length;
      const con=gs.filter(x=>x.sc!==cl && abs(x)>=w.start && (w.end>=matchLen(m) || abs(x)<=w.end)).length; conceded+=con;   /* ما لم يُستبدل، أهداف الوقت المحتسب عليه أيضاً */
      const cd=CARDS.filter(x=>x.r===m.round && compOf(x)===compOf(m) && x.club===cl && x.p===name);
      const home=m.home===cl, opp=home?m.away:m.home;
      const gf=home?+m.hg:+m.ag, ga=home?+m.ag:+m.hg;
      log.push({m,opp,home,wc:cl,mins:w.end-w.start,on:w.start,offAt:w.end,g,a,con,y:cd.some(x=>isYellow(x.type)),r:cd.some(x=>isRed(x.type)),
                res:`${gf} - ${ga}`, k: gf>ga?"w":gf<ga?"l":"d", sub: w.start>0, off: w.end<matchLen(m)});
    });
  });
  /* في الإجمالي تختلط جولات المسابقات (ج1 كأس بعد ج3 دوري)، فالترتيب بالتاريخ؛ داخل مسابقة واحدة كما كان */
  log.sort((a,b)=>(COMP==="الكل" && a.m.date && b.m.date && a.m.date!==b.m.date) ? String(b.m.date).localeCompare(String(a.m.date))
    : (b.m.round-a.m.round)||String(b.m.date).localeCompare(String(a.m.date)));
  return {name, club, former, pos, num, gk, goals, assists, ownG, y, rd, pens, apps:pp.apps, mins:pp.mins, cs:pp.cs, conceded, log};
}

/* ===== أبرز اللاعبين (رادار) + حالة الفرق — على الرئيسية، أرقام الموسم كاملاً (2026-09-15) ===== */
function seasonPlayerStats(){
  const pp=(typeof playerPlay==="function")?playerPlay():[];
  const map={};
  const get=(n,c)=>map[n+"|"+c] || (map[n+"|"+c]={n,c,g:0,a:0,apps:0,mins:0,y:0,r:0,cs:0});
  GOALS.forEach(g=>{ if(!isOG(g)){ get(g.p,g.sc).g++; if(g.a) get(g.a,g.sc).a++; } });
  pp.forEach(x=>{ const e=get(x.n,x.c); e.apps=x.apps; e.mins=x.mins; e.cs=x.cs; });
  CARDS.forEach(x=>{ const e=get(x.p,x.club); if(isYellow(x.type)) e.y++; if(isRed(x.type)) e.r++; });
  return Object.values(map);
}
/* رادار SVG بستة محاور، القيم منسوبة إلى أعلى قيمة في الدوري (0..1) */
function radarSVG(vals, labels, color, mini){
  /* mini = نسخة الهاتف: رسم أصغر، وأسماء المحاور في شارات دائرية خارج الحلقات لا تتداخل مع الرسم */
  const N=vals.length, cx=mini?130:110, cy=mini?116:100, R=mini?54:64;
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const ring=k=>"M"+Array.from({length:N},(_,i)=>pt(i,R*k).map(v=>v.toFixed(1)).join(",")).join("L")+"Z";
  const poly="M"+vals.map((v,i)=>pt(i,R*Math.max(.06,Math.min(1,v))).map(x=>x.toFixed(1)).join(",")).join("L")+"Z";
  const lab = mini
    ? labels.map((t,i)=>{ let [x,y]=pt(i,R+27); const w=String(t).length*8.6+16, h=22;
        x=Math.max(w/2+1, Math.min(260-w/2-1, x)); y=Math.max(h/2+1, Math.min(232-h/2-1, y));
        return `<g class="rl"><rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="11"/><text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle">${t}</text></g>`; }).join("")
    : labels.map((t,i)=>{ const [x,y]=pt(i,R+16); const anc = Math.abs(x-cx)<6 ? "middle" : (x<cx ? "end" : "start"); return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}">${t}</text>`; }).join("");
  return `<svg class="rad${mini?" rad-mini":" rad-full"}" viewBox="${mini?"0 0 260 232":"0 0 220 200"}" direction="ltr" aria-hidden="true">
    ${[.33,.66,1].map(k=>`<path class="rg" d="${ring(k)}"/>`).join("")}
    ${Array.from({length:N},(_,i)=>{ const [x,y]=pt(i,R); return `<line class="rg" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join("")}
    <path class="rp" d="${poly}" style="fill:${color};stroke:${color}"/>
    ${vals.map((v,i)=>{ const [x,y]=pt(i,R*Math.max(.06,Math.min(1,v))); return `<circle class="rd" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" style="fill:${color}"/>`; }).join("")}
    ${lab}</svg>`;
}
/* شباك نظيفة لكل لاعب (أي مركز): ثلثا المباراة فأكثر في مباراة لم يستقبل فيها فريقه — نفس قاعدة الحرّاس في playerPlay، للمدافعين في «أبرز اللاعبين» */
function teamCleanSheets(){
  const out={};
  MATCHES.filter(m=>!isUpcoming(m)).forEach(m=>{
    const comp=compOf(m);
    [m.home, m.away].forEach(club=>{
      if((club===m.home ? +m.ag : +m.hg)!==0) return;
      const men=new Set(xiNames(m.round, comp, club)); matchSubs(m).filter(s=>s.club===club && s.in).forEach(s=>men.add(s.in));
      men.forEach(n=>{ if(playerMatchMinutes(m, club, n)>=csLimit(m)) out[n+"|"+club]=(out[n+"|"+club]||0)+1; });
    });
  });
  return out;
}
function topPlayersHTML(){
  const all=seasonPlayerStats().filter(p=>p.apps>0 || p.g>0 || p.a>0);
  if(!all.length) return "";
  const mx={g:Math.max(1,...all.map(p=>p.g)), a:Math.max(1,...all.map(p=>p.a)), ga:Math.max(1,...all.map(p=>p.g+p.a)),
            mins:Math.max(1,...all.map(p=>p.mins)), apps:Math.max(1,...all.map(p=>p.apps)), cards:Math.max(1,...all.map(p=>p.y+2*p.r))};
  /* الترتيب نفسه المستعمل في جدول الهدافين: المعيار، ثم المعيار المقابل،
     ثم الأقل دقائق. كان هنا «الأكثر دقائق» فيظهر على الرئيسية هدّاف
     يخالف صدارة الجدول عند تساوي الأهداف (منصور 2026-09-17). */
  const rank=(k,k2)=>[...all].sort((x,y)=> k(y)-k(x) || (k2? k2(y)-k2(x) : 0) || (x.mins-y.mins));
  const picks=[
    {t:"الهدّاف",        sub:"أكثر اللاعبين تسجيلاً",           L:rank(p=>p.g, p=>p.a)},
    {t:"صانع الألعاب",   sub:"أكثر اللاعبين صناعةً للأهداف",    L:rank(p=>p.a, p=>p.g)},
    {t:"الأكثر مساهمة",  sub:"أهداف + صناعة لكل 90 دقيقة",     L:[...all].filter(p=>p.mins>=120).sort((x,y)=>((y.g+y.a)/y.mins)-((x.g+x.a)/x.mins)||(y.g+y.a)-(x.g+x.a))},
  ];
  /* بطاقات المراكز الدفاعية (منصور 2026-09-16): المركز من كشف النادي؛ الترتيب بالشباك النظيفة ثم المساهمة ثم الدقائق */
  const TCS=teamCleanSheets(); all.forEach(p=>{ p.dcs=TCS[p.n+"|"+p.c]||0; });
  const posOf=p=>{ const e=(SQUADS[p.c]||[]).find(x=>sqName(x)===p.n); return e?String(sqPos(e)).toUpperCase():""; };
  const best=(codes,key)=>[...all].filter(p=>codes.includes(posOf(p)) && p.mins>0).sort(key);
  const defSort=(x,y)=>(y.dcs-x.dcs)||((y.g+y.a)-(x.g+x.a))||(x.mins-y.mins);   /* الأقل دقائق أولاً عند التساوي (منصور 2026-09-17) */
  picks.push(
    {t:"قلب الدفاع", sub:"أكثر قلوب الدفاع شباكاً نظيفة", role:"def", L:best(["CB"], defSort)},
    {t:"الظهير",     sub:"الأظهرة: شباك نظيفة ومساهمة",   role:"def", L:best(["RB","LB","RWB","LWB"], defSort)},
    {t:"الحارس",     sub:"أكثر الحرّاس شباكاً نظيفة",       role:"gk",  L:best(["GK"], (x,y)=>(y.cs-x.cs)||(x.mins-y.mins))}
  );
  /* لا يتكرر اللاعب نفسه في بطاقتين: البطاقة التالية تأخذ أول من لم
     يُؤخذ بدل أن تختفي كلياً كما كان يحدث مع الفلترة القديمة */
  const seen=new Set(); const uniq=[];
  picks.forEach(x=>{
    const p=(x.L||[]).find(c=>c && !seen.has(c.n+"|"+c.c));
    if(!p) return;
    seen.add(p.n+"|"+p.c); uniq.push({...x, p});
  });
  const mxCS=Math.max(1,...all.map(p=>p.dcs)), mxGK=Math.max(1,...all.map(p=>p.cs));
  const card=({t,sub,p,role})=>{
    const disc=1-Math.min(1,(p.y+2*p.r)/mx.cards);
    const vals = role==="gk"  ? [p.cs/mxGK, p.apps/mx.apps, p.mins/mx.mins, disc]
               : role==="def" ? [p.dcs/mxCS, p.g/mx.g, p.a/mx.a, p.apps/mx.apps, p.mins/mx.mins, disc]
               : [p.g/mx.g, p.a/mx.a, p.apps/mx.apps, p.mins/mx.mins, disc, (p.g+p.a)/mx.ga];
    const labels = role==="gk"  ? ["شباك نظيفة","مشاركات","دقائق","انضباط"]

let HM_CD_TIMER=null;
function hmCountdownParts(ts){
  const ms=Math.max(0, ts-Date.now());
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4);
  return {d,h,m};
}

  return `<section class="hm-nm" data-ts="${ts}">
    <div class="hm-nm-hd"><span class="hm-tag"><i></i>المباراة القادمة</span><span class="hm-muted">الجولة ${m.round}${COMP==="الكل"?` · ${esc(compOf(m))}`:""}</span></div>
    <div class="hm-nm-body">
      <button type="button" class="hm-nm-team" data-club-open="${esc(m.home)}">${crest(m.home,true)}<b>${esc(m.home)}</b></button>
      <div class="hm-nm-mid">

        <span class="hm-muted">${dayLabel(m.date)}</span>
      </div>
      <button type="button" class="hm-nm-team" data-club-open="${esc(m.away)}">${crest(m.away,true)}<b>${esc(m.away)}</b></button>

    <div class="hm-cd" dir="rtl" aria-label="العدّ التنازلي">
      <span><b data-cd="d">${pad(c.d)}</b><small>أيام</small></span><i>:</i>
      <span><b data-cd="h">${pad(c.h)}</b><small>ساعات</small></span><i>:</i>
      <span><b data-cd="m">${pad(c.m)}</b><small>دقائق</small></span>
    </div>
    <div class="hm-cta">
      <button type="button" class="hm-btn" data-go-view="predict">التوقعات</button>
      <button type="button" class="hm-btn primary" data-go-view="fans">صوّت بتشكيلتك</button>
    </div>
  </section>`;
}
function hmTickCountdown(){
  const box=$("#v-home .hm-nm"); if(!box){ if(HM_CD_TIMER){ clearInterval(HM_CD_TIMER); HM_CD_TIMER=null; } return; }
  const c=hmCountdownParts(+box.dataset.ts); const pad=n=>String(n).padStart(2,"0");
  const set=(k,v)=>{ const el=box.querySelector(`[data-cd="${k}"]`); if(el && el.textContent!==pad(v)) el.textContent=pad(v); };
  set("d",c.d); set("h",c.h); set("m",c.m);
}
function hmSparkline(){
  const rounds=[...new Set(MATCHES.filter(m=>!isUpcoming(m)).map(m=>m.round))].sort((a,b)=>a-b);
  if(rounds.length<2) return "";
  const vals=rounds.map(r=>MATCHES.filter(m=>m.round===r && !isUpcoming(m)).reduce((a,m)=>a+m.hg+m.ag,0));
  const W=120,H=34,mx=Math.max(1,...vals);
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*(W-6)+3, H-3-(v/mx)*(H-10)]);
  const d="M"+pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join("L");
  return `<svg class="hm-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2"/>`).join("")}</svg>
    <span class="hm-muted">أهداف كل جولة · ${rounds[0]}–${rounds[rounds.length-1]}</span>`;
}

    {v:pct(sp,tg)+"%", l:"كرات ثابتة"}, {v:cards, l:"بطاقة"},

  return `<section class="hm-kpi">

  "تأسس الاتحاد الكويتي لكرة القدم عام 1952 باسم «الاتحاد الكويتي للألعاب الرياضية» وحمل اسمه الحالي عام 1957، وانضم إلى الفيفا عام 1962 وإلى الاتحاد الآسيوي عام 1964، وهو عضو في الاتحاد العربي منذ 1974 واتحاد غرب آسيا منذ 2010 وعضو مؤسس في اتحاد كأس الخليج العربي عام 2016. يدير الاتحاد المنتخبات الوطنية والمسابقات المحلية (الدوري الممتاز، الدرجة الأولى، كأس الأمير، كأس ولي العهد، كأس الاتحاد)، ومقره في العديلية، ويملك استاد جابر الأحمد الدولي أكبر ملاعب الكويت. يُلقّب المنتخب الأول بـ«الأزرق»، وهو بطل آسيا 1980 وصاحب الرقم القياسي في ألقاب كأس الخليج بعشرة ألقاب.":"The Kuwait Football Association was founded in 1952 as the Kuwait Sports Games Association and took its present name in 1957. It joined FIFA in 1962 and the AFC in 1964, has been a member of the Arab Football Association since 1974 and of the West Asian Football Federation since 2010, and was a founding member of the Arabian Gulf Cup Federation in 2016. The FA runs the national teams and the domestic competitions (the Premier League, the First Division, the Emir Cup, the Crown Prince Cup and the Federation Cup), is based in Adailiya, and owns Jaber Al-Ahmad International Stadium, the largest ground in Kuwait. The senior side is nicknamed Al-Azraq (“The Blue”); it was Asian champion in 1980 and holds the record for Gulf Cup titles with ten.",

/* ================= تقييم اللاعبين (2026-09-15) =================
   تقييم لكل لاعب في كل مباراة من 3 إلى 10 يُحسب فقط من إحصاءات الموقع المسجّلة من الإدارة
   (التشكيلة والتبديلات = الدقائق، الأهداف، الصناعة، الأهداف العكسية، الإنذارات والطرد، ركلات الجزاء، النتيجة،
   الأهداف المستقبَلة أثناء وجوده). كل قاعدة مستقلة في RATING.rules: أي إحصائية جديدة تُضاف كقاعدة واحدة
   فتدخل تلقائياً في تقييم كل المباريات والمتوسطات. التقييم يظهر لمن لعب 10 دقائق فأكثر. */
const RATING = {
  base: 6.3, min: 3, max: 10, minMinutes: 10,
  /* ctx: {m, club, name, line(G|D|M|F), mins, share, win, draw, loss, goals, penGoals, assists, ownGoals,
          yellow, red, penMissed, conceded(أثناء وجوده), teamConceded} */
  rules: [
    {key:"goal",    label:"الأهداف",                 fn:c => c.goals * ({G:1.3, D:1.2, M:1.0, F:0.9}[c.line] || 1.0) + c.penGoals * 0.7},
    {key:"assist",  label:"الصناعة",                 fn:c => c.assists * 0.6},
    {key:"og",      label:"الأهداف العكسية",         fn:c => c.ownGoals * -0.8},
    {key:"yellow",  label:"الإنذارات",               fn:c => c.yellow * -0.25},
    {key:"red",     label:"الطرد",                   fn:c => c.red * -1.2},
    {key:"penMiss", label:"ركلات الجزاء الضائعة",    fn:c => c.penMissed * -0.6},
    {key:"result",  label:"نتيجة المباراة",          fn:c => (c.win ? 0.35 : c.loss ? -0.35 : 0) * c.share},
    {key:"cs",      label:"الشباك النظيفة",          fn:c => (c.mins>=(c.csLimit||60) && c.conceded===0) ? ({G:0.9, D:0.5, M:0.15}[c.line] || 0) : 0},
    {key:"against", label:"الأهداف المستقبَلة",      fn:c => c.conceded * ({G:-0.25, D:-0.15, M:-0.05}[c.line] || 0)},
    {key:"minutes", label:"دقائق اللعب",             fn:c => c.mins>=(c.csLimit||60) ? 0.15 : 0},
  ]
};
function playerLine(club, name){
  const e=(SQUADS[club]||[]).find(x=>sqName(x)===name);
  return POS_MAIN[String(e?sqPos(e):"").toUpperCase()] || "M";
}
/* سياق لاعب في مباراة من بيانات الموقع */
function ratingCtx(m, club, name){
  const mins=playerMatchMinutes(m, club, name);
  if(mins<=0) return null;
  const w=playerWindow(m, club, name) || {start:0, end:matchLen(m)};
  const gf = club===m.home ? +m.hg : +m.ag, ga = club===m.home ? +m.ag : +m.hg;
  const gs=matchGoals(m);
  const on = g => { const t=Math.min(matchLen(m), abs(g)); return t>=w.start && t<=w.end; };
  const mine=gs.filter(g=>g.p===name && g.sc===club && g.bp!=="هدف عكسي");
  const pens=(PENS||[]).filter(p=>p.r===m.round && compOf(p)===compOf(m) && p.p===name && p.by===club);
  const cards=CARDS.filter(x=>x.r===m.round && compOf(x)===compOf(m) && x.club===club && x.p===name);
  const red=cards.filter(x=>isRed(x.type)).length;
  return {m, club, name, line:playerLine(club,name), mins, csLimit:csLimit(m), share:Math.min(1, mins/matchLen(m)),
    win:gf>ga, draw:gf===ga, loss:gf<ga,
    goals: mine.filter(g=>g.det!=="ركلة جزاء").length,
    penGoals: mine.filter(g=>g.det==="ركلة جزاء").length,
    assists: gs.filter(g=>g.a===name && g.sc===club && !isOG(g)).length,
    ownGoals: gs.filter(g=>isOG(g) && g.og===name && g.cd===club).length,
    yellow: cards.filter(x=>isYellow(x.type) && !isRed(x.type)).length, red,
    penMissed: pens.filter(p=>p.res && p.res!=="سجلت").length,
    conceded: gs.filter(g=>g.cd===club && on(g)).length,
    teamConceded: ga};
}
function playerRating(m, club, name){
  const c=ratingCtx(m, club, name);
  if(!c || c.mins<RATING.minMinutes) return null;
  const parts=RATING.rules.map(r=>({key:r.key, label:r.label, v:+(r.fn(c)||0)}));
  const raw=RATING.base + parts.reduce((s,p)=>s+p.v,0);
  return {v: Math.round(Math.max(RATING.min, Math.min(RATING.max, raw))*10)/10, parts, ctx:c};
}
/* تقييمات فريق في مباراة، مرتبة من الأعلى */
function matchRatings(m, club){
  const comp=compOf(m), men=new Set(xiNames(m.round, comp, club));
  matchSubs(m).filter(s=>s.club===club && s.in).forEach(s=>men.add(s.in));
  return [...men].map(n=>({n, c:club, r:playerRating(m, club, n)})).filter(x=>x.r).sort((a,b)=>b.r.v-a.r.v);
}
/* متوسط التقييم لكل لاعب على المباريات الملعوبة */
function averageRatings(){
  return PASS_MEMO.get("avgRatings|"+COMP, ()=>{
    const out={};
    playedMatches().forEach(m=>[m.home,m.away].forEach(club=>matchRatings(m,club).forEach(x=>{
      const k=x.n+"|"+club; const e=out[k]||(out[k]={n:x.n, c:club, apps:0, sum:0, best:0});
      e.apps++; e.sum+=x.r.v; e.best=Math.max(e.best,x.r.v);
    })));
    return Object.values(out).map(e=>({...e, avg:Math.round(e.sum/e.apps*100)/100})).sort((a,b)=>b.avg-a.avg||b.apps-a.apps);
  });
}

/* اختيار الجمهور: أصوات «أفضل لاعب» في تصويت تشكيلة الجمهور لجولة المباراة، للاعبي الفريقين فقط */
function mpFanPick(m){
  const k=totKey(m.round, compOf(m)), ballots=TOTVOTES[k];
  if(ballots===undefined){
    if(typeof loadTotVotes==="function" && mpFanPick.busy!==k){ mpFanPick.busy=k;
      loadTotVotes(m.round, compOf(m)).then(()=>{ mpFanPick.busy=null; TOTVOTES[k]=TOTVOTES[k]||[]; if(MP.m===m && MP.tab==="details") renderMatchPage(); })
        .catch(()=>{ mpFanPick.busy=null; TOTVOTES[k]=TOTVOTES[k]||[]; }); }
    return {loading:(typeof fbDb!=="undefined" && !!fbDb), list:[]};
  }
  const best=tallyVotes(ballots||[]).best||{};
  const list=Object.entries(best).map(([key,v])=>({n:key.split("|")[0], c:key.split("|")[1], v}))
    .filter(x=>x.c===m.home || x.c===m.away).sort((a,b)=>b.v-a.v);
  const total=list.reduce((a,x)=>a+x.v,0);
  list.forEach(x=>x.pct=total?Math.round(x.v/total*100):0);
  return {loading:false, list, total};
}

    <rect x="22" y="${H-19}" width="56" height="17" ${V}/><rect x="36" y="${H-8.5}" width="28" height="6.5" ${V}/><path d="M40 ${H-19}a12 9 0 0 1 20 0" ${V}/>

/* تحت الملعبين: مبدّل الفريقين ← المدرب ← التبديلات ← الاحتياط (منصور 2026-09-15) */
let MP_LT="home";
function mpFacePh(n, c){

function mpTeamSection(m){

  const sq=squadEntriesOf(club), numOf=n=>{ const e=sq.find(x=>x.n===n); return e&&e.s?e.s:""; };
  const R={}; matchRatings(m, club).forEach(x=>R[x.n]=x.r.v);

  const coachHTML = coach ? `<div class="mpt-hd">المدرب</div><div class="mpt-row nolink">

  const played=new Set([...xiNames(m.round, comp, club), ...subs.flatMap(x=>[x.in, x.out]).filter(Boolean)]);   /* الخارج أيضاً: حتى لو سُجّل خطأً خارج التشكيلة */

function mpLineups(m){

  return `${both || (h+a)}${mpTeamSection(m)}`;

/* القائمة: كشف الفريقين كما في صفحة النادي (المدرب ثم المراكز) — منفصلة عن تشكيلة المباراة */
let MP_SQ="home";
function mpSquad(m){

  const seg=`<div class="mp-seg two">

function mpTable(m){
  if(!playedMatches().length) return `<div class="mp-card mp-empty">يظهر الجدول بعد أول جولة.</div>`;
  let html=hmStandingsHTML(standings());
  [m.home,m.away].forEach(c=>{ html=html.replace(`data-club-open="${esc(c)}"`, `data-club-open="${esc(c)}" data-mp-hl="1"`); });

}
function mpMatchRow(x, club){
  const soon=isUpcoming(x), r=club?mpResult(x,club):"";
  return `<button type="button" class="mp-mrow" data-mp-open="${matchKey(x)}">

function mpSplitList(list, club){

  const next=list.filter(x=>isUpcoming(x)).sort((a,b)=>(kickoffTS(a)||0)-(kickoffTS(b)||0));

  return blk("النتائج",done)+blk("القادمة",next);
}
let MP_MX="h2h";
function mpMatches(m){
  const pick = MP_MX==="h2h" ? mpH2HList(m) :
    MATCHES.filter(x=>x!==m && (x.home===(MP_MX==="home"?m.home:m.away) || x.away===(MP_MX==="home"?m.home:m.away)))
      .sort((a,b)=>(kickoffTS(b)||0)-(kickoffTS(a)||0));

    <button type="button" data-mp-mx="home" aria-pressed="${MP_MX==="home"}">${crest(m.home)}</button>

    ${pick.length?mpSplitList(pick,club)
                 :`<div class="mp-empty">${MP_MX==="h2h"?"لا مواجهات أخرى بين الفريقين هذا الموسم.":"لا مباريات أخرى."}</div>`}</div>`;
}
function renderMatchPage(){
  const box=$("#mpage"), m=MP.m; if(!box||!m) return;
  const body = MP.tab==="lineups" ? mpLineups(m) : MP.tab==="squad" ? mpSquad(m) : MP.tab==="table" ? mpTable(m) : MP.tab==="matches" ? mpMatches(m) : mpDetails(m);
  box.innerHTML=`<div class="mp-sheet" style="--hc:${clubAccent(m.home).a};--ac:${clubAccent(m.away).a}">
    <header class="mp-head">${mpHeader(m)}</header>
    <nav class="mp-tabs">${MP_TABS.map(([k,l])=>`<button type="button" data-mp-tab="${k}" aria-pressed="${MP.tab===k}">${l}</button>`).join("")}</nav>
    <div class="mp-body">${body}</div></div>`;
}
function openMatch(m, opts){
  if(typeof m==="string") m=matchByKey(m);
  const box=$("#mpage"); if(!m||!box) return;
  const wasOpen = !box.hidden;
  const same = MP.m===m;
  MP.m=m; if(!same){ MP.tab="details"; MP_MX="h2h"; MP_SQ="home"; MP_LT="home"; }
  renderMatchPage();
  box.hidden=false; box.classList.add("on"); document.documentElement.classList.add("mp-open");
  const sh=box.querySelector(".mp-sheet"); if(sh) sh.scrollTop=0;
  /* مباراة داخل صفحة مباراة تستبدل الرابط بدل إضافة خطوة، فيغلق زر الرجوع الصفحة مباشرة */
  if(!(opts&&opts.noHistory)){ try{ (wasOpen && history.state && history.state.mp ? history.replaceState : history.pushState).call(history, {mp:1}, "", "#m/"+matchKey(m)); }catch(e){} }
}
function hideMatchBox(){
  const box=$("#mpage"); if(!box) return;
  box.classList.remove("on"); box.hidden=true; box.innerHTML=""; MP.m=null;
  document.documentElement.classList.remove("mp-open");
}
function closeMatch(){
  const box=$("#mpage"); if(!box||box.hidden) return;
  hideMatchBox();
  if(history.state && history.state.mp){ try{ history.back(); }catch(e){} }
  else if(/^#m\//.test(location.hash)){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
}
window.openMatch=openMatch; window.closeMatch=closeMatch;
window.addEventListener("popstate", ()=>{
  const box=$("#mpage"); if(!box) return;
  if(/^#m\//.test(location.hash)){ const m=matchByKey(location.hash.slice(3)); if(m){ openMatch(m,{noHistory:true}); return; } }
  if(!box.hidden) hideMatchBox();
});
document.addEventListener("click", e=>{
  const box=$("#mpage");
  if(box && !box.hidden && box.contains(e.target)){
    if(e.target.closest("[data-player]")) return;                 /* ملف اللاعب يفتح فوقها */
    if(e.target.closest("[data-mp-close]")){ closeMatch(); return; }
    const t=e.target.closest("[data-mp-tab]"); if(t){ MP.tab=t.dataset.mpTab; renderMatchPage(); box.querySelector(".mp-sheet").scrollTop=0; return; }
    const x=e.target.closest("[data-mp-mx]"); if(x){ MP_MX=x.dataset.mpMx; renderMatchPage(); return; }
    const q=e.target.closest("[data-mp-sq]"); if(q){ MP_SQ=q.dataset.mpSq; renderMatchPage(); return; }
    const lt=e.target.closest("[data-mp-lt]"); if(lt){ const y=box.querySelector(".mp-sheet").scrollTop; MP_LT=lt.dataset.mpLt; renderMatchPage(); box.querySelector(".mp-sheet").scrollTop=y; return; }
    const o=e.target.closest("[data-mp-open]"); if(o){ const mm=matchByKey(o.dataset.mpOpen); if(mm){ MP.tab="details"; MP_MX="h2h"; MP.m=null; openMatch(mm); } return; }
    if(e.target.closest("[data-club-open]")){ closeMatch(); return; }   /* فتح النادي يتولاه المستمع العام */
    return;
  }
  /* بطاقة المباراة في صفحة المباريات: الضغط على البطاقة (لا على «التفاصيل» أو اسم لاعب) يفتح صفحة المباراة */
  const card=e.target.closest("[data-mopen]");
  if(card && !e.target.closest(".mtog,.mdet,[data-player],a,select,input")){ const mm=matchByKey(card.dataset.mopen); if(mm){ e.preventDefault(); openMatch(mm); } }
});
/* رابط عميق #m/… يفتح المباراة بعد وصول البيانات */
function openMatchFromHash(){
  if(!/^#m\//.test(location.hash) || !Array.isArray(MATCHES) || !MATCHES.length) return false;
  const m=matchByKey(location.hash.slice(3)); if(!m) return false;
  openMatch(m,{noHistory:true}); return true;
}
/* رابط عميق #m/المسابقة/الجولة/المضيف/الضيف: يفتح صفحة المباراة بعد وصول البيانات */
(function(){
  if(!/^#m\//.test(location.hash)) return;
  let tries=0; const tick=()=>{ if(!openMatchFromHash() && ++tries<40) setTimeout(tick,300); }; setTimeout(tick,400);
})();
/* رابط عميق #p/الاسم/النادي: يفتح الملف بعد وصول البيانات */
(function(){
  const m=/^#p\/([^/]+)\/?(.*)$/.exec(location.hash); if(!m) return;
  let tries=0; const tick=()=>{
    if(Array.isArray(MATCHES) && MATCHES.length && Object.keys(SQUADS||{}).length){ try{ openPlayer(decodeURIComponent(m[1]), decodeURIComponent(m[2]||""), {noHistory:true}); }catch(e){} }
    else if(++tries<40) setTimeout(tick,300);
  }; setTimeout(tick,400);
})();
</script>

<style>/* ===== بحث اللاعبين أعلى قسم اللاعبين — 2026-09-15 ===== */

<script>
/* بحث اللاعبين: يكتب المستخدم جزءاً من الاسم ← قائمة بالمطابقين ← الضغط يفتح ملف اللاعب (openPlayer).
   المصدر: كشوفات الأندية + كل من ظهر في الأهداف/التشكيلات/الإنذارات (لاعب بلا كشف يبقى قابلاً للبحث).
   المربع عنصر واحد دائم يُعاد تركيبه أعلى القسم بعد كل رسم، فلا يضيع ما كُتب ولا التركيز حين
   يُعاد رسم القسم بتحديث حيّ. */
(function(){
  const norm=s=>String(s||"").normalize("NFKC")
    .replace(/[ً-ٰٟـ]/g,"")        /* التشكيل والتطويل */
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .toLowerCase().replace(/\s+/g," ").trim();
  let idx=null, idxKey="";
  function index(){
    const key=(typeof CUR_STAMP!=="undefined"?CUR_STAMP:"")+"|"+Object.keys(SQUADS||{}).length+"|"+(GOALS||[]).length;
    if(idx && key===idxKey) return idx;
    const map=new Map();
    const add=(n,c,s)=>{ n=String(n||"").trim(); c=String(c||"").trim(); if(!n || !c || n.length<2) return;
      const k=n+"|"+c; const o=map.get(k); if(o){ if(s && !o.s) o.s=s; return; }
      map.set(k,{n,c,s:s||0,key:norm(n),score:0}); };
    Object.keys(SQUADS||{}).forEach(c=>(SQUADS[c]||[]).forEach(x=>add(sqName(x),c,sqNum(x))));
    const A=(typeof ALL!=="undefined" && ALL)||{};
    (A.goals||GOALS||[]).forEach(g=>{ if(g.bp!=="هدف عكسي") add(g.p,g.sc); add(g.a,g.sc); });
    (A.lineups||[]).forEach(x=>add(x.p,x.club));
    (A.cards||CARDS||[]).forEach(x=>add(x.p,x.club));
    /* الأبرز أولاً عند التساوي: أهداف + صناعة */
    (A.goals||GOALS||[]).forEach(g=>{ if(isOG(g)) return; const o=map.get(g.p+"|"+g.sc); if(o) o.score+=3; const a=map.get(g.a+"|"+g.sc); if(a) a.score+=2; });
    idxKey=key; return idx=[...map.values()];
  }
  function search(q){
    const nq=norm(q); if(!nq) return [];
    const words=nq.split(" ");
    const out=[];
    for(const p of index()){
      if(!words.every(w=>p.key.includes(w))) continue;
      const rank = p.key===nq ? 0 : p.key.startsWith(nq) ? 1 : p.key.split(" ").some(w=>w.startsWith(words[0])) ? 2 : 3;
      out.push([rank,p]);
    }
    return out.sort((a,b)=>a[0]-b[0] || b[1].score-a[1].score || a[1].n.localeCompare(b[1].n,"ar")).slice(0,20).map(x=>x[1]);
  }
  const SEARCH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const X_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  let root=null, input, list, clearBtn, results=[], sel=-1;
  function build(){
    root=document.createElement("div"); root.className="psearch"; root.setAttribute("role","search");
    root.innerHTML=`<label class="psearch-box">${SEARCH_SVG}
        <input type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
          placeholder="ابحث عن لاعب" aria-label="ابحث عن لاعب" role="combobox" aria-expanded="false" aria-controls="psearchList" aria-autocomplete="list">
        <button type="button" class="psearch-clear" aria-label="مسح البحث" hidden>${X_SVG}</button></label>
      <div class="psearch-list" id="psearchList" role="listbox" hidden></div>`;
    input=root.querySelector("input"); list=root.querySelector(".psearch-list"); clearBtn=root.querySelector(".psearch-clear");
    input.addEventListener("input", ()=>{ sel=-1; paint(); });
    input.addEventListener("focus", ()=>{ if(input.value) paint(); });
    input.addEventListener("keydown", e=>{
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(!results.length) return; e.preventDefault();
        sel=(sel+(e.key==="ArrowDown"?1:-1)+results.length)%results.length; mark(); }
      else if(e.key==="Enter"){ const p=results[sel>=0?sel:0]; if(p){ e.preventDefault(); pick(p); } }
      else if(e.key==="Escape"){ close(); }
    });
    clearBtn.addEventListener("click", ()=>{ input.value=""; close(); input.focus(); });
    /* pointerdown قبل blur: يُسجَّل الاختيار قبل أن تُغلق القائمة */
    list.addEventListener("pointerdown", e=>{ if(e.target.closest(".psearch-item")) e.preventDefault(); });
    list.addEventListener("click", e=>{ const b=e.target.closest(".psearch-item"); if(b) pick(results[+b.dataset.i]); });
    document.addEventListener("pointerdown", e=>{ if(root && !root.contains(e.target)) close(); }, true);
  }
  function hi(name, q){
    const words=norm(q).split(" ").filter(Boolean); const n=String(name);
    /* تظليل على النص الأصلي: نطابق حرفاً بحرف بعد التطبيع (التطبيع لا يغيّر عدد الأحرف إلا بالتشكيل) */
    const chars=[...n], nn=chars.map(ch=>norm(ch)||"");
    const flat=nn.join(""); const on=new Array(chars.length).fill(false);
    words.forEach(w=>{ let from=0, at;
      while((at=flat.indexOf(w,from))>=0){ let pos=0;
        for(let i=0;i<chars.length;i++){ const L=nn[i].length; if(pos+L>at && pos<at+w.length && L) on[i]=true; pos+=L; }
        from=at+w.length; } });
    let h="", open=false;
    chars.forEach((ch,i)=>{ if(on[i]&&!open){ h+="<mark>"; open=true; } if(!on[i]&&open){ h+="</mark>"; open=false; } h+=esc(ch); });
    return h+(open?"</mark>":"");
  }
  function face(p){
    const cut=(typeof photoCut==="function" && typeof LOCAL_PHOTOS!=="undefined" && (typeof PHOTOSON==="undefined" || PHOTOSON)) ? photoCut(p.n,p.c) : null;
    return cut ? `<img src="${cut}_f.webp?v=28" alt="" loading="lazy" decoding="async">`
               : esc(p.n.split(/\s+/).slice(0,2).map(w=>w[0]||"").join(""));
  }
  function paint(){
    const q=input.value; clearBtn.hidden=!q;
    if(!norm(q)){ close(); return; }
    results=search(q);
    list.innerHTML = results.length
      ? results.map((p,i)=>`<button type="button" class="psearch-item" role="option" data-i="${i}" aria-selected="${i===sel}" data-i18n="off">
          <span class="psearch-ph">${face(p)}</span>
          <span class="psearch-tx"><b>${hi(p.n,q)}</b><small>${esc(p.c)}${p.s?` · ${p.s}`:""}</small></span>${crest(p.c)}</button>`).join("")
      : `<div class="psearch-empty">لا يوجد لاعب بهذا الاسم</div>`;
    list.hidden=false; input.setAttribute("aria-expanded","true");
  }
  function mark(){
    list.querySelectorAll(".psearch-item").forEach((b,i)=>{ b.setAttribute("aria-selected", i===sel); if(i===sel) b.scrollIntoView({block:"nearest"}); });
  }
  function close(){ if(!list) return; list.hidden=true; results=[]; sel=-1; input.setAttribute("aria-expanded","false"); }
  function pick(p){ if(!p) return; close(); input.blur(); openPlayer(p.n, p.c); }

  function mount(st){
    const v=document.getElementById("v-players"); if(!v) return;
    if(!root) build();
    v.prepend(root);
    if(st && st.focused){ input.focus({preventScroll:true}); try{ input.setSelectionRange(st.s,st.e); }catch(_){} if(input.value) paint(); }
  }
  const _rp=renderPlayers;
  renderPlayers=function(){
    /* حالة التركيز تُقرأ قبل الرسم: بعده يكون المربع قد فُصل عن الصفحة */
    const st = input ? {focused:document.activeElement===input, s:input.selectionStart, e:input.selectionEnd} : null;
    const r=_rp.apply(this,arguments); mount(st); return r; };
  if(typeof RENDER==="object") RENDER.players=renderPlayers;
  if(document.querySelector("#v-players.on")) mount();
})();
</script>

  background:linear-gradient(135deg,#22b573,#128a52)!important;box-shadow:0 8px 18px rgba(18,138,82,.35)}
.mx-save:hover{filter:brightness(1.06)}
.mx-save svg{width:18px;height:18px}

/* النافذة السفلية (إضافة/تعديل حدث، اختيار نادٍ) */
.mx-sheet{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,10,22,.62);animation:mxFade .18s ease}
@media(min-width:760px){.mx-sheet{align-items:center;padding:24px}}
.mx-sheet .box{width:100%;max-width:640px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;
  background:var(--mx-card);border:1px solid var(--mx-ln);box-shadow:0 -20px 60px rgba(0,0,0,.45);animation:mxUp .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.mx-sheet .box{border-radius:22px}}
.mx-sheet .hd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--mx-card);border-bottom:1px solid var(--mx-ln)}
.mx-sheet .hd h3{margin:0;flex:1;font-family:var(--display);font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.mx-sheet .hd button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mx-soft)!important}
.mx-sheet .hd svg{width:16px;height:16px}
.mx-sheet .bd{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.mx-sheet .ft{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--mx-card);border-top:1px solid var(--mx-ln)}
.mx-sheet .ft .sp{flex:1}
.mx-tsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx-clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mx-clubb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--mx-ln)!important;background:var(--mx-soft)!important;font-weight:700;font-size:.78rem}
.mx-clubb .crest{width:40px!important;height:40px!important}
.mx-clubb.on{border-color:#1c6fd1!important;background:rgba(28,111,209,.2)!important}

.mx-del{display:inline-flex;align-items:center;gap:6px;padding:11px 14px;border-radius:12px;color:#ff8a90;font-weight:800;border:1px solid rgba(229,72,77,.45)!important}
@keyframes mxFade{from{opacity:0}to{opacity:1}}
@keyframes mxUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
